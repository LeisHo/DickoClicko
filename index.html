  // from its stale pre-move position at a 0.25 factor -- barely followed,
  // leaving the tip's new segment pointing in a near-arbitrary direction
  // (measured up to ~180 degrees off the established growth direction).
  // Because drawEndcap() orients the endcap graphic off exactly this
  // segment's direction (see its own tipDirection() call), that reads as
  // the endcap visibly snapping/spinning at the tip on every commit during
  // real swinging -- reproducing the user's "still extends in a jittery
  // fashion" report, distinct from (and not fixed by) the earlier
  // acceleration-spike fix above, which addressed the tip's ABSOLUTE
  // position/velocity continuity but not this anchor-tracking gap.
  const targetOffX = dir.x * mainRope.tipGrowLen;
  const targetOffY = dir.y * mainRope.tipGrowLen;
  if (!mainRope.tipOffset) mainRope.tipOffset = { x: targetOffX, y: targetOffY };
  //
  // The smoothing factor itself RAMPS UP toward 1 as this segment nears
  // completion (tipGrowLen -> segLen), rather than staying flat at 0.25 the
  // whole time. growRope()'s own commit finalizes the tip at whatever
  // position it's ALREADY at (see that function's comment) instead of
  // snapping it the rest of the way -- a flat 0.25 smoothing factor could
  // still be meaningfully lagging behind the true target right up to the
  // commit instant, leaving each finalized segment measurably short of the
  // real targetSeg; over many commits during a real swinging+growing
  // session that compounded into WORSE overall segment-length stability
  // than before this whole fix (confirmed via direct measurement: max
  // segment-length ratio reached ~3.6x by the end of a 5s test, vs ~1.2x
  // with the ramp below). Ramping smoothing up to 1 by the time
  // tipGrowLen reaches segLen means the tip has essentially already
  // caught up to its target the instant BEFORE commit, so growRope()
  // freezing it there loses none of the segment's real length -- while
  // the EARLY part of the segment's growth still gets the original gentle
  // 0.25 lag, still filtering the single-frame solver noise this smoothing
  // was added for 2 rounds ago.
  const frac = mainRope.tipGrowLen / mainRope.segLen;
  const smoothing = Math.max(0.25, frac);
  mainRope.tipOffset.x += (targetOffX - mainRope.tipOffset.x) * smoothing;
  mainRope.tipOffset.y += (targetOffY - mainRope.tipOffset.y) * smoothing;
  tip.x = dir.prev.x + mainRope.tipOffset.x;
  tip.y = dir.prev.y + mainRope.tipOffset.y;
  tip.oldx = tip.x; tip.oldy = tip.y;
}

// ratePerSecVh: %vh/s override -- defaults to cfg.ropeGrowthRate (the
// manual hold-to-grow rate) so every pre-existing caller is unaffected.
// The startup animation's own 'growing' phase passes its own rate instead
// (constant Startup Extension Speed, or a tweened one -- see
// currentIntroExtendRate()) so its pacing is independently tunable from
// manual hold-to-grow, per explicit request.
function growRope(dtSeconds, ratePerSecVh){
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const rate = ratePerSecVh !== undefined ? ratePerSecVh : cfg.ropeGrowthRate;
  const growth = vh(rate) * dtSeconds;
  // accumulate from the persisted real total (mainRope.totalLength), not
  // re-derived from segLen*pointCount -- segLen is now pinned to a constant
  // (see setMainRopeTotalLength), so that product only changes in whole-point
  // jumps and would silently discard any growth accumulated since the last one.
  mainRope.totalLength += growth;
  // tipGrowLen rises continuously every frame (never in whole-point jumps);
  // positionGrowingTip() (called after integrateChain() in update()) is what
  // actually reveals that as smooth motion. Once it reaches a full targetSeg
  // we commit: fix the just-finished segment at exactly targetSeg (clamping
  // away any single-frame overshoot) and start a fresh, zero-length tip,
  // carrying the overshoot forward into its own tipGrowLen so no
  // accumulated growth is lost. The while loop covers a growth rate high
  // enough to complete more than one segment in a single frame.
  mainRope.tipGrowLen += growth;
  let firstCommitThisFrame = true;
  while (mainRope.tipGrowLen >= targetSeg){
    const pts = mainRope.points;
    const tip = pts[pts.length - 1];
    const prev = pts[pts.length - 2] || pts[0];
    // The newly-finalized point (and the fresh zero-length tip started right
    // after it) inherit prev's CURRENT velocity instead of starting from
    // rest. prev is a real, already-settled physics point that may still
    // carry a small residual velocity (light swinging, or the ordinary
    // frame-to-frame "breathing" of a fixed-iteration-count constraint
    // solver); starting the new point at zero velocity next to a moving
    // neighbor forces the solver to yank it into place over the following
    // few frames, which showed up as a real, measured decaying-oscillation
    // transient in prev's own position every time a segment committed
    // (confirmed via frame-by-frame tracing: prev.y jumped ~2px then settled
    // over ~4-5 frames) -- and since positionGrowingTip() anchors the
    // growing tip directly to prev every frame, that transient was
    // fully visible as tip jitter during extension. Matching the inherited
    // velocity here removes the mismatch the solver was correcting for.
    const vx = prev.x - prev.oldx, vy = prev.y - prev.oldy;
    if (firstCommitThisFrame){
      // Finalize the tip EXACTLY where it already visually is -- its
      // current position, already smoothly interpolated toward the target
      // by positionGrowingTip()'s own deliberate lag (see its comment) --
      // rather than snapping it the rest of the way to the mathematically
      // "complete" targetSeg-away position. The two can genuinely still
      // differ at the exact instant tipGrowLen crosses targetSeg, and
      // closing that gap here in one frame produced a real, measured
      // velocity-discontinuity spike at EVERY commit boundary during
      // simultaneous swinging+growth (confirmed via direct frame-by-frame
      // acceleration tracing: spikes up to ~50px/frame^2 against a
      // ~4px/frame^2 baseline, recurring at almost exactly the commit
      // interval -- reproducing the user's own "still extends in a
      // jittery fashion" report, this time reproduced specifically while
      // mid-swing, independent of the earlier pileRepulsion/floor fix).
      // Leaving tip.x/y untouched avoids the jump entirely; the finalized
      // segment's actual length may fall very slightly short of targetSeg
      // as a result, which the distance constraint gently absorbs over
      // the next few frames instead of reacting to an instant full-length
      // snap.
    } else {
      // A rare multi-commit-in-one-frame burst (a very high growth rate,
      // or an unusually large dt spike) -- this tip was only just created
      // a few lines below, THIS same frame, so it has no meaningfully
      // smoothed history to preserve; give it its full-length position
      // the same way every commit used to, computed fresh from the
      // now-finalized prev.
      const dir = tipGrowDirection(pts);
      tip.x = prev.x + dir.x * targetSeg;
      tip.y = prev.y + dir.y * targetSeg;
    }
    tip.oldx = tip.x - vx; tip.oldy = tip.y - vy;
    pts.push({ x: tip.x, y: tip.y, oldx: tip.x - vx, oldy: tip.y - vy });
    // the new tip starts exactly coincident with its own anchor (the point
    // just pushed from) -- zero offset -- so positionGrowingTip()'s offset
    // smoothing (see its own comment) starts from the correct zero point
    // instead of inheriting whatever offset was accumulating for the
    // segment that just finished.
    mainRope.tipOffset = { x: 0, y: 0 };
    mainRope.tipGrowLen -= targetSeg;
    firstCommitThisFrame = false;
  }
  setCfg('ropeLength', mainRope.totalLength / viewportH() * 100);
}

// power (an absolute vh()-based value, independent of the rope's own
// scale) used to be applied uncapped -- fine for a normal-length rope,
// but for a SHORT rope (small segLen), Click Intensity + Intensity
// Ceiling can produce a displacement several times a single segment's
// own length. Since the falloff spreads a real (if smaller) kick across
// several NEIGHBORING points too, not just the exact hit point, a
// large enough power can fling the tip clean PAST its own neighbor (or
// even the anchor) into an inverted configuration -- confirmed via
// direct frame-by-frame tracing: point0 (the anchor, otherwise excluded
// from the punch directly) got dragged by the distance constraint
// through a wild multi-frame swing past the circle's own center, and
// tipDirection() (which drawEndcap() rotates by) genuinely flipped
// and spun tick to tick during that recovery -- reported as "the dark
// flash near the rope start... occurs when i do a long click and hold
// flick from the bottom". Capping power at a multiple of the rope's own
// segLen keeps a strong punch feeling strong (still several segments'
// worth of kick) while never letting a single application send a point
// past where its own neighbor structurally allows it to go without an
// inverted, chaotically-recovering configuration.
const MAX_PUNCH_SEGMENTS = 4;
function applyPunch(points, hit, clickX, clickY, intensity, pinnedIndex, segLen){
  const dirX = hit.x - clickX, dirY = hit.y - clickY;
  const len = Math.hypot(dirX, dirY) || 1;
  const nx = dirX / len, ny = dirY / len;
  const power = Math.min(vh(1.0) * intensity, segLen * MAX_PUNCH_SEGMENTS);
  for (let i = 0; i < points.length; i++){
    if (i === pinnedIndex) continue;
    const falloff = Math.exp(-Math.pow((i - hit.index) / 3, 2));
    points[i].x += nx * power * falloff;
    points[i].y += ny * power * falloff;
  }
}

const CUT_SWEEP_BASE_SEC = 0.35;

// How long the cut-line sweep mark actually takes to travel across the full
// rope thickness, at the current Cut Speed -- the exact inverse of how
// cutSweep.progress accumulates each frame (`rawDt * cutSpeed /
// CUT_SWEEP_BASE_SEC`), so a full progress 0->1 sweep takes exactly this
// long. The piece being cut off doesn't actually separate until this much
// time has passed (mainRope.pendingCut / piece.pendingCut, set below) --
// replaces the old standalone Fall Delay dev control per explicit request
// ("set the fall delay as the time it takes the cut line to cut through
// the entire rope"), so the pending-separation delay is no longer an
// independently-tunable number that could drift out of sync with what the
// sweep mark is visually showing; it's now definitionally the same value.
function cutThroughDuration(){
  return CUT_SWEEP_BASE_SEC / cfg.cutSpeed;
}

// a perfectly vertical piece has no asymmetry to topple over on -- give it a
// small random initial tilt (around its own top point) so gravity and the
// floor collision naturally fold it into a heap instead of it standing
// there as a rigid straight column. Shared by both cutRopeAt (the piece
// falling off the main rope) and cutPieceAt (a fallen piece split in two).
function topplePiece(points){
  const angle = (Math.random() - 0.5) * 0.6;
  const pivot = points[0];
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  for (let i = 1; i < points.length; i++){
    const p = points[i];
    // rotate both the current AND old position by the same angle around the
    // same pivot, so the rotation only adds a topple bias — it does NOT
    // zero out whatever velocity the point already had from an in-progress
    // swing (rotating position but resetting oldx/oldy to match would kill
    // that momentum, which is exactly the "shouldn't freeze mid-swing" bug).
    const dx = p.x - pivot.x, dy = p.y - pivot.y;
    const odx = p.oldx - pivot.x, ody = p.oldy - pivot.y;
    p.x = pivot.x + dx * cosA - dy * sinA;
    p.y = pivot.y + dx * sinA + dy * cosA;
    p.oldx = pivot.x + odx * cosA - ody * sinA;
    p.oldy = pivot.y + odx * sinA + ody * cosA;
  }
}

function cutRopeAt(hit, clickX, clickY){
  // a cut is already pending -- the rope hasn't actually separated yet
  // (still counting down toward cutThroughDuration()), so there's nothing
  // new to cut.
  if (mainRope.pendingCut) return;
  const idx = Math.max(1, Math.min(hit.index, mainRope.points.length - 2));
  // refuse the cut entirely if it would leave the remaining (anchor-side)
  // rope shorter than the configured minimum — the rope stays whole rather
  // than being clamped to some other length the user didn't ask for.
  const remainingLen = idx * mainRope.segLen;
  if (remainingLen < vh(cfg.minRopeLength)) return;
  const a = mainRope.points[idx - 1], b = mainRope.points[idx];
  let tx = b.x - a.x, ty = b.y - a.y;
  const tlen = Math.hypot(tx, ty) || 1;
  tx /= tlen; ty /= tlen;
  // perpendicular to the rope's local tangent, oriented so (1,0) is screen-right
  // when the rope hangs straight down (tangent (0,1)) — used to tell which side
  // of the rope the click landed on, so the cut sweep runs the direction the
  // user actually clicked from, not just a fixed screen-left/right assumption.
  const nx = ty, ny = -tx;
  const side = (clickX - hit.x) * nx + (clickY - hit.y) * ny;

  // the cut sweep-mark belongs to the REMAINING rope (still hanging from the
  // circle), not the eventual falling piece -- anchorIndex pins it to idx,
  // which stays the correct edge for the whole time the cut is pending;
  // renderCutSweep tracks it live. A later cut overwrites this outright.
  const half = vmin(cfg.ropeThickness) / 2;
  mainRope.cutSweep = {
    progress: 0,
    anchorIndex: idx,
    startOffset: side > 0 ? half : -half,
    endOffset: side > 0 ? -half : half,
  };
  // Defer the actual separation until the cut-line sweep has fully crossed
  // the rope (cutThroughDuration()) -- the rope stays ONE physics chain
  // (still fully solved by integrateChain, still pinned to the circle)
  // instead of being split immediately into two independently-integrated
  // chains that then have to be kept in sync by rigidly translating the
  // piece to follow the parent's tip. That translate-to-follow approach
  // was an earlier implementation and it produced visible collision/seam
  // artifacts when cut mid-swing -- translating by the shortened parent's
  // tip delta doesn't reproduce what the same point would have done had
  // it stayed part of the original, undivided chain, since a shorter
  // chain swings differently. Keeping it undivided sidesteps the mismatch
  // entirely: nothing to desync because there are no two separate chains
  // yet. idx stays a valid split point even if the rope keeps growing
  // past it while the cut is pending.
  mainRope.pendingCut = { idx, delay: cutThroughDuration() };
}

// Actually separates mainRope at idx into the remaining (anchor-side) rope
// and a new fallen piece -- called immediately from cutRopeAt() when Fall
// Delay is 0, or from update() once a pendingCut's delay has elapsed.
function performMainRopeSplit(idx){
  const lowerPoints = mainRope.points.slice(idx).map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
  mainRope.points = mainRope.points.slice(0, idx + 1);
  // keep the persisted real total (and its dev-panel display) in sync with
  // the now-shorter remainder — otherwise the next growRope() call would
  // resume accumulating from the stale PRE-cut total, and separately, the
  // Rope Length slider would still show the old length, so nudging it would
  // jump the rope back out near its pre-cut length instead of adjusting the
  // actual current (cut) one.
  mainRope.totalLength = mainRope.segLen * idx;
  // the remaining tip after a cut is always a full, already-committed
  // segment -- no growth in progress.
  mainRope.tipGrowLen = mainRope.segLen;
  // a cut changes the chain's own local geometry right at the new tip --
  // any smoothed growth direction carried over from BEFORE the cut
  // (tipGrowDirection()) belongs to a now-discarded portion of the rope,
  // so the next hold-to-grow should measure fresh rather than starting
  // biased toward wherever the rope was pointing pre-cut.
  mainRope.growDir = null;
  mainRope.tipOffset = null;
  // mainRope's own tip IS the fresh cut edge now -- start its End Emerge
  // countdown (a no-op read as "fully emerged" wherever End Emerge is
  // off, per emergeFactor()'s own convention).
  mainRope.tipEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
  // Display-only -- see syncControlDisplay()'s own comment. cfg.ropeLength
  // itself stays at the real configured default so a later full detach
  // regrows to that, not to whatever this cut just shortened the rope to.
  syncControlDisplay('ropeLength', mainRope.totalLength / viewportH() * 100);
  if (lowerPoints.length >= 2){
    // Toppling (the initial random tilt) happens exactly at the moment of
    // real separation -- this is the same instant the piece starts
    // actually falling, which is also the only instant toppling makes
    // physical sense (a still-attached piece has no reason to tumble).
    topplePiece(lowerPoints);
    // age/baseThickness drive this piece's own independent thickness
    // decay (see pieceThickness()) -- baseThickness captures mainRope's
    // real live thickness AT THE MOMENT of falling (including whatever
    // Detach Thickness Multiplier has already compounded), so a piece
    // that falls off a thickened rope starts decaying from that real
    // thickness, not the plain unmultiplied default.
    const piece = { points: lowerPoints, segLen: mainRope.segLen, tipEmerge: null, age: 0, baseThickness: vmin(cfg.ropeThickness) * ropeThicknessMultiplier };
    // the new piece's OWN near/cut edge (points[0]) is its own fresh cut
    // edge -- separate End Emerge state from mainRope's tipEmerge above,
    // since it's a different entity's different end.
    piece.cutEdgeEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
    fallenPieces.push(piece);
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
}

// Splits an already-fallen piece into two independent pieces at the click
// point — same geometry/toppling as cutRopeAt's own piece split, but with
// no anchor/growth bookkeeping (a fallen piece has neither). The "upper"
// half (index 0..idx) keeps the piece's own identity and cutSweep mark,
// same convention as cutRopeAt's remaining rope keeping mainRope's; the
// "lower" half becomes a brand-new fallen piece with no mark of its own.
function cutPieceAt(pieceIndex, hit, clickX, clickY){
  const piece = fallenPieces[pieceIndex];
  if (!piece || piece.pendingCut) return;
  const idx = Math.max(1, Math.min(hit.index, piece.points.length - 2));
  const upperLen = idx * piece.segLen;
  const lowerLen = (piece.points.length - 1 - idx) * piece.segLen;
  if (upperLen < vh(cfg.minRopeLength) || lowerLen < vh(cfg.minRopeLength)) return;

  const a = piece.points[idx - 1], b = piece.points[idx];
  let tx = b.x - a.x, ty = b.y - a.y;
  const tlen = Math.hypot(tx, ty) || 1;
  tx /= tlen; ty /= tlen;
  const nx = ty, ny = -tx;
  const side = (clickX - hit.x) * nx + (clickY - hit.y) * ny;

  const half = vmin(cfg.ropeThickness) / 2;
  piece.cutSweep = {
    progress: 0,
    anchorIndex: idx,
    startOffset: side > 0 ? half : -half,
    endOffset: side > 0 ? -half : half,
  };
  // See cutRopeAt()'s identical pendingCut comment -- same deferred-split
  // reasoning, just against this piece's own points instead of mainRope's.
  piece.pendingCut = { idx, delay: cutThroughDuration() };
}

// Actually separates `piece` at idx -- see performMainRopeSplit()'s
// identical role for mainRope.
function performPieceSplit(piece, idx){
  const lowerPoints = piece.points.slice(idx).map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
  piece.points = piece.points.slice(0, idx + 1);
  // `piece`'s own tip is now the fresh cut edge -- see
  // performMainRopeSplit()'s identical reasoning.
  piece.tipEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
  if (lowerPoints.length >= 2){
    topplePiece(lowerPoints);
    // The new lower half starts its OWN fresh decay from `piece`'s
    // CURRENT thickness (not the plain default) -- it's splitting off a
    // piece that may already be partway through its own decay, so the
    // split-off half should visually continue from there, not reset to
    // full thickness. `piece` itself (the upper, identity-keeping half)
    // keeps its own existing age/baseThickness untouched -- it's the
    // same continuous piece, just shorter now, so its decay timeline
    // doesn't restart.
    const newPiece = { points: lowerPoints, segLen: piece.segLen, tipEmerge: null, age: 0, baseThickness: pieceThickness(piece) };
    newPiece.cutEdgeEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
    fallenPieces.push(newPiece);
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
}

/* ---------------------------------------------------------------------
   Input: click(punch) / hold(grow or charge) / double-click(cut).
   Which hold behavior applies depends on WHERE the hold starts:
   - hold starting on the circle -> grows the rope (existing behavior).
   - hold starting on the rope -> charges punch intensity, fired on release
     (Click Hold Max Duration / Intensity Ceiling); a quick tap on the rope
     still goes through the normal punch/double-click-to-cut path below.
   Double-click is hand-rolled (not the native dblclick event) because a
   native click would otherwise fire before a dblclick is recognized —
   the spec requires a double click to never trigger a single click.
--------------------------------------------------------------------- */
let downInfo = null;   // {mode:'circle'} or {mode:'rope', x,y,hit,startTime,charging}
// Rope Attraction: right-click-and-hold reaches mainRope's own tip toward
// the mouse. Kept entirely separate from downInfo/holdTimer (the left-click
// state machine above) rather than a 3rd downInfo.mode -- it's a genuinely
// independent gesture (a different mouse button) with no hold-threshold/
// double-click-arming logic of its own to share, so folding it into that
// state machine would only add unrelated fields to every left-click path.
// mouseX/mouseY track continuously (not just while attracting) since the
// cost of one extra pointermove listener is trivial and it means the very
// first attraction-active frame already has a real, current mouse position
// instead of stale/undefined coordinates from before the right-click.
let ropeAttractionActive = false;
let mouseX = 0, mouseY = 0;
window.addEventListener('pointermove', e => { mouseX = e.clientX; mouseY = e.clientY; });
let holdTimer = null;
let pendingClick = null; // {hit,timer}

// Click diagnostics -- DEV_MODE only. One entry per input-state transition
// (down, hold-eligible, growing, charging, release action), both to the
// console AND to a visible, scrollable log inside the dev panel itself
// (#dpClickLog) -- the console alone isn't visible to a non-technical
// user testing the app, so the panel display is the primary surface this
// was actually requested for.
const CLICK_LOG_MAX_ENTRIES = 200;
function logClick(event, data){
  if (!DEV_MODE) return;
  console.log('[click]', event, data);
  const el = document.getElementById('dpClickLog');
  if (!el) return;
  const empty = el.querySelector('.dp-click-log-empty');
  if (empty) empty.remove();
  const line = document.createElement('div');
  const dataStr = Object.entries(data || {}).map(([k, v]) => k + ':' + (typeof v === 'number' ? round(v, 2) : v)).join(' ');
  line.textContent = event + '  ' + dataStr;
  el.appendChild(line);
  while (el.children.length > CLICK_LOG_MAX_ENTRIES) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

// a generous margin beyond the circle's own visual radius — a small
// circleSize is an easy miss otherwise, and the rope renders on top of
// (visually through) the circle right where it emerges, so a press that's
// "clearly meant for the circle" needs real forgiveness, not pixel-exact
// targeting. Shared by isOnCircle() (hold-to-grow eligibility) and
// cutRopeAt()'s own Circle Cut Distance floor (see that comment) so the
// two can never drift apart -- whatever counts as "on the circle" for
// growing must also always count as "too close to cut."
function circleExclusionRadius(){
  return vmin(cfg.circleSize) / 2 + vmin(4);
}

function isOnCircle(x, y){
  const anchor = circleAnchor();
  return Math.hypot(x - anchor.x, y - anchor.y) <= circleExclusionRadius();
}

function hitTestRope(x, y, maxDist){
  if (maxDist === undefined) maxDist = vmin(cfg.clickDistance);
  if (isOnCircle(x, y)) return null; // clicking the circle itself never counts as a rope hit
  const hit = nearestPointOnRope(x, y, mainRope.points);
  return hit.dist <= maxDist ? hit : null;
}

// Nearest fallen piece within maxDist (defaults to Click Distance), if
// any -- same proximity gate as hitTestRope, checked against every piece
// independently since they're unrelated point chains scattered across the
// floor. maxDist is overridable so double-click-cut resolution can use
// Double Click Distance instead (see hitTestAny).
function hitTestPieces(x, y, maxDist){
  if (maxDist === undefined) maxDist = vmin(cfg.clickDistance);
  let best = null;
  for (let i = 0; i < fallenPieces.length; i++){
    const hit = nearestPointOnRope(x, y, fallenPieces[i].points);
    if (hit.dist <= maxDist && (!best || hit.dist < best.dist)) best = { ...hit, pieceIndex: i };
  }
  return best;
}

// Whichever of the main rope or a fallen piece is closest to (x,y), tagged
// with which one it is -- used both for arming a possible double-click (at
// the default Click Distance, matching the initial tap/hold's own
// proximity gate) and for RESOLVING a completed double-click, where the
// caller passes Double Click Distance explicitly instead -- a separate,
// independently-tunable radius per explicit request ("give me a double
// click distance slider that says how far from the rope a double click
// cut sequence is triggered... so i should have both click and double
// click distance sliders"). Punching/hold-charging stay rope-only
// (unchanged scope) and keep using hitTestRope/nearestPointOnRope
// directly, always at Click Distance.
function hitTestAny(x, y, maxDist){
  if (maxDist === undefined) maxDist = vmin(cfg.clickDistance);
  const ropeHit = hitTestRope(x, y, maxDist);
  const pieceHit = hitTestPieces(x, y, maxDist);
  if (ropeHit && (!pieceHit || ropeHit.dist <= pieceHit.dist)) return { ...ropeHit, target: 'rope' };
  if (pieceHit) return { ...pieceHit, target: 'piece' };
  return null;
}

function onPointerDown(e){
  // Rope Attraction (right-click-and-hold): checked first and unconditionally
  // returns, same reasoning as the FLICK check just below -- a different
  // mouse button is an entirely separate gesture that should never also
  // fall through into the left-click rope/circle logic. Gated on
  // introPhase === 'done' since there's no mainRope tip to reach for
  // otherwise (mirrors the circle-hold-to-grow branch's own gating further
  // down, for the same reason).
  if (e.button === 2){
    if (introPhase === 'done'){
      ropeAttractionActive = true;
      logClick('down:rope-attraction', { x: e.clientX, y: e.clientY });
    }
    return;
  }
  // FLICK animations 1 and 2: both rest on frame 1 until clicked directly
  // on their own graphic, per explicit request -- checked first and
  // return immediately so a click here never also reaches the rope/circle
  // hit-testing below. Independent of introPhase -- there's no reason a
  // startup-animation-only gate should also apply to an unrelated overlay
  // graphic. Checked in on-screen z-order (2 drawn last/on top -- see
  // render() -- so 2 is checked first) in case their rects ever overlap.
  // A press while that animation is ALREADY playing is ignored (not
  // reset into holding) -- previously every press unconditionally
  // re-entered holding mode, which on release restarted flickAnimTime at
  // 0 regardless of how far the current sequence had already gotten.
  // Reported as "it seems to run through a couple of frames, and then
  // click, it runs more frames, and the next click, more frames...
  // sixth or seventh click, does it run through the entire sequence" --
  // confirmed via direct simulation of repeated quick clicks a few
  // frames apart: flickAnimTime reset to exactly 0 every single click,
  // capping progress at whatever the gap to the NEXT click happened to
  // allow (a few frames' worth each time) rather than ever reaching the
  // full sequence, unless one particular gap happened to be long enough
  // to finish uninterrupted -- exactly the "random click count before it
  // finally completes" pattern reported. Now a press during an
  // already-in-progress sequence simply does nothing, letting it finish
  // on its own; a new press only starts holding once that animation is
  // idle again.
  if (isPointInFlick2(e.clientX, e.clientY)){
    if (!flick2Playing){
      holdingFlick = 2; flickHoldTime = 0; flickHoldCyclePos = 0;
      logClick('down:flick2', { x: e.clientX, y: e.clientY });
    } else {
      logClick('down:flick2-ignored-playing', { x: e.clientX, y: e.clientY });
    }
    return;
  }
  if (isPointInFlick(e.clientX, e.clientY)){
    if (!flickPlaying){
      holdingFlick = 1; flickHoldTime = 0; flickHoldCyclePos = 0;
      logClick('down:flick', { x: e.clientX, y: e.clientY });
    } else {
      logClick('down:flick-ignored-playing', { x: e.clientX, y: e.clientY });
    }
    return;
  }
  // No interaction while there's no real interactive rope yet
  // (waiting/rising/pausing -- only bgRope's own background climb is on
  // screen). Once mainRope has actually spawned and is mid-scripted-
  // growth ('growing'), cutting IS now allowed -- per explicit request
  // ("I should be able to cut/fully cut the main rope at any time,
  // assuming the rope is longer than the minimum rope length"), gated
  // the same way an ordinary cut always has been (cutRopeAt()'s own
  // Minimum Rope Length check, unchanged). The circle branch just below
  // is still skipped during 'growing' -- see its own guard -- since that
  // branch's hold-to-grow/full-detach mechanics both touch the SAME
  // `growing` flag the intro's own scripted extension is actively
  // driving; a plain click during 'growing' falls through to the
  // ordinary rope hit-test below instead, which is all a cut needs.
  if (introPhase !== 'done' && introPhase !== 'growing') return;
  const x = e.clientX, y = e.clientY;
  // defensive: a pointerdown that never reaches onPointerUp/pointercancel
  // (dropped event, capture stolen by another element, etc.) would otherwise
  // leave its holdTimer's reference overwritten but the timer itself still
  // pending — it would later fire against a LATER click's downInfo and mark
  // that later click as a false hold, silently swallowing it. Clearing here
  // guarantees at most one holdTimer is ever live at a time.
  clearTimeout(holdTimer);

  // introPhase === 'done' required here (not just isOnCircle) -- during
  // 'growing' the circle-press path below would either fight the intro's
  // own scripted extension for the `growing` flag (hold-to-grow) or
  // trigger a full detach mid-detach-triggered-regrowth (double-click),
  // neither of which this round's "allow cutting during growth" request
  // asked for. A press over the circle during 'growing' falls through to
  // the ordinary rope hit-test below instead.
  if (introPhase === 'done' && isOnCircle(x, y)){
    downInfo = { mode: 'circle' };
    logClick('down:circle', { x, y });
    holdTimer = setTimeout(() => {
      if (!downInfo || downInfo.mode !== 'circle') return;
      growing = true;
      logClick('hold:grow-start', { x, y });
    }, HOLD_THRESHOLD_MS);
    return;
  }

  // hold-to-charge isn't limited by Click Distance — you can press down
  // anywhere and the hold still charges, aimed at whatever the nearest rope
  // point turns out to be. Only a QUICK tap (below) still needs real
  // proximity, since that's what targets a specific punch/cut point.
  const hit = nearestPointOnRope(x, y, mainRope.points);
  // startedInCircle: true only for a press that landed inside the circle
  // but fell through to here anyway (introPhase !== 'done', per the
  // guard above) rather than taking the dedicated circle branch. Used
  // below to suppress charging for exactly this case -- reported
  // directly: "if i click and hold in the circle... when i let go, the
  // rope acts as if i had done a regular click and hold Flick. It
  // shouldnt. Whenever click and hold is initiated within the circle, no
  // Flick sequeuce should ever follow." Without this, a hold started in
  // the circle during 'growing' had no dedicated handling at all (the
  // circle branch is skipped there) and fell all the way through to the
  // ordinary rope hold-to-charge-punch path, so releasing it fired a full
  // charged punch the user never intended as a rope interaction -- they
  // were pressing the CIRCLE, same gesture that means "grow" once
  // introPhase reaches 'done'.
  const startedInCircle = isOnCircle(x, y);
  downInfo = { mode: 'rope', x, y, hit, startTime: performance.now(), charging: false, startedInCircle };
  logClick('down:rope', { x, y, hitDist: hit.dist, hitIndex: hit.index, startedInCircle });
  // Charging only becomes eligible after a FULL doubleClickThreshold of
  // holding, not the short HOLD_THRESHOLD_MS — this is what keeps it from
  // ever hijacking a real double-click. Provably safe, not just empirically:
  // if this release's own press duration already exceeds doubleClickThreshold,
  // the gap from the FIRST click's release (which is earlier still) must
  // exceed doubleClickThreshold too, so it could never have passed the
  // double-click gap check below anyway. Also never arms at all when
  // startedInCircle -- see that flag's own comment.
  holdTimer = setTimeout(() => {
    if (!downInfo || downInfo.mode !== 'rope' || downInfo.startedInCircle) return;
    downInfo.charging = true;
    logClick('hold:charging-start', { x, y });
  }, cfg.doubleClickThreshold);
}

function onPointerUp(e){
  // Ends a Rope Attraction hold -- independent of downInfo (see
  // onPointerDown's own rope-attraction branch), so checked first the same
  // way the FLICK release just below is. e.button === 2 on a pointerup
  // reports which button was JUST released, same convention as pointerdown.
  if (e.button === 2){
    if (ropeAttractionActive) logClick('up:rope-attraction', { x: e.clientX, y: e.clientY });
    ropeAttractionActive = false;
    return;
  }
  // Release ends a FLICK hold-preview (see onPointerDown) and starts that
  // animation's real sequence -- checked first, independent of downInfo
  // (a flick hold never sets it), same reasoning as onPointerDown's own
  // flick check running before the rope/circle logic below.
  if (holdingFlick === 2){
    holdingFlick = null;
    flick2Playing = true;
    flick2AnimTime = 0;
    logClick('up:flick2-play', { x: e.clientX, y: e.clientY, heldMs: Math.round(flickHoldTime * 1000) });
    return;
  }
  if (holdingFlick === 1){
    holdingFlick = null;
    flickPlaying = true;
    flickAnimTime = 0;
    logClick('up:flick-play', { x: e.clientX, y: e.clientY, heldMs: Math.round(flickHoldTime * 1000) });
    return;
  }
  if (!downInfo) return;
  clearTimeout(holdTimer);
  const info = downInfo;
  downInfo = null;

  const now = performance.now();

  if (info.mode === 'circle'){
    logClick('up:circle', { wasGrowing: growing });
    growing = false;
    // A double-click landing inside the circle's own exclusion zone still
    // needs to be able to cut the rope near the anchor -- previously,
    // isOnCircle() routed EVERY press starting there into this 'circle'
    // branch, which never even checked for a double-click, so the whole
    // circle-covered area was permanently uncuttable. Real bug, reported
    // directly ("double click in the circle still doesn't work"), and more
    // noticeable now that the anchor is a free-moving point that routinely
    // rests visually inside the circle graphic. Shares the same pendingClick
    // state the rope-side double-click path uses below, so a first click on
    // the circle followed by a second click on (or off) the circle within
    // Double Click Threshold still resolves as one double-click either way.
    if (pendingClick && (now - pendingClick.time) <= cfg.doubleClickThreshold){
      clearTimeout(pendingClick.timer);
      pendingClick = null;
      // Double-clicking ANYWHERE in the circle detaches the whole rope --
      // no distance-based hit test against the rope's actual curve. That
      // used to gate this on hitTestAnyIgnoringCircle() finding a target
      // within Double Click Distance, which silently did nothing for a
      // double-click landing in circle-space the rope doesn't currently
      // pass near (reported: "this is doble click in the circe but not on
      // the rope" / "click in the top 1/3 of the circle" -- confirmed the
      // anchor now rests low in the circle per Circle Offset, so the rope
      // itself only occupies the lower portion, leaving the rest of the
      // circle's own interior an unresponsive dead zone). The circle
      // itself is already the target -- there's no rope-curve proximity
      // to require.
      logClick('up:double-click-on-circle', { x: e.clientX, y: e.clientY, willDetach: mainRope.points.length >= 2 });
      // Double-clicking in the circle detaches the WHOLE rope (not a
      // minimum-length partial cut) and restarts the startup animation to
      // grow a fresh one in -- per explicit request: "the entire length
      // of visible rope falls out of the hole... after the same amount of
      // time as the startup animation, [it] starts a new rope."
      detachEntireRopeAndRestartIntro();
      return;
    }
    if (pendingClick) clearTimeout(pendingClick.timer);
    pendingClick = { time: now, timer: setTimeout(() => { pendingClick = null; }, cfg.doubleClickThreshold) };
    return;
  }

  if (pendingClick && (now - pendingClick.time) <= cfg.doubleClickThreshold){
    clearTimeout(pendingClick.timer);
    pendingClick = null;
    // re-resolve against CURRENT positions at release time -- the rope and
    // any fallen piece may both have moved since the press, and a double
    // click can be aimed at either (cuts the rope, or splits a piece).
    const target = hitTestAny(e.clientX, e.clientY, vmin(cfg.doubleClickDistance));
    logClick('up:double-click', { x: e.clientX, y: e.clientY, willCut: !!target, target: target && target.target });
    if (target){
      if (target.target === 'rope') cutRopeAt(target, e.clientX, e.clientY);
      else cutPieceAt(target.pieceIndex, target, e.clientX, e.clientY);
    }
    return;
  }

  if (info.charging){
    // a genuine hold — not limited by Click Distance (press down anywhere);
    // gated instead by its own, more generous Click And Hold Distance,
    // checked against WHERE THE HOLD ENDS, not where it started — the user
    // can press anywhere and move the pointer toward the rope before
    // releasing, so the release position (not the stale press-time info.hit)
    // is what determines whether/where it fires. An earlier version reused
    // info.hit, which is frozen at pointerdown time, so moving the pointer
    // during the hold had no effect at all — a hold that started too far
    // from the rope stayed stuck failing even after being dragged right
    // over it, matching the reported "click and hold doesn't work."
    const releaseHit = nearestPointOnRope(e.clientX, e.clientY, mainRope.points);
    const heldMs = now - info.startTime;
    if (releaseHit.dist > vmin(cfg.holdDistance)){
      logClick('up:hold-release-too-far', { x: e.clientX, y: e.clientY, releaseDist: releaseHit.dist, heldMs });
      return;
    }
    const t = Math.min(1, heldMs / cfg.clickHoldMaxDuration);
    const intensity = cfg.clickIntensity + t * cfg.intensityCeiling;
    logClick('up:hold-release-punch', { x: e.clientX, y: e.clientY, releaseDist: releaseHit.dist, heldMs, t, intensity });
    // Intensity Ceiling stacks ON TOP of Click Intensity, not in place of it
    // -- a hold starts at the same intensity a quick tap would produce and
    // rises from there, reaching Click Intensity + Intensity Ceiling exactly
    // at Click Hold Max Duration.
    applyPunch(mainRope.points, releaseHit, e.clientX, e.clientY, intensity, 0, mainRope.segLen);
    return;
  }

  // quick tap — arms pendingClick if the press landed near the rope OR a
  // fallen piece, so a double-click aimed at either (or a mix of the two)
  // still registers; only a ROPE tap fires the single-tap punch on its own
  // timeout — punching stays rope-only (unchanged scope), still keyed off
  // the original press-time rope hit (info.hit), same as before pieces
  // became double-click-cuttable.
  const nearAny = hitTestAny(info.x, info.y);
  if (!nearAny){
    logClick('up:tap-too-far', { x: info.x, y: info.y, hitDist: info.hit.dist });
    return;
  }
  if (pendingClick) clearTimeout(pendingClick.timer);
  logClick('up:tap-pending', { x: info.x, y: info.y, target: nearAny.target });
  pendingClick = {
    time: now,
    timer: setTimeout(() => {
      if (info.hit.dist <= vmin(cfg.clickDistance)){
        logClick('up:tap-punch', { x: info.x, y: info.y, hitDist: info.hit.dist, intensity: cfg.clickIntensity });
        applyPunch(mainRope.points, info.hit, info.x, info.y, cfg.clickIntensity, 0, mainRope.segLen);
      }
      pendingClick = null;
    }, cfg.doubleClickThreshold),
  };
}

canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', () => { logClick('cancel', { wasGrowing: growing }); downInfo = null; growing = false; clearTimeout(holdTimer); holdingFlick = null; ropeAttractionActive = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------------------------------------------------------------
   Update / render loop
--------------------------------------------------------------------- */
// viewportH() (not raw window.innerHeight -- see that helper's own
// comment) so this never silently computes a floor near the TOP of the
// screen instead of the bottom when window.innerHeight reads 0. Real,
// confirmed bug: with window.innerHeight===0 (this session's own
// sandbox, and per that same comment, a documented real mobile-browser
// quirk too), this returned a NEGATIVE floorY (e.g. -48 at floorHeight
// 6%vh against an 800px viewportH fallback) -- placing the "floor" far
// above where the anchor/rope actually rest, so EVERY point (including
// mainRope's own anchor, confined correctly by anchorBoundaryRadius())
// got clamped straight back up to that bogus line every single frame,
// reproducing exactly what looked like "the whole rope is frozen" and,
// downstream, "double-clicking the circle does nothing" (the anchor
// never actually settling anywhere near the circle to be double-clicked
// on in the first place).
function floorY(){ return viewportH() - vh(cfg.floorHeight); }

function update(rawDt){
  // Both FLICK animations play exactly one sequence per click, then stop
  // until clicked again -- per explicit request. "One sequence" for
  // animation 1 is one full ping-pong period (1->17->1, matching its own
  // triangle-wave design); for animation 2 it's one forward pass (1->21,
  // matching its own hard-cut-back design, see flick2FrameIndex()). Both
  // checks recompute cyclePos from the SAME formula their own
  // *FrameIndex() functions use (rather than precomputing a fixed
  // duration in seconds) so a live Anim Speed change mid-play still ends
  // the sequence at the right moment.
  // Hold-preview: cycles flickHoldFrames continuously for as long as
  // either graphic is held (see onPointerDown/onPointerUp) -- independent
  // of flickPlaying/flick2Playing, which only start once released. Cycle
  // RATE ramps linearly from 1x up to Flick Hold Max Speed as elapsed
  // hold time goes from 0 to Flick Hold Max Duration (then holds flat at
  // Max Speed past that point) -- per explicit request ("the longer I
  // hold, the faster the frames alternate... that maximum speed will be
  // hit at the maximum hold duration"). flickHoldCyclePos accumulates the
  // ACTUAL cycle position at this varying rate each frame (can't just
  // multiply elapsed time by a single rate the way the constant-rate
  // flickAnimTime/flick2AnimTime do, since the rate itself keeps
  // changing) -- flickHoldTime itself still only tracks elapsed real hold
  // duration, purely to drive rampProgress below.
  if (holdingFlick){
    flickHoldTime += rawDt;
    const rampProgress = cfg.flickHoldMaxDuration > 0 ? Math.min(1, flickHoldTime / cfg.flickHoldMaxDuration) : 1;
    const holdRate = 1 + (cfg.flickHoldMaxSpeed - 1) * rampProgress;
    flickHoldCyclePos += rawDt * FLICK_BASE_FPS * holdRate;
  }
  // Pauses on whichever frame the sequence is CURRENTLY showing if that
  // specific image hasn't finished loading yet, rather than letting the
  // clock advance regardless. Reported as "the animation only seems to
  // show like two, three frames. Then it goes back to waiting position...
  // I click it again, then it runs maybe four, five frames... eventually
  // it runs in full" -- root cause: render()'s own draw guard
  // (`img.complete && naturalWidth > 0`) already silently skips drawing
  // any frame whose image isn't ready, but flickAnimTime/flick2AnimTime
  // used to advance on real elapsed time ALONE, completely independent of
  // whether the frame it mapped to actually drew -- so the sequence
  // still reached its own completion threshold and cleanly returned to
  // idle "on schedule" even though most of its higher-index frames (still
  // downloading, especially right after a hard refresh where the browser
  // cache is bypassed for all ~40+ FLICK images across both animations)
  // never visibly drew at all. Confirmed NOT a simple "wait longer"
  // fix -- 17-21 frames at ~500KB+ each is 10+MB per animation, which can
  // easily exceed a 30s real-world load window depending on connection,
  // matching the user's own report that waiting didn't help. Checking the
  // CURRENT (not-yet-advanced) frame's own load state before advancing
  // means a slow-loading frame simply holds the sequence there
  // (retried every subsequent frame) instead of the clock racing past it
  // -- every frame is guaranteed to actually display before the sequence
  // can complete, regardless of how long images take to arrive.
  // isFrameBlocking(): true only while an image is genuinely STILL
  // LOADING (complete === false). A FAILED load (a real, recurring
  // condition for these exact FLICK images -- see the ERR_CONNECTION_RESET
  // gotcha already documented for this project) settles into complete
  // === true / naturalWidth === 0, a permanent end-state indistinguishable
  // from "loaded successfully" by the `complete` flag alone. The pause
  // fix above (see its own comment) originally checked `complete &&
  // naturalWidth > 0` to decide whether to advance -- which correctly
  // paused on a slow-but-eventually-successful load, but ALSO permanently
  // froze the sequence forever on a genuinely FAILED one, since that
  // condition can never become true. Confirmed directly: a deliberately
  // 404'd image settles at {complete:true, naturalWidth:0} and stays
  // there. Reported as "same animation issue" recurring after the
  // original fix shipped -- this is that regression. Now only blocks
  // advancement while complete is false (genuinely still in flight);
  // once complete is true, advance regardless of naturalWidth --
  // matching the ORIGINAL graceful-degradation behavior for a failed
  // frame (render() already skips drawing it either way) while still
  // fixing the original bug (a merely slow frame no longer gets skipped
  // over by the clock racing ahead of it).
  function isFrameBlocking(img){
    return !!img && !img.complete;
  }
  if (flickPlaying){
    if (!isFrameBlocking(flickFrames[flickFrameIndex()])){
      flickAnimTime += rawDt;
      const flickPeriod = (FLICK_FRAME_COUNT - 1) * 2;
      if (flickAnimTime * FLICK_BASE_FPS * cfg.flickAnimSpeed >= flickPeriod){
        flickPlaying = false;
        flickAnimTime = 0;
      }
    }
  }
  if (flick2Playing){
    if (!isFrameBlocking(flickFrames2[flick2FrameIndex()])){
      flick2AnimTime += rawDt;
      if (flick2AnimTime * FLICK_BASE_FPS * cfg.flick2AnimSpeed >= FLICK2_FRAME_COUNT){
        flick2Playing = false;
        flick2AnimTime = 0;
      }
    }
  }
  if (introPhase !== 'done') updateIntro(rawDt);
  const dt = rawDt * cfg.ropeAnimSpeed;
  // Startup Rise Gravity replaces normal Gravity Strength for BOTH
  // mainRope and bgRope (they share this one gravityAccel below) until
  // the anchor actually REACHES equilibrium -- per explicit correction
  // ("i want the gravity to stay, the startup gravity, until they reach
  // the equilibrium point. Then it becomes real gravity"), replacing an
  // earlier introPhase!=='done' gate that switched gravity back to full
  // strength the instant the whole startup SEQUENCE finished, regardless
  // of whether the anchor had actually settled -- confirmed to produce a
  // real, abrupt discontinuity at extreme Startup Rise Gravity values
  // (tracing a live example: anchor sitting still at ~148 while
  // introPhase was 'growing', then snapping hard toward true equilibrium
  // the instant 'growing' completed and gravity jumped from 0.01 to
  // 1.7 -- 170x -- in one frame). integrateChain()'s own
  // boundaryConstraint clamps a point to EXACTLY boundaryConstraint.radius
  // the instant it's found beyond it (see that function) -- which used to
  // mean a mainRope spawned beyond the boundary (a large Startup Rise
  // Clear Offset) got hard-snapped back to EXACTLY that radius on the very
  // next physics tick regardless of Startup Rise Gravity's own value,
  // producing a velocity-kick "shoot" on the frame after (the clamp moves
  // position without touching oldx/oldy, so the FOLLOWING frame's verlet
  // step reads the clamp's own correction as real motion). Reported
  // directly: "even though the startup gravity is low, it still seems to
  // shoot right back down to the default offset." Fixed by disabling that
  // hard clamp entirely while unsettled (radius: Infinity), so a spawn
  // point placed outside the boundary free-falls in under Startup Rise
  // Gravity alone, same as any other unconstrained point, rather than
  // being rigidly pinned to the boundary from frame one.
  //
  // "Unsettled" went through 2 wrong definitions before this one. First,
  // a stateful flag flipped true the instant dist-FROM-CENTER dropped to
  // <= anchorBoundaryRadius() -- broke down whenever Clear Offset placed
  // the spawn point on the far side of center from the boundary's real
  // resting spot (e.g. 2.25%vmin above center when the boundary sits
  // 9.25%vmin below it), which already counts as "inside" that measure
  // despite having barely begun falling -- so it flipped settled on the
  // very first frame, and Startup Rise Gravity never got a chance to
  // apply ("the startup rise gravity slider doesnt seem to do
  // anything"). Recomputing that SAME from-center check fresh every
  // frame (instead of once, as a persisted flag) fixed that exact
  // symptom but didn't fix the underlying flaw -- once introPhase left
  // 'pausing' (Pause Duration is 0.5s by default), the from-center check
  // was STILL satisfied instantly for this same spawn geometry, so full
  // Gravity Strength (1.7, ~170x the slider's 0.01) took back over after
  // only 0.5s regardless -- the anchor's own real fall (still ~11.5%vmin
  // to go) then happened almost entirely under NORMAL gravity, reading
  // as "even at 0.01 it falls at a relatively normal speed" once
  // measured against a real elapsed-time comparison rather than eyeballed.
  //
  // Fixed by measuring distance from the anchor's actual REST point (the
  // boundary's own bottom point, circleAnchor().y + anchorBoundaryRadius()
  // -- the same "hanging straight down" spot gravity always pulls it
  // toward, already used elsewhere in this file as bottomY) instead of
  // distance from center. This is what "up until it falls and hits the
  // circle offset default position, then switches" (verbatim) actually
  // describes -- a real arrival at a real target, not an incidental
  // radius-from-center measurement that can be satisfied without any
  // falling happening at all. EPSILON (2%vmin) is a judgment call, not a
  // measured value -- picked as "close enough that re-enabling the
  // boundary clamp at that point produces at most an imperceptible
  // correction," not derived from any specific measurement.
  const restPoint = { x: circleAnchor().x, y: circleAnchor().y + anchorBoundaryRadius() };
  const anchorDistFromRest = Math.hypot(mainRope.points[0].x - restPoint.x, mainRope.points[0].y - restPoint.y);
  const REST_EPSILON = vmin(2);
  const introUnsettled = introPhase !== 'done' && (introPhase === 'pausing' || anchorDistFromRest > REST_EPSILON);
  const gravityAccel = vh(90) * (introUnsettled ? cfg.startupRiseGravity : cfg.gravityStrength);

  // mainRope.points[0] (the anchor end) is no longer rigidly pinned to the
  // circle's center -- per explicit request, it's now a normal physics
  // point (subject to gravity, and pulled around by the rope's own
  // swinging motion via the distance/bend constraints, same as every
  // other point) that's kept inside the circle entirely by
  // integrateChain()'s own boundaryConstraint param (position, negotiated
  // iteratively alongside the distance/bend constraints, and
  // velocity-preserving -- see that function's comment for why). pinnedIndex
  // is now -1 (no pin at all), matching how fallenPieces already integrate.
  // During the startup animation's own 'growing' phase, extension paces
  // off Startup Extension Speed (or its tween) instead of the manual
  // Rope Growth Rate -- independently tunable, per explicit request.
  if (growing) growRope(rawDt, introPhase === 'growing' ? currentIntroExtendRate() : undefined);
  // Rope Attraction: nudge mainRope's own tip toward the mouse each frame
  // while right-click-held, THEN let integrateChain()'s own constraint
  // solve (just below) resolve it -- deliberately NOT excluded from that
  // solve the way a growing tip is (see hasPartialTip/skipLastSegment
  // below): the whole point is that the distance constraint's own
  // segment-length limit is what naturally caps how far the tip can
  // actually reach, so a mouse target farther than the rope's real total
  // length just pulls the chain as far toward it as the rope's own length
  // allows -- per explicit request ("If the rope length or wahtever isnt
  // enough for the endcap to fully look at the mouse, it will rotate as
  // much as it can"). The endcap's own "look at the mouse" rotation is a
  // free consequence of this: drawEndcap() already orients off
  // tipDirection(), which reads straight from wherever the tip physics
  // point actually ends up -- no separate rotation logic needed.
  if (ropeAttractionActive){
    const tip = mainRope.points[mainRope.points.length - 1];
    const anchor = mainRope.points[0];
    // Max Reach Distance clamps the ATTRACTION TARGET itself (measured
    // from the rope's own anchor point) rather than the tip's per-frame
    // movement -- an independent, tunable ceiling on top of whatever the
    // rope's real physical length already allows, so it can be dialed
    // BELOW the rope's full length (a shorter "leash") without fighting
    // the constraint solver's own, separate length limit.
    const maxReach = vmin(cfg.ropeAttractionMaxReach);
    let tx = mouseX - anchor.x, ty = mouseY - anchor.y;
    const tdist = Math.hypot(tx, ty) || 1e-6;
    if (tdist > maxReach){ tx *= maxReach / tdist; ty *= maxReach / tdist; }
    let dx = (anchor.x + tx) - tip.x, dy = (anchor.y + ty) - tip.y;
    const ddist = Math.hypot(dx, dy);
    if (ddist > 0.0001){
      // Frame-rate-independent ease (not a flat per-frame fraction) so
      // Rope Attraction Intensity means the same thing regardless of the
      // actual frame rate this environment happens to render at.
      const ease = 1 - Math.pow(1 - cfg.ropeAttractionIntensity, dt * 60);
      let moveX = dx * ease, moveY = dy * ease;
      const moveDist = Math.hypot(moveX, moveY);
      const maxMove = vmin(cfg.ropeAttractionSpeed) * dt;
      if (moveDist > maxMove){ const s = maxMove / moveDist; moveX *= s; moveY *= s; }
      tip.x += moveX; tip.y += moveY;
    }
  }
  // Forced false while Rope Attraction is active -- reported directly:
  // "after i extend the rope, the attraction no longer works. it only
  // works once i cut the rope." Root cause: positionGrowingTip() (called
  // below whenever hasPartialTip is true -- not just while actively
  // holding to grow, but for as long as the last segment remains a
  // partial one, which is the normal state any time growth stopped
  // mid-segment) unconditionally overwrites the tip's own x/y AFTER the
  // attraction nudge above already ran this same frame, silently
  // discarding it every frame -- exactly why cutting "fixed" it:
  // performMainRopeSplit() always sets tipGrowLen = segLen, permanently
  // clearing hasPartialTip until the next growth. Attraction now treats
  // the tip as fully committed for as long as it's held, matching
  // cutting's own effect: it re-enters the normal constraint solve
  // (skipLastSegment below reads this same flag) instead of being
  // kinematically placed, and positionGrowingTip() is skipped entirely.
  // Reverts to the real tipGrowLen-based value the instant attraction
  // ends, so an in-progress hold-to-grow resumes exactly where it left
  // off.
  const hasPartialTip = !ropeAttractionActive && mainRope.tipGrowLen < mainRope.segLen;
  // radius is the circle's own drawn edge (not Infinity) while
  // introUnsettled -- lets a spawn point placed beyond the tight
  // anchorBoundaryRadius() free-fall under Startup Rise Gravity instead
  // of being hard-clamped back to that tight radius on the spot, but
  // still never lets it visibly leave the circle graphic entirely.
  // Genuinely unbounded (Infinity) was tried first and reported directly:
  // "it sometimes falls through beyond the circle bottom" -- gravity
  // plus the chain's own momentum, with nothing at all limiting the fall,
  // could carry the anchor visibly outside the circle before the
  // distance-from-rest check (see introUnsettled's own comment) caught up
  // and re-armed the tight clamp. weightMult still applies regardless of
  // which radius is active (a separate object field the distance
  // constraint reads independent of radius), so Anchor Weight isn't lost
  // during the unsettled window.
  const circleR = vmin(cfg.circleSize) / 2;
  integrateChain(mainRope.points, mainRope.segLen, dt, gravityAccel, -1, hasPartialTip,
    { index: 0, center: circleAnchor(), radius: introUnsettled ? circleR : anchorBoundaryRadius(), weightMult: cfg.anchorWeight });
  // The exact frame introUnsettled flips true->false, the boundary radius
  // shrinks from circleR down to the much tighter anchorBoundaryRadius()
  // in the SAME integrateChain() call above -- if the anchor was still
  // outside that tighter radius (it can be, by up to REST_EPSILON's own
  // margin), this clamps it inward immediately, and since the clamp
  // itself never touches oldx/oldy, the FOLLOWING frame's verlet step
  // reads that positional correction as real velocity -- the same
  // clamp-creates-spurious-velocity mechanism already fixed once for the
  // spawn transition, recurring here at the settle transition instead.
  // Reported directly: "once it has reached the circle offset... the
  // entire rope unit bounces upwards to the top of the circle, then
  // falls back down." Fixed the same way spawn already is: zero the
  // implied velocity on exactly this one transition frame.
  if (anchorWasUnsettled && !introUnsettled){
    mainRope.points[0].oldx = mainRope.points[0].x;
    mainRope.points[0].oldy = mainRope.points[0].y;
  }
  anchorWasUnsettled = introUnsettled;
  // Boot-only endcap grow-in (see the 'pausing'->'growing' spawn code's
  // own comment for why this is armed only there, and only for boot) --
  // null once finished, so this whole block is skipped as soon as
  // there's nothing left to grow (and permanently skipped for a
  // detach-triggered spawn, which never arms it).
  if (mainRope.bootEndcapScale !== null){
    mainRope.bootEndcapScale = Math.min(cfg.endcapHeight, mainRope.bootEndcapScale + cfg.mainEndcapGrowSpeed * rawDt);
    if (mainRope.bootEndcapScale >= cfg.endcapHeight) mainRope.bootEndcapScale = null;
  }
  if (hasPartialTip) positionGrowingTip();

  // Background "peeking" rope (see render()'s own comment on the clip):
  // its anchor is forced to mainRope's own anchor -- ALREADY updated by
  // the integrateChain() call just above, so this reads this frame's real
  // final position, not last frame's -- every tick, then pinnedIndex=0
  // keeps that point fixed for bgRope's own integration below (same
  // mechanism mainRope's anchor used before it became free-floating).
  // Everything else about bgRope (its own gravity/damping/constraint
  // solve, via the SAME cfg values mainRope uses) is fully independent,
  // so it swings on its own rather than mirroring mainRope's body shape --
  // only its start point is driven externally, per explicit request.
  // EXCEPT during 'waiting'/'rising'/'pausing': bgRope IS the startup
  // animation's own climbing (then holding) visual through all 3 of
  // those phases now (see updateIntro()), so its anchor is driven by
  // that phase's own logic instead -- left untouched here so this block
  // doesn't fight it. 'pausing' was NOT excluded here until this fix --
  // since mainRope no longer spawns until 'pausing' ENDS, this line was
  // still forcing bgRope's held position to follow the OLD, stale,
  // hidden mainRope (wherever it had drifted to during the entire
  // waiting+rising+pausing duration) every single frame, completely
  // undoing "it stays there for the pause duration" -- bgRope visibly
  // moved off the clear-offset line during the pause instead of holding.
  if (introPhase !== 'waiting' && introPhase !== 'rising' && introPhase !== 'pausing'){
    bgRope.points[0].x = mainRope.points[0].x;
    bgRope.points[0].y = mainRope.points[0].y;
  }
  integrateChain(bgRope.points, bgRope.segLen, dt, gravityAccel, 0);
  maintainBgRopeEnd();

  // Detach-triggered tip endcap scale-up (see detachEntireRopeAndRestartIntro())
  // -- a simple linear ramp, deliberately separate from the End Emerge
  // system. undefined (the boot-time rope never sets this) means "always
  // full size", the pre-existing behavior.
  if (mainRope.detachTipScaleProgress !== undefined && mainRope.detachTipScaleProgress < 1){
    mainRope.detachTipScaleProgress = Math.min(1, mainRope.detachTipScaleProgress + rawDt / cfg.detachTipGrowDuration);
  }

  // A Fall Delay > 0 cut hasn't actually split mainRope yet (see
  // cutRopeAt's pendingCut) -- it just integrated as one whole chain above,
  // identically to an uncut rope. Once the countdown elapses, perform the
  // real split now, using this frame's already-updated positions.
  if (mainRope.pendingCut){
    mainRope.pendingCut.delay -= dt;
    if (mainRope.pendingCut.delay <= 0){
      const idx = mainRope.pendingCut.idx;
      mainRope.pendingCut = null;
      performMainRopeSplit(idx);
    }
  }

  // cutSweep.progress only drives the cosmetic sweep-mark overlay now
  // (render()) — it never gates anything's own physics, so a piece cut
  // mid-swing keeps swinging/falling continuously from the very next frame.
  // mainRope and any piece can each carry their own independent cutSweep
  // (a rope cut, and any number of subsequent piece-splits, all animate
  // on their own timeline).
  if (mainRope.cutSweep && mainRope.cutSweep.progress < 1){
    mainRope.cutSweep.progress = Math.min(1, mainRope.cutSweep.progress + rawDt * cfg.cutSpeed / CUT_SWEEP_BASE_SEC);
  }
  fallenPieces.forEach(piece => {
    if (piece.cutSweep && piece.cutSweep.progress < 1){
      piece.cutSweep.progress = Math.min(1, piece.cutSweep.progress + rawDt * cfg.cutSpeed / CUT_SWEEP_BASE_SEC);
    }
  });

  // End Emerge -- same raw-wall-clock, cosmetic-timer treatment as
  // cutSweep just above; a no-op per-tick when there's no active emerge
  // state (nothing cut yet, or End Emerge is off).
  tickEmerge(mainRope.tipEmerge, rawDt, cfg.endEmergeSpeed);
  fallenPieces.forEach(piece => {
    tickEmerge(piece.tipEmerge, rawDt, cfg.pieceEndEmergeSpeed);
    tickEmerge(piece.cutEdgeEmerge, rawDt, cfg.pieceEndEmergeSpeed);
  });

  const fallGravity = vh(90) * cfg.gravityStrength * cfg.ropeFallSpeed;
  fallenPieces.forEach(piece => {
    if (piece.age !== undefined) piece.age += rawDt;
    integrateChain(piece.points, piece.segLen, dt, fallGravity, -1);
    // A piece-on-piece cut (cutPieceAt) hasn't actually split `piece` yet
    // -- same pendingCut deferral as mainRope's, checked after this
    // piece's own integration above so the split happens against this
    // frame's already-updated positions, identically to how
    // mainRope's pendingCut is resolved after ITS integration. A newly
    // split-off lower piece pushed here starts getting its own
    // integrateChain() from next frame's pass over fallenPieces.
    if (piece.pendingCut){
      piece.pendingCut.delay -= dt;
      if (piece.pendingCut.delay <= 0){
        const idx = piece.pendingCut.idx;
        piece.pendingCut = null;
        performPieceSplit(piece, idx);
      }
    }
  });

  if (cfg.floorEnabled){
    // the main rope (still attached to the circle) collides with the floor
    // too, not just cut-off pieces — otherwise growing it long enough to
    // reach the floor just clips straight through with no reaction at all.
    const fY = floorY();
    const allPoints = mainRope.points.slice();
    fallenPieces.forEach(piece => allPoints.push(...piece.points));
    allPoints.forEach(p => {
      if (p.y > fY){
        p.y = fY;
        p.oldx = p.x - (p.x - p.oldx) * 0.3;
        p.oldy = p.y;
      }
    });
    // The OLD pileRepulsion() had no concept of chain adjacency -- it
    // repelled ANY two points closer than minSep, including two points
    // from far apart in the SAME chain that simply ended up
    // geometrically close after piling against the floor, fighting
    // integrateChain()'s own distance constraint for the ENTIRE rope and
    // causing a severe, reproduced tangle (worst-case segment-length
    // ratio >6x) -- so it was removed from this call site entirely
    // rather than reintroduce that bug. pieceCollision() below is the
    // chain-adjacency-aware replacement this comment used to say would
    // be needed: it only ever repels a piece's points against a
    // DIFFERENT piece's points, never its own, so it's safe to run every
    // frame without refighting any single chain's own constraints --
    // per explicit request ("I want the cut off rope segments to have
    // collision detection with each other so they either stack or push
    // each other around").
    pieceCollision(dt);
  } else {
    fallenPieces = fallenPieces.filter(piece => piece.points.some(p => p.y < viewportH() * 1.5));
  }
}

// Draws one rope end's rounded cap as a half-ellipse bulging outward from
// (px,py) in direction (dirx,diry): a flat chord spanning the rope's full
// width (thicknessPx) plus a curved protrusion whose depth is
// (thicknessPx/2)*arcMult. At arcMult=0 the protrusion degenerates to
// nothing (a flat line, matching a straight/butt end); at arcMult=1 the
// protrusion equals the chord's own half-width, making the shape a TRUE
// semicircle (matching the old always-round look); values in between are
// a proportionally flattened arc, not a smaller full circle -- per
// explicit clarification that Rope End/Top Curve Arc controls how much of
// a semicircle the end is, not the size of a circle sitting on top of it.
function drawEndArc(px, py, dirx, diry, thicknessPx, arcMult, gradientStops){
  if (arcMult <= 0) return;
  const halfW = thicknessPx / 2;
  const protrusion = halfW * arcMult;
  const angle = Math.atan2(diry, dirx);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  // Rope End Arc Seam Overlap (cfg.arcSeamOverlapPx) -- reported as "i
  // see a seam between the rope and the rope end/start arch curve cap."
  // Same root cause and fix shape as the earlier endcap/rope seam (see
  // drawEndcap()'s own ENDCAP_SEAM_OVERLAP_PX comment): this arc's own
  // flat base chord and the rope's own butt-capped stroke end
  // (strokeRopeCurve()) meet at the EXACT same world coordinate with the
  // EXACT same width -- a mathematically perfect zero-overlap join
  // between 2 independently-rasterized canvas shapes, which
  // anti-aliases into a visible hairline gap. Shifting the arc's own
  // local origin backward (toward the rope, along -local-x, i.e. -dir in
  // world space) BEFORE the ellipse below is drawn moves the WHOLE arc
  // shape (base chord and all) that far into the rope, hiding the seam
  // under solid overlap. No measured "correct" overlap exists for a
  // sub-pixel AA artifact -- started as a hardcoded constant (1.5px,
  // then 4px, then 2.5px, each a manual edit+push cycle to find a value
  // that visually closed the seam), now a live-adjustable slider per
  // explicit follow-up request instead of requiring a code edit for
  // every retry.
  ctx.translate(-cfg.arcSeamOverlapPx, 0);
  // Optional gradient (Rope End Arc Gradient) -- local to THIS arc's own
  // small protrusion (base chord at local x=0 -> outward tip at
  // x=protrusion), created here (inside the already-translated/rotated
  // space) rather than in world coordinates, same reasoning as Endcap
  // Gradient's own local-vs-world fix: a small end feature mapped against
  // the whole rope's own world-space anchor-to-tip span would clamp to
  // nearly one constant color instead of showing a real gradient. Caller
  // (drawRopeEndArcs()) already set ctx.fillStyle to the plain fallback
  // color; this only overrides it when a real gradient is supplied.
  if (gradientStops && gradientStops.length >= 2){
    const grad = ctx.createLinearGradient(0, 0, protrusion, 0);
    [...gradientStops].sort((a, b) => a.pos - b.pos).forEach(s => grad.addColorStop(Math.max(0, Math.min(1, s.pos)), s.color));
    ctx.fillStyle = grad;
  }
  ctx.beginPath();
  // local +x now points in the outward `dir` direction; the arc spans
  // -90..+90 degrees (the half where local x >= 0, i.e. the outward-facing
  // half only), closed off by the flat chord straight back to the start.
  ctx.ellipse(0, 0, protrusion, halfW, 0, -Math.PI / 2, Math.PI / 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Builds a top-to-bottom linear gradient across the entity's own current
// points (anchor -> tip) from an ordered color-stop array, evenly spaced
// (stop i at i/(n-1)), or just returns the plain fallback color when the
// gradient is off/not enough stops -- `ctx.strokeStyle`/`fillStyle` accept
// a CanvasGradient exactly like a string, so every existing caller of
// strokeRopeCurve()/drawEndcap()/etc. needs no change beyond passing this
// through instead of a raw color.
function ropeStrokeColor(points, enabled, stops, fallbackColor){
  if (!enabled || !stops || stops.length < 2) return fallbackColor;
  const top = points[0], bottom = points[points.length - 1];
  const grad = ctx.createLinearGradient(top.x, top.y, bottom.x, bottom.y);
  // Each stop's own `pos` (0-1, independently draggable -- see
  // buildRow()'s 'gradient' editor) decides where it kicks in, NOT an
  // even 1/(n-1) spacing -- per explicit request. addColorStop() itself
  // requires an ascending-order sequence of calls; stops are sorted by
  // pos here rather than trusted to already be in order (the editor
  // keeps them sorted as stored, but this is what actually enforces it
  // for the gradient itself).
  [...stops].sort((a, b) => a.pos - b.pos).forEach(s => grad.addColorStop(Math.max(0, Math.min(1, s.pos)), s.color));
  return grad;
}

function strokeRopeCurve(points, thicknessPx, color){
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = thicknessPx; ctx.lineJoin = 'round';
  // Always a flat (butt) cap on the stroke itself now -- it used to be
  // unconditionally 'round', so even at Rope End Curve Arc's minimum (0)
  // the stroke's own inherent round cap still rounded the tip off (only
  // the SEPARATE filled arc below was ever gated by endArcMult). Per
  // explicit request ("when I set Rope End Curve Arc, I want the end of
  // the rope to be a straight line"), all roundedness now comes ONLY from
  // the independently-sized arc circles drawn below, at each end
  // separately -- necessary because ctx.lineCap is a single value for the
  // WHOLE stroked path, but a piece's two ends (its free/growing tip vs
  // its own cut edge) can need genuinely different treatment at the same
  // time (e.g. mid-emergence at one end, fully settled at the other) —
  // something one shared lineCap could never express.
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  const n = points.length;
  if (n === 2){
    // nothing to curve through -- a single segment is just a straight line.
    ctx.lineTo(points[1].x, points[1].y);
  } else {
    // Every interior point curves through itself toward the MIDPOINT of
    // itself and its neighbor (the standard smooth-curve-through-a-
    // polyline technique) -- EXCEPT the last one, which curves all the
    // way to the actual tip coordinate instead of a midpoint, since
    // there's no point past the tip to average with. An earlier version
    // used `ctx.lineTo(tip)` for that final leg instead, which always drew
    // a dead-straight line for roughly the last half-to-full segment
    // length regardless of the rope's actual physics state -- reported as
    // "the last ~20px end seems to be a stiff piece" (an almost exact
    // match for one segLen, ~24.9px at default settings). Confirmed as a
    // pure rendering artifact, not real stiffness: nothing in the physics
    // (constraints, bendStiffness, growth) singles out the tip's own
    // segment for extra rigidity outside of active growth (see
    // integrateChain()'s bendEnd, which only excludes the tip while a
    // partial segment is still growing). Curving through the actual tip
    // coordinate instead removes the straight leg entirely.
    for (let i = 1; i < n - 1; i++){
      const isLast = i === n - 2;
      const ex = isLast ? points[i+1].x : (points[i].x + points[i+1].x) / 2;
      const ey = isLast ? points[i+1].y : (points[i].y + points[i+1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, ex, ey);
    }
  }
  ctx.stroke();
}

// Split out of strokeRopeCurve() so callers can draw the rope's own BODY
// first, then the (decorative SVG) endcap on top of it, and only THEN
// these plain round-cap arcs -- rather than the arcs always painting
// immediately after the body, before any endcap. Reported directly:
// "the growing endcap on both the main rope and the cut off segments,
// are still showing above the rope end arch curve endcap piece. It
// should not. The endcap geometry that is scaling up should be layered
// behind this semi circle rope end/ rope start geometry." Since these
// arcs are already ONLY drawn while an endcap is absent or still mid-
// emerge (see mainArcMult/tipArcMult/cutArcMult, gated on
// `factor >= 1`), moving the arc draw call to AFTER the corresponding
// drawEndcap() call is exactly what makes the arc win that overlap --
// still hidden entirely once the endcap fully emerges (factor >= 1
// zeroes the relevant *ArcMult, same as before), but no longer visible
// UNDER a still-emerging endcap's own semi-transparent/partial edges in
// the meantime. No change to WHEN an arc is drawn (still gated by the
// exact same *ArcMult logic) -- only where in the draw order it lands.
function drawRopeEndArcs(points, thicknessPx, color, endArcMult, startArcMult, endFacingOverride){
  if (startArcMult === undefined) startArcMult = 0;
  // Set explicitly (not inherited from ctx state) -- drawEndcap() may have
  // run in between this call and the strokeRopeCurve() call that drew the
  // rope body, and its own fill color/gradient would otherwise still be
  // sitting in ctx.fillStyle by the time drawEndArc()'s own ctx.fill() runs.
  // This is only the FALLBACK when Rope End Arc Gradient is off --
  // drawEndArc() itself overrides it with a real gradient when enabled
  // (see that function's own comment).
  ctx.fillStyle = color;
  // Rope End Arc Gradient -- per explicit request ("provide me a slider
  // to set the gradent of the rope end/start arch curved endcap"), a
  // separate/independent gradient from both Rope Gradient (the body
  // stroke) and Endcap Gradient (the decorative SVG endcap). Read once
  // here rather than per-arc-call since both ends of the same entity
  // share the one setting.
  const arcGradientStops = cfg.arcGradientEnabled ? cfg.arcGradientColors : null;
  const n = points.length;
  const tip = points[n - 1];
  if (endArcMult > 0){
    // endFacingOverride: see drawEndcap()'s own identical param -- same
    // "point at the mouse regardless of physical reach" reasoning,
    // applied here so the plain round-cap arc (shown whenever Endcap
    // Design is None) also faces the mouse during Rope Attraction.
    const dir = endFacingOverride || tipDirection(points);
    drawEndArc(tip.x, tip.y, dir.x, dir.y, thicknessPx, endArcMult, arcGradientStops);
  }
  // startArcMult mirrors endArcMult at points[0] instead of points[n-1] --
  // meaningful for both a fallen piece's own free cut edge (Rope End
  // Curve Arc reused there) AND mainRope's own anchor point (Rope Top
  // Curve Arch, a separate/independent setting -- the rope draws ON TOP
  // of the circle graphic, per render()'s own draw order, so this end is
  // genuinely visible, not hidden underneath it).
  if (startArcMult > 0){
    const base = points[0], next = points[1];
    let dx = base.x - next.x, dy = base.y - next.y;
    const dlen = Math.hypot(dx, dy) || 1;
    drawEndArc(base.x, base.y, dx / dlen, dy / dlen, thicknessPx, startArcMult, arcGradientStops);
  }
}
