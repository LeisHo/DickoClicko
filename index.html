  downInfo = { mode: 'rope', x, y, hit, startTime: performance.now(), charging: false };
  logClick('down:rope', { x, y, hitDist: hit.dist, hitIndex: hit.index });
  // Charging only becomes eligible after a FULL doubleClickThreshold of
  // holding, not the short HOLD_THRESHOLD_MS — this is what keeps it from
  // ever hijacking a real double-click. Provably safe, not just empirically:
  // if this release's own press duration already exceeds doubleClickThreshold,
  // the gap from the FIRST click's release (which is earlier still) must
  // exceed doubleClickThreshold too, so it could never have passed the
  // double-click gap check below anyway.
  holdTimer = setTimeout(() => {
    if (!downInfo || downInfo.mode !== 'rope') return;
    downInfo.charging = true;
    logClick('hold:charging-start', { x, y });
  }, cfg.doubleClickThreshold);
}

function onPointerUp(e){
  if (!downInfo) return;
  clearTimeout(holdTimer);
  const info = downInfo;
  downInfo = null;

  const now = performance.now();

  if (info.mode === 'circle'){
    logClick('up:circle', { wasGrowing: growing });
    growing = false;
    // A double-click landing inside the circle's own exclusion zone still
    // needs to be able to cut the rope near the anchor -- previously,
    // isOnCircle() routed EVERY press starting there into this 'circle'
    // branch, which never even checked for a double-click, so the whole
    // circle-covered area was permanently uncuttable. Real bug, reported
    // directly ("double click in the circle still doesn't work"), and more
    // noticeable now that the anchor is a free-moving point that routinely
    // rests visually inside the circle graphic. Shares the same pendingClick
    // state the rope-side double-click path uses below, so a first click on
    // the circle followed by a second click on (or off) the circle within
    // Double Click Threshold still resolves as one double-click either way.
    if (pendingClick && (now - pendingClick.time) <= cfg.doubleClickThreshold){
      clearTimeout(pendingClick.timer);
      pendingClick = null;
      const target = hitTestAnyIgnoringCircle(e.clientX, e.clientY, vmin(cfg.doubleClickDistance));
      logClick('up:double-click-on-circle', { x: e.clientX, y: e.clientY, willCut: !!target, target: target && target.target });
      if (target){
        // Double-clicking in the circle now detaches the WHOLE rope (not a
        // minimum-length partial cut) and restarts the startup animation to
        // grow a fresh one in -- per explicit request: "the entire length
        // of visible rope falls out of the hole... after the same amount of
        // time as the startup animation, [it] starts a new rope." A double-
        // click resolving to an already-fallen piece is unaffected (still a
        // normal partial cutPieceAt) -- this feature is about the live rope
        // specifically, the same scope as the original report.
        if (target.target === 'rope') detachEntireRopeAndRestartIntro();
        else cutPieceAt(target.pieceIndex, target, e.clientX, e.clientY);
      }
      return;
    }
    if (pendingClick) clearTimeout(pendingClick.timer);
    pendingClick = { time: now, timer: setTimeout(() => { pendingClick = null; }, cfg.doubleClickThreshold) };
    return;
  }

  if (pendingClick && (now - pendingClick.time) <= cfg.doubleClickThreshold){
    clearTimeout(pendingClick.timer);
    pendingClick = null;
    // re-resolve against CURRENT positions at release time -- the rope and
    // any fallen piece may both have moved since the press, and a double
    // click can be aimed at either (cuts the rope, or splits a piece).
    const target = hitTestAny(e.clientX, e.clientY, vmin(cfg.doubleClickDistance));
    logClick('up:double-click', { x: e.clientX, y: e.clientY, willCut: !!target, target: target && target.target });
    if (target){
      if (target.target === 'rope') cutRopeAt(target, e.clientX, e.clientY);
      else cutPieceAt(target.pieceIndex, target, e.clientX, e.clientY);
    }
    return;
  }

  if (info.charging){
    // a genuine hold — not limited by Click Distance (press down anywhere);
    // gated instead by its own, more generous Click And Hold Distance,
    // checked against WHERE THE HOLD ENDS, not where it started — the user
    // can press anywhere and move the pointer toward the rope before
    // releasing, so the release position (not the stale press-time info.hit)
    // is what determines whether/where it fires. An earlier version reused
    // info.hit, which is frozen at pointerdown time, so moving the pointer
    // during the hold had no effect at all — a hold that started too far
    // from the rope stayed stuck failing even after being dragged right
    // over it, matching the reported "click and hold doesn't work."
    const releaseHit = nearestPointOnRope(e.clientX, e.clientY, mainRope.points);
    const heldMs = now - info.startTime;
    if (releaseHit.dist > vmin(cfg.holdDistance)){
      logClick('up:hold-release-too-far', { x: e.clientX, y: e.clientY, releaseDist: releaseHit.dist, heldMs });
      return;
    }
    const t = Math.min(1, heldMs / cfg.clickHoldMaxDuration);
    const intensity = cfg.clickIntensity + t * cfg.intensityCeiling;
    logClick('up:hold-release-punch', { x: e.clientX, y: e.clientY, releaseDist: releaseHit.dist, heldMs, t, intensity });
    // Intensity Ceiling stacks ON TOP of Click Intensity, not in place of it
    // -- a hold starts at the same intensity a quick tap would produce and
    // rises from there, reaching Click Intensity + Intensity Ceiling exactly
    // at Click Hold Max Duration.
    applyPunch(mainRope.points, releaseHit, e.clientX, e.clientY, intensity, 0, mainRope.segLen);
    return;
  }

  // quick tap — arms pendingClick if the press landed near the rope OR a
  // fallen piece, so a double-click aimed at either (or a mix of the two)
  // still registers; only a ROPE tap fires the single-tap punch on its own
  // timeout — punching stays rope-only (unchanged scope), still keyed off
  // the original press-time rope hit (info.hit), same as before pieces
  // became double-click-cuttable.
  const nearAny = hitTestAny(info.x, info.y);
  if (!nearAny){
    logClick('up:tap-too-far', { x: info.x, y: info.y, hitDist: info.hit.dist });
    return;
  }
  if (pendingClick) clearTimeout(pendingClick.timer);
  logClick('up:tap-pending', { x: info.x, y: info.y, target: nearAny.target });
  pendingClick = {
    time: now,
    timer: setTimeout(() => {
      if (info.hit.dist <= vmin(cfg.clickDistance)){
        logClick('up:tap-punch', { x: info.x, y: info.y, hitDist: info.hit.dist, intensity: cfg.clickIntensity });
        applyPunch(mainRope.points, info.hit, info.x, info.y, cfg.clickIntensity, 0, mainRope.segLen);
      }
      pendingClick = null;
    }, cfg.doubleClickThreshold),
  };
}

canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', () => { logClick('cancel', { wasGrowing: growing }); downInfo = null; growing = false; clearTimeout(holdTimer); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------------------------------------------------------------
   Update / render loop
--------------------------------------------------------------------- */
// viewportH() (not raw window.innerHeight -- see that helper's own
// comment) so this never silently computes a floor near the TOP of the
// screen instead of the bottom when window.innerHeight reads 0. Real,
// confirmed bug: with window.innerHeight===0 (this session's own
// sandbox, and per that same comment, a documented real mobile-browser
// quirk too), this returned a NEGATIVE floorY (e.g. -48 at floorHeight
// 6%vh against an 800px viewportH fallback) -- placing the "floor" far
// above where the anchor/rope actually rest, so EVERY point (including
// mainRope's own anchor, confined correctly by anchorBoundaryRadius())
// got clamped straight back up to that bogus line every single frame,
// reproducing exactly what looked like "the whole rope is frozen" and,
// downstream, "double-clicking the circle does nothing" (the anchor
// never actually settling anywhere near the circle to be double-clicked
// on in the first place).
function floorY(){ return viewportH() - vh(cfg.floorHeight); }

function update(rawDt){
  flickAnimTime += rawDt;
  flick2AnimTime += rawDt;
  if (introPhase !== 'done') updateIntro(rawDt);
  const dt = rawDt * cfg.ropeAnimSpeed;
  const gravityAccel = vh(90) * cfg.gravityStrength;

  // mainRope.points[0] (the anchor end) is no longer rigidly pinned to the
  // circle's center -- per explicit request, it's now a normal physics
  // point (subject to gravity, and pulled around by the rope's own
  // swinging motion via the distance/bend constraints, same as every
  // other point) that's kept inside the circle entirely by
  // integrateChain()'s own boundaryConstraint param (position, negotiated
  // iteratively alongside the distance/bend constraints, and
  // velocity-preserving -- see that function's comment for why). pinnedIndex
  // is now -1 (no pin at all), matching how fallenPieces already integrate.
  // During the startup animation's own 'growing' phase, extension paces
  // off Startup Extension Speed (or its tween) instead of the manual
  // Rope Growth Rate -- independently tunable, per explicit request.
  if (growing) growRope(rawDt, introPhase === 'growing' ? currentIntroExtendRate() : undefined);
  const hasPartialTip = mainRope.tipGrowLen < mainRope.segLen;
  integrateChain(mainRope.points, mainRope.segLen, dt, gravityAccel, -1, hasPartialTip,
    { index: 0, center: circleAnchor(), radius: anchorBoundaryRadius(), weightMult: cfg.anchorWeight });
  if (hasPartialTip) positionGrowingTip();

  // Background "peeking" rope (see render()'s own comment on the clip):
  // its anchor is forced to mainRope's own anchor -- ALREADY updated by
  // the integrateChain() call just above, so this reads this frame's real
  // final position, not last frame's -- every tick, then pinnedIndex=0
  // keeps that point fixed for bgRope's own integration below (same
  // mechanism mainRope's anchor used before it became free-floating).
  // Everything else about bgRope (its own gravity/damping/constraint
  // solve, via the SAME cfg values mainRope uses) is fully independent,
  // so it swings on its own rather than mirroring mainRope's body shape --
  // only its start point is driven externally, per explicit request.
  // EXCEPT during 'waiting'/'rising': bgRope IS the startup animation's
  // own climbing visual now (see updateIntro()), so its anchor is driven
  // by that phase's own logic instead -- left untouched here so this
  // block doesn't fight it.
  if (introPhase !== 'waiting' && introPhase !== 'rising'){
    bgRope.points[0].x = mainRope.points[0].x;
    bgRope.points[0].y = mainRope.points[0].y;
  }
  integrateChain(bgRope.points, bgRope.segLen, dt, gravityAccel, 0);
  maintainBgRopeEnd();

  // Detach-triggered tip endcap scale-up (see detachEntireRopeAndRestartIntro())
  // -- a simple linear ramp, deliberately separate from the End Emerge
  // system. undefined (the boot-time rope never sets this) means "always
  // full size", the pre-existing behavior.
  if (mainRope.detachTipScaleProgress !== undefined && mainRope.detachTipScaleProgress < 1){
    mainRope.detachTipScaleProgress = Math.min(1, mainRope.detachTipScaleProgress + rawDt / cfg.detachTipGrowDuration);
  }

  // A Fall Delay > 0 cut hasn't actually split mainRope yet (see
  // cutRopeAt's pendingCut) -- it just integrated as one whole chain above,
  // identically to an uncut rope. Once the countdown elapses, perform the
  // real split now, using this frame's already-updated positions.
  if (mainRope.pendingCut){
    mainRope.pendingCut.delay -= dt;
    if (mainRope.pendingCut.delay <= 0){
      const idx = mainRope.pendingCut.idx;
      mainRope.pendingCut = null;
      performMainRopeSplit(idx);
    }
  }

  // cutSweep.progress only drives the cosmetic sweep-mark overlay now
  // (render()) — it never gates anything's own physics, so a piece cut
  // mid-swing keeps swinging/falling continuously from the very next frame.
  // mainRope and any piece can each carry their own independent cutSweep
  // (a rope cut, and any number of subsequent piece-splits, all animate
  // on their own timeline).
  if (mainRope.cutSweep && mainRope.cutSweep.progress < 1){
    mainRope.cutSweep.progress = Math.min(1, mainRope.cutSweep.progress + rawDt * cfg.cutSpeed / CUT_SWEEP_BASE_SEC);
  }
  fallenPieces.forEach(piece => {
    if (piece.cutSweep && piece.cutSweep.progress < 1){
      piece.cutSweep.progress = Math.min(1, piece.cutSweep.progress + rawDt * cfg.cutSpeed / CUT_SWEEP_BASE_SEC);
    }
  });

  // End Emerge -- same raw-wall-clock, cosmetic-timer treatment as
  // cutSweep just above; a no-op per-tick when there's no active emerge
  // state (nothing cut yet, or End Emerge is off).
  tickEmerge(mainRope.tipEmerge, rawDt);
  fallenPieces.forEach(piece => {
    tickEmerge(piece.tipEmerge, rawDt);
    tickEmerge(piece.cutEdgeEmerge, rawDt);
  });

  const fallGravity = vh(90) * cfg.gravityStrength * cfg.ropeFallSpeed;
  fallenPieces.forEach(piece => {
    if (piece.age !== undefined) piece.age += rawDt;
    integrateChain(piece.points, piece.segLen, dt, fallGravity, -1);
    // A piece-on-piece cut (cutPieceAt) hasn't actually split `piece` yet
    // -- same pendingCut deferral as mainRope's, checked after this
    // piece's own integration above so the split happens against this
    // frame's already-updated positions, identically to how
    // mainRope's pendingCut is resolved after ITS integration. A newly
    // split-off lower piece pushed here starts getting its own
    // integrateChain() from next frame's pass over fallenPieces.
    if (piece.pendingCut){
      piece.pendingCut.delay -= dt;
      if (piece.pendingCut.delay <= 0){
        const idx = piece.pendingCut.idx;
        piece.pendingCut = null;
        performPieceSplit(piece, idx);
      }
    }
  });

  if (cfg.floorEnabled){
    // the main rope (still attached to the circle) collides with the floor
    // too, not just cut-off pieces — otherwise growing it long enough to
    // reach the floor just clips straight through with no reaction at all.
    const fY = floorY();
    const allPoints = mainRope.points.slice();
    fallenPieces.forEach(piece => allPoints.push(...piece.points));
    allPoints.forEach(p => {
      if (p.y > fY){
        p.y = fY;
        p.oldx = p.x - (p.x - p.oldx) * 0.3;
        p.oldy = p.y;
      }
    });
    // The OLD pileRepulsion() had no concept of chain adjacency -- it
    // repelled ANY two points closer than minSep, including two points
    // from far apart in the SAME chain that simply ended up
    // geometrically close after piling against the floor, fighting
    // integrateChain()'s own distance constraint for the ENTIRE rope and
    // causing a severe, reproduced tangle (worst-case segment-length
    // ratio >6x) -- so it was removed from this call site entirely
    // rather than reintroduce that bug. pieceCollision() below is the
    // chain-adjacency-aware replacement this comment used to say would
    // be needed: it only ever repels a piece's points against a
    // DIFFERENT piece's points, never its own, so it's safe to run every
    // frame without refighting any single chain's own constraints --
    // per explicit request ("I want the cut off rope segments to have
    // collision detection with each other so they either stack or push
    // each other around").
    pieceCollision();
  } else {
    fallenPieces = fallenPieces.filter(piece => piece.points.some(p => p.y < viewportH() * 1.5));
  }
}

// Draws one rope end's rounded cap as a half-ellipse bulging outward from
// (px,py) in direction (dirx,diry): a flat chord spanning the rope's full
// width (thicknessPx) plus a curved protrusion whose depth is
// (thicknessPx/2)*arcMult. At arcMult=0 the protrusion degenerates to
// nothing (a flat line, matching a straight/butt end); at arcMult=1 the
// protrusion equals the chord's own half-width, making the shape a TRUE
// semicircle (matching the old always-round look); values in between are
// a proportionally flattened arc, not a smaller full circle -- per
// explicit clarification that Rope End/Top Curve Arc controls how much of
// a semicircle the end is, not the size of a circle sitting on top of it.
function drawEndArc(px, py, dirx, diry, thicknessPx, arcMult){
  if (arcMult <= 0) return;
  const halfW = thicknessPx / 2;
  const protrusion = halfW * arcMult;
  const angle = Math.atan2(diry, dirx);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  ctx.beginPath();
  // local +x now points in the outward `dir` direction; the arc spans
  // -90..+90 degrees (the half where local x >= 0, i.e. the outward-facing
  // half only), closed off by the flat chord straight back to the start.
  ctx.ellipse(0, 0, protrusion, halfW, 0, -Math.PI / 2, Math.PI / 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Builds a top-to-bottom linear gradient across the entity's own current
// points (anchor -> tip) from an ordered color-stop array, evenly spaced
// (stop i at i/(n-1)), or just returns the plain fallback color when the
// gradient is off/not enough stops -- `ctx.strokeStyle`/`fillStyle` accept
// a CanvasGradient exactly like a string, so every existing caller of
// strokeRopeCurve()/drawEndcap()/etc. needs no change beyond passing this
// through instead of a raw color.
function ropeStrokeColor(points, enabled, stops, fallbackColor){
  if (!enabled || !stops || stops.length < 2) return fallbackColor;
  const top = points[0], bottom = points[points.length - 1];
  const grad = ctx.createLinearGradient(top.x, top.y, bottom.x, bottom.y);
  // Each stop's own `pos` (0-1, independently draggable -- see
  // buildRow()'s 'gradient' editor) decides where it kicks in, NOT an
  // even 1/(n-1) spacing -- per explicit request. addColorStop() itself
  // requires an ascending-order sequence of calls; stops are sorted by
  // pos here rather than trusted to already be in order (the editor
  // keeps them sorted as stored, but this is what actually enforces it
  // for the gradient itself).
  [...stops].sort((a, b) => a.pos - b.pos).forEach(s => grad.addColorStop(Math.max(0, Math.min(1, s.pos)), s.color));
  return grad;
}

function strokeRopeCurve(points, thicknessPx, color, endArcMult, startArcMult){
  if (startArcMult === undefined) startArcMult = 0;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = thicknessPx; ctx.lineJoin = 'round';
  // Always a flat (butt) cap on the stroke itself now -- it used to be
  // unconditionally 'round', so even at Rope End Curve Arc's minimum (0)
  // the stroke's own inherent round cap still rounded the tip off (only
  // the SEPARATE filled arc below was ever gated by endArcMult). Per
  // explicit request ("when I set Rope End Curve Arc, I want the end of
  // the rope to be a straight line"), all roundedness now comes ONLY from
  // the independently-sized arc circles drawn below, at each end
  // separately -- necessary because ctx.lineCap is a single value for the
  // WHOLE stroked path, but a piece's two ends (its free/growing tip vs
  // its own cut edge) can need genuinely different treatment at the same
  // time (e.g. mid-emergence at one end, fully settled at the other) —
  // something one shared lineCap could never express.
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  const n = points.length;
  if (n === 2){
    // nothing to curve through -- a single segment is just a straight line.
    ctx.lineTo(points[1].x, points[1].y);
  } else {
    // Every interior point curves through itself toward the MIDPOINT of
    // itself and its neighbor (the standard smooth-curve-through-a-
    // polyline technique) -- EXCEPT the last one, which curves all the
    // way to the actual tip coordinate instead of a midpoint, since
    // there's no point past the tip to average with. An earlier version
    // used `ctx.lineTo(tip)` for that final leg instead, which always drew
    // a dead-straight line for roughly the last half-to-full segment
    // length regardless of the rope's actual physics state -- reported as
    // "the last ~20px end seems to be a stiff piece" (an almost exact
    // match for one segLen, ~24.9px at default settings). Confirmed as a
    // pure rendering artifact, not real stiffness: nothing in the physics
    // (constraints, bendStiffness, growth) singles out the tip's own
    // segment for extra rigidity outside of active growth (see
    // integrateChain()'s bendEnd, which only excludes the tip while a
    // partial segment is still growing). Curving through the actual tip
    // coordinate instead removes the straight leg entirely.
    for (let i = 1; i < n - 1; i++){
      const isLast = i === n - 2;
      const ex = isLast ? points[i+1].x : (points[i].x + points[i+1].x) / 2;
      const ey = isLast ? points[i+1].y : (points[i].y + points[i+1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, ex, ey);
    }
  }
  ctx.stroke();

  const tip = points[n - 1];
  if (endArcMult > 0){
    const dir = tipDirection(points);
    drawEndArc(tip.x, tip.y, dir.x, dir.y, thicknessPx, endArcMult);
  }
  // startArcMult mirrors endArcMult at points[0] instead of points[n-1] --
  // meaningful for both a fallen piece's own free cut edge (Rope End
  // Curve Arc reused there) AND mainRope's own anchor point (Rope Top
  // Curve Arch, a separate/independent setting -- the rope draws ON TOP
  // of the circle graphic, per render()'s own draw order, so this end is
  // genuinely visible, not hidden underneath it).
  if (startArcMult > 0){
    const base = points[0], next = points[1];
    let dx = base.x - next.x, dy = base.y - next.y;
    const dlen = Math.hypot(dx, dy) || 1;
    drawEndArc(base.x, base.y, dx / dlen, dy / dlen, thicknessPx, startArcMult);
  }
}

/* ---------------------------------------------------------------------
   Rope endcaps -- optional decorative shapes (data/Rope/End_Form1-*.svg,
   End_Form2-*.svg) drawn at the free/tip end of the main rope and every
   fallen piece, replacing the plain round cap when selected (Endcap
   Design dev control). Embedded as Path2D objects (this is a single-file
   app, no external asset loading) using the SVG paths' own coordinates
   verbatim. Replaces the original End1-End4 set entirely (those source
   files were removed) with two design families: Form1 (5 numbered
   variants 02-06 plus a "-C" flagship) and Form2 (5 numbered variants
   07-11 plus its own "-C" flagship).

   All 12 designs share ONE scale/anchor reference -- ENDCAP_ALIGNMENT,
   read from data/Rope/End Alignment.svg's <line> (x1=41.57, y1=80.26,
   x2=96.06, y2=80.26) -- rather than each design measuring its own
   bounding box independently. Every one of the 12 new source SVGs
   embeds that exact same reference line alongside its own path (confirmed
   by inspection), so they're all authored against this one shared frame;
   ENDCAP_ALIGNMENT itself didn't need to change when the source set did.
   Same reasoning as before: one common width/anchor point keeps swapping
   between designs in the dropdown visually consistent (same size, same
   attachment point) instead of each design silently re-deriving its own
   scale.
--------------------------------------------------------------------- */

// just ENDCAP_ALIGNMENT.topY, which is the top/neck edge). Needed by End
// Emerge (below): at spawn, the endcap's bottom edge -- not its top -- is
// what gets anchored to the cut rope's own end, so the whole shape starts
// tucked backward into the rope instead of sitting proud of it. Computed
// ONCE at startup from each design's raw `d` string via a throwaway SVG
// <path> element (Path2D itself exposes no bounding-box query), rather
// than hand-measuring and hardcoding a table of numbers -- keeps this
// correct automatically no matter how many times the source SVGs get
// swapped/updated, with zero extra maintenance (the same reasoning this
// same computation used when it measured width instead, before End
// Emerge's redesign to anchor-point interpolation).
const ENDCAP_BOTTOM_Y = (function(){
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.style.position = 'absolute'; svg.style.width = '0'; svg.style.height = '0'; svg.style.overflow = 'hidden';
  document.body.appendChild(svg);
  const bottoms = {};
  for (const key in ENDCAP_DESIGNS){
    const p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', ENDCAP_DESIGNS[key].d);
    svg.appendChild(p);
    const bbox = p.getBBox();
    bottoms[key] = bbox.y + bbox.height;
    svg.removeChild(p);
  }
  document.body.removeChild(svg);
  return bottoms;
})();

// The user-supplied "tip segment" shape (data/Rope/RopeEG.svg) -- an
// optional replacement for the plain rope-colored stroke on just the LAST
// segment (the one between the endcap and the rest of the rope), toggled
// via the Tip Segment Shape checkbox (see drawTipSegmentShape() below).
// Unlike the endcap designs, this SVG has no explicit alignment <line> of
// its own -- per its own author's description, orientation is simply a
// vertical line through the shape's horizontal center, so topCenterX
// comes from its bounding box's own midpoint rather than a shared
// reference line. topY/bottomY (getBBox()-derived, same technique as
// ENDCAP_BOTTOM_Y above) bound its natural authored height, which is what
// a live segment's CURRENT length gets stretched to match -- so the shape
// always spans exactly from the second-to-last physics point to the tip,
// however long that segment currently is, rather than a fixed size.
const TIP_SEGMENT_SHAPE = (function(){
  const d = 'M183.74,176.56c-17.44-45.3-26.85-107.11,12.71-149.24h-123.66c39.56,42.13,30.15,103.94,12.71,149.24-14.01,36.38-26.26,70.59,11.44,126.28,2.26,3.33,11.87,15.34,14.26,18.74,4.53,6.01,8.35,10.74,12.17,17.19.6,1.01.34,2.47,2.43,2.53,2.2.06,2.98-2.69,4.54-4.74,1.19-1.56,3.14-2.46,4.28-2.57,1.14.11,3.09,1.02,4.28,2.57,1.57,2.05,2.34,4.81,4.54,4.74,2.09-.06,1.84-1.52,2.43-2.53,3.82-6.46,7.64-11.18,12.17-17.19,2.39-3.4,12.01-15.41,14.26-18.74,37.7-55.69,25.44-89.9,11.44-126.28Z';
  const path = new Path2D(d);
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.style.position = 'absolute'; svg.style.width = '0'; svg.style.height = '0'; svg.style.overflow = 'hidden';
  document.body.appendChild(svg);
  const p = document.createElementNS(svgNS, 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  const bbox = p.getBBox();
  document.body.removeChild(svg);
  return {
    path,
    topCenterX: bbox.x + bbox.width / 2,
    width: bbox.width,
    topY: bbox.y,
    bottomY: bbox.y + bbox.height,
  };
})();

/* ---------------------------------------------------------------------
   End Emerge -- when enabled (End Emerge Enabled), a freshly-cut edge's
   endcap doesn't appear at full size/position the instant the real split
   happens. Instead it SPAWNS anchored by its own BOTTOM edge (not its
   usual top/neck edge) to the cut rope's end, at Endcap Starting Scale
   (a fraction of normal size) -- so the whole shape starts tucked
   backward, into the rope, rather than sitting proud of it. It waits End
   Emerge Delay, then over End Emerge Speed's own duration (eased by End
   Emerge Tweening), scales up AND slides its anchor point back to the
   normal top/neck edge -- which reads as the endcap growing and sliding
   down/out of the rope, being revealed -- ending at exactly the same
   scale and position this app has always used for a fully-emerged
   endcap. Applies to BOTH halves of every cut: the remaining rope/piece's
   own new tip (its `tipEmerge`), and the newly-split-off piece's own new
   near/cut edge (its `cutEdgeEmerge`) -- see performMainRopeSplit()/
   performPieceSplit(), the only two places that create these states,
   since those are the only two places a genuinely NEW cut edge is ever
   created.
--------------------------------------------------------------------- */
const EMERGE_BASE_SEC = 0.35;
// The invisible slide-into-position phase (see SLIDE_SHARE in drawEndcap)
// always resolves in this fixed real time, independent of End Emerge
// Speed -- see tickEmerge()'s own comment for why this exists separately
// from EMERGE_BASE_SEC.
const EMERGE_SLIDE_SHARE = 0.15;
const EMERGE_SLIDE_SEC = 0.3;
// Each tween takes the raw progress `t` (0..1) plus `s` (End Emerge Easing
// Strength) -- `s` generalizes the exponent each curve already used
// (originally hardcoded to 2, i.e. t², matching a classic quadratic ease):
// raising it makes the curve MORE pronounced/snappier, lowering it toward
// 1 flattens it toward linear. `linear` ignores `s` entirely -- "no easing"
// stays "no easing" regardless of the strength slider, which is the
// intuitive behavior when that tween is selected. Added per explicit
// feedback that the fixed built-in curves weren't a strong enough effect.
const EMERGE_TWEENS = {
  linear: (t, s) => t,
  easeIn: (t, s) => Math.pow(t, s),
  easeOut: (t, s) => 1 - Math.pow(1 - t, s),
  easeInOut: (t, s) => t < 0.5 ? Math.pow(2 * t, s) / 2 : 1 - Math.pow(-2 * t + 2, s) / 2,
};

function newEmergeState(){
  return { delayRemaining: cfg.endEmergeDelay, progress: 0 };
}

// advances one emerge state by rawDt -- same raw-wall-clock convention as
// cutSweep's own progress (a cosmetic timer, not part of the physics dt),
// so Rope Animation Speed doesn't also secretly slow/speed emergence.
function tickEmerge(emerge, rawDt){
  if (!emerge || emerge.progress >= 1) return;
  if (emerge.delayRemaining > 0){
    emerge.delayRemaining = Math.max(0, emerge.delayRemaining - rawDt);
    return;
  }
  // Two-phase rate, not one shared rate for the whole 0..1 span: the
  // invisible SLIDE portion (progress 0..EMERGE_SLIDE_SHARE, see
  // drawEndcap's own SLIDE_SHARE) always resolves in a fixed
  // EMERGE_SLIDE_SEC, regardless of End Emerge Speed. Only the remaining,
  // visible GROW portion still scales with Speed. Per explicit report
  // ("even with delay set to 0 it takes a while... like 5 seconds at
  // least"): the two phases used to share ONE rate
  // (cfg.endEmergeSpeed / EMERGE_BASE_SEC), so slowing Speed down for a
  // slower visible grow-in also silently slowed the invisible slide by
  // the same factor -- at Speed's own current default (0.01, set per an
  // earlier explicit request for a much slower grow), the slide alone
  // took ~5.25s (0.15 / (0.01/0.35)) before ANY visible change appeared,
  // regardless of Delay.
  const rate = emerge.progress < EMERGE_SLIDE_SHARE
    ? EMERGE_SLIDE_SHARE / EMERGE_SLIDE_SEC
    : cfg.endEmergeSpeed / EMERGE_BASE_SEC;
  emerge.progress = Math.min(1, emerge.progress + rawDt * rate);
}

// 0 = fully hidden (rope-width scale), 1 = fully emerged (normal scale).
// Undefined/missing emerge state (nothing has been cut yet, or End Emerge
// is off and the state was never created) always reads as 1 -- normal,
// immediate, full-size rendering, i.e. "what we have now."
function emergeFactor(emerge){
  if (!cfg.endEmergeEnabled || !emerge) return 1;
  if (emerge.delayRemaining > 0) return 0;
  const ease = EMERGE_TWEENS[cfg.endEmergeTweening] || EMERGE_TWEENS.linear;
  return ease(emerge.progress, cfg.endEmergeEasingStrength);
}

// direction of the LAST segment (second-to-last point -> tip), normalized;
// falls back to straight down for a degenerate (<2 point) chain.
function tipDirection(points){
  if (points.length < 2) return { x: 0, y: 1 };
  const a = points[points.length - 2], b = points[points.length - 1];
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: dx / len, y: dy / len };
}

// gradientInfo: optional { colors, worldTop } -- when present (and the
// relevant Rope/Background Rope Gradient checkbox is on), the endcap
// fills with the SAME gradient the rope's own stroke uses (same colors,
// same world-space anchor-to-tip span), not a separately-computed one,
// so there's no visible seam where the rope's own color ends and the
// endcap's begins -- "the gradient applies to both the rope and the
// endcap such that it is one consistent gradient", per explicit request.
// Built using LOCAL coordinates (the current point's position under the
// inverse of the CTM active at this point in the transform stack, via
// ctx.getTransform()) rather than a gradient object created in world
// space and reused here -- a gradient's own stored coordinates are
// themselves subject to whatever transform is active when it's PAINTED
// (same as the path it colors), so a world-space gradient built outside
// drawEndcap's own translate/rotate/scale would get transformed a SECOND
// time and land in the wrong place entirely. Mapping the same 2 world
// points (rope anchor -> tip, identical to ropeStrokeColor()'s own pair)
// through the inverse CTM first means the gradient renders in exactly
// the same world position the rope's own stroke gradient already
// occupies, regardless of the endcap's current rotation/scale/slide
// position.
function drawEndcap(points, thicknessPx, designKey, color, heightMult, factor, gradientInfo, heightThicknessPx){
  const design = ENDCAP_DESIGNS[designKey];
  if (!design) return;
  if (factor === undefined) factor = 1;
  // heightThicknessPx defaults to thicknessPx (mainRope's own call site,
  // and every call before this param existed): the endcap's length (Y
  // axis) scales off the SAME thickness as its width (X axis), same as
  // before. A fallen piece's own decay (pieceThickness()) passes its
  // fixed baseThickness here instead -- decoupling the endcap's LENGTH
  // from its currently-decaying WIDTH, per explicit request ("i dont want
  // them to get shorter, just thinner. the end cap should also scale with
  // the thickness"): the cap narrows as the piece thins (X still tracks
  // live thickness) but its footprint beyond the tip no longer recedes as
  // decay progresses (Y stays pinned to whatever thickness the piece had
  // when it fell).
  if (heightThicknessPx === undefined) heightThicknessPx = thicknessPx;
  const dir = tipDirection(points);
  const tip = points[points.length - 1];
  // rotates local "down" (0,1) to (dir.x,dir.y); derived from the standard
  // rotation matrix (x cosθ - y sinθ, x sinθ + y cosθ) solved for
  // (-sinθ,cosθ) = (dir.x,dir.y).
  const angle = Math.atan2(-dir.x, dir.y);
  const normalScale = thicknessPx / ENDCAP_ALIGNMENT.width;
  const heightNormalScale = heightThicknessPx / ENDCAP_ALIGNMENT.width;
  const startYScale = heightNormalScale * cfg.endcapStartingScale;
  // Sequential, not simultaneous, per explicit request ("instead of
  // simultaneously rescaling the endcap back up, the rescaling only
  // begins once the endcap top edge has aligned with the rope end"):
  // the SLIDE_SHARE of `factor` slides the hidden endcap down to the tip
  // at a CONSTANT (starting) scale; only once that slide has fully
  // landed does the rest begin scaling it up to full size. A tiny,
  // rope-colored endcap sliding along the rope reads as essentially
  // invisible against the rope's own body -- an even 50/50 split (the
  // original implementation) meant the visibly-obvious part (growth)
  // didn't start until HALF the total configured duration had already
  // passed, which read as "waiting longer than my delay to see the
  // animation" (reported directly). SLIDE_SHARE is deliberately small so
  // the (largely invisible) slide resolves quickly and nearly all of the
  // configured duration goes to the part that's actually visible.
  const SLIDE_SHARE = EMERGE_SLIDE_SHARE;
  const slideFactor = Math.min(1, factor / SLIDE_SHARE);
  const scaleFactor = Math.max(0, Math.min(1, (factor - SLIDE_SHARE) / (1 - SLIDE_SHARE)));
  const yScale = startYScale + (heightNormalScale - startYScale) * scaleFactor;
  // The hidden endcap starts exactly ONE full natural design-height up
  // the rope from the tip -- "it will be up the rope exactly the height
  // of the endcap geometry after scaling", per explicit request. No
  // longer a tunable multiplier (End Emerge Hide Distance removed
  // entirely) -- always exactly the design's own bottom-minus-top span,
  // i.e. what the old hideDistance=1 case used to compute.
  const designBottomY = ENDCAP_BOTTOM_Y[designKey] !== undefined ? ENDCAP_BOTTOM_Y[designKey] : ENDCAP_ALIGNMENT.topY;
  const hideRange = designBottomY - ENDCAP_ALIGNMENT.topY;
  const startAnchorY = ENDCAP_ALIGNMENT.topY + hideRange;
  const anchorY = startAnchorY + (ENDCAP_ALIGNMENT.topY - startAnchorY) * slideFactor;
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(angle);
  // Mid-emerge (factor < 1), clip to the rope's own current width right
  // here -- BEFORE the scale() below, so thicknessPx is used directly in
  // world units rather than needing to reason about the design's own
  // locally-scaled coordinate space. This is what keeps the hidden/
  // mid-slide endcap from sticking out past a narrower rope segment
  // (e.g. under Tip Segment Shape's own taper) than the endcap's full
  // natural width -- "make sure to use a mask... such that the hidden
  // endcap doesn't stick out of the left and right of the rope, since
  // the end segment of the rope has variable width", per explicit
  // request. A fully-emerged endcap (factor >= 1, including End Emerge
  // simply being off) renders unclipped, exactly as before this round.
  if (factor < 1){
    ctx.beginPath();
    ctx.rect(-thicknessPx / 2, -100000, thicknessPx, 200000);
    ctx.clip();
  }
  // heightMult stretches ONLY the local "down" axis (independent of X) --
  // applied here, before the anchor-shift below, so it scales the shape
  // around the path's own local origin. Since the anchor-shift translate is
  // the LAST transform call (so it acts FIRST on the path's raw coordinates,
  // canvas transforms compose in reverse call order), whichever local point
  // is used as the anchor always lands at local (0,0) regardless of scale
  // -- so THAT point stays exactly at the tip no matter how much vertical
  // stretch (heightMult), emergence shrink, or emergence anchor-shift is
  // applied.
  ctx.scale(normalScale, yScale * heightMult);
  ctx.translate(-ENDCAP_ALIGNMENT.topCenterX, -anchorY);
  if (gradientInfo && gradientInfo.stops && gradientInfo.stops.length >= 2){
    // Self-contained gradient across the endcap's OWN local extent (its
    // neck at ENDCAP_ALIGNMENT.topY -> its own bottom-most point,
    // designBottomY, computed above) -- NOT the whole rope's world-space
    // anchor-to-tip span, per explicit correction. The endcap is a small
    // feature near just the very end of that whole-rope span, so mapping
    // world coordinates through the inverse transform (the old approach)
    // showed almost nothing but one clamped stop color at equilibrium (a
    // long/straight rope has a large anchor-to-tip distance, which maps
    // to local coordinates FAR outside the endcap's own small shape) --
    // reported directly as "the endcap is only the color at the 100% of
    // the slider... then when i flick it, i see more of the other
    // colors" (flicking/curling shrinks the rope's own straight-line
    // anchor-to-tip distance, pulling more of the gradient's range into
    // the endcap's small local area) -- a "color changes when you flick
    // it" symptom that isn't a real physical property of the rope. This
    // keeps the endcap's own look consistent regardless of total rope
    // length or current pose. Stops are used REVERSED (pos' = 1-pos), so
    // the endcap's NECK (where it visually joins the rope's own tip)
    // lands on the same color the rope's whole gradient ends on -- still
    // no hard seam in the common (long-rope) case, where the rope's own
    // gradient is already near that same last-stop color right at the
    // tip -- and the endcap's own far end transitions back toward the
    // rope's STARTING color, reading as one continuous, symmetric
    // transition rather than an arbitrary independent one.
    const grad = ctx.createLinearGradient(ENDCAP_ALIGNMENT.topCenterX, ENDCAP_ALIGNMENT.topY, ENDCAP_ALIGNMENT.topCenterX, designBottomY);
    const reversedStops = gradientInfo.stops.map(s => ({ pos: 1 - s.pos, color: s.color })).sort((a, b) => a.pos - b.pos);
    reversedStops.forEach(s => grad.addColorStop(Math.max(0, Math.min(1, s.pos)), s.color));
    ctx.fillStyle = grad;
  } else {
    ctx.fillStyle = color;
  }
  ctx.fill(design.path);
  ctx.restore();
}

// Draws TIP_SEGMENT_SHAPE anchored by its own bottom edge to the tip (same
// point drawEndcap() anchors to, so it sits flush against the endcap),
// scaled uniformly from rope thickness -- see the scale comment inside for
// why this is NOT stretched to fit exactly one physics segment. Horizontal
// scale matches the rope's current thickness, same as every endcap design.
// Drawn UNDER the endcap (render() calls this first) so the endcap remains
// the visible cap right at the very tip. render() must also stop the
// plain rope stroke short of this shape's own height (see
// pointsExcludingTipSegmentShape() below) -- both this shape and the
// stroke render in the exact same cfg.ropeColor, so without that, the
// full-width stroke underneath fills in exactly where this shape's own
// narrower silhouette (waist, fork) should show as a visible cutout,
// making the shape invisible against its own backdrop.
function drawTipSegmentShape(points, thicknessPx, color){
  if (points.length < 2) return;
  const dir = tipDirection(points);
  const angle = Math.atan2(-dir.x, dir.y);
  const tip = points[points.length - 1];
  // Scaled UNIFORMLY from rope thickness alone (same as drawEndcap), not
  // stretched to match the live segment's own length. The shape's natural
  // proportions (~2.5x taller than wide) don't fit into one physics
  // segment (~28px at default settings, only ~9% of the shape's own
  // natural height) -- forcing its height to match the segment exactly
  // squashed it into an unrecognizable flat blob (confirmed: a per-row
  // filled-width scan across the compressed shape showed almost no
  // variation, ~37px throughout, since the neck/waist/belly/fork detail
  // had no vertical room left to read). Per explicit choice: keep the
  // shape looking like the shape, even though its own top edge then
  // generally does NOT land exactly on the second-to-last physics point
  // (it typically reaches further up the chain, past it) -- this is
  // cosmetic-only, like the endcap, and never affects the physics chain
  // itself in any way.
  const scale = thicknessPx / TIP_SEGMENT_SHAPE.width;
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.translate(-TIP_SEGMENT_SHAPE.topCenterX, -TIP_SEGMENT_SHAPE.bottomY);
  ctx.fillStyle = color;
  ctx.fill(TIP_SEGMENT_SHAPE.path);
  ctx.restore();
}

// When Tip Segment Shape is enabled, the plain stroke (strokeRopeCurve)
// must stop short of wherever that shape's own scaled height reaches back
// to along the chain -- otherwise the two overlap in the exact same color
// and the shape's own narrower silhouette (waist, fork) never shows
// through (see drawTipSegmentShape()'s own comment). Approximated in whole
// segments via the entity's own segLen rather than exact stroke arc-length
// -- plenty precise for this purpose, since over-omitting by a fraction of
// a segment just leaves a bit more of the shape's own natural taper
// visible instead of stroke (never a gap: the shape's bottom is always
// exactly anchored to the true tip regardless of how much stroke got
// omitted above it). Returns `points` unchanged when the feature is off or
// the chain is too short to safely trim.
function pointsExcludingTipSegmentShape(points, segLen, thicknessPx){
  if (!cfg.tipSegmentShapeEnabled || points.length < 3) return points;
  const shapeHeightPx = (thicknessPx / TIP_SEGMENT_SHAPE.width) * (TIP_SEGMENT_SHAPE.bottomY - TIP_SEGMENT_SHAPE.topY);
  const segmentsToOmit = Math.min(points.length - 2, Math.max(1, Math.ceil(shapeHeightPx / segLen)));
  return points.slice(0, points.length - segmentsToOmit);
}

function renderCutSweep(entity){
  const sweep = entity.cutSweep;
  const t = sweep.progress;
  const off = sweep.startOffset + (sweep.endOffset - sweep.startOffset) * t;
  // anchored to entity.points[sweep.anchorIndex] -- the point the cut
  // actually landed on. The entity isn't split at cut time (see
  // cutRopeAt/cutPieceAt's pendingCut deferral, now always active since
  // the pending delay is cutThroughDuration(), never 0) so anchorIndex
  // generally is NOT pts.length-1 yet -- it only becomes the entity's true
  // last point once the deferred split actually happens, at which point
  // Math.min below just naturally resolves to it.
  // Still tracks live physics either way, same reasoning as before: the
  // entity keeps moving/rotating after the cut, so a snapshotted position
  // or direction would visibly stop tracking that motion.
  const pts = entity.points;
  const idx = Math.min(sweep.anchorIndex, pts.length - 1);
  const cutPoint = pts[idx];
  // tangent at the anchor point (idx-1 -> idx), recomputed fresh every
  // frame -- same "toward increasing index" convention cutRopeAt/
  // cutPieceAt derived nx/ny from, so the sweep runs from the same
  // physical edge it started at even while the entity keeps swinging.
  const a = pts[Math.max(0, idx - 1)], b = pts[idx];
  const tdx = b.x - a.x, tdy = b.y - a.y;
  const tlen = Math.hypot(tdx, tdy) || 1;
  const dir = { x: tdx / tlen, y: tdy / tlen };
  const nx = dir.y, ny = -dir.x;
  const x1 = cutPoint.x + nx * sweep.startOffset, y1 = cutPoint.y + ny * sweep.startOffset;
  const x2 = cutPoint.x + nx * off, y2 = cutPoint.y + ny * off;
  ctx.strokeStyle = cfg.cutSweepColor;
  ctx.lineWidth = Math.max(2, vmin(cfg.cutSweepThickness));
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function render(){
  ctx.fillStyle = cfg.backgroundColor;
  ctx.fillRect(0, 0, viewportW(), viewportH());

  if (cfg.floorEnabled){
    const fY = floorY();
    ctx.fillStyle = cfg.floorColor;
    ctx.fillRect(0, fY, viewportW(), vh(cfg.floorThickness));
  }

  const anchor = circleAnchor();
  ctx.beginPath();
  ctx.arc(anchor.x, anchor.y, vmin(cfg.circleSize) / 2, 0, Math.PI * 2);
  ctx.fillStyle = cfg.circleColor;
  ctx.fill();

  const thickness = vmin(cfg.ropeThickness);
  // mainRope's and bgRope's own LIVE thickness, distinct from the plain
  // `thickness` above (which fallenPieces keep using) -- compounds by
  // Detach Thickness Multiplier every time the whole rope is fully cut
  // (see detachEntireRopeAndRestartIntro()), per explicit request: "every
  // subsequent time the rope is fully cut, it increase[s] in thickness".
  // Already-fallen pieces deliberately keep whatever thickness they had
  // at the moment they existed, rather than retroactively thickening.
  const liveThickness = thickness * ropeThicknessMultiplier;
  // Background "peeking" rope: a second, non-interactive chain whose own
  // anchor is forced to follow mainRope's real anchor every frame (see
  // update()) -- "the only factor driving its movement is the movement of
  // the original rope[' start]", per explicit request. Clipped to exactly
  // the circle's own circular area, so the circle genuinely acts as a
  // clipping mask rather than just a visual backdrop: bgRope draws on top
  // of the plain circle fill above, but only the part of it that falls
  // within the circle's own bounds ever shows -- everything past that
  // edge is invisible, same as if the circle were a hole cut into a wall.
  // Visible starting 'rising' onward -- bgRope itself IS the startup
  // animation's own climbing visual now (see updateIntro()), so it needs
  // to be on screen (clipped) the whole time it's climbing/pausing, not
  // just once mainRope itself appears. Still hidden during 'waiting' --
  // "there is no rope, just the circle" holds until the climb begins.
  //
  // Background Rope Clip Enabled (def true, matching the always-on
  // behavior before this control existed) gates the clip specifically --
  // per explicit request ("so i can see the whole background rope"),
  // turning it off draws bgRope fully, unclipped, for inspecting/tuning
  // its own real shape and position rather than only the sliver that
  // normally peeks through the circle's own bounds.
  if (introPhase !== 'waiting'){
    if (cfg.bgRopeClipEnabled){
      ctx.save();
      ctx.beginPath();
      ctx.arc(anchor.x, anchor.y, vmin(cfg.circleSize) / 2, 0, Math.PI * 2);
      ctx.clip();
      strokeRopeCurve(bgRope.points, liveThickness, ropeStrokeColor(bgRope.points, cfg.bgRopeGradientEnabled, cfg.bgRopeGradientColors, cfg.ropeColor), cfg.ropeEndCurveArc, cfg.ropeTopCurveArc);
      ctx.restore();
    } else {
      strokeRopeCurve(bgRope.points, liveThickness, ropeStrokeColor(bgRope.points, cfg.bgRopeGradientEnabled, cfg.bgRopeGradientColors, cfg.ropeColor), cfg.ropeEndCurveArc, cfg.ropeTopCurveArc);
    }
  }
  // an SVG endcap replaces the plain round cap entirely (drawn separately,
  // below) rather than stacking both at the tip -- EXCEPT while End Emerge
  // has that endcap still hidden/mid-emergence, in which case the rope's
  // own Rope End Curve Arc treatment fills in at that specific end instead
  // ("the end of the rope will be the regular end set by the arc curve
  // setting" until the endcap actually emerges there). Each end of each
  // entity has its OWN independent emerge factor, since a piece's two ends
  // (its own free/growing tip vs its own cut edge) can be at different
  // points in their respective emergence -- see strokeRopeCurve()'s own
  // comment for why this can't be expressed via a single shared lineCap.
  const hasEndcap = cfg.endcapDesign !== 'none';
  const mainTipFactor = emergeFactor(mainRope.tipEmerge);
  const mainArcMult = (hasEndcap && mainTipFactor >= 1) ? 0 : cfg.ropeEndCurveArc;
  fallenPieces.forEach(piece => {
    const tipFactor = emergeFactor(piece.tipEmerge);
    const cutFactor = emergeFactor(piece.cutEdgeEmerge);
    // the shape covers the free/tip end entirely when enabled -- no round-
    // cap arc treatment needed there anymore, same reasoning as hasEndcap.
    const tipArcMult = (hasEndcap && tipFactor >= 1) || cfg.tipSegmentShapeEnabled ? 0 : cfg.ropeEndCurveArc;
    const cutArcMult = (hasEndcap && cfg.endcapAtCutEnd && cutFactor >= 1) ? 0 : cfg.ropeEndCurveArc;
    // Each fallen piece renders at its OWN current (possibly decayed)
    // thickness -- see pieceThickness() -- never mainRope/bgRope's live
    // (possibly Detach-Thickness-Multiplier-boosted) thickness.
    const pieceThick = pieceThickness(piece);
    const strokePoints = pointsExcludingTipSegmentShape(piece.points, piece.segLen, pieceThick);
    // A fallen piece keeps showing the rope gradient it had while still
    // attached, recomputed each frame from its OWN current points span --
    // per explicit request ("i want cut off rope segments to retrain the
    // gradient"). Previously always cfg.ropeColor (solid), regardless of
    // Rope Gradient Enabled -- a piece lost its gradient coloring the
    // instant it fell.
    strokeRopeCurve(strokePoints, pieceThick, ropeStrokeColor(piece.points, cfg.ropeGradientEnabled, cfg.ropeGradientColors, cfg.ropeColor), tipArcMult, cutArcMult);
  });
  // mainRope's points[0] is the anchor -- free to move within the circle
  // now (see integrateChain()'s own boundaryConstraint), but still never a
  // cut edge or a growing tip, so no endcap/End-Emerge concept ever
  // applies there. Rope
  // Top Curve Arch controls it directly and
  // unconditionally, independent of Rope End Curve Arc (which only ever
  // governed the FAR/free end). The rope is drawn AFTER (on top of) the
  // circle below, so this end is genuinely visible, not hidden underneath
  // it as an earlier version of this comment incorrectly assumed.
  // The startup animation keeps mainRope itself structurally valid (and
  // physically integrating, so its anchor settles naturally) throughout
  // 'waiting'/'rising'/'pausing' -- it just isn't DRAWN yet, per the
  // "no rope, just the circle" / "the dot climbs, not a rope" spec. Once
  // 'growing' starts (or immediately, when the animation is off/done),
  // mainRope draws exactly as it always has, no different code path.
  const showMainRope = introPhase === 'done' || introPhase === 'growing';
  const mainStrokePoints = pointsExcludingTipSegmentShape(mainRope.points, mainRope.segLen, liveThickness);
  const mainEffectiveArcMult = cfg.tipSegmentShapeEnabled ? 0 : mainArcMult;
  if (showMainRope) strokeRopeCurve(mainStrokePoints, liveThickness, ropeStrokeColor(mainRope.points, cfg.ropeGradientEnabled, cfg.ropeGradientColors, cfg.ropeColor), mainEffectiveArcMult, cfg.ropeTopCurveArc);
  if (cfg.tipSegmentShapeEnabled){
    fallenPieces.forEach(piece => drawTipSegmentShape(piece.points, pieceThickness(piece), cfg.ropeColor));
    if (showMainRope) drawTipSegmentShape(mainRope.points, liveThickness, cfg.ropeColor);
  }
  if (hasEndcap){
    // Independent endcap gradient (see endcapGradientEnabled/Colors) --
    // recomputed per piece each frame from its OWN current points span,
    // same convention as the rope-gradient retention above.
    const pieceEndcapGradientInfo = piece => cfg.endcapGradientEnabled ? { stops: cfg.endcapGradientColors, worldTop: piece.points[0] } : null;
    fallenPieces.forEach(piece => drawEndcap(piece.points, pieceThickness(piece), cfg.endcapDesign, cfg.ropeColor, cfg.endcapHeight, emergeFactor(piece.tipEmerge), pieceEndcapGradientInfo(piece), piece.baseThickness));
    // detachScale: 1 for the boot-time rope (detachTipScaleProgress never
    // set) or once its own grow-back has finished; otherwise blends from
    // Detach Endcap Start Scale up to 1 as detachTipScaleProgress rises --
    // see detachEntireRopeAndRestartIntro()/update()'s own tick.
    const detachScale = mainRope.detachTipScaleProgress === undefined ? 1
      : cfg.detachTipStartScale + (1 - cfg.detachTipStartScale) * mainRope.detachTipScaleProgress;
    const mainGradientInfo = cfg.endcapGradientEnabled ? { stops: cfg.endcapGradientColors, worldTop: mainRope.points[0] } : null;
    if (showMainRope) drawEndcap(mainRope.points, liveThickness, cfg.endcapDesign, cfg.ropeColor, cfg.endcapHeight * detachScale, mainTipFactor, mainGradientInfo);
    // piece.points[0] is the cut edge (where it severed from the rest of the
    // rope, per renderCutSweep's own convention) -- reversing the piece's
    // points array before reusing drawEndcap() puts that cut point at
    // points[length-1] (the position drawEndcap always caps) and its
    // neighbor at points[length-2] (drawEndcap's own orientation reference),
    // so the cap is correctly positioned AND oriented at the severed end
    // with no separate code path needed.
    if (cfg.endcapAtCutEnd){
      // No separate "has it started falling yet" gate needed here: a piece
      // doesn't exist in fallenPieces at all until the deferred split
      // actually happens (cutRopeAt/cutPieceAt's pendingCut, resolved in
      // update()) -- so by the time a piece is here to iterate over, it
      // has, by construction, already started falling. Its OWN
      // cutEdgeEmerge (separate from tipEmerge above) governs how far
      // along ITS emergence is.
      fallenPieces.forEach(piece => {
        // worldTop uses the piece's ORIGINAL far end (pre-reversal), not
        // the reversed array's own [0] -- keeps this end's gradient in
        // the same world-space orientation as the tip-end endcap above,
        // rather than flipping independently.
        const cutGradientInfo = cfg.endcapGradientEnabled ? { stops: cfg.endcapGradientColors, worldTop: piece.points[piece.points.length - 1] } : null;
        drawEndcap([...piece.points].reverse(), pieceThickness(piece), cfg.endcapDesign, cfg.ropeColor, cfg.endcapHeight, emergeFactor(piece.cutEdgeEmerge), cutGradientInfo);
      });
    }
  }
  if (mainRope.cutSweep && mainRope.cutSweep.progress < 1) renderCutSweep(mainRope);
  fallenPieces.forEach(piece => { if (piece.cutSweep && piece.cutSweep.progress < 1) renderCutSweep(piece); });

  // Debug: Show Rise Clear Offset Line -- draws the RAW (uncapped)
  // Startup Rise Clear Offset target as a dashed CIRCLE (pink) -- per
  // explicit correction, it's conceptually a circle offset FROM the
  // anchor's own boundary, not an arbitrary full-width horizontal line --
  // plus the anchor's own physics boundary (anchorBoundaryRadius() around
  // circleAnchor()) as a second dashed circle (cyan), so the two can be
  // visually compared -- exactly the two quantities updateIntro()'s own
  // clamp (see its comment) now reconciles. Drawn regardless of
  // introPhase (not just during waiting/rising/pausing) so it's just as
  // usable for inspecting Circle Boundary Offset/Circle Size tuning
  // after the animation has finished.
  if (cfg.debugShowRiseClearOffset){
    const anchor = circleAnchor();
    const boundaryR = anchorBoundaryRadius();
    const rawClearRadius = boundaryR - (cfg.introRiseClearOffsetEnabled ? vmin(cfg.introRiseClearOffset) : 0);
    ctx.save();
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ff2ec4';
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, Math.max(0, rawClearRadius), 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#2ee6ff';
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, boundaryR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // FLICK animation overlay -- drawn last so it's always on top of the
  // rope/circle. `complete`/`naturalWidth` guard against drawing before
  // that particular frame image has actually finished loading.
  const flickImg = flickFrames[flickFrameIndex()];
  if (flickImg && flickImg.complete && flickImg.naturalWidth > 0){
    const w = vmin(cfg.flickScale);
    const h = w * (flickImg.naturalHeight / flickImg.naturalWidth);
    const cx = vw(cfg.flickX);
    const cy = vh(cfg.flickY);
    ctx.drawImage(flickImg, cx - w / 2, cy - h / 2, w, h);
  }
  const flick2Img = flickFrames2[flick2FrameIndex()];
  if (flick2Img && flick2Img.complete && flick2Img.naturalWidth > 0){
    const w2 = vmin(cfg.flick2Scale);
    const h2 = w2 * (flick2Img.naturalHeight / flick2Img.naturalWidth);
    const cx2 = vw(cfg.flick2X);
    const cy2 = vh(cfg.flick2Y);
    ctx.drawImage(flick2Img, cx2 - w2 / 2, cy2 - h2 / 2, w2, h2);
  }
}

// Fixed-timestep physics: update() always advances by exactly this much,
// however many times are needed to catch up to real elapsed time (a plain
// requestAnimationFrame dt is fed straight from the browser's own frame
// timing, which jitters — every subsequent frame's motion, growth rate, and
// cut-sweep speed jittered along with it, which read as "jumpy").
// render() still runs once per real animation frame.
const FIXED_DT = 1 / 60;
const MAX_FRAME_DT = 0.25; // cap the catch-up burst after e.g. a backgrounded tab
let lastTime = performance.now();
let accumulator = 0;
let fpsAccum = 0, fpsFrames = 0, fpsLast = performance.now();
function loop(now){
  try {
  const frameDt = Math.min((now - lastTime) / 1000, MAX_FRAME_DT);
  lastTime = now;
  accumulator += frameDt;
  while (accumulator >= FIXED_DT){
    update(FIXED_DT);
    accumulator -= FIXED_DT;
  }
  render();
  if (DEV_MODE){
    fpsFrames++; fpsAccum += frameDt;
    if (now - fpsLast > 500){
      document.getElementById('dpFps').textContent = Math.round(fpsFrames / fpsAccum) + 'fps';
      fpsFrames = 0; fpsAccum = 0; fpsLast = now;
    }
  }
  } catch (err) {
    // A single bad frame (a transient fetch/network hiccup mid-frame, or
    // any other one-off exception) used to permanently freeze the whole
    // app -- an uncaught throw here stops requestAnimationFrame(loop)
    // from ever being called again, with no way to recover short of a
    // manual reload. Logged (not silent) so a real, reproducible bug is
    // still visible in the console, but the loop itself now survives a
    // single bad frame and keeps running from the next one.
    console.error('loop() error (frame skipped):', err);
  }
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
// Start with a minimal (single-segment) rope so mainRope.points[0] (the
// anchor) is a real, physically-integrating point from frame one --
// integrateChain() needs something valid to integrate during
// 'waiting'/'rising'/'pausing' even though nothing is drawn yet (see
// render()'s showMainRope gate). introPhase is always set to 'waiting'
// here rather than being gated on cfg.introEnabled, which may not have
// finished loading from saved settings yet (resetSettings() below is
// async and unawaited) -- updateIntro() re-checks cfg.introEnabled every
// frame during 'waiting' and jumps straight to a full-length 'done' rope
// the instant it sees the feature is actually off. bgRope's own anchor
// starts wherever resetBgRope() places it (circleAnchor()) and just sits
// there hidden through 'waiting' -- updateIntro() explicitly repositions
// it to the circle's bottom edge the instant 'rising' begins, the same
// frame bgRope first becomes visible, so this isn't a visible jump.
resetMainRope(vh(TARGET_SEG_LEN_VH));
resetBgRope();
introPhase = 'waiting';
introTimer = 0;
if (DEV_MODE){
  document.getElementById('devPanel').classList.remove('hidden');
  buildDevPanel();
  buildPanelStyleGroup();
  applyPanelStyle();
  initPanelDrag();
  initResizeHandles();
  initDevPanelChrome();
  initDeviceTabs();
  resetSettings(); // load last-saved values/order/geometry, if any (falls back to defaults if nothing saved)
}
// Re-synced HERE, right before the first real frame -- not left at its
// module-init-time value set alongside FIXED_DT above. Everything since
// then (DEV_MODE's synchronous dev-panel construction, resetSettings()'s
// own synchronous portion, etc.) takes a real, variable amount of wall-
// clock time. Left uncorrected, that startup work counted as frame 1's
// own dt, which the fixed-timestep accumulator (MAX_FRAME_DT-capped)
// then "catches up" on in a burst of extra ticks BEFORE the first
// render() -- reported as "sometimes it lags, sometimes it jumps really
// high up": a bigger burst (more queued ticks) reads as a sudden jump
// once painted; a smaller, more variable one reads as stutter across the
// first couple of seconds. Root cause, not a band-aid -- doesn't touch
// MAX_FRAME_DT itself, which still does its real job of capping a
// genuine catch-up burst (e.g. after a backgrounded tab).
lastTime = performance.now();
requestAnimationFrame(loop);

})();
</script>
</body>
