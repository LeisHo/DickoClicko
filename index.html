        // since either reach can change live (Endcap Height, thickness
        // decay). Cleared PERMANENTLY the first time it's satisfied, so
        // this piece behaves exactly like any other from then on
        // (including being eligible again if mainRope is later
        // extended back down to a pile it happens to be part of).
        if (piece.mainRopeExcluded){
          const cutPoint = piece.points[0];
          const originDist = Math.hypot(cutPoint.x - piece.mainRopeExcludeOriginX, cutPoint.y - piece.mainRopeExcludeOriginY);
          const pieceReach = Math.max(thick / 2, cutCircle ? cutCircle.offset + cutCircle.radius : 0);
          const safeDist = (mainReach + pieceReach) * 1.5;
          if (originDist < safeDist) return;
          piece.mainRopeExcluded = false;
        }
        resolveChainCollision(mainData, pieceCollisionRadii(piece.points, thick, tipCircle, cutCircle), maxPush);
      });
    }
  }

  if (fallenPieces.length === 0) return;
  // Per-PAIR separation, from each piece's own CURRENT (possibly
  // decayed) thickness via pieceThickness() -- not a single global
  // value pinned to cfg.ropeThickness (the un-decayed default) computed
  // once for every pair regardless of either piece's real live
  // thickness. That fixed value never shrank as a piece's own thickness
  // decayed toward Piece Minimum Thickness, so anything resting on top
  // of a decaying piece stayed held up at the ORIGINAL, un-decayed
  // separation forever -- reported directly: "when the bottom piece
  // starts shrinking in thickness, the top piece doesnt fall down with
  // it... the top piece stays suspended in the air."
  const pieceData = fallenPieces.map(piece => {
    const thick = pieceThickness(piece);
    // see the mainRope-vs-piece loop's own identical comment for why
    // the tip uses baseThickness (offset) + live thick (radius) while
    // the cut edge uses live thick for both.
    const tipCircle = endcapCircle(piece.baseThickness, thick);
    const cutCircle = cfg.endcapAtCutEnd ? endcapCircle(thick, thick) : null;
    return pieceCollisionRadii(piece.points, thick, tipCircle, cutCircle);
  });
  // Self-collision: a piece's own far-apart points pushing off each
  // other -- see MIN_SELF_COLLISION_GAP's own comment for why an index
  // gap is what makes this safe. Runs for every piece regardless of how
  // many others exist (unlike the pairwise loop below), since a lone
  // piece coiling on itself is just as real a case as 2+ pieces piling.
  //
  // Deliberately uses THICKNESS-ONLY radii here (tipExt/cutExt both 0),
  // NOT pieceData's own endcap-inflated radii shared with cross-piece
  // collision below -- reported directly right after self-collision
  // shipped: "when i fully cut the rope, the cut off rope gets flung to
  // the floor, far faster thn the normal falling speed" and separately
  // "cut segments... look like theyre floating" on the pile. A piece's 2
  // ends can each carry a LARGE endcap-inflated radius (Endcap Height is
  // a live-tunable multiplier with real range), and MIN_SELF_COLLISION_GAP
  // (4) doesn't exclude the pair formed by a piece's own tip and cut edge
  // -- they're always far apart by index. A full-rope detach in
  // particular is the LONGEST possible piece and gets tossed by
  // topplePiece()'s own random tilt, which can easily curl those 2
  // oversized-radius ends close enough in space to register as deeply
  // overlapping -- producing exactly a sudden, large, "flung" correction
  // on the very first frame, and later a mismatched resting shape/height
  // once it's part of a pile ("floating"). The endcap graphics
  // themselves visually touching or overlapping is a MUCH rarer, more
  // extreme event than the rope BODY folding on itself (the actual
  // request), so it's not worth this risk -- self-collision now only
  // ever concerns the rope's own physical body.
  pieceData.forEach((data, i) => {
    const thick = pieceThickness(fallenPieces[i]);
    resolveSelfCollision(pieceCollisionRadii(data.points, thick, null, null), maxPush);
  });
  for (let a = 0; a < fallenPieces.length; a++){
    for (let b = a + 1; b < fallenPieces.length; b++){
      // see setPieceSpawnGrace()'s own comment -- a freshly-created piece
      // still within its own spawn grace is excluded from EVERY
      // piece-vs-piece pair this frame, not just whichever piece it
      // actually spawned overlapping (which this loop has no way to
      // identify specifically).
      if (pieceSpawnGraceActive(fallenPieces[a], pieceData[a].maxRadius) ||
          pieceSpawnGraceActive(fallenPieces[b], pieceData[b].maxRadius)) continue;
      resolveChainCollision(pieceData[a], pieceData[b], maxPush);
    }
  }
}

/* ---------------------------------------------------------------------
   Startup animation -- 'waiting' (nothing but the circle) -> 'rising'
   (bgRope's OWN rope-start climbs from the circle's bottom edge, driven
   directly rather than following mainRope -- bgRope itself, clipped to
   the circle, IS the climbing visual now, not a separate dot) -> once
   bgRope's rope-start clears the circle's bottom-edge boundary (per
   Startup Rise Clear Offset), 'pausing' (brief hold, bgRope resumes
   following mainRope's own anchor as usual) -> 'growing' (the rope
   extends downward from there, reusing the SAME `growing`-flag mechanic
   hold-to-grow already drives -- no separate growth code) -> 'done'
   (normal operation). mainRope is built as a minimal single-segment rope
   at boot when this is active (see the Boot section), so it's always
   structurally valid (physics can integrate it every frame, letting the
   anchor settle naturally during 'waiting'/'rising' the same way it
   would during ordinary play) -- render() is what actually hides it,
   per phase.
--------------------------------------------------------------------- */
let introPhase = 'done'; // set to 'waiting' at boot when cfg.introEnabled
let introTimer = 0;
let introTargetLengthPx = 0;
// mainRope.totalLength at the exact instant 'growing' starts -- the tween's
// own 0% point, so progress is measured against how far THIS extension has
// actually come, not an assumed-fixed starting length.
let introGrowStartLengthPx = 0;
// false for the boot-time (page-load) run of this state machine, true for
// every run triggered by detachEntireRopeAndRestartIntro() -- lets
// 'pausing' pick Detach Pause Duration instead of Startup Pause Duration.
// Never reset back to false: once the first detach happens, every LATER
// 'waiting' in this same page session is also detach-triggered by
// definition (the only way to re-enter 'waiting' after boot is another
// detach), so staying true is correct, not stale.
let introTriggeredByDetach = false;
// Tracks the PREVIOUS frame's unsettled state (see update()'s own
// introUnsettled computation) so the exact frame it flips from true to
// false can be detected and have its own implied-velocity zeroed out --
// see that transition's own comment near the integrateChain() call for
// why. Starts true (matching introUnsettled's own default reasoning).
let anchorWasUnsettled = true;
// Gates Startup Rise Gravity vs. Gravity Strength -- see
// introUnsettled()'s own comment (defined near update()) for the full,
// twice-corrected mechanism.
// Compounds by cfg.detachThicknessMultiplier on every full-rope detach --
// "every subsequent time the rope is fully cut, it increases in
// thickness by [the multiplier]", per explicit request. Applied only to
// mainRope's and bgRope's own live rendering (see render()'s
// liveThickness), never to already-fallen pieces, which keep whatever
// thickness they had at the moment they existed.
let ropeThicknessMultiplier = 1;

// The rate growRope() extends at during the startup animation's own
// 'growing' phase -- either a flat Startup Extension Speed, or (when
// Startup Extension Speed Tween Enabled) linearly tweened from Startup
// Extension Starting Speed up to that same default as the extension
// progresses from 0% to 100% of its own span, per explicit request ("set
// a starting speed, and that speed tweens into the default extension
// speed as the rope extends").
function currentIntroExtendRate(){
  if (!cfg.introExtendSpeedTweenEnabled) return cfg.introExtendSpeed;
  const span = introTargetLengthPx - introGrowStartLengthPx;
  const progress = span > 0 ? Math.min(1, Math.max(0, (mainRope.totalLength - introGrowStartLengthPx) / span)) : 1;
  return cfg.introExtendStartSpeed + (cfg.introExtendSpeed - cfg.introExtendStartSpeed) * progress;
}

function updateIntro(rawDt){
  if (introPhase === 'waiting'){
    // Re-checked every frame (not just once at boot) rather than decided
    // once at boot time -- resetSettings() loads saved config
    // asynchronously, so cfg.introEnabled may not reflect a saved
    // override yet on the very first frames. If it turns out to be off
    // (now, or once the async load catches up), skip straight to a full-
    // length rope instead of running the animation.
    if (!cfg.introEnabled){
      setMainRopeTotalLength(vh(cfg.ropeDefaultLength));
      introPhase = 'done';
      return;
    }
    introTimer += rawDt;
    // Detach-triggered restarts get their own Detach Wait Duration instead
    // of reusing Startup Wait Duration -- same split as Detach Pause
    // Duration below, so tuning boot's own wait doesn't also change how
    // long a detach-and-regrow cycle pauses before its climb starts.
    // Reported as "the main rope doesnt spawn UNTIl the wait time is
    // over": before this, a detach had no independent control over this
    // delay at all.
    const waitDuration = introTriggeredByDetach ? cfg.detachWaitDuration : cfg.introWaitDuration;
    if (introTimer >= waitDuration){
      introPhase = 'rising';
      // bgRope's own rope-start begins its climb one full circle-diameter
      // BELOW the circle's bottom edge -- "as if the circle was a hole in
      // a wall and this rope is climbing through it coming from the
      // bottom". Deliberately NOT starting exactly at the bottom edge
      // itself (which the old dot used to do): with Startup Rise Clear
      // Offset at its own default of 0, the "clear the bottom edge"
      // threshold (below) sits exactly AT the bottom edge too, so a
      // start position already there would satisfy it instantly, making
      // the whole climb imperceptible by default -- contradicting a
      // slow Startup Rise Speed default existing at all. Starting a full
      // diameter below guarantees a real, visible climb regardless of
      // the offset's own value.
      //
      // The WHOLE chain is rebuilt here (not just point 0 repositioned) --
      // reported as "the background rope suddenly goes really high
      // straight up" right as this phase begins. Root cause, confirmed via
      // direct frame-by-frame tracing: only point 0 used to jump to this
      // far-below position while points 1+ stayed wherever they'd settled
      // during 'waiting' (hanging normally downward from the OLD point 0,
      // which sat at circleAnchor()) -- leaving the rest of the chain
      // ABOVE the newly-teleported point 0, an inverted configuration
      // gravity never produces naturally. The constraint solver's
      // correction for that inversion is what flung the tail upward: 5
      // consecutive frames after the teleport measured the tip moving
      // 199->165->147->127->106->84 (y decreasing = climbing), racing
      // upward well past the circle before eventually settling. Rebuilding
      // the whole chain to hang FURTHER below this same start point (via
      // resetBgRope's own makeChain() logic, now parameterized) means
      // every point is already consistent with gravity's own direction
      // from frame one -- nothing to invert, nothing to violently correct.
      //
      // Start position: just barely below the circle's own edge -- Rope
      // Thickness + 1 (%vmin) -- not a full diameter below. Per explicit
      // correction ("the background rope should spawn just out of sight
      // of the circle... spawning very far down [was wrong]. It sould be
      // spawning the rope thickness+1 under the circle"). This makes the
      // visible climb correspondingly short when Startup Rise Clear
      // Offset is at/near its own default (0, disabled) -- an explicit,
      // deliberate tradeoff against this same function's PRIOR reasoning
      // (a far-below start was originally chosen specifically to
      // guarantee a real, visible climb regardless of Offset) -- that
      // reasoning no longer applies now that the spawn point itself is
      // meant to already sit just out of sight.
      resetBgRope(circleAnchor().x, circleAnchor().y + vmin(cfg.circleSize) / 2 + vmin(cfg.ropeThickness + 1));
    }
  } else if (introPhase === 'rising'){
    // bgRope's own rope-start climbs at Startup Rise Speed until it
    // clears a tunable boundary -- Startup Rise Clear Offset -- measured
    // from the circle's own bottom edge, per explicit request ("when the
    // rope start of background rope clears the bottom edge of the
    // circle, then the main rope appears and begins the extension").
    // This replaces the old "climb until reaching mainRope's own settled
    // anchor position" target: a purely geometric trigger, independent
    // of wherever Anchor Physics happens to settle mainRope's anchor.
    //
    // Clamped to mainRope's own anchor boundary (anchorBoundaryRadius()
    // around circleAnchor()) -- NOT the raw offset math alone. Reported as
    // "sometimes i see the background rope jump up past the top edge of
    // the circle, then come back down" / "the rope comes from above":
    // mainRope's anchor is a physics point that can NEVER actually rest
    // outside that radius (integrateChain()'s own boundaryConstraint
    // clamps it back every single frame), so an Offset large enough to
    // put the RAW target beyond it was never actually achievable by the
    // handoff below -- bgRope climbed there anyway (fully unconstrained
    // during 'rising'), then mainRope's spawn got hard-snapped back
    // inside the boundary on the very next physics tick while its
    // oldx/oldy still held the far-outside spawn position (set equal to
    // it the same frame, on the -- as it turns out, false -- assumption
    // that meant zero implied velocity). The FOLLOWING frame's verlet
    // step then computed a real implied velocity from that mismatch
    // (clamped position minus the still-far-outside old position),
    // flinging the anchor hard in the correction's own direction --
    // confirmed via direct trace at the current default Startup Rise
    // Clear Offset (-18.5): the raw target sits ~29%vmin from center vs.
    // an ~8.75%vmin boundary radius at default Circle Size/Circle
    // Boundary Offset, a large enough gap to overshoot past the
    // boundary's opposite side before damping settled it back --
    // reproducing exactly the reported jump-then-return. Clamping the
    // climb's own TARGET here means bgRope's visible climb now stops
    // exactly where mainRope's anchor can actually rest, so the handoff
    // below is a genuine zero-discontinuity continuation, matching what
    // this code always intended ("There will not be a sudden jump") --
    // rather than relying on a same-frame zero-velocity assignment that
    // the very next frame's boundary clamp was silently invalidating.
    // A large negative Offset's own configured "climb from far below"
    // distance is now bounded by the anchor's real physics reach --
    // increase Circle Boundary Offset (or Circle Size) to let the anchor
    // itself range further from center if a longer visible climb is
    // wanted; Offset beyond that boundary was never physically
    // achievable without reproducing this exact bug.
    //
    // clearY is a straight horizontal line again -- per explicit
    // correction, back from the circle this was briefly changed to
    // ("Make it a horizontal line again. But make it an offset from the
    // bottom point of the Anhor Point - Circle Offset"). Measured from
    // anchorBoundaryRadius()'s own BOTTOM point (circleAnchor().y +
    // boundaryR, the Circle-Offset-adjusted confinement boundary's lowest
    // point, not the raw drawn circle's circleSize/2 or circleAnchor().y
    // itself) minus the offset -- positive Offset moves the line UP
    // (toward center, shrinking how far the climb has to travel to
    // "clear"), same sign convention Circle Offset itself already uses.
    // Clamped so an extreme Offset can't push the line above the
    // boundary's own top point -- a straight y-bound now, not a circle
    // clamp, though the underlying math is unchanged from before this
    // revert (this path was always purely vertical -- bgRope's climb only
    // ever moves along the anchor's own x -- so "circle" vs. "line"
    // framing produced identical numbers here regardless; this revert is
    // about restoring the conceptual framing and the debug visualization,
    // see debugShowRiseClearOffset below).
    //
    // Startup Rise Clear Offset Enabled (def false, per explicit
    // request) gates whether the slider's own value is actually applied
    // -- when off, the line collapses to exactly the boundary's own
    // bottom point (offset 0), so the climb simply clears at the anchor's
    // own real physics boundary with no extra offset.
    const boundaryR = anchorBoundaryRadius();
    const bottomY = circleAnchor().y + boundaryR;
    const appliedOffset = cfg.introRiseClearOffsetEnabled ? vmin(cfg.introRiseClearOffset) : 0;
    const rawClearY = bottomY - appliedOffset;
    // Clamped to the circle's own drawn radius, NOT anchorBoundaryRadius() --
    // that used to cap Startup Rise Clear Offset at the tiny anchor
    // boundary itself, so raising the slider past it did nothing ("the main
    // rope is still spawning at its own offset boundary instead of
    // spawning at the startup clear offset"). anchorBoundaryRadius() used
    // to be the right bound here because mainRope's spawn point, placed
    // beyond it, would get hard-snapped straight back by
    // integrateChain()'s own boundaryConstraint on the very next physics
    // tick (see that fix's own comment above) -- that snap is what's
    // actually fixed now, at its source, by relaxing the boundaryConstraint
    // itself while introUnsettled() is true (see update()'s own call
    // below), so this clamp no longer needs to protect against it. Still
    // clamped to SOMETHING (the circle's own edge) so an extreme Offset
    // can't send the clear line -- and therefore mainRope's spawn point --
    // outside the circle graphic entirely.
    const circleR = vmin(cfg.circleSize) / 2;
    const clearY = Math.min(circleAnchor().y + circleR, Math.max(circleAnchor().y - circleR, rawClearY));
    const step = vh(cfg.introRiseSpeed) * rawDt;
    if (bgRope.points[0].y - clearY <= step){
      bgRope.points[0].y = clearY;
      introPhase = 'pausing';
      introTimer = 0;
      // mainRope does NOT spawn here anymore -- per explicit correction
      // ("after the background rope has risen to clear the startup rise
      // offset, it stays there for the pause duration, then after that
      // duration does the main rope spawn and the whole unit begins to
      // fall"). bgRope simply holds at clearY (nothing here moves it)
      // for the whole 'pausing' duration; the actual spawn moved to the
      // 'pausing'->'growing' transition below.
    } else {
      bgRope.points[0].y -= step;
    }
  } else if (introPhase === 'pausing'){
    introTimer += rawDt;
    // Boot's own (first-ever) startup animation uses Startup Pause
    // Duration; a double-click-triggered full detach (see
    // detachEntireRopeAndRestartIntro()) reuses this ENTIRE state
    // machine but pauses for its own, separately-tunable Detach Pause
    // Duration instead -- per explicit request ("give me a duplicate,
    // but this is the pause for when the rope is fully cut").
    const pauseDuration = introTriggeredByDetach ? cfg.detachPauseDuration : cfg.introPauseDuration;
    if (introTimer >= pauseDuration){
      // mainRope "spawns" exactly where bgRope has been holding -- no
      // jump -- then, from this frame on, mainRope's own already-running
      // physics (the same boundaryConstraint every other frame already
      // uses) naturally settles it toward wherever it actually wants to
      // rest, exactly like a real drop rather than a teleport. Per
      // explicit request: "the main rope [will] start with the rope
      // start at background rope's rope start... will then naturally
      // fall back to its default position. There will not be a sudden
      // jump."
      //
      // The WHOLE chain is rebuilt here (not just point 0) -- same fix
      // shape as 'waiting'->'rising' and bgRope's own handoff rebuild
      // just below, and for the exact same reason. Only patching point 0
      // (as this used to do) left points 1+ wherever they'd hung from
      // mainRope's OLD anchor position for the entire waiting+rising+
      // pausing duration -- normally close enough to the new spawn point
      // to go unnoticed, but with a real Startup Rise Clear Offset now
      // actually reaching far from that old position, the gap between
      // old point 1 and new point 0 became large enough for the distance
      // constraint to violently whip the chain back toward the old
      // position the instant this handoff ran -- reported directly, with
      // a screen recording, as "you can also see that the background
      // rope jumps down to the circle offset" (bgRope visibly moves too
      // because it re-syncs to mainRope's own anchor every frame from
      // here on -- see its own comment below). Rebuilding hanging from
      // the new spawn point means every point is already consistent with
      // both gravity's direction AND the actual segment length from
      // frame one, nothing left to violently correct.
      mainRope.points = makeChain(mainRope.points.length, bgRope.points[0].x, bgRope.points[0].y, mainRope.segLen);
      // Point 0 explicitly pinned to the exact spawn coordinate (not left
      // to makeChain()'s own small random per-point x lean, which is only
      // meant to break points 1+'s symmetry -- see makeChain()'s own
      // comment) -- oldx/oldy set equal to x/y (zero implied velocity) so
      // the following frame's integration doesn't compute a spurious
      // "teleport" velocity from wherever mainRope's own anchor had
      // independently drifted to while hidden during waiting/rising.
      mainRope.points[0].x = bgRope.points[0].x;
      mainRope.points[0].y = bgRope.points[0].y;
      mainRope.points[0].oldx = mainRope.points[0].x;
      mainRope.points[0].oldy = mainRope.points[0].y;
      // See makeChain()'s own comment for the real fix to "it stays this
      // way for 5-10 seconds then it settles to the position i expect" --
      // a nudge attempted HERE, at the handoff, was tried first and
      // measured to fail: by this point mainRope has already been
      // integrating (hidden) for the ENTIRE waiting+rising+pausing
      // duration, long enough to have already settled deep into
      // makeChain()'s own perfectly-symmetric trap -- a one-frame nudge
      // this late is fighting settled inertia across the whole chain,
      // not preventing it, and live tracing confirmed even an
      // 8%-of-boundary-radius kick here decayed back to the exact same
      // symmetric x within ~1-2s (i.e. it just relocated the freeze, it
      // didn't fix it). Fixing the chain's own construction instead means
      // the whole hidden wait+rise+pause duration is naturally available
      // to settle into a real off-axis resting pose BEFORE this handoff
      // ever runs, so there's nothing left to fight here.
      // bgRope resumes following mainRope's own anchor from here on (see
      // update()'s own bgRope sync) -- rebuild it HERE, at the moment of
      // that handoff, both for the usual race-avoidance reason (locks its
      // fixed length in against the real settings-loaded Rope Length, not
      // a possible pre-load default. Built hanging from mainRope's NEW
      // spawn position directly (not circleAnchor()) -- previously this
      // called resetBgRope() with no args, which hangs the WHOLE chain
      // from circleAnchor() and only patched point 0 afterward (the 2
      // lines below), leaving points 1+ built relative to circleAnchor()
      // while point 0 sat wherever the climb actually ended (the anchor
      // BOUNDARY, not circleAnchor() itself -- these differ by
      // anchorBoundaryRadius(), a real gap whenever Circle Offset moves
      // the boundary off dead-center). That's the exact same inversion
      // bug class already fixed for the 'waiting'->'rising' transition
      // above, just recurring here at the handoff instead -- reported as
      // "when the main rope spawns, it seems to physically affect the
      // background rope. it shouldnt." Passing the real spawn coordinates
      // directly means every point starts consistent with gravity's
      // direction from frame one, same fix shape as above.
      resetBgRope(mainRope.points[0].x, mainRope.points[0].y);
      // Still set explicitly (not left to makeChain()'s own small random
      // per-point x lean) so point 0 matches mainRope's spawn x exactly,
      // not off by that lean.
      bgRope.points[0].x = mainRope.points[0].x;
      bgRope.points[0].y = mainRope.points[0].y;
      // detachTipScaleProgress is armed HERE (the actual spawn moment),
      // not back at the initial detach trigger -- arming it there meant
      // it had already been ticking for the ENTIRE hidden waiting+rising+
      // pausing duration by the time mainRope was ever shown, often
      // exceeding Detach Endcap Grow Duration before the endcap was ever
      // visible at all. Reported directly: "when i cut the rope entirely,
      // the new main rope has a full height endcap regardless of those
      // sliders." undefined (-> full size) for boot, which never sets
      // this, same as before.
      if (introTriggeredByDetach) mainRope.detachTipScaleProgress = 0;
      // Boot-only endcap grow-in (per explicit request, and per explicit
      // follow-up clarifying detach keeps its OWN existing mechanism
      // above unchanged rather than sharing this one): starts at
      // Background Rope Endcap Pause Height -- the same height bgRope's
      // own endcap was shrinking FROM during 'pausing' (see render()'s
      // own bgRope-endcap comment) -- and grows to mainRope's normal
      // Endcap Height at Main Rope Endcap Growth Speed (see update()'s
      // own per-frame increment). Left null (skipped) on a detach spawn.
      if (!introTriggeredByDetach) mainRope.bootEndcapScale = cfg.bgRopeEndcapPauseHeight;
      // Captured HERE, not at boot -- by this point (wait + rise + pause,
      // several seconds in) any async settings load has long since
      // resolved, so this is guaranteed to be the real configured target,
      // never a stale pre-load default. Reads Default Rope Length, not
      // Rope Length -- this is a fresh spawn's own target (boot, or a
      // full detach/respawn), which must always be the real configured
      // default regardless of whatever length a prior rope was grown to
      // or cut down to (see Default Rope Length's own comment).
      introTargetLengthPx = vh(cfg.ropeDefaultLength);
      introGrowStartLengthPx = mainRope.totalLength;
      introPhase = 'growing';
      growing = true; // reuses growRope()/positionGrowingTip() unchanged
    }
  } else if (introPhase === 'growing'){
    if (mainRope.totalLength >= introTargetLengthPx){
      growing = false;
      introPhase = 'done';
    }
  }
}

// Double-clicking in the circle: the whole rope lets go and falls as one
// piece (rather than a minimum-length partial cut), then the startup
// animation replays to grow a fresh one in -- per explicit request. Reuses
// the exact same fresh-rope/toppling/emerge-state machinery Boot and a
// normal cut already use, just applied to the ENTIRE points array instead
// of a slice of it, and re-enters 'waiting' instead of leaving introPhase
// alone.
function detachEntireRopeAndRestartIntro(){
  if (mainRope.points.length >= 2){
    const fallingPoints = mainRope.points.map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
    // see topplePiece()'s own comment: this whole rope's own last point is
    // the kinematically-placed growing tip whenever mainRope was cut off
    // mid-growth, not a settled physics point.
    topplePiece(fallingPoints, mainRope.tipGrowLen < mainRope.segLen);
    // Captured BEFORE ropeThicknessMultiplier compounds further below --
    // this piece is the OLD rope, falling at whatever thickness it
    // actually had, not the NEW (about to be thicker) one the fresh
    // regrowth will use.
    const piece = { points: fallingPoints, segLen: mainRope.segLen, tipEmerge: mainRope.tipEmerge, age: 0, baseThickness: vmin(cfg.ropeThickness) * ropeThicknessMultiplier };
    // Falls immediately, same as any other cut -- an earlier version of
    // this held the piece frozen (no gravity) until the fresh main rope
    // spawned, based on a misreading of "the ropes shouldnt fall until
    // the Main rope has been spawned." Corrected per explicit follow-up:
    // "the wait is only for the endcap. the cut segment should fall
    // immediatly as it used to" -- the wait belongs to the NEW rope's own
    // endcap grow-in (Detach Endcap Start Scale/Grow Duration, driven by
    // mainRope.detachTipScaleProgress below), not to this falling piece's
    // physics at all.
    // the piece's own free/tip end keeps whatever End Emerge state the
    // rope's tip already had; its NEW cut edge (former anchor, now
    // points[0]) starts its own fresh emerge, same convention
    // performMainRopeSplit() already uses for an ordinary cut.
    piece.cutEdgeEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
    setPieceSpawnGrace(piece);
    fallenPieces.push(piece);
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
  resetMainRope(vh(TARGET_SEG_LEN_VH));
  // Boot's own version of this restart also rebuilds bgRope from scratch
  // (see resetBgRope() at Boot) -- this path used to skip that entirely,
  // leaving bgRope's OWN chain (points[1] onward; point 0 alone gets
  // explicitly repositioned when 'rising' begins, a few lines below in
  // updateIntro()) at whatever stale positions it last held from normal
  // 'done'-phase operation, swinging wherever mainRope's old anchor had
  // last taken it. The instant 'rising' snapped point 0 to the fresh
  // "below the circle" start while the REST of the chain stayed stale
  // and far away, the distance/bend constraints spent several real
  // seconds violently whipping those stale points back into a normal
  // chain shape relative to the new point 0 -- reported as "the
  // background rope act[s] weird" for "5-8 seconds", "coming from the
  // top or something" (wherever the old rope happened to be swinging,
  // often above the circle), reproduced by repeatedly double-clicking to
  // trigger this exact path ("I cut it 3 times"). Rebuilding bgRope HERE
  // means every point starts fresh and consistent on every detach-
  // triggered restart, not just the very first boot.
  resetBgRope();
  // detachTipScaleProgress is armed at the actual SPAWN moment instead
  // (the 'pausing'->'growing' transition in updateIntro()), not here --
  // see that site's own comment for why arming it this early was a real
  // bug ("the new main rope has a full height endcap regardless of
  // those sliders").
  introTriggeredByDetach = true;
  ropeThicknessMultiplier *= cfg.detachThicknessMultiplier;
  introPhase = 'waiting';
  introTimer = 0;
}

/* ---------------------------------------------------------------------
   Growth / cut / punch actions
--------------------------------------------------------------------- */
let growing = false;

// direction to extend the tip in: the settled rope's own local tangent
// (from the point BEFORE prev, to prev) -- deliberately not derived from the
// tip's own current position, which is what's being placed and would make
// the direction circular/dependent on wherever the tip last happened to be.
//
// The RAW per-frame tangent is exponentially smoothed into mainRope.growDir
// before being returned, rather than handed back unsmoothed. prev/beforePrev
// are real, solver-participating points, so their measured tangent carries
// the solver's own ordinary per-frame "breathing" noise (worse with fewer
// constraintIterations / higher damping, i.e. less energy removed per
// frame) -- positionGrowingTip() already smooths its OWN rendered position
// toward the target, but growRope()'s commit previously placed each newly-
// finalized segment using a freshly-recomputed RAW direction with no
// smoothing at all, so a single noisy frame at the exact instant a segment
// committed could bake a locally-wrong angle in as a PERMANENT kink.
// Confirmed via reproduction: a synthetic straight-down growth test (zero
// punches/perturbation, so every committed point's Y should stay strictly
// increasing) showed points going non-monotonic starting a few commits in --
// e.g. point Y-sequence ...441.4, 455.4, 511.8, 462.4, 520.2, 471.8... --
// a real fold-back baked in at specific commits, reproducing the user's
// reported chaotic knotting during sustained hold-to-grow after a cut. This
// happened independent of cfg.bendStiffness (reproduced identically with it
// forced to 0), so it predates and is unrelated to that constraint -- fixing
// bendStiffness's own separate tip-feedback issue (see integrateChain()'s
// bendEnd) was necessary but not sufficient on its own.
function tipGrowDirection(pts){
  const n = pts.length;
  const prev = pts[n - 2] || pts[0];
  const beforePrev = pts[n - 3] || pts[0];
  const dx = prev.x - beforePrev.x, dy = prev.y - beforePrev.y;
  const dlen = Math.hypot(dx, dy);
  // A chain this short (n<=2, e.g. right after a cut leaves just the anchor
  // + 1 point) has no real local tangent yet -- prev and beforePrev both
  // resolve to the SAME point (pts[n-3] underflows to undefined, falling
  // back to pts[0]), making dx/dy exactly 0. The old `|| 1` fallback only
  // guarded the DIVISOR, not this case, so it silently returned direction
  // (0,0) -- positionGrowingTip() and growRope()'s commit both then placed
  // the new point at EXACTLY prev's position (anchor.x + 0*len = anchor.x),
  // collapsing multiple points onto the same coordinate. integrateChain()'s
  // distance constraint, solving a real segLen against a measured distance
  // of ~0, then produced a correction with an effectively arbitrary
  // direction (0/0.0001-scale noise) -- confirmed via reproduction as the
  // tight knot/tangle right at the anchor reported after cutting the rope
  // very short and then repeatedly growing it. Falls back to straight down
  // (the rope's own authored default direction) whenever there's no real
  // direction to measure yet.
  const raw = dlen < 1e-6 ? { x: 0, y: 1 } : { x: dx / dlen, y: dy / dlen };
  if (!mainRope.growDir){
    mainRope.growDir = { x: raw.x, y: raw.y };
  } else {
    const s = 0.15; // low-pass factor -- low enough to filter single-frame solver noise, high enough to still track real swinging within a few frames
    mainRope.growDir.x += (raw.x - mainRope.growDir.x) * s;
    mainRope.growDir.y += (raw.y - mainRope.growDir.y) * s;
    const glen = Math.hypot(mainRope.growDir.x, mainRope.growDir.y) || 1;
    mainRope.growDir.x /= glen; mainRope.growDir.y /= glen; // re-normalize -- blending two unit vectors doesn't stay unit length
  }
  return { x: mainRope.growDir.x, y: mainRope.growDir.y, prev };
}

// Places the currently-growing tip segment directly, every frame, instead of
// letting it participate in the iterative constraint solve (see
// integrateChain()'s skipLastSegment for why). oldx/oldy are set to match,
// so the tip carries zero implied velocity — it can never accumulate
// momentum of its own, only ever reflecting mainRope.tipGrowLen and the
// settled chain's current direction. A no-op once tipGrowLen has reached a
// full segLen (fully committed, ordinary physics point from here on).
function positionGrowingTip(){
  if (mainRope.tipGrowLen >= mainRope.segLen) return;
  const pts = mainRope.points;
  const dir = tipGrowDirection(pts);
  const tip = pts[pts.length - 1];
  // The tip's position is anchor (dir.prev, a real physics point) PLUS a
  // smoothed OFFSET -- not a smoothed absolute position. mainRope.tipOffset
  // (reset to {0,0} by growRope() every time a new tip is pushed) is what
  // gets smoothed toward the raw target offset below; dir.prev's own
  // CURRENT position is always applied in full, every frame, with no lag.
  // An earlier version smoothed the absolute (dir.prev + offset) position
  // directly, which meant the tip only partially followed dir.prev when
  // dir.prev itself moved -- and dir.prev moves for real reasons every
  // commit frame (it inherits the outgoing segment's velocity, per
  // growRope()'s own comment, then gets constraint-solved against ITS OWN
  // neighbor for the first time as an ordinary point). Confirmed via direct
  // frame-by-frame tracing: at a commit frame with real swing velocity
  // present, dir.prev moved several px while the tip -- still smoothing
  // from its stale pre-move position at a 0.25 factor -- barely followed,
  // leaving the tip's new segment pointing in a near-arbitrary direction
  // (measured up to ~180 degrees off the established growth direction).
  // Because drawEndcap() orients the endcap graphic off exactly this
  // segment's direction (see its own tipDirection() call), that reads as
  // the endcap visibly snapping/spinning at the tip on every commit during
  // real swinging -- reproducing the user's "still extends in a jittery
  // fashion" report, distinct from (and not fixed by) the earlier
  // acceleration-spike fix above, which addressed the tip's ABSOLUTE
  // position/velocity continuity but not this anchor-tracking gap.
  const targetOffX = dir.x * mainRope.tipGrowLen;
  const targetOffY = dir.y * mainRope.tipGrowLen;
  if (!mainRope.tipOffset) mainRope.tipOffset = { x: targetOffX, y: targetOffY };
  //
  // The smoothing factor itself RAMPS UP toward 1 as this segment nears
  // completion (tipGrowLen -> segLen), rather than staying flat at 0.25 the
  // whole time. growRope()'s own commit finalizes the tip at whatever
  // position it's ALREADY at (see that function's comment) instead of
  // snapping it the rest of the way -- a flat 0.25 smoothing factor could
  // still be meaningfully lagging behind the true target right up to the
  // commit instant, leaving each finalized segment measurably short of the
  // real targetSeg; over many commits during a real swinging+growing
  // session that compounded into WORSE overall segment-length stability
  // than before this whole fix (confirmed via direct measurement: max
  // segment-length ratio reached ~3.6x by the end of a 5s test, vs ~1.2x
  // with the ramp below). Ramping smoothing up to 1 by the time
  // tipGrowLen reaches segLen means the tip has essentially already
  // caught up to its target the instant BEFORE commit, so growRope()
  // freezing it there loses none of the segment's real length -- while
  // the EARLY part of the segment's growth still gets the original gentle
  // 0.25 lag, still filtering the single-frame solver noise this smoothing
  // was added for 2 rounds ago.
  const frac = mainRope.tipGrowLen / mainRope.segLen;
  const smoothing = Math.max(0.25, frac);
  mainRope.tipOffset.x += (targetOffX - mainRope.tipOffset.x) * smoothing;
  mainRope.tipOffset.y += (targetOffY - mainRope.tipOffset.y) * smoothing;
  tip.x = dir.prev.x + mainRope.tipOffset.x;
  tip.y = dir.prev.y + mainRope.tipOffset.y;
  tip.oldx = tip.x; tip.oldy = tip.y;
}

// ratePerSecVh: %vh/s override -- defaults to cfg.ropeGrowthRate (the
// manual hold-to-grow rate) so every pre-existing caller is unaffected.
// The startup animation's own 'growing' phase passes its own rate instead
// (constant Startup Extension Speed, or a tweened one -- see
// currentIntroExtendRate()) so its pacing is independently tunable from
// manual hold-to-grow, per explicit request.
function growRope(dtSeconds, ratePerSecVh){
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const rate = ratePerSecVh !== undefined ? ratePerSecVh : cfg.ropeGrowthRate;
  const growth = vh(rate) * dtSeconds;
  // accumulate from the persisted real total (mainRope.totalLength), not
  // re-derived from segLen*pointCount -- segLen is now pinned to a constant
  // (see setMainRopeTotalLength), so that product only changes in whole-point
  // jumps and would silently discard any growth accumulated since the last one.
  mainRope.totalLength += growth;
  // tipGrowLen rises continuously every frame (never in whole-point jumps);
  // positionGrowingTip() (called after integrateChain() in update()) is what
  // actually reveals that as smooth motion. Once it reaches a full targetSeg
  // we commit: fix the just-finished segment at exactly targetSeg (clamping
  // away any single-frame overshoot) and start a fresh, zero-length tip,
  // carrying the overshoot forward into its own tipGrowLen so no
  // accumulated growth is lost. The while loop covers a growth rate high
  // enough to complete more than one segment in a single frame.
  mainRope.tipGrowLen += growth;
  let firstCommitThisFrame = true;
  while (mainRope.tipGrowLen >= targetSeg){
    const pts = mainRope.points;
    const tip = pts[pts.length - 1];
    const prev = pts[pts.length - 2] || pts[0];
    // The newly-finalized point (and the fresh zero-length tip started right
    // after it) inherit prev's CURRENT velocity instead of starting from
    // rest. prev is a real, already-settled physics point that may still
    // carry a small residual velocity (light swinging, or the ordinary
    // frame-to-frame "breathing" of a fixed-iteration-count constraint
    // solver); starting the new point at zero velocity next to a moving
    // neighbor forces the solver to yank it into place over the following
    // few frames, which showed up as a real, measured decaying-oscillation
    // transient in prev's own position every time a segment committed
    // (confirmed via frame-by-frame tracing: prev.y jumped ~2px then settled
    // over ~4-5 frames) -- and since positionGrowingTip() anchors the
    // growing tip directly to prev every frame, that transient was
    // fully visible as tip jitter during extension. Matching the inherited
    // velocity here removes the mismatch the solver was correcting for.
    const vx = prev.x - prev.oldx, vy = prev.y - prev.oldy;
    if (firstCommitThisFrame){
      // Finalize the tip EXACTLY where it already visually is -- its
      // current position, already smoothly interpolated toward the target
      // by positionGrowingTip()'s own deliberate lag (see its comment) --
      // rather than snapping it the rest of the way to the mathematically
      // "complete" targetSeg-away position. The two can genuinely still
      // differ at the exact instant tipGrowLen crosses targetSeg, and
      // closing that gap here in one frame produced a real, measured
      // velocity-discontinuity spike at EVERY commit boundary during
      // simultaneous swinging+growth (confirmed via direct frame-by-frame
      // acceleration tracing: spikes up to ~50px/frame^2 against a
      // ~4px/frame^2 baseline, recurring at almost exactly the commit
      // interval -- reproducing the user's own "still extends in a
      // jittery fashion" report, this time reproduced specifically while
      // mid-swing, independent of the earlier pileRepulsion/floor fix).
      // Leaving tip.x/y untouched avoids the jump entirely; the finalized
      // segment's actual length may fall very slightly short of targetSeg
      // as a result, which the distance constraint gently absorbs over
      // the next few frames instead of reacting to an instant full-length
      // snap.
    } else {
      // A rare multi-commit-in-one-frame burst (a very high growth rate,
      // or an unusually large dt spike) -- this tip was only just created
      // a few lines below, THIS same frame, so it has no meaningfully
      // smoothed history to preserve; give it its full-length position
      // the same way every commit used to, computed fresh from the
      // now-finalized prev.
      const dir = tipGrowDirection(pts);
      tip.x = prev.x + dir.x * targetSeg;
      tip.y = prev.y + dir.y * targetSeg;
    }
    tip.oldx = tip.x - vx; tip.oldy = tip.y - vy;
    pts.push({ x: tip.x, y: tip.y, oldx: tip.x - vx, oldy: tip.y - vy });
    // the new tip starts exactly coincident with its own anchor (the point
    // just pushed from) -- zero offset -- so positionGrowingTip()'s offset
    // smoothing (see its own comment) starts from the correct zero point
    // instead of inheriting whatever offset was accumulating for the
    // segment that just finished.
    mainRope.tipOffset = { x: 0, y: 0 };
    mainRope.tipGrowLen -= targetSeg;
    firstCommitThisFrame = false;
  }
  setCfg('ropeLength', mainRope.totalLength / viewportH() * 100);
}

// power (an absolute vh()-based value, independent of the rope's own
// scale) used to be applied uncapped -- fine for a normal-length rope,
// but for a SHORT rope (small segLen), Click Intensity + Intensity
// Ceiling can produce a displacement several times a single segment's
// own length. Since the falloff spreads a real (if smaller) kick across
// several NEIGHBORING points too, not just the exact hit point, a
// large enough power can fling the tip clean PAST its own neighbor (or
// even the anchor) into an inverted configuration -- confirmed via
// direct frame-by-frame tracing: point0 (the anchor, otherwise excluded
// from the punch directly) got dragged by the distance constraint
// through a wild multi-frame swing past the circle's own center, and
// tipDirection() (which drawEndcap() rotates by) genuinely flipped
// and spun tick to tick during that recovery -- reported as "the dark
// flash near the rope start... occurs when i do a long click and hold
// flick from the bottom". Capping power at a multiple of the rope's own
// segLen keeps a strong punch feeling strong (still several segments'
// worth of kick) while never letting a single application send a point
// past where its own neighbor structurally allows it to go without an
// inverted, chaotically-recovering configuration.
const MAX_PUNCH_SEGMENTS = 4;
function applyPunch(points, hit, clickX, clickY, intensity, pinnedIndex, segLen){
  const dirX = hit.x - clickX, dirY = hit.y - clickY;
  const len = Math.hypot(dirX, dirY) || 1;
  const nx = dirX / len, ny = dirY / len;
  const power = Math.min(vh(1.0) * intensity, segLen * MAX_PUNCH_SEGMENTS);
  for (let i = 0; i < points.length; i++){
    if (i === pinnedIndex) continue;
    const falloff = Math.exp(-Math.pow((i - hit.index) / 3, 2));
    points[i].x += nx * power * falloff;
    points[i].y += ny * power * falloff;
  }
}

const CUT_SWEEP_BASE_SEC = 0.35;

// How long the cut-line sweep mark actually takes to travel across the full
// rope thickness, at the current Cut Speed -- the exact inverse of how
// cutSweep.progress accumulates each frame (`rawDt * cutSpeed /
// CUT_SWEEP_BASE_SEC`), so a full progress 0->1 sweep takes exactly this
// long. The piece being cut off doesn't actually separate until this much
// time has passed (mainRope.pendingCut / piece.pendingCut, set below) --
// replaces the old standalone Fall Delay dev control per explicit request
// ("set the fall delay as the time it takes the cut line to cut through
// the entire rope"), so the pending-separation delay is no longer an
// independently-tunable number that could drift out of sync with what the
// sweep mark is visually showing; it's now definitionally the same value.
function cutThroughDuration(){
  return CUT_SWEEP_BASE_SEC / cfg.cutSpeed;
}

// a perfectly vertical piece has no asymmetry to topple over on -- give it a
// small random initial tilt (around its own top point) so gravity and the
// floor collision naturally fold it into a heap instead of it standing
// there as a rigid straight column. Shared by both cutRopeAt (the piece
// falling off the main rope) and cutPieceAt (a fallen piece split in two).
// preserveTipZeroVelocity: true when points[points.length-1] was mainRope's
// own kinematically-placed growing tip at the moment of this cut (tipGrowLen
// < segLen) -- positionGrowingTip() deliberately keeps that point's
// oldx/oldy identical to its x/y every frame (zero implied velocity, "never
// entering the solver", per that function's own comment), which is NOT a
// real previous-frame position the way every other point's oldx/oldy is.
// The rotation below is only correct for points whose old/new pair both
// describe genuine, same-reference-frame instants; fed a pivot with real
// velocity (pivot.x != pivot.oldx/oldy) and a tip whose "old" was faked
// equal to its "new", it derives an old-state rotation from a DIFFERENT
// reference point (pivot.oldx/oldy) than the new-state rotation (pivot.x/y)
// for the one point that was never supposed to have a "previous state" at
// all -- confirmed by direct simulation: a stationary-old-position tip
// (oldx=x, oldy=y) next to a pivot moving at (5,2)px/frame comes out of a
// ~13-degree topple with a spurious ~1.2px/frame implied velocity, roughly
// 22% of the pivot's own -- for a short, freshly-cut rope (few points, cut
// mid-growth) that tip IS most of the piece's visible extent, so this reads
// exactly as the reported "flung/shoots downward far faster than normal" on
// a piece that was mid-growth the instant it got fully detached. Re-zeroing
// the tip's oldx/oldy AFTER the topple rotation restores the same "just
// created, no velocity yet" invariant positionGrowingTip() already
// guaranteed before this piece was ever toppled -- the piece still gets its
// random tilt (the tip's POSITION is still rotated normally above), only
// its fabricated non-velocity is prevented from leaking a fraction of the
// pivot's real velocity into it.
function topplePiece(points, preserveTipZeroVelocity){
  const angle = (Math.random() - 0.5) * 0.6;
  const pivot = points[0];
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  for (let i = 1; i < points.length; i++){
    const p = points[i];
    // rotate both the current AND old position by the same angle around the
    // same pivot, so the rotation only adds a topple bias — it does NOT
    // zero out whatever velocity the point already had from an in-progress
    // swing (rotating position but resetting oldx/oldy to match would kill
    // that momentum, which is exactly the "shouldn't freeze mid-swing" bug).
    //
    // odx/ody MUST be measured against the pivot's own OLD position
    // (pivot.oldx/oldy), not its current one -- a real bug, found by
    // direct derivation after 2 reported symptoms ("the cut off rope gets
    // flung to the floor, far faster th[a]n the normal falling speed" on
    // a full detach; cut segments "look like theyre floating" once
    // piled) both survived an unrelated fix attempt. Using the pivot's
    // CURRENT position for the OLD relative vector mixes 2 different
    // points in time into one frame of reference: worked through by hand
    // for a pivot moving (0,0)->(5,0) with a point p rigidly co-moving
    // (0,10)->(5,10) -- zero real velocity relative to the pivot -- a 90
    // degree topple then produced an implied velocity of (0,5) for p
    // under the old (buggy) formula, when the only physically consistent
    // answer for a point with no relative motion is to end up moving
    // with the pivot's OWN velocity, (5,0): completely the wrong
    // DIRECTION, not just a wrong magnitude. mainRope's own former
    // anchor -- pivot for a FULL detach specifically, since the entire
    // rope becomes one piece -- is exactly the point most likely to
    // carry real, sometimes-erratic velocity right at the moment of a
    // cut (it's the one point subject to the circle's own boundary-
    // clamp physics), which is why this showed up prominently on full
    // cuts even though the same bug always applied to every piece
    // creation. Fixed by using pivot.oldx/oldy (matching, same-instant
    // reference) for the old-state rotation, exactly mirroring how
    // pivot.x/y (current) is already correctly used for the current-
    // state rotation just below.
    const dx = p.x - pivot.x, dy = p.y - pivot.y;
    const odx = p.oldx - pivot.oldx, ody = p.oldy - pivot.oldy;
    p.x = pivot.x + dx * cosA - dy * sinA;
    p.y = pivot.y + dx * sinA + dy * cosA;
    p.oldx = pivot.oldx + odx * cosA - ody * sinA;
    p.oldy = pivot.oldy + odx * sinA + ody * cosA;
  }
  if (preserveTipZeroVelocity){
    const tip = points[points.length - 1];
    tip.oldx = tip.x; tip.oldy = tip.y;
  }
}

function cutRopeAt(hit, clickX, clickY){
  // a cut is already pending -- the rope hasn't actually separated yet
  // (still counting down toward cutThroughDuration()), so there's nothing
  // new to cut.
  if (mainRope.pendingCut) return;
  const idx = Math.max(1, Math.min(hit.index, mainRope.points.length - 2));
  // refuse the cut entirely if it would leave the remaining (anchor-side)
  // rope shorter than the configured minimum — the rope stays whole rather
  // than being clamped to some other length the user didn't ask for.
  const remainingLen = idx * mainRope.segLen;
  if (remainingLen < vh(cfg.minRopeLength)) return;
  const a = mainRope.points[idx - 1], b = mainRope.points[idx];
  let tx = b.x - a.x, ty = b.y - a.y;
  const tlen = Math.hypot(tx, ty) || 1;
  tx /= tlen; ty /= tlen;
  // perpendicular to the rope's local tangent, oriented so (1,0) is screen-right
  // when the rope hangs straight down (tangent (0,1)) — used to tell which side
  // of the rope the click landed on, so the cut sweep runs the direction the
  // user actually clicked from, not just a fixed screen-left/right assumption.
  const nx = ty, ny = -tx;
  const side = (clickX - hit.x) * nx + (clickY - hit.y) * ny;

  // the cut sweep-mark belongs to the REMAINING rope (still hanging from the
  // circle), not the eventual falling piece -- anchorIndex pins it to idx,
  // which stays the correct edge for the whole time the cut is pending;
  // renderCutSweep tracks it live. A later cut overwrites this outright.
  const half = vmin(cfg.ropeThickness) / 2;
  mainRope.cutSweep = {
    progress: 0,
    anchorIndex: idx,
    startOffset: side > 0 ? half : -half,
    endOffset: side > 0 ? -half : half,
  };
  // Defer the actual separation until the cut-line sweep has fully crossed
  // the rope (cutThroughDuration()) -- the rope stays ONE physics chain
  // (still fully solved by integrateChain, still pinned to the circle)
  // instead of being split immediately into two independently-integrated
  // chains that then have to be kept in sync by rigidly translating the
  // piece to follow the parent's tip. That translate-to-follow approach
  // was an earlier implementation and it produced visible collision/seam
  // artifacts when cut mid-swing -- translating by the shortened parent's
  // tip delta doesn't reproduce what the same point would have done had
  // it stayed part of the original, undivided chain, since a shorter
  // chain swings differently. Keeping it undivided sidesteps the mismatch
  // entirely: nothing to desync because there are no two separate chains
  // yet. idx stays a valid split point even if the rope keeps growing
  // past it while the cut is pending.
  mainRope.pendingCut = { idx, delay: cutThroughDuration() };
}

// Actually separates mainRope at idx into the remaining (anchor-side) rope
// and a new fallen piece -- called immediately from cutRopeAt() when Fall
// Delay is 0, or from update() once a pendingCut's delay has elapsed.
function performMainRopeSplit(idx){
  // captured before mainRope.tipGrowLen is reset below -- see
  // topplePiece()'s own comment: lowerPoints' own last point (mainRope's
  // pre-cut tip) is the kinematically-placed growing tip, not a settled
  // physics point, whenever the cut lands mid-growth.
  const hadPartialTip = mainRope.tipGrowLen < mainRope.segLen;
  const lowerPoints = mainRope.points.slice(idx).map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
  mainRope.points = mainRope.points.slice(0, idx + 1);
  // Zero the remaining chain's own implied velocity right at the split --
  // reported repeatedly, even after 2 rounds of collision-focused fixes:
  // "the big jump after a cut is still occurring." Root cause was never
  // collision at all: every remaining point's oldx/oldy still encodes
  // velocity shaped by carrying the NOW-REMOVED trailing mass/tension a
  // moment ago (an interior point mid-chain is pulled by BOTH neighbors;
  // the instant it becomes the new free tip, the pull from everything
  // that used to hang below it vanishes, but its existing velocity
  // doesn't) -- next frame's verlet step (vx = (x-oldx)*damping) read
  // that stale, no-longer-balanced velocity and kept moving the
  // shortened chain along it with nothing left to counteract, reading as
  // a sudden snap/recoil ("as if having been flicked") that this
  // project's own deliberately low damping (0.986) then let ring out
  // visibly rather than settle quickly. This is real, physically
  // explicable behavior (an actual rope recoils when a weighted trailing
  // section is suddenly released) but not the clean cut this project
  // wants -- zeroing it here makes the remainder start falling fresh
  // from rest instead of carrying forward momentum that was never really
  // its own to begin with. The falling PIECE keeps its own full
  // pre-cut velocity via lowerPoints' oldx/oldy above (untouched) --
  // only the remaining, still-attached side is affected.
  mainRope.points.forEach(p => { p.oldx = p.x; p.oldy = p.y; });
  // keep the persisted real total (and its dev-panel display) in sync with
  // the now-shorter remainder — otherwise the next growRope() call would
  // resume accumulating from the stale PRE-cut total, and separately, the
  // Rope Length slider would still show the old length, so nudging it would
  // jump the rope back out near its pre-cut length instead of adjusting the
  // actual current (cut) one.
  mainRope.totalLength = mainRope.segLen * idx;
  // the remaining tip after a cut is always a full, already-committed
  // segment -- no growth in progress.
  mainRope.tipGrowLen = mainRope.segLen;
  // a cut changes the chain's own local geometry right at the new tip --
  // any smoothed growth direction carried over from BEFORE the cut
  // (tipGrowDirection()) belongs to a now-discarded portion of the rope,
  // so the next hold-to-grow should measure fresh rather than starting
  // biased toward wherever the rope was pointing pre-cut.
  mainRope.growDir = null;
  mainRope.tipOffset = null;
  // mainRope's own tip IS the fresh cut edge now -- start its End Emerge
  // countdown (a no-op read as "fully emerged" wherever End Emerge is
  // off, per emergeFactor()'s own convention).
  mainRope.tipEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
  // Display-only -- see syncControlDisplay()'s own comment. cfg.ropeLength
  // itself stays at the real configured default so a later full detach
  // regrows to that, not to whatever this cut just shortened the rope to.
  syncControlDisplay('ropeLength', mainRope.totalLength / viewportH() * 100);
  if (lowerPoints.length >= 2){
    // Toppling (the initial random tilt) happens exactly at the moment of
    // real separation -- this is the same instant the piece starts
    // actually falling, which is also the only instant toppling makes
    // physical sense (a still-attached piece has no reason to tumble).
    topplePiece(lowerPoints, hadPartialTip);
    // age/baseThickness drive this piece's own independent thickness
    // decay (see pieceThickness()) -- baseThickness captures mainRope's
    // real live thickness AT THE MOMENT of falling (including whatever
    // Detach Thickness Multiplier has already compounded), so a piece
    // that falls off a thickened rope starts decaying from that real
    // thickness, not the plain unmultiplied default.
    const piece = { points: lowerPoints, segLen: mainRope.segLen, tipEmerge: null, age: 0, baseThickness: vmin(cfg.ropeThickness) * ropeThicknessMultiplier };
    // mainRopeExcluded: an absolute, distance-based guarantee that mainRope
    // never collides with the piece it JUST split from -- reported
    // directly, more than once, after time-based grace periods alone kept
    // proving insufficient: "A rope and its endcaps/arch curve caps should
    // NEVER detect or react to collisions with itself." A fixed TIME
    // window (MAIN_COLLISION_GRACE_AGE) can't guarantee real separation --
    // under weak gravity, a heavy endcap, or a slow Rope Fall Speed, the
    // piece may still be genuinely touching mainRope's own tip once that
    // window elapses, and maxPush's own gradual-not-instant correction
    // still reads as a visible jolt even though it's no longer a single-
    // frame snap. This flag instead stays set until the piece's own cut
    // edge has ACTUALLY moved a real distance away from where it was
    // created (checked in pieceCollision()) -- adapting automatically to
    // however fast or slow that separation happens, rather than guessing
    // a duration. mainRopeExcludeOriginX/Y captures that starting point
    // once, right here, at the exact instant of the split.
    piece.mainRopeExcluded = true;
    piece.mainRopeExcludeOriginX = piece.points[0].x;
    piece.mainRopeExcludeOriginY = piece.points[0].y;
    // the new piece's OWN near/cut edge (points[0]) is its own fresh cut
    // edge -- separate End Emerge state from mainRope's tipEmerge above,
    // since it's a different entity's different end.
    piece.cutEdgeEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
    setPieceSpawnGrace(piece);
    fallenPieces.push(piece);
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
}

// Splits an already-fallen piece into two independent pieces at the click
// point — same geometry/toppling as cutRopeAt's own piece split, but with
// no anchor/growth bookkeeping (a fallen piece has neither). The "upper"
// half (index 0..idx) keeps the piece's own identity and cutSweep mark,
// same convention as cutRopeAt's remaining rope keeping mainRope's; the
// "lower" half becomes a brand-new fallen piece with no mark of its own.
function cutPieceAt(pieceIndex, hit, clickX, clickY){
  const piece = fallenPieces[pieceIndex];
  if (!piece || piece.pendingCut) return;
  const idx = Math.max(1, Math.min(hit.index, piece.points.length - 2));
  const upperLen = idx * piece.segLen;
  const lowerLen = (piece.points.length - 1 - idx) * piece.segLen;
  if (upperLen < vh(cfg.minRopeLength) || lowerLen < vh(cfg.minRopeLength)) return;

  const a = piece.points[idx - 1], b = piece.points[idx];
  let tx = b.x - a.x, ty = b.y - a.y;
  const tlen = Math.hypot(tx, ty) || 1;
  tx /= tlen; ty /= tlen;
  const nx = ty, ny = -tx;
  const side = (clickX - hit.x) * nx + (clickY - hit.y) * ny;

  const half = vmin(cfg.ropeThickness) / 2;
  piece.cutSweep = {
    progress: 0,
    anchorIndex: idx,
    startOffset: side > 0 ? half : -half,
    endOffset: side > 0 ? -half : half,
  };
  // See cutRopeAt()'s identical pendingCut comment -- same deferred-split
  // reasoning, just against this piece's own points instead of mainRope's.
  piece.pendingCut = { idx, delay: cutThroughDuration() };
}

// Actually separates `piece` at idx -- see performMainRopeSplit()'s
// identical role for mainRope.
function performPieceSplit(piece, idx){
  const lowerPoints = piece.points.slice(idx).map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
  piece.points = piece.points.slice(0, idx + 1);
  // Zero the remaining half's own implied velocity -- see
  // performMainRopeSplit()'s identical fix/comment for the full
  // recoil-from-lost-trailing-mass reasoning, same mechanism here.
  piece.points.forEach(p => { p.oldx = p.x; p.oldy = p.y; });
  // `piece`'s own tip is now the fresh cut edge -- see
  // performMainRopeSplit()'s identical reasoning.
  piece.tipEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
  if (lowerPoints.length >= 2){
    topplePiece(lowerPoints);
    // The new lower half starts its OWN fresh decay from `piece`'s
    // CURRENT thickness (not the plain default) -- it's splitting off a
    // piece that may already be partway through its own decay, so the
    // split-off half should visually continue from there, not reset to
    // full thickness. `piece` itself (the upper, identity-keeping half)
    // keeps its own existing age/baseThickness untouched -- it's the
    // same continuous piece, just shorter now, so its decay timeline
    // doesn't restart.
    const newPiece = { points: lowerPoints, segLen: piece.segLen, tipEmerge: null, age: 0, baseThickness: pieceThickness(piece) };
    newPiece.cutEdgeEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
    setPieceSpawnGrace(newPiece);
    fallenPieces.push(newPiece);
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
}

/* ---------------------------------------------------------------------
   Input: click(punch) / hold(grow or charge) / double-click(cut).
   Which hold behavior applies depends on WHERE the hold starts:
   - hold starting on the circle -> grows the rope (existing behavior).
   - hold starting on the rope -> charges punch intensity, fired on release
     (Click Hold Max Duration / Intensity Ceiling); a quick tap on the rope
     still goes through the normal punch/double-click-to-cut path below.
   Double-click is hand-rolled (not the native dblclick event) because a
   native click would otherwise fire before a dblclick is recognized —
   the spec requires a double click to never trigger a single click.
--------------------------------------------------------------------- */
let downInfo = null;   // {mode:'circle'} or {mode:'rope', x,y,hit,startTime,charging}
// Rope Attraction: right-click-and-hold reaches mainRope's own tip toward
// the mouse. Kept entirely separate from downInfo/holdTimer (the left-click
// state machine above) rather than a 3rd downInfo.mode -- it's a genuinely
// independent gesture (a different mouse button) with no hold-threshold/
// double-click-arming logic of its own to share, so folding it into that
// state machine would only add unrelated fields to every left-click path.
// mouseX/mouseY track continuously (not just while attracting) since the
// cost of one extra pointermove listener is trivial and it means the very
// first attraction-active frame already has a real, current mouse position
// instead of stale/undefined coordinates from before the right-click.
let ropeAttractionActive = false;
let mouseX = 0, mouseY = 0;
window.addEventListener('pointermove', e => { mouseX = e.clientX; mouseY = e.clientY; });
let holdTimer = null;
let pendingClick = null; // {hit,timer}

// Click diagnostics -- DEV_MODE only. One entry per input-state transition
// (down, hold-eligible, growing, charging, release action), both to the
// console AND to a visible, scrollable log inside the dev panel itself
// (#dpClickLog) -- the console alone isn't visible to a non-technical
// user testing the app, so the panel display is the primary surface this
// was actually requested for.
const CLICK_LOG_MAX_ENTRIES = 200;
function logClick(event, data){
  if (!DEV_MODE) return;
  console.log('[click]', event, data);
  const el = document.getElementById('dpClickLog');
  if (!el) return;
  const empty = el.querySelector('.dp-click-log-empty');
  if (empty) empty.remove();
  const line = document.createElement('div');
  const dataStr = Object.entries(data || {}).map(([k, v]) => k + ':' + (typeof v === 'number' ? round(v, 2) : v)).join(' ');
  line.textContent = event + '  ' + dataStr;
  el.appendChild(line);
  while (el.children.length > CLICK_LOG_MAX_ENTRIES) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

// a generous margin beyond the circle's own visual radius — a small
// circleSize is an easy miss otherwise, and the rope renders on top of
// (visually through) the circle right where it emerges, so a press that's
// "clearly meant for the circle" needs real forgiveness, not pixel-exact
// targeting. Shared by isOnCircle() (hold-to-grow eligibility) and
// cutRopeAt()'s own Circle Cut Distance floor (see that comment) so the
// two can never drift apart -- whatever counts as "on the circle" for
// growing must also always count as "too close to cut."
function circleExclusionRadius(){
  return vmin(cfg.circleSize) / 2 + vmin(4);
}

function isOnCircle(x, y){
  const anchor = circleAnchor();
  return Math.hypot(x - anchor.x, y - anchor.y) <= circleExclusionRadius();
}

function hitTestRope(x, y, maxDist){
  if (maxDist === undefined) maxDist = vmin(cfg.clickDistance);
  if (isOnCircle(x, y)) return null; // clicking the circle itself never counts as a rope hit
  const hit = nearestPointOnRope(x, y, mainRope.points);
  return hit.dist <= maxDist ? hit : null;
}

// Nearest fallen piece within maxDist (defaults to Click Distance), if
// any -- same proximity gate as hitTestRope, checked against every piece
// independently since they're unrelated point chains scattered across the
// floor. maxDist is overridable so double-click-cut resolution can use
// Double Click Distance instead (see hitTestAny).
function hitTestPieces(x, y, maxDist){
  if (maxDist === undefined) maxDist = vmin(cfg.clickDistance);
  let best = null;
  for (let i = 0; i < fallenPieces.length; i++){
    const hit = nearestPointOnRope(x, y, fallenPieces[i].points);
    if (hit.dist <= maxDist && (!best || hit.dist < best.dist)) best = { ...hit, pieceIndex: i };
  }
  return best;
}

// Whichever of the main rope or a fallen piece is closest to (x,y), tagged
// with which one it is -- used both for arming a possible double-click (at
// the default Click Distance, matching the initial tap/hold's own
// proximity gate) and for RESOLVING a completed double-click, where the
// caller passes Double Click Distance explicitly instead -- a separate,
// independently-tunable radius per explicit request ("give me a double
// click distance slider that says how far from the rope a double click
// cut sequence is triggered... so i should have both click and double
// click distance sliders"). Punching/hold-charging stay rope-only
// (unchanged scope) and keep using hitTestRope/nearestPointOnRope
// directly, always at Click Distance.
function hitTestAny(x, y, maxDist){
  if (maxDist === undefined) maxDist = vmin(cfg.clickDistance);
  const ropeHit = hitTestRope(x, y, maxDist);
  const pieceHit = hitTestPieces(x, y, maxDist);
  if (ropeHit && (!pieceHit || ropeHit.dist <= pieceHit.dist)) return { ...ropeHit, target: 'rope' };
  if (pieceHit) return { ...pieceHit, target: 'piece' };
  return null;
}

function onPointerDown(e){
  // Rope Attraction (right-click-and-hold): checked first and unconditionally
  // returns, same reasoning as the FLICK check just below -- a different
  // mouse button is an entirely separate gesture that should never also
  // fall through into the left-click rope/circle logic. Gated on
  // introPhase === 'done' since there's no mainRope tip to reach for
  // otherwise (mirrors the circle-hold-to-grow branch's own gating further
  // down, for the same reason).
  if (e.button === 2){
    if (introPhase === 'done'){
      ropeAttractionActive = true;
      // Max Reach Distance is measured from the endcap's OWN position at
      // the moment the hold starts, not from the anchor -- captured once
      // here and held fixed for the whole hold (a fresh capture on every
      // new press), per explicit request/clarification. Previously
      // measured from the anchor, which conflated "how far can it reach"
      // with "how far down the rope already hangs before any reach even
      // starts."
      const tip = mainRope.points[mainRope.points.length - 1];
      mainRope.attractionOriginX = tip.x;
      mainRope.attractionOriginY = tip.y;
      logClick('down:rope-attraction', { x: e.clientX, y: e.clientY });
    }
    return;
  }
  // FLICK animations 1 and 2: both rest on frame 1 until clicked directly
  // on their own graphic, per explicit request -- checked first and
  // return immediately so a click here never also reaches the rope/circle
  // hit-testing below. Independent of introPhase -- there's no reason a
  // startup-animation-only gate should also apply to an unrelated overlay
  // graphic. Checked in on-screen z-order (2 drawn last/on top -- see
  // render() -- so 2 is checked first) in case their rects ever overlap.
  // A press while that animation is ALREADY playing is ignored (not
  // reset into holding) -- previously every press unconditionally
  // re-entered holding mode, which on release restarted flickAnimTime at
  // 0 regardless of how far the current sequence had already gotten.
  // Reported as "it seems to run through a couple of frames, and then
  // click, it runs more frames, and the next click, more frames...
  // sixth or seventh click, does it run through the entire sequence" --
  // confirmed via direct simulation of repeated quick clicks a few
  // frames apart: flickAnimTime reset to exactly 0 every single click,
  // capping progress at whatever the gap to the NEXT click happened to
  // allow (a few frames' worth each time) rather than ever reaching the
  // full sequence, unless one particular gap happened to be long enough
  // to finish uninterrupted -- exactly the "random click count before it
  // finally completes" pattern reported. Now a press during an
  // already-in-progress sequence simply does nothing, letting it finish
  // on its own; a new press only starts holding once that animation is
  // idle again.
  if (isPointInFlick3(e.clientX, e.clientY)){
    if (!flick3Playing){
      holdingFlick = 3; flickHoldTime = 0; flickHoldCyclePos = 0;
      logClick('down:flick3', { x: e.clientX, y: e.clientY });
    } else {
      logClick('down:flick3-ignored-playing', { x: e.clientX, y: e.clientY });
    }
    return;
  }
  if (isPointInFlick2(e.clientX, e.clientY)){
    if (!flick2Playing){
      holdingFlick = 2; flickHoldTime = 0; flickHoldCyclePos = 0;
      logClick('down:flick2', { x: e.clientX, y: e.clientY });
    } else {
      logClick('down:flick2-ignored-playing', { x: e.clientX, y: e.clientY });
    }
    return;
  }
  if (isPointInFlick(e.clientX, e.clientY)){
    if (!flickPlaying){
      holdingFlick = 1; flickHoldTime = 0; flickHoldCyclePos = 0;
      logClick('down:flick', { x: e.clientX, y: e.clientY });
    } else {
      logClick('down:flick-ignored-playing', { x: e.clientX, y: e.clientY });
    }
    return;
  }
  // No interaction while there's no real interactive rope yet
  // (waiting/rising/pausing -- only bgRope's own background climb is on
  // screen). Once mainRope has actually spawned and is mid-scripted-
  // growth ('growing'), cutting IS now allowed -- per explicit request
  // ("I should be able to cut/fully cut the main rope at any time,
  // assuming the rope is longer than the minimum rope length"), gated
  // the same way an ordinary cut always has been (cutRopeAt()'s own
  // Minimum Rope Length check, unchanged). The circle branch just below
  // is still skipped during 'growing' -- see its own guard -- since that
  // branch's hold-to-grow/full-detach mechanics both touch the SAME
  // `growing` flag the intro's own scripted extension is actively
  // driving; a plain click during 'growing' falls through to the
  // ordinary rope hit-test below instead, which is all a cut needs.
  if (introPhase !== 'done' && introPhase !== 'growing') return;
  const x = e.clientX, y = e.clientY;
  // defensive: a pointerdown that never reaches onPointerUp/pointercancel
  // (dropped event, capture stolen by another element, etc.) would otherwise
  // leave its holdTimer's reference overwritten but the timer itself still
  // pending — it would later fire against a LATER click's downInfo and mark
  // that later click as a false hold, silently swallowing it. Clearing here
  // guarantees at most one holdTimer is ever live at a time.
  clearTimeout(holdTimer);

  // introPhase === 'done' required here (not just isOnCircle) -- during
  // 'growing' the circle-press path below would either fight the intro's
  // own scripted extension for the `growing` flag (hold-to-grow) or
  // trigger a full detach mid-detach-triggered-regrowth (double-click),
  // neither of which this round's "allow cutting during growth" request
  // asked for. A press over the circle during 'growing' falls through to
  // the ordinary rope hit-test below instead.
  if (introPhase === 'done' && isOnCircle(x, y)){
    downInfo = { mode: 'circle' };
    logClick('down:circle', { x, y });
    holdTimer = setTimeout(() => {
      if (!downInfo || downInfo.mode !== 'circle') return;
      growing = true;
      logClick('hold:grow-start', { x, y });
    }, HOLD_THRESHOLD_MS);
    return;
  }

  // hold-to-charge isn't limited by Click Distance — you can press down
  // anywhere and the hold still charges, aimed at whatever the nearest rope
  // point turns out to be. Only a QUICK tap (below) still needs real
  // proximity, since that's what targets a specific punch/cut point.
  const hit = nearestPointOnRope(x, y, mainRope.points);
  // startedInCircle: true only for a press that landed inside the circle
  // but fell through to here anyway (introPhase !== 'done', per the
  // guard above) rather than taking the dedicated circle branch. Used
  // below to suppress charging for exactly this case -- reported
  // directly: "if i click and hold in the circle... when i let go, the
  // rope acts as if i had done a regular click and hold Flick. It
  // shouldnt. Whenever click and hold is initiated within the circle, no
  // Flick sequeuce should ever follow." Without this, a hold started in
  // the circle during 'growing' had no dedicated handling at all (the
  // circle branch is skipped there) and fell all the way through to the
  // ordinary rope hold-to-charge-punch path, so releasing it fired a full
  // charged punch the user never intended as a rope interaction -- they
  // were pressing the CIRCLE, same gesture that means "grow" once
  // introPhase reaches 'done'.
  const startedInCircle = isOnCircle(x, y);
  downInfo = { mode: 'rope', x, y, hit, startTime: performance.now(), charging: false, startedInCircle };
  logClick('down:rope', { x, y, hitDist: hit.dist, hitIndex: hit.index, startedInCircle });
  // Charging only becomes eligible after a FULL doubleClickThreshold of
  // holding, not the short HOLD_THRESHOLD_MS — this is what keeps it from
  // ever hijacking a real double-click. Provably safe, not just empirically:
  // if this release's own press duration already exceeds doubleClickThreshold,
  // the gap from the FIRST click's release (which is earlier still) must
  // exceed doubleClickThreshold too, so it could never have passed the
