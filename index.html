<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dicko Clicko</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#000; }
  #scene { position:fixed; inset:0; display:block; touch-action:none; }

  #devPanel {
    position:fixed; top:10px; right:10px;
    width:min(320px, calc(100vw - 20px));
    max-height:88vh;
    /* min-width/min-height are NOT set here -- they depend on the header's
       own rendered content (title font size is itself a dev-panel setting),
       so a static CSS number would drift out of sync with the JS-computed
       floor the same way max-height almost did; computeMinPanelSize()
       applies them via style.minWidth/minHeight instead, as the one source
       of truth the resize-drag math also reads from directly. */
    background:var(--dp-bg, rgba(18,18,26,0.94)); color:var(--dp-text-color, #c9c9d8);
    font:var(--dp-body-size, 12px)/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    border:1px solid #3a3a4a; border-radius:8px;
    z-index:9999; user-select:none;
    box-shadow:0 6px 24px rgba(0,0,0,0.5);
    display:flex; flex-direction:column;
  }
  #devPanel.hidden { display:none; }
  #devPanel.dp-collapsed .dp-body,
  #devPanel.dp-collapsed .dp-resize { display:none; }
  .dp-header {
    padding:8px 10px; font-weight:600;
    background:#25253a; border-radius:8px 8px 0 0;
    cursor:grab; touch-action:none;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    flex:0 0 auto;
  }
  .dp-header:active { cursor:grabbing; }
  .dp-title { letter-spacing:.06em; font-size:var(--dp-title-size, 13px); color:var(--dp-title-color, #e8e8f0); }
  #dpFps { flex:1 1 auto; opacity:.6; font-weight:400; font-size:10px; }
  .dp-icon-btn {
    flex:0 0 auto; width:18px; height:18px; line-height:16px; text-align:center;
    background:#3a3a4a; color:#e8e8f0; border:none; border-radius:3px;
    cursor:pointer; font-size:12px; padding:0;
  }
  .dp-body { padding:4px 8px 10px; overflow-y:auto; flex:1 1 auto; min-height:0; }
  .dp-actions { display:flex; gap:6px; padding:2px 2px 8px; }
  .dp-actions button {
    flex:1 1 auto; background:#3a3a4a; color:#e8e8f0; border:none; border-radius:4px;
    padding:5px 4px; font-size:11px; cursor:pointer;
  }
  .dp-actions button:active { background:#4a4a5e; }
  .dp-tabs { display:flex; gap:4px; padding:6px 2px 0; }
  .dp-tab-btn {
    flex:1 1 auto; background:#25253a; color:#9a9ab0; border:none; border-radius:4px;
    padding:5px 4px; font-size:var(--dp-tab-size, 11px); cursor:pointer;
  }
  .dp-tab-btn.active { background:#3a3a4a; color:#e8e8f0; font-weight:600; }
  .dp-group { border-top:1px solid #33333f; }
  .dp-group:first-child { border-top:none; }
  .dp-group.dp-dragging, .dp-row.dp-dragging { opacity:.4; }
  .dp-group-header {
    padding:7px 2px; font-weight:600; font-size:var(--dp-group-size, 11px); letter-spacing:.04em;
    color:var(--dp-text-color, #c9c9d8); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .dp-group-header .arrow { transition:transform .15s; font-size:9px; }
  .dp-group.collapsed .arrow { transform:rotate(-90deg); }
  .dp-group.collapsed .dp-group-body { display:none; }
  .dp-drag-handle {
    flex:0 0 auto; cursor:grab; color:#666; touch-action:none; padding:0 2px;
  }
  .dp-drag-handle:active { cursor:grabbing; }
  /* wrap, not clip: when the panel is resized narrow enough that a row's
     control (slider/color-picker/dropdown/gradient) no longer fits next
     to its label, it drops to its own line beneath the label instead of
     overflowing/getting cut off -- reported directly. */
  .dp-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:3px 2px; }
  .dp-row label { flex:0 0 auto; width:112px; font-size:var(--dp-label-size, 11px); color:var(--dp-text-color, #c9c9d8); }
  .dp-row input[type=range] { flex:1 1 auto; min-width:0; accent-color:#7d8cff; }
  .dp-num {
    flex:0 0 auto; width:52px; text-align:right; font-size:11px;
    background:#0f0f18; color:#e8e8f0; border:1px solid #3a3a4a; border-radius:4px;
    padding:2px 4px;
  }
  .dp-row input[type=color] {
    width:40px; height:22px; border:1px solid #3a3a4a; border-radius:4px; background:none; padding:0;
  }
  .dp-row input[type=checkbox] { width:16px; height:16px; }
  /* Copy/Paste a color between any two color pickers in the panel --
     shared copiedColorValue, see its own comment. */
  .dp-color-copy, .dp-color-paste {
    flex:0 0 auto; width:20px; height:20px; line-height:18px; padding:0;
    font-size:10px; font-weight:600; text-align:center;
    background:#0f0f18; color:#c9c9d8; border:1px solid #3a3a4a; border-radius:4px;
    cursor:pointer;
  }
  .dp-color-copy:hover, .dp-color-paste:hover { background:#1c1c2c; color:#e8e8f0; }
  .dp-dropdown {
    flex:1 1 auto; min-width:0; font-size:11px;
    background:#0f0f18; color:#e8e8f0; border:1px solid #3a3a4a; border-radius:4px;
    padding:2px 4px;
  }
  .dp-gradient { flex:1 1 auto; min-width:80px; position:relative; }
  .dp-gradient-bar {
    position:relative; height:22px; border:1px solid #3a3a4a; border-radius:4px;
    /* a faint checkerboard shows through before any stops exist */
    background-image: linear-gradient(45deg, #2a2a36 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a36 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a36 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a36 75%);
    background-size:8px 8px; background-position:0 0, 0 4px, 4px -4px, -4px 0px;
    cursor:copy; touch-action:none;
  }
  .dp-gradient-marker {
    position:absolute; bottom:-1px; width:12px; height:14px; transform:translateX(-50%);
    cursor:grab; touch-action:none;
  }
  .dp-gradient-marker::before {
    content:''; position:absolute; left:0; right:0; top:2px; bottom:0;
    background:var(--marker-color, #fff); border:1px solid #12121e; border-radius:2px;
  }
  .dp-gradient-marker::after {
    content:''; position:absolute; left:50%; top:0; transform:translateX(-50%);
    border-left:5px solid transparent; border-right:5px solid transparent;
    border-bottom:4px solid #e8e8f0;
  }
  .dp-gradient-marker:active { cursor:grabbing; }
  .dp-gradient-color-input {
    position:absolute; bottom:-14px; transform:translateX(-50%);
    width:1px; height:1px; padding:0; border:0; opacity:0; pointer-events:none;
  }
  .dp-click-log-wrap { border-top:1px solid #33333f; margin-top:4px; }
  .dp-click-log-header {
    padding:7px 2px; display:flex; align-items:center; justify-content:space-between;
    font-weight:600; font-size:var(--dp-group-size, 11px); letter-spacing:.04em;
    color:var(--dp-text-color, #c9c9d8);
  }
  .dp-click-log-header button {
    background:#3a3a4a; color:#e8e8f0; border:none; border-radius:4px;
    padding:2px 8px; font-size:10px; cursor:pointer;
  }
  .dp-click-log {
    height:110px; overflow-y:auto; background:#0f0f18; border:1px solid #3a3a4a;
    border-radius:4px; padding:4px 6px; font:10px/1.5 ui-monospace, Consolas, monospace;
    color:#9a9ab0; white-space:pre-wrap; word-break:break-all;
  }
  .dp-click-log .dp-click-log-empty { opacity:.5; }

  /* Missing touch-action:none was the one real gap here -- every other
     draggable handle in this panel (.dp-drag-handle, the group drag
     handle, the gradient marker, etc.) already has it. Without it, a
     real finger-drag starting on a resize handle can get hijacked by
     the browser's own native scroll/pan gesture recognition before JS
     ever sees a clean pointermove sequence -- desktop mouse drags are
     unaffected (no native touch-gesture layer to compete with), and
     synthetic PointerEvents dispatched directly in JS bypass this
     entirely too, which is why this doesn't show up in code-level
     testing -- only a REAL touch-drag on an actual mobile viewport
     exposes it. Reported as "the panel resizing in mobile is still
     buggy". */
  .dp-resize { position:absolute; z-index:10; touch-action:none; }
  .dp-resize-n, .dp-resize-s { left:8px; right:8px; height:8px; cursor:ns-resize; }
  .dp-resize-n { top:-4px; } .dp-resize-s { bottom:-4px; }
  .dp-resize-e, .dp-resize-w { top:8px; bottom:8px; width:8px; cursor:ew-resize; }
  .dp-resize-e { right:-4px; } .dp-resize-w { left:-4px; }
  .dp-resize-ne, .dp-resize-nw, .dp-resize-se, .dp-resize-sw { width:14px; height:14px; }
  .dp-resize-ne { top:-4px; right:-4px; cursor:nesw-resize; }
  .dp-resize-nw { top:-4px; left:-4px; cursor:nwse-resize; }
  .dp-resize-se { bottom:-4px; right:-4px; cursor:nwse-resize; }
  .dp-resize-sw { bottom:-4px; left:-4px; cursor:nesw-resize; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="devPanel" class="hidden">
  <div class="dp-header" id="dpHeader">
    <span class="dp-title">DEV</span>
    <span id="dpFps">--fps</span>
    <button type="button" class="dp-icon-btn" id="dpCollapseBtn" title="Collapse">–</button>
  </div>
  <div class="dp-body" id="dpBody">
    <div class="dp-tabs" id="dpTabs">
      <button type="button" class="dp-tab-btn" data-tab="desktop">Desktop</button>
      <button type="button" class="dp-tab-btn" data-tab="mobile">Mobile</button>
    </div>
    <div class="dp-actions">
      <button type="button" id="dpCopyBtn">Copy</button>
      <button type="button" id="dpSaveBtn">Save</button>
      <button type="button" id="dpResetBtn">Reset</button>
    </div>
    <div id="dpGroups"></div>
    <div class="dp-click-log-wrap">
      <div class="dp-click-log-header">
        <span>CLICK LOG</span>
        <button type="button" id="dpClickLogClear">Clear</button>
      </div>
      <div id="dpClickLog" class="dp-click-log"><span class="dp-click-log-empty">(no clicks yet)</span></div>
    </div>
  </div>
  <div class="dp-resize dp-resize-n" data-dir="n"></div>
  <div class="dp-resize dp-resize-s" data-dir="s"></div>
  <div class="dp-resize dp-resize-e" data-dir="e"></div>
  <div class="dp-resize dp-resize-w" data-dir="w"></div>
  <div class="dp-resize dp-resize-ne" data-dir="ne"></div>
  <div class="dp-resize dp-resize-nw" data-dir="nw"></div>
  <div class="dp-resize dp-resize-se" data-dir="se"></div>
  <div class="dp-resize dp-resize-sw" data-dir="sw"></div>
</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------------
   Dev mode gating: local file, localhost, or ?dev=1
--------------------------------------------------------------------- */
const DEV_MODE = (
  location.protocol === 'file:' ||
  location.hostname === 'localhost' ||
  location.hostname === '127.0.0.1' ||
  new URLSearchParams(location.search).get('dev') === '1'
);

/* ---------------------------------------------------------------------
   Dev-panel control config. Every *DEV* from the spec is one entry here.
   unit '%vw'/'%vh'/'%vmin' = percent of that viewport dimension.
   unit 'x' = dimensionless multiplier. unit 'ms' = milliseconds.
   Every X/Y position pair (e.g. circleX/circleY) shares one global origin:
   (0,0) = top-left of the viewport, 100 = full width (X, %vw) / full height
   (Y, %vh) -- the same scheme vw()/vh() already use. Any new position
   slider must follow this exact scheme so raw values copy/paste directly
   between X sliders (and between Y sliders) and land on the same point.
--------------------------------------------------------------------- */
const DEV_GROUPS = [
  { title:'UI', controls:[
    { key:'backgroundColor', label:'Background Color', type:'color', def:'#252546' },
  ]},
  { title:'CIRCLE', controls:[
    { key:'circleSize',  label:'Circle Size',   type:'slider', unit:'%vmin', min:1,   max:30,  step:0.5, def:21.5 },
    { key:'circleX',     label:'Circle X Pos',  type:'slider', unit:'%vw',   min:0,   max:100, step:1,   def:50 },
    { key:'circleY',     label:'Circle Y Pos',  type:'slider', unit:'%vh',   min:0,   max:100, step:1,   def:18 },
    { key:'circleColor', label:'Circle Color',  type:'color',  def:'#111023' },
  ]},
  { title:'ANCHOR PHYSICS', controls:[
    { key:'circleBoundaryOffset', label:'Circle Offset', type:'slider', unit:'%vmin', min:-10, max:10, step:0.5, def:-2 },
    { key:'anchorWeight', label:'Rope Start Weight', type:'slider', unit:'x', min:0, max:5, step:0.1, def:0.4 },
  ]},
  { title:'ROPE', controls:[
    { key:'endcapDesign',   label:'Endcap Design',     type:'dropdown', def:'form1-01',
      options:[
        { value:'none', label:'None (plain round cap)' },
        { value:'form1-01', label:'Form 1 - 01' },
        { value:'form1-02', label:'Form 1 - 02' },
        { value:'form1-03', label:'Form 1 - 03' },
        { value:'form1-04', label:'Form 1 - 04' },
        { value:'form1-05', label:'Form 1 - 05' },
        { value:'form1-06', label:'Form 1 - 06' },
        { value:'form1-15', label:'Form 1 - 15' },
        { value:'form1-c', label:'Form 1 - C' },
        { value:'form2-07', label:'Form 2 - 07' },
        { value:'form2-08', label:'Form 2 - 08' },
        { value:'form2-09', label:'Form 2 - 09' },
        { value:'form2-10', label:'Form 2 - 10' },
        { value:'form2-11', label:'Form 2 - 11' },
        { value:'form2-16', label:'Form 2 - 16' },
        { value:'form2-c', label:'Form 2 - C' },
        { value:'form3-01', label:'Form 3 - 01' },
        { value:'form3-02', label:'Form 3 - 02' },
        { value:'form4', label:'Form 4' },
        { value:'form5', label:'Form 5' },
        { value:'form6', label:'Form 6' },
        { value:'form7', label:'Form 7' },
        { value:'form8', label:'Form 8' },
        { value:'form9', label:'Form 9' },
      ] },
    { key:'endcapHeight',   label:'Endcap Height',     type:'slider', unit:'x', min:0.2, max:3, step:0.05, def:1.45 },
    { key:'tipSegmentShapeEnabled', label:'Tip Segment Shape', type:'checkbox', def:false },
    { key:'ropeThickness',  label:'Rope Thickness',    type:'slider', unit:'%vmin', min:0.1, max:10, step:0.1, def:10 },
    { key:'ropeLength',     label:'Rope Length',       type:'slider', unit:'%vh',   min:3,   max:120.19262130177428, step:1, def:3.4615384615384612,
      // Skipped while the startup animation is actively managing mainRope's
      // own length (introPhase !== 'done') -- otherwise resetSettings()
      // loading a saved Rope Length (applyValues() calls onChange the same
      // as a real slider drag) silently snapped mainRope to full length
      // during 'waiting', long before the animation's own 'growing' phase
      // ever ran -- a real, previously-undiagnosed bug that made the
      // "grow from nothing" effect never actually visible whenever a
      // saved Rope Length loaded successfully (the normal/common case).
      // The intro sequence reads its own spawn target (Default Rope
      // Length, cfg.ropeDefaultLength -- see that control's own comment)
      // fresh at the exact moment it needs to (updateIntro()'s
      // 'pausing'->'growing' transition), so skipping THIS control's
      // resize doesn't lose anything -- once introPhase reaches 'done' a
      // real slider drag/reload behaves exactly as before.
      onChange: v => { if (mainRope && introPhase === 'done') setMainRopeTotalLength(vh(v)); } },
    // Separate from Rope Length above, per explicit request ("Default
    // rope length and 'current' rope length needs to be 2 different
    // figures. When i fully cut a rope, the new rope should be the
    // default length not the new current length"). Rope Length (above)
    // is a LIVE control -- it tracks and can directly resize the rope
    // that exists RIGHT NOW (via hold-to-grow, a direct slider drag, or
    // a cut's own display-only sync -- see syncControlDisplay()'s
    // comment). This one is read ONLY at the moment a fresh rope is
    // actually spawned (initial boot, and every full detach/respawn via
    // detachEntireRopeAndRestartIntro()) and is never overwritten by
    // anything that happens to the live rope afterward -- see
    // resetMainRope()/resetBgRope()/updateIntro()'s own call sites.
    // Same range/default as Rope Length for continuity with this
    // project's existing configured default.
    { key:'ropeDefaultLength', label:'Default Rope Length', type:'slider', unit:'%vh', min:3, max:120.19262130177428, step:1, def:3.4615384615384612 },
    { key:'ropeColor',      label:'Rope Color',        type:'color',  def:'#a5815f' },
    { key:'ropeGradientEnabled', label:'Rope Gradient Enabled', type:'checkbox', def:false },
    // Each stop is { pos: 0-1, color: hex } -- position along the gradient
    // is independently draggable per stop (NOT evenly spaced), per
    // explicit request ("I want to be able to slide the sliders to
    // determine where a gradient color kicks in"). See buildRow()'s
    // 'gradient' case for the actual editor UI.
    { key:'ropeGradientColors',  label:'Rope Gradient Colors',  type:'gradient', def:[{pos:0, color:'#a5815f'}, {pos:1, color:'#3d2817'}] },
    // A separate, independent gradient for FALLEN PIECES (cut-off rope
    // segments) only -- per explicit request ("give me a gradient
    // slider that is for the cut segments of rope"), same split-gradient
    // pattern as Endcap Gradient/Rope End Arc Gradient's own earlier
    // splits from Rope Gradient. Previously every fallen piece reused
    // Rope Gradient (still-attached mainRope's own setting), so a piece
    // couldn't have a different gradient than the rope it fell from.
    // Recomputed per piece each frame from its OWN current points span,
    // same convention Rope Gradient's own per-piece retention already
    // uses (see ropeStrokeColor()'s call sites in render()).
    { key:'pieceGradientEnabled', label:'Piece Gradient Enabled', type:'checkbox', def:false },
    { key:'pieceGradientColors',  label:'Piece Gradient Colors',  type:'gradient', def:[{pos:0, color:'#a5815f'}, {pos:1, color:'#3d2817'}] },
    // A separate, independent gradient for the ENDCAP graphic only -- per
    // explicit request ("leave the current slider for the rope only. and
    // give me the same slider but the endcaps"). Previously the endcap
    // reused the ROPE's own gradient (via mainGradientInfo) so the two
    // were forced to match ("one consistent gradient" was the earlier
    // explicit request that produced that -- since superseded by this
    // one asking for independent control instead). Applies to mainRope's
    // own endcap AND every fallen piece's endcap (see render()).
    { key:'endcapGradientEnabled', label:'Endcap Gradient Enabled', type:'checkbox', def:false },
    { key:'endcapGradientColors',  label:'Endcap Gradient Colors',  type:'gradient', def:[{pos:0, color:'#a5815f'}, {pos:1, color:'#3d2817'}] },
    { key:'bgRopeGradientEnabled', label:'Background Rope Gradient Enabled', type:'checkbox', def:false },
    { key:'bgRopeGradientColors',  label:'Background Rope Gradient Colors',  type:'gradient', def:[{pos:0, color:'#a5815f'}, {pos:1, color:'#3d2817'}] },
    { key:'ropeEndCurveArc',label:'Rope End Curve Arc',type:'slider', unit:'x',     min:0,   max:3,  step:0.1, def:1 },
    { key:'ropeTopCurveArc',label:'Rope Top Curve Arch',type:'slider', unit:'x',    min:0,   max:3,  step:0.1, def:0.8 },
    // A separate, independent gradient for the plain round-cap end/start
    // ARC (drawEndArc()) only -- per explicit request ("provide me a
    // slider to set the gradent of the rope end/start arch curved
    // endcap"), same pattern as Endcap Gradient's own split from Rope
    // Gradient above. Local to the arc's own small protrusion (base ->
    // outward tip), not the whole rope's world-space span -- same
    // reasoning as Endcap Gradient's own local-vs-world fix (see that
    // control's render()-side comment): a small end feature mapped
    // against the whole rope's own anchor-to-tip gradient would clamp to
    // nearly one constant color. Applies everywhere drawRopeEndArcs() is
    // called -- mainRope, every fallen piece's tip/cut edge, and bgRope.
    { key:'arcGradientEnabled', label:'Rope End Arc Gradient Enabled', type:'checkbox', def:false },
    { key:'arcGradientColors',  label:'Rope End Arc Gradient Colors',  type:'gradient', def:[{pos:0, color:'#a5815f'}, {pos:1, color:'#3d2817'}] },
    // Was a hardcoded constant (ARC_SEAM_OVERLAP_PX, see drawEndArc()'s
    // own comment) closing an anti-aliasing seam between the arc and the
    // rope body -- exposed as a slider per explicit follow-up request,
    // after 2 rounds of manually editing the constant and re-pushing
    // (1.5 -> 4 -> 2.5) to find a value that visually closed the seam.
    { key:'arcSeamOverlapPx', label:'Rope End Arc Seam Overlap', type:'slider', unit:'px', min:0, max:5, step:0.1, def:3 },
  ]},
  { title:'CLICK', controls:[
    { key:'clickIntensity', label:'Click Intensity', type:'slider', unit:'x',     min:0,   max:5,  step:0.1, def:1.1 },
    { key:'holdDistance',   label:'Click And Hold Distance', type:'slider', unit:'%vmin', min:1, max:40, step:0.5, def:22 },
  ]},
  { title:'ROPE ANIMATION', controls:[
    { key:'bendStiffness',   label:'Bend Stiffness',       type:'slider', unit:'x', min:0,   max:1, step:0.01, def:0 },
    { key:'ropeAnimSpeed',   label:'Rope Animation Speed', type:'slider', unit:'x', min:0.1, max:3, step:0.1, def:1.2 },
    { key:'gravityStrength', label:'Gravity Strength',     type:'slider', unit:'x', min:0,   max:5, step:0.1, def:4.6 },
    { key:'damping',            label:'Damping',              type:'slider', unit:'x', min:0.8, max:0.999, step:0.001, def:0.984 },
    { key:'constraintIterations', label:'Constraint Iterations', type:'slider', unit:'x', min:1, max:20, step:1, def:1 },
  ]},
  { title:'ROPE GROWTH', controls:[
    { key:'ropeGrowthRate', label:'Rope Growth Rate', type:'slider', unit:'%vh/s', min:1, max:100, step:1, def:12 },
    { key:'clickHoldMaxDuration', label:'Click Hold Max Duration', type:'slider', unit:'ms', min:200, max:3000, step:50, def:800 },
    { key:'intensityCeiling',     label:'Intensity Ceiling',       type:'slider', unit:'x',  min:0.5, max:10,  step:0.1, def:10 },
  ]},
  { title:'ROPE CUT', controls:[
    { key:'minRopeLength',   label:'Minimum Rope Length', type:'slider', unit:'%vh', min:0.1, max:15, step:0.1, def:0.5 },
    { key:'clickDistance',  label:'Click Distance',  type:'slider', unit:'%vmin', min:0.5, max:15, step:0.1, def:11.4 },
    { key:'doubleClickDistance', label:'Double Click Distance', type:'slider', unit:'%vmin', min:0.5, max:15, step:0.1, def:11.4 },
    { key:'doubleClickThreshold', label:'Double Click Threshold', type:'slider', unit:'ms', min:100, max:1000, step:10, def:180 },
    { key:'ropeFallSpeed',   label:'Rope Fall Speed',  type:'slider',   unit:'x',   min:0.1, max:5, step:0.1, def:1 },
    { key:'cutSpeed',        label:'Cut Speed',        type:'slider',   unit:'x',   min:0.2, max:5, step:0.1, def:1.6 },
    { key:'endcapAtCutEnd',  label:'Endcap At Cut End', type:'checkbox', def:true },

const cfg = {};
// Array-valued defaults (gradient controls) are cloned, not aliased --
// otherwise a live edit to cfg[key] (e.g. changing one gradient swatch)
// would mutate the DEV_GROUPS control's own `def` array in place, so
// every future reset/reload would silently inherit whatever the LAST
// live edit happened to leave behind instead of the real default.
// A DEEP clone -- gradient stops are themselves objects ({pos, color}),
// so a shallow [...arr] copy would still share those inner objects with
// the DEV_GROUPS default, and dragging a stop's position or picking its
// color would mutate the shared default in place, same bug the shallow
// clone above was already written to avoid for the array itself.
DEV_GROUPS.forEach(g => g.controls.forEach(c => cfg[c.key] = Array.isArray(c.def) ? c.def.map(v => (v && typeof v === 'object') ? { ...v } : v) : c.def));

function hexToRgba(hex, alpha){
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function applyPanelStyle(){
  const panel = document.getElementById('devPanel');
  panel.style.setProperty('--dp-title-size', panelStyle.titleFontSize + 'px');
  panel.style.setProperty('--dp-tab-size', panelStyle.tabFontSize + 'px');
  panel.style.setProperty('--dp-group-size', panelStyle.groupFontSize + 'px');
  panel.style.setProperty('--dp-label-size', panelStyle.labelFontSize + 'px');
  panel.style.setProperty('--dp-body-size', panelStyle.bodyFontSize + 'px');
  panel.style.setProperty('--dp-bg', hexToRgba(panelStyle.bgColor, panelStyle.opacity));
  panel.style.setProperty('--dp-title-color', panelStyle.titleColor);
  panel.style.setProperty('--dp-text-color', panelStyle.textColor);
}

const panelStyleNumEls = {};
function buildPanelStyleGroup(){
  const g = document.createElement('div');
  g.className = 'dp-group';
  g.dataset.key = 'DEV PANEL';
  const h = document.createElement('div');
  h.className = 'dp-group-header';
  h.innerHTML = '<span class="dp-drag-handle">⠿</span><span class="arrow">▼</span><span>Dev Panel</span>';
  const gb = document.createElement('div');
  gb.className = 'dp-group-body';
  h.addEventListener('click', e => { if (!e.target.closest('.dp-drag-handle')) g.classList.toggle('collapsed'); });

  PANEL_STYLE_CONTROLS.forEach(ctrl => {
    const row = document.createElement('div');
    row.className = 'dp-row'; row.dataset.key = ctrl.key;
    const handle = document.createElement('span'); handle.className = 'dp-row-handle dp-drag-handle'; handle.textContent = '⠿';
    const label = document.createElement('label'); label.textContent = ctrl.label;
    row.appendChild(handle); row.appendChild(label);

    if (ctrl.type === 'slider'){
      const slider = document.createElement('input'); slider.type = 'range';
      slider.min = ctrl.min; slider.max = ctrl.max; slider.step = ctrl.step; slider.value = panelStyle[ctrl.key];
      const numInput = document.createElement('input'); numInput.type = 'text'; numInput.className = 'dp-num'; numInput.value = panelStyle[ctrl.key];
      function apply(v){
        v = parseFloat(v);
        if (isNaN(v)) return;
        panelStyle[ctrl.key] = v;
        let mn = parseFloat(slider.min), mx = parseFloat(slider.max);
        if (v > mx) slider.max = v + Math.max(Math.abs(v), Math.abs(mx - mn), 1) * 0.2;
        if (v < mn) slider.min = v - Math.max(Math.abs(v), Math.abs(mx - mn), 1) * 0.2;
        slider.value = v; numInput.value = round(v, 3);
        applyPanelStyle();
      }
      slider.addEventListener('input', () => apply(slider.value));
      numInput.addEventListener('change', () => apply(numInput.value));
      numInput.addEventListener('keydown', e => { if (e.key === 'Enter') numInput.blur(); });
      row.appendChild(slider); row.appendChild(numInput);
      panelStyleNumEls[ctrl.key] = { slider, numInput };
    } else if (ctrl.type === 'color'){
      const color = document.createElement('input'); color.type = 'color'; color.value = panelStyle[ctrl.key];
      color.addEventListener('input', () => { panelStyle[ctrl.key] = color.value; applyPanelStyle(); });
      row.appendChild(color);
      // Same shared copiedColorValue every other color picker in the
      // panel uses -- see that variable's own comment.
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button'; copyBtn.className = 'dp-color-copy'; copyBtn.textContent = 'C';
      copyBtn.title = 'Copy this color';
      copyBtn.addEventListener('click', () => { copiedColorValue = color.value; });
      const pasteBtn = document.createElement('button');
      pasteBtn.type = 'button'; pasteBtn.className = 'dp-color-paste'; pasteBtn.textContent = 'P';
      pasteBtn.title = 'Paste copied color';
      pasteBtn.addEventListener('click', () => {
        if (copiedColorValue === null) return;
        color.value = copiedColorValue;
        panelStyle[ctrl.key] = copiedColorValue;
        applyPanelStyle();
      });
      row.appendChild(copyBtn);
      row.appendChild(pasteBtn);
      panelStyleNumEls[ctrl.key] = { color };
    }
    gb.appendChild(row);
  });

  g.appendChild(h); g.appendChild(gb);
  const container = document.getElementById('dpGroups');
  container.insertBefore(g, container.firstChild);
  makeReorderable(gb, 'dp-row', 'dp-row-handle');
}

function applyPanelStyleValues(saved){
  // always resolve every field (falling back to its default), so switching to
  // a tab with nothing saved yet resets away from whatever the previously
  // active tab happened to be showing, rather than silently keeping it.
  PANEL_STYLE_CONTROLS.forEach(ctrl => {
    const v = (saved && ctrl.key in saved) ? saved[ctrl.key] : ctrl.def;
    // panelStyle write happens regardless of whether el exists -- a real
    // visitor (no dev panel built, panelStyleNumEls always empty here)
    // still needs applyPanelStyle() below to see the real value, even
    // though the dev-panel-appearance sliders/colors it would otherwise
    // sync have nothing to sync to.
    panelStyle[ctrl.key] = v;
    const el = panelStyleNumEls[ctrl.key];
    if (el){
      if (ctrl.type === 'slider'){
        el.slider.min = ctrl.min; el.slider.max = ctrl.max;
        if (v > ctrl.max) el.slider.max = v;
        if (v < ctrl.min) el.slider.min = v;
        el.slider.value = v; el.numInput.value = round(v, 3);
      } else if (ctrl.type === 'color'){
        el.color.value = v;
      }
    }
  });
  applyPanelStyle();
}

/* ---------------------------------------------------------------------
   Drag-to-reorder (groups, and settings within a group) — pointer-based
   so it works the same on touch and mouse.
--------------------------------------------------------------------- */
function makeReorderable(container, itemClass, handleClass){
  let dragEl = null;
  container.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.' + handleClass);
    if (!handle || !container.contains(handle)) return;
    const item = handle.closest('.' + itemClass);
    if (!item || item.parentElement !== container) return;
    e.preventDefault();
    dragEl = item;
    dragEl.classList.add('dp-dragging');
    tryCapture(handle, e.pointerId);

    function move(ev){
      if (!dragEl) return;
      const siblings = Array.from(container.children).filter(c => c.classList.contains(itemClass) && c !== dragEl);
      for (const sib of siblings){
        const r = sib.getBoundingClientRect();
        const mid = r.top + r.height / 2;
        if (ev.clientY < mid){
          container.insertBefore(dragEl, sib);
          break;
        } else if (sib === siblings[siblings.length - 1]){
          container.appendChild(dragEl);
        }
      }
    }
    function up(){
      if (dragEl) dragEl.classList.remove('dp-dragging');
      dragEl = null;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
}

function setCfg(key, value){
  cfg[key] = value;
  const num = numEls[key];
  if (num && num.type !== 'checkbox' && document.activeElement !== num.numInput) {
    if (num.slider) num.slider.value = Math.max(parseFloat(num.slider.min), Math.min(parseFloat(num.slider.max), value));
    if (num.numInput) num.numInput.value = round(value, 3);
  }
}

// Same as setCfg()'s own slider/numInput sync, but deliberately does NOT
// touch cfg[key] itself -- used where a control's on-screen number should
// reflect the rope's current live state without redefining what that
// control's own value actually MEANS going forward. See
// performMainRopeSplit()'s own use of this for why: a cut used to call
// setCfg('ropeLength', ...) directly, which kept the slider's display
// honest but ALSO silently overwrote the persisted default itself --
// meaning a later FULL detach (which regrows to vh(cfg.ropeLength) as
// "the default length") regrew to whatever a PRIOR cut had shrunk it to,
// not the rope's real original configured length. Reported directly:
// "when I cut the rope in full, the length it extends back to after
// should be the default length. not the length the cut rope was."
//
// This kept cfg.ropeLength itself honest against a CUT, but a later
// direct report ("Default rope length and 'current' rope length needs
// to be 2 different figures") showed the same leak still existed
// through hold-to-grow (growRope() -> setCfg('ropeLength', ...), a
// genuine live-length update, not a bug) -- growing the rope longer,
// THEN fully detaching, regrew to the grown length, not the true
// original default, since cfg.ropeLength was still the only place any
// "default" lived. Fully resolved by adding a real, separate
// cfg.ropeDefaultLength (see its own dev-panel comment) that nothing
// ever overwrites automatically -- this function's own cut-display use
// below still stands on its own merits (Rope Length's slider SHOULD
// keep reflecting live current length either way).
function syncControlDisplay(key, value){
  const num = numEls[key];
  if (num && num.type !== 'checkbox' && document.activeElement !== num.numInput) {
    if (num.slider) num.slider.value = Math.max(parseFloat(num.slider.min), Math.min(parseFloat(num.slider.max), value));
    if (num.numInput) num.numInput.value = round(value, 3);
  }
}

function round(v, d){ const m = Math.pow(10,d); return Math.round(v*m)/m; }

function buildRow(ctrl){
  const row = document.createElement('div');
  row.className = 'dp-row';
  row.dataset.key = ctrl.key;
  const handle = document.createElement('span');
  handle.className = 'dp-row-handle dp-drag-handle';
  handle.textContent = '⠿';
  row.appendChild(handle);
  const label = document.createElement('label');
  label.textContent = ctrl.label;
  row.appendChild(label);

  if (ctrl.type === 'slider') {
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = ctrl.min; slider.max = ctrl.max; slider.step = ctrl.step;
    slider.value = ctrl.def;
    const numInput = document.createElement('input');
    numInput.type = 'text'; numInput.className = 'dp-num';
    numInput.value = ctrl.def;

    function apply(v){
      v = parseFloat(v);
      if (isNaN(v)) return;
      cfg[ctrl.key] = v;
      // §12h: typing beyond the current bound actually expands that bound
      // (typed value ± 20%), not just a visual clamp of the slider handle.
      let mn = parseFloat(slider.min), mx = parseFloat(slider.max);
      if (v > mx) { slider.max = v + Math.max(Math.abs(v), Math.abs(mx - mn), 1) * 0.2; }
      if (v < mn) { slider.min = v - Math.max(Math.abs(v), Math.abs(mx - mn), 1) * 0.2; }
      slider.value = v;
      numInput.value = round(v, 3);
      if (ctrl.onChange) ctrl.onChange(v);
    }
    slider.addEventListener('input', () => apply(slider.value));
    numInput.addEventListener('change', () => apply(numInput.value));
    numInput.addEventListener('keydown', e => { if (e.key === 'Enter') numInput.blur(); });

    row.appendChild(slider); row.appendChild(numInput);
    numEls[ctrl.key] = { slider, numInput };
  } else if (ctrl.type === 'color') {
    const color = document.createElement('input');
    color.type = 'color'; color.value = ctrl.def;
    color.addEventListener('input', () => { cfg[ctrl.key] = color.value; });
    row.appendChild(color);
    // Copy/Paste: copies this picker's current color into the shared
    // value, or overwrites this picker from whatever was last copied
    // (from ANY color picker in the panel, including this one) -- see
    // copiedColorValue's own comment.
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button'; copyBtn.className = 'dp-color-copy'; copyBtn.textContent = 'C';
    copyBtn.title = 'Copy this color';
    copyBtn.addEventListener('click', () => { copiedColorValue = color.value; });
    const pasteBtn = document.createElement('button');
    pasteBtn.type = 'button'; pasteBtn.className = 'dp-color-paste'; pasteBtn.textContent = 'P';
    pasteBtn.title = 'Paste copied color';
    pasteBtn.addEventListener('click', () => {
      if (copiedColorValue === null) return;
      color.value = copiedColorValue;
      cfg[ctrl.key] = copiedColorValue;
    });
    row.appendChild(copyBtn);
    row.appendChild(pasteBtn);
    numEls[ctrl.key] = { type:'color' };
  } else if (ctrl.type === 'checkbox') {
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !!ctrl.def;
    cb.addEventListener('change', () => { cfg[ctrl.key] = cb.checked; });
    row.appendChild(cb);
    numEls[ctrl.key] = { type:'checkbox' };
  } else if (ctrl.type === 'dropdown') {
    const select = document.createElement('select');
    select.className = 'dp-dropdown';
    ctrl.options.forEach(opt => {
      const optionEl = document.createElement('option');
      optionEl.value = opt.value; optionEl.textContent = opt.label;
      select.appendChild(optionEl);
    });
    select.value = ctrl.def;
    select.addEventListener('change', () => {
      cfg[ctrl.key] = select.value;
      if (ctrl.onChange) ctrl.onChange(select.value);
    });
    row.appendChild(select);
    numEls[ctrl.key] = { type:'dropdown' };
  } else if (ctrl.type === 'gradient') {
    // A Photoshop-style gradient bar: each stop is a draggable marker
    // along the bottom edge (position, NOT evenly spaced -- "I want to
    // be able to slide the sliders to determine where a gradient color
    // kicks in"), and clicking a marker (a real click/tap, not a drag)
    // opens a native color picker for that stop -- per explicit request
    // and reference image. cfg[key] holds an array of {pos: 0-1, color}
    // objects, order-independent (always re-sorted before building the
    // actual canvas gradient -- see ropeStrokeColor()).
    const wrap = document.createElement('div');
    wrap.className = 'dp-gradient';
    const bar = document.createElement('div');
    bar.className = 'dp-gradient-bar';
    wrap.appendChild(bar);

    // One hidden native color input, repositioned and reused for
    // whichever stop is currently being edited -- simpler and lighter
    // than a separate <input type=color> per stop.
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.className = 'dp-gradient-color-input';
    wrap.appendChild(colorInput);
    let editingStop = null;

    function sortedStops(){ return [...cfg[ctrl.key]].sort((a, b) => a.pos - b.pos); }

    function renderStops(){
      const sorted = sortedStops();
      bar.style.background = sorted.length >= 2
        ? `linear-gradient(to right, ${sorted.map(s => `${s.color} ${Math.round(Math.max(0, Math.min(1, s.pos)) * 100)}%`).join(', ')})`
        : (sorted[0] ? sorted[0].color : '#888888');
      bar.querySelectorAll('.dp-gradient-marker').forEach(m => m.remove());
      cfg[ctrl.key].forEach(stop => {
        const marker = document.createElement('div');
        marker.className = 'dp-gradient-marker';
        marker.style.left = (Math.max(0, Math.min(1, stop.pos)) * 100) + '%';
        marker.style.setProperty('--marker-color', stop.color);
        bar.appendChild(marker);
        marker.addEventListener('pointerdown', e => {
          e.stopPropagation();
          tryCapture(marker, e.pointerId);
          const barRect = bar.getBoundingClientRect();
          let dragged = false;
          function move(ev){
            dragged = true;
            stop.pos = Math.max(0, Math.min(1, (ev.clientX - barRect.left) / barRect.width));
            renderStops();
          }
          function up(ev){
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            if (!dragged){
              // A real click, not a drag -- open the color picker for
              // this stop rather than treat it as a (no-op) position edit.
              editingStop = stop;
              colorInput.value = stop.color;
              colorInput.style.left = (Math.max(0, Math.min(1, stop.pos)) * 100) + '%';
              colorInput.click();
            }
          }
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up);
        });
        // Deleting a stop: both double-click AND right-click do it (per
        // explicit request -- right-click was added alongside the
        // original double-click, not in place of it). Never below 2
        // stops -- a gradient needs at least a start and end.
        function deleteStop(e){
          e.stopPropagation();
          e.preventDefault();
          if (cfg[ctrl.key].length > 2){
            cfg[ctrl.key] = cfg[ctrl.key].filter(s => s !== stop);
            renderStops();
          }
        }
        marker.addEventListener('dblclick', deleteStop);
        marker.addEventListener('contextmenu', deleteStop);
      });
    }

    // Clicking empty bar space (not a marker -- those stop propagation
    // above) adds a new stop there, seeded with whatever color the
    // gradient already shows at that position so it doesn't visibly
    // jump.
    bar.addEventListener('pointerdown', e => {
      if (e.target !== bar) return;
      const barRect = bar.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - barRect.left) / barRect.width));
      const sorted = sortedStops();
      let color = sorted.length ? sorted[0].color : '#ffffff';
      for (let k = 0; k < sorted.length - 1; k++){
        if (frac >= sorted[k].pos && frac <= sorted[k + 1].pos){ color = sorted[k].color; break; }
        if (frac >= sorted[k].pos) color = sorted[k].color;
      }
      cfg[ctrl.key] = [...cfg[ctrl.key], { pos: frac, color }];
      renderStops();
    });

    colorInput.addEventListener('input', () => {
      if (editingStop){ editingStop.color = colorInput.value; renderStops(); }
    });

    row.appendChild(wrap);
    numEls[ctrl.key] = { type:'gradient', renderStops, setStops: newStops => { cfg[ctrl.key] = newStops.map(s => ({ ...s })); renderStops(); } };
    renderStops();
  }
  return row;
}

/* ---------------------------------------------------------------------
   Dev panel drag + resize (chrome only — not subject to the %-unit rule,
   which applies to the animation's own position/size controls)
--------------------------------------------------------------------- */
function tryCapture(el, pointerId){
  try { el.setPointerCapture(pointerId); } catch (err) { /* no active pointer to capture — window-level listeners below still work */ }
}

function initPanelDrag(){
  const panel = document.getElementById('devPanel');
  const header = document.getElementById('dpHeader');
  header.addEventListener('pointerdown', e => {
    if (e.target.closest('.dp-icon-btn')) return;
    tryCapture(header, e.pointerId);
    const r = panel.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY, startLeft = r.left, startTop = r.top;
    panel.style.right = 'auto';

    function move(ev){
      // clamp against the panel's OWN actual width/height, not a fixed
      // stub margin — otherwise most of the panel (including the resize
      // corners, which sit right at its edges) can be dragged off-screen
      // well before the drag "stops".
      const maxLeft = Math.max(0, viewportW() - r.width);
      const maxTop = Math.max(0, viewportH() - r.height);
      panel.style.left = Math.max(0, Math.min(maxLeft, startLeft + (ev.clientX - startX))) + 'px';
      panel.style.top = Math.max(0, Math.min(maxTop, startTop + (ev.clientY - startY))) + 'px';
    }
    function up(){ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
  // §12c clamping only ever fired during an active drag -- resizing the
  // BROWSER WINDOW itself (e.g. dragging it down to phone width, or a
  // real device rotation) never triggered a drag, so a panel positioned
  // fine at a wide viewport could end up with its saved `left`/`top`
  // now past the new, narrower window's own edge, with nothing to pull
  // it back -- reported directly ("when i resize my browser to phone
  // size, the panel will end up out of frame"). Reuses the exact same
  // clamp formula the drag handler above already uses, just triggered by
  // `resize` instead of `pointermove`, and also run once immediately (a
  // saved geometry from a wider device, loaded fresh on a narrower one,
  // needs the same correction before any resize event ever fires).
  function clampToViewport(){
    if (panel.classList.contains('hidden')) return;
    const r = panel.getBoundingClientRect();
    const maxLeft = Math.max(0, viewportW() - r.width);
    const maxTop = Math.max(0, viewportH() - r.height);
    const left = Math.max(0, Math.min(maxLeft, r.left));
    const top = Math.max(0, Math.min(maxTop, r.top));
    if (left !== r.left || top !== r.top){
      panel.style.right = 'auto';
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
    }
  }
  window.addEventListener('resize', clampToViewport);
  clampToViewport();
}

// §12c: "minimum size is whatever is functionally necessary" -- derived
// live from the header's own rendered content (title text width, collapse
// button width, padding, gaps), not a hardcoded guess. Computed fresh on
// every resize-drag start rather than cached once, since the title's
// rendered width depends on the Dev Panel Title Font Size slider (part of
// the panel's own live-adjustable appearance), so a cached value could go
// stale the moment that slider moves. #dpFps (flex:1 1 auto) is
// deliberately excluded from the floor -- it's the header's designated
// shrink-first element, not a click target, so it's fine for it to have
// zero space rather than dictating the panel's minimum width. The floor
// only needs to keep the title and the (clickable) collapse button
// visible and non-overlapping -- everything below the header scrolls
// (`.dp-body{overflow-y:auto}`), so it can shrink to 0 without breaking
// anything.
function computeMinPanelSize(){
  const header = document.getElementById('dpHeader');
  const title = header.querySelector('.dp-title');
  const collapseBtn = document.getElementById('dpCollapseBtn');
  const style = getComputedStyle(header);
  const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const gap = parseFloat(style.gap) || 0;
  return {
    width: Math.ceil(title.scrollWidth + collapseBtn.offsetWidth + paddingX + gap * 2),
    height: Math.ceil(header.offsetHeight),
  };
}

/* All 4 edges + all 4 corners resizable, per §12c. */
function initResizeHandles(){
  const panel = document.getElementById('devPanel');
  document.querySelectorAll('.dp-resize').forEach(handle => {
    const dir = handle.dataset.dir;
    handle.addEventListener('pointerdown', e => {
      tryCapture(handle, e.pointerId);
      const sx = e.clientX, sy = e.clientY;
      const startRect = panel.getBoundingClientRect();
      panel.style.right = 'auto';
      const { width: minW, height: minH } = computeMinPanelSize();
      panel.style.minWidth = minW + 'px';
      panel.style.minHeight = minH + 'px';

      function move(ev){
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        let { left, top, width, height } = startRect;
        // matches the CSS max-height:88vh on #devPanel exactly — without this,
        // a requested height beyond it gets silently clamped by CSS while this
        // math still thinks the full request took effect, so 's' would go
        // visually unresponsive past the cap and 'n' would push the panel's
        // top off-screen while its (uncompensated) height stayed clamped,
        // shrinking the panel from the bottom instead of growing it.
        const maxH = viewportH() * 0.88;
        if (dir.includes('e')) width = Math.max(minW, Math.min(viewportW() - left, startRect.width + dx));
        if (dir.includes('s')) height = Math.max(minH, Math.min(maxH, viewportH() - top, startRect.height + dy));
        if (dir.includes('w')) { width = Math.max(minW, startRect.width - dx); left = startRect.left + (startRect.width - width); }
        if (dir.includes('n')) {
          // the bottom edge is the fixed point for a pure top-edge resize —
          // compute height from the (clamped) top, not the other way around,
          // so the two never disagree about where the bottom edge actually is.
          const bottomEdge = startRect.top + startRect.height;
          let newTop = startRect.top + dy;
          newTop = Math.max(0, bottomEdge - maxH, Math.min(newTop, bottomEdge - minH));
          top = newTop;
          height = bottomEdge - newTop;
        }
        panel.style.width = width + 'px';
        panel.style.height = height + 'px';
        panel.style.left = left + 'px';
        panel.style.top = top + 'px';
      }
      function up(){ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  });
}

/* ---------------------------------------------------------------------
   Copy / Save / Reset settings (§12d), reorderable-group/setting order
   captured alongside values (§12e), panel size/position saved separately
   per device class (§12f).
--------------------------------------------------------------------- */
const isMobileClass = () => window.matchMedia('(max-width: 767px)').matches;
// which tab (Desktop/Mobile, §12f) is active — the panel's own geometry keys off
// this explicit selection, not the live viewport, so it can be previewed/tuned
// without actually resizing the browser. Every functional setting in this
// project is already %/vmin-based (§12a), so none of them need to be
// device-split — only the panel's own chrome (§12c) does, per §12f's own text.
let activeDeviceTab = isMobileClass() ? 'mobile' : 'desktop';

function getPanelOrder(){
  return Array.from(document.querySelectorAll('#dpGroups > .dp-group')).map(g => ({
    key: g.dataset.key,
    collapsed: g.classList.contains('collapsed'),
    settings: Array.from(g.querySelectorAll('.dp-row')).map(r => r.dataset.key),
  }));
}

function applyOrder(order){
  const groupsContainer = document.getElementById('dpGroups');
  (order || []).forEach(g => {
    const groupEl = groupsContainer.querySelector('.dp-group[data-key="' + CSS.escape(g.key) + '"]');
    if (!groupEl) return;
    groupsContainer.appendChild(groupEl);
    groupEl.classList.toggle('collapsed', !!g.collapsed);
    const groupBody = groupEl.querySelector('.dp-group-body');
    (g.settings || []).forEach(k => {
      const rowEl = groupBody.querySelector('.dp-row[data-key="' + CSS.escape(k) + '"]');
      if (rowEl) groupBody.appendChild(rowEl);
    });
  });
}

function applyValues(values){
  DEV_GROUPS.forEach(group => group.controls.forEach(ctrl => {
    if (!(ctrl.key in (values || {}))) return;
    const v = values[ctrl.key];
    const el = numEls[ctrl.key];
    if (ctrl.type === 'slider'){
      // cfg write and onChange happen regardless of whether el exists --
      // a real visitor (no dev panel built, el always undefined here)
      // still needs the actual functional value/side-effect to apply;
      // only the slider/numInput DOM sync is dev-panel-only, per the
      // same convention 'color'/'checkbox'/'dropdown' below already use.
      cfg[ctrl.key] = v;
      if (el){
        if (v > parseFloat(el.slider.max)) el.slider.max = v;
        if (v < parseFloat(el.slider.min)) el.slider.min = v;
        el.slider.value = v; el.numInput.value = round(v, 3);
      }
      if (ctrl.onChange) ctrl.onChange(v);
    } else if (ctrl.type === 'color'){
      cfg[ctrl.key] = v;
      const input = document.querySelector('.dp-row[data-key="' + CSS.escape(ctrl.key) + '"] input[type=color]');
      if (input) input.value = v;
    } else if (ctrl.type === 'checkbox'){
      cfg[ctrl.key] = v;
      const input = document.querySelector('.dp-row[data-key="' + CSS.escape(ctrl.key) + '"] input[type=checkbox]');
      if (input) input.checked = v;
    } else if (ctrl.type === 'dropdown'){
      cfg[ctrl.key] = v;
      const select = document.querySelector('.dp-row[data-key="' + CSS.escape(ctrl.key) + '"] select');
      if (select) select.value = v;
      if (ctrl.onChange) ctrl.onChange(v);
    } else if (ctrl.type === 'gradient'){
      if (Array.isArray(v) && v.length){
        // Auto-converts a pre-existing save from the OLD gradient format
        // (a plain array of hex strings, evenly spaced) to the current
        // {pos, color} shape, rather than silently doing nothing with it
        // -- a save from before this round's editor rebuild should still
        // load correctly, not just get dropped.
        const stops = typeof v[0] === 'object' ? v : v.map((c, i) => ({ pos: v.length > 1 ? i / (v.length - 1) : 0, color: c }));
        // el.setStops() writes cfg[ctrl.key] itself (see its own
        // definition) AND re-renders the gradient bar UI -- but el is
        // always undefined for a real visitor with no dev panel built,
        // so cfg has to be set directly here too, same reasoning as the
        // 'slider' branch above.
        if (el && el.setStops) el.setStops(stops);
        else cfg[ctrl.key] = stops.map(s => ({ ...s }));
      }
    }
  }));
}

function getPanelGeometry(){
  const r = document.getElementById('devPanel').getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height, style: { ...panelStyle } };
}

function applyPanelGeometry(geom){
  // geom === null means "nothing saved for this tab" — reset to the CSS
  // default rather than silently leaving whatever the other tab had applied.
  const panel = document.getElementById('devPanel');
  if (geom){
    panel.style.right = 'auto';
    panel.style.left = geom.left + 'px';
    panel.style.top = geom.top + 'px';
    panel.style.width = geom.width + 'px';
    panel.style.height = geom.height + 'px';
  } else {
    panel.style.left = ''; panel.style.top = ''; panel.style.right = '';
    panel.style.width = ''; panel.style.height = '';
  }
  applyPanelStyleValues(geom && geom.style);
}

/* ---------------------------------------------------------------------
   §12l/§12d: Save Settings writes ONLY to a git-tracked settings log
   (data/processed/dev-panel-settings.json) — there is deliberately no
   persistent browser-local default alongside it. Reset restores from that
   same file, not from any local default. Three tiers, tried in order,
   each covering what the one before it can't:

   1. Vercel/GitHub API (writeSettingsViaApi()/readSettingsViaApi() above)
      — a serverless function (api/save-settings.js) commits straight to
      the repo via GitHub's Contents API. The ONLY tier that works from a
      device with no filesystem access of its own (e.g. a phone visiting
      the deployed site with ?dev=1). Tried whenever a real server is
      behind the page at all (not file://) — reads always try this first
      (a plain fetch of the already-committed static file, so it works
      from any server including a local one), writes fall through to
      Tier 2 if this fails (not deployed as Vercel, network error, or the
      function's env vars genuinely aren't configured yet).
   2. File System Access API (GIT_LOG_WRITABLE, getGitSettingsFileHandle()
      below) — direct local disk write via a native picker. The FIRST
      Save on a given browser prompts that dialog (navigate to
      data/processed/, use the suggested filename); the resulting handle
      is persisted in IndexedDB so every later Save/Reset reuses it with
      no dialog. Reading at boot never prompts (no user gesture exists
      yet) — it only succeeds if this browser already silently holds read
      permission on a previously-picked handle (queryPermission, which
      never shows UI). Chromium-only (Firefox/Safari lack the API) and
      feature-detected throughout.
   3. Local save prompt + sessionStorage (downloadSettingsAsFile() above,
      SESSION_FALLBACK_KEY below) — last resort when neither of the above
      reached the git-tracked log at all (§12l's "no server, opened
      directly as a local file" exception, or a browser lacking both
      capabilities). Never a persistent local default — sessionStorage is
      gone the moment the tab closes, so it exists only so a Save made in
      this mode has anything for that same tab's own Reset to read back.
--------------------------------------------------------------------- */
const GIT_SETTINGS_FILENAME = 'dev-panel-settings.json';
const IDB_NAME = 'dickoClicko';
const IDB_STORE = 'handles';
const IDB_HANDLE_KEY = 'gitSettingsFileHandle';
// the last snapshot read from (or written to) the git settings log, kept
// in memory so tab-switching/copySettings can find the OTHER device's
// panel geometry without re-reading the file — there is no localStorage
// fallback for any of this anymore.
let lastLoadedSnapshot = null;

// Shared anti-abuse token for /api/save-settings -- NOT a real secret (it
// ships in this public page's source, same as every other client-side
// value here); it exists only to keep a random visitor from spamming
// commits to the repo. Must match the DEV_PANEL_SAVE_SECRET env var set on
// the Vercel project -- see README.md for setup. Reuses the exact same
// value CLICKO already uses, since this is one workspace-wide shared
// secret (CLAUDE.md §12l), not a per-project one.
const DEV_PANEL_SAVE_SECRET = 'PkrbMti03M6xm3FEThYXa8gGW_08BOGj';

// Tier 1 of Save/Reset (see saveSettings()/resetSettings() below): a
// Vercel serverless function (api/save-settings.js) that commits straight
// to data/processed/dev-panel-settings.json via GitHub's Contents API.
// This is the ONLY tier that works from a device with no local filesystem
// access of its own (a phone visiting the deployed site with ?dev=1
// appended) -- Tier 2's File System Access picker would just save to some
// location on THAT visitor's own disk, unrelated to this repo. Reading is
// simpler than writing: once committed, the settings file is just an
// ordinary static asset, so Reset fetches it directly rather than needing
// its own API route.
// Returns {ok, error} rather than a bare boolean -- api/save-settings.js's
// own error responses (missing env vars, secret mismatch, GitHub API
// failure) are worth surfacing directly rather than collapsing every
// failure mode into a single generic "didn't work", both for real users
// and for diagnosing a live deployment's actual problem from the outside.
async function writeSettingsViaApi(data){
  try {
    const resp = await fetch('/api/save-settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Dev-Panel-Secret': DEV_PANEL_SAVE_SECRET },
      body: JSON.stringify(data),
    });
    const body = await resp.json().catch(() => ({}));
    if (resp.ok && body.ok === true) return { ok: true };
    return { ok: false, error: body.error || `HTTP ${resp.status}` };
  } catch (err) {
    return { ok: false, error: 'offline or unreachable: ' + String((err && err.message) || err) };
  }
}
async function readSettingsViaApi(){
  try {
    const resp = await fetch('/data/processed/dev-panel-settings.json', { cache: 'no-store' });
    if (!resp.ok) return null; // e.g. 404 before the file exists yet, or not served at all
    return await resp.json();
  } catch (err) {
    return null;
  }
}

// Tier 3 last resort (see saveSettings() below): when nothing above
// reached the git-tracked log at all, hand the user a real file they can
// save themselves, via the browser's ordinary download mechanism -- works
// everywhere a normal file:// page runs, unlike the File System Access
// API's native picker.
function downloadSettingsAsFile(data){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = GIT_SETTINGS_FILENAME;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// True only for a genuine local-development context (a bare local file, or
// a local dev server) -- false for a real deployed/hosted origin (a Vercel
// preview or production URL, or any other real domain), even though that
// origin's own protocol is a normal https:// that would otherwise pass a
// bare "not file:" check. This is the actual "is there a local checkout
// behind this page at all" signal that both the fallback tiers below and
// saveSettings() itself (see its own comment) key off of -- a deployed
// page must never fall through to a local-save mechanism, per §12l/§12d's
// explicit rule, regardless of whether Tier 1 (the Vercel/GitHub API)
// succeeds or fails.
const IS_LOCAL_CONTEXT = location.protocol === 'file:' ||
  location.hostname === 'localhost' || location.hostname === '127.0.0.1';

// §12l's scope for Tier 2 specifically (the File System Access picker):
// gated on DEV_MODE, not just protocol/API capability -- the native
// save-file picker/disk write only makes sense against a real local
// checkout (localhost/127.0.0.1, never file: -- see below), never against
// a deployed/hosted origin, which has no locally-tracked repo file for
// that write to be meaningfully "tracked" through. Corrected same day as
// this comment's own original wording: the code previously only checked
// `location.protocol !== 'file:'`, which stayed TRUE for any real deployed
// domain too (a normal https:// origin passes that check just as easily
// as localhost does) -- confirmed via direct user report: hitting Save on
// a real, correctly-configured Vercel deployment still triggered the
// native picker dialog, exactly the "local save prompt on a served
// deployment" behavior §12d/§12l calls out as a bug. Now requires
// IS_LOCAL_CONTEXT's own hostname check, which a deployed origin can never
// satisfy. `location.protocol !== 'file:'` is layered on TOP of
// IS_LOCAL_CONTEXT (not redundant with it) because IS_LOCAL_CONTEXT itself
// still counts file: as local (that's what makes the dev panel visible
// when opened as a bare local file, per DEV_MODE) -- this is the one case
// where git-write must stay off despite being "local", per §12l's own "no
// server behind it at all" exception. Also false in the ordinary case of a
// browser lacking the API entirely (Firefox/Safari). Checked once, not
// per-call, since these are environmental facts that don't change
// mid-session. When false, Save/Reset use SESSION_FALLBACK_KEY instead
// (sessionStorage, not localStorage -- it's gone the moment the tab
// closes, so it can never become the persistent "separate browser-local
// default" §12d/§12l otherwise bans; it exists only so a Save made in this
// mode has anything for that same tab's own Reset to read back).
const GIT_LOG_WRITABLE = DEV_MODE && IS_LOCAL_CONTEXT && location.protocol !== 'file:' && 'showSaveFilePicker' in window;
const SESSION_FALLBACK_KEY = 'dickoClicko.sessionSettings';

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// mode: 'read' (boot/Reset — never prompts) or 'readwrite' (Save — may
// prompt, since it always runs from a real click/keydown user gesture).
async function getGitSettingsFileHandle(mode, promptIfMissing){
  if (!('showSaveFilePicker' in window)) return null;
  let handle = null;
  try { handle = await idbGet(IDB_HANDLE_KEY); } catch (err) { handle = null; }
  if (handle){
    try {
      let perm = await handle.queryPermission({ mode }); // never shows UI
      if (perm !== 'granted' && promptIfMissing){
        perm = await handle.requestPermission({ mode }); // needs a user gesture to actually prompt
      }
      if (perm === 'granted') return handle;
    } catch (err) { /* handle stale/revoked — fall through to re-prompt below */ }
  }
  if (!promptIfMissing) return null; // boot-time/Reset read: never force a picker with no gesture behind it
  try {
    handle = await window.showSaveFilePicker({
      suggestedName: GIT_SETTINGS_FILENAME,
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
    });
    await idbSet(IDB_HANDLE_KEY, handle);
    return handle;
  } catch (err) {
    return null; // user cancelled the picker, or the API is blocked
  }
}

async function writeGitSettingsLog(data){
  const handle = await getGitSettingsFileHandle('readwrite', true);
  if (!handle) return false;
  try {
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    return true;
  } catch (err) {
    return false;
  }
}

async function readGitSettingsLog(){
  const handle = await getGitSettingsFileHandle('read', false);
  if (!handle) return null;
  try {
    const file = await handle.getFile();
    return JSON.parse(await file.text());
  } catch (err) {
    return null; // missing/empty/corrupt file, or permission not actually granted
  }
}

async function saveSettings(){
  const current = activeDeviceTab;
  const other = activeDeviceTab === 'mobile' ? 'desktop' : 'mobile';
  const otherGeom = lastLoadedSnapshot && lastLoadedSnapshot.panelGeometry ? lastLoadedSnapshot.panelGeometry[other] : null;
  const snapshot = {
    values: { ...cfg },
    order: getPanelOrder(),
    panelGeometry: { [current]: getPanelGeometry(), [other]: otherGeom },
  };
  const btn = document.getElementById('dpSaveBtn');
  const flash = (text, holdMs) => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = text;
    setTimeout(() => btn.textContent = orig, holdMs || 900);
  };

  // Tier 1: Vercel/GitHub API -- works from any device (see the big comment
  // above), so try it whenever a real server is behind the page at all.
  if (location.protocol !== 'file:'){
    const result = await writeSettingsViaApi(snapshot);
    if (result.ok){
      lastLoadedSnapshot = snapshot;
      flash('Saved to repo!');
      return;
    }
    // §12d/§12l: a genuinely deployed page must NEVER fall through to a
    // local-save mechanism (Tier 2's native picker, or Tier 3's download
    // dialog) -- confirmed via direct user report that this was actually
    // happening (Save on a real, configured Vercel deployment still
    // triggered the native picker, since the OLD IS_LOCAL_CONTEXT-less
    // check let it fall through here). Report the real failure and stop;
    // console.error too, since the on-screen flash is brief and the error
    // text (e.g. "Server not configured - missing: ...", a GitHub API
    // failure detail) is exactly what's needed to diagnose a live
    // deployment from the outside.
    if (!IS_LOCAL_CONTEXT){
      console.error('[saveSettings] Vercel/GitHub API write failed:', result.error);
      flash('Save failed: ' + result.error, 4000);
      return;
    }
  }

  // Tier 2: direct local disk write via the File System Access API. Local
  // dev only (IS_LOCAL_CONTEXT, folded into GIT_LOG_WRITABLE itself) --
  // never reached on a real deployment, per the guard above.
  if (GIT_LOG_WRITABLE){
    const ok = await writeGitSettingsLog(snapshot);
    if (ok){
      lastLoadedSnapshot = snapshot;
      flash('Saved!');
      return;
    }
    // fall through to Tier 3 rather than reporting outright failure -- the
    // picker may have just been cancelled, and the user still gets SOME
    // way to preserve this Save.
  }

  // Tier 3: nothing above reached the git-tracked log at all -- §12l's "no
  // server, opened directly as a local file" exception. Hand the user a
  // real downloadable file AND stash it in this tab's own sessionStorage
  // (never a persistent local default), rather than failing outright, and
  // say so honestly rather than claiming a real git-log save.
  try {
    downloadSettingsAsFile(snapshot);
    sessionStorage.setItem(SESSION_FALLBACK_KEY, JSON.stringify(snapshot));
    lastLoadedSnapshot = snapshot;
    flash('Saved (session only)');
  } catch (err) {
    flash('Save failed');
  }
}

async function resetSettings(){
  let snap = null;

  // Tier 1: the git-tracked settings log is just a static asset once
  // committed, so a plain fetch works on ANY server (local dev server or a
  // real Vercel deployment) -- no picker/permission dance needed for reads.
  if (location.protocol !== 'file:'){
    snap = await readSettingsViaApi();
  }
  // Tier 2: this browser's own previously-granted File System Access handle.
  if (!snap && GIT_LOG_WRITABLE){
    snap = await readGitSettingsLog();
  }
  // Tier 3: this tab's own sessionStorage fallback.
  if (!snap){
    try { snap = JSON.parse(sessionStorage.getItem(SESSION_FALLBACK_KEY)); } catch (err) { snap = null; }
  }

  lastLoadedSnapshot = snap;
  if (snap){
    applyOrder(snap.order);
    applyValues(snap.values);
  }
  applyPanelGeometry(snap && snap.panelGeometry ? snap.panelGeometry[activeDeviceTab] : null);
}

function copySettings(){
  const current = activeDeviceTab;
  const other = activeDeviceTab === 'mobile' ? 'desktop' : 'mobile';
  const otherGeom = lastLoadedSnapshot && lastLoadedSnapshot.panelGeometry ? lastLoadedSnapshot.panelGeometry[other] : null;
  const snapshot = {
    values: { ...cfg },
    order: getPanelOrder(),
    panelGeometry: { [current]: getPanelGeometry(), [other]: otherGeom },
  };
  const text = JSON.stringify(snapshot, null, 2);
  const btn = document.getElementById('dpCopyBtn');
  const flash = msg => { const orig = btn.textContent; btn.textContent = msg; setTimeout(() => btn.textContent = orig, 900); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flash('Copied!')).catch(() => flash('Copy failed'));
  } else {
    flash('Copy failed');
  }
}

function initDeviceTabs(){
  const buttons = document.querySelectorAll('.dp-tab-btn');
  function refreshActive(){
    buttons.forEach(b => b.classList.toggle('active', b.dataset.tab === activeDeviceTab));
  }
  buttons.forEach(b => b.addEventListener('click', () => {
    activeDeviceTab = b.dataset.tab;
    refreshActive();
    const geom = lastLoadedSnapshot && lastLoadedSnapshot.panelGeometry ? lastLoadedSnapshot.panelGeometry[activeDeviceTab] : null;
    applyPanelGeometry(geom); // preview that tab's last-loaded panel geometry, even without actually resizing the browser
  }));
  refreshActive();
}

function initDevPanelChrome(){
  document.getElementById('dpCopyBtn').addEventListener('click', copySettings);
  document.getElementById('dpSaveBtn').addEventListener('click', saveSettings);
  document.getElementById('dpResetBtn').addEventListener('click', resetSettings);
  document.getElementById('dpClickLogClear').addEventListener('click', () => {
    const el = document.getElementById('dpClickLog');
    el.innerHTML = '<span class="dp-click-log-empty">(no clicks yet)</span>';
  });
  document.getElementById('dpCollapseBtn').addEventListener('click', () => {
    const panel = document.getElementById('devPanel');
    const collapsing = !panel.classList.contains('dp-collapsed');
    panel.classList.toggle('dp-collapsed');
    // The CSS rule (#devPanel.dp-collapsed .dp-body/.dp-resize) only
    // hides the BODY and resize handles -- it never touched the panel's
    // own explicit inline height (set by dragging a resize handle, or by
    // a saved-settings reload via applyPanelGeometry()). Left alone, that
    // explicit height persisted across collapse, leaving the panel's own
    // outer box at its full pre-collapse size with a big empty gap below
    // the title bar -- reported as "collapse button simply collapses the
    // setting options but not the panel". Saving/clearing/restoring the
    // explicit height here (not touching width, which should stay as-is)
    // is what actually shrinks the panel itself down to just its title
    // bar while collapsed, and restores the user's own resized height
    // when expanded again.
    if (collapsing){
      panel.dataset.preCollapseHeight = panel.style.height;
      panel.style.height = '';
    } else {
      panel.style.height = panel.dataset.preCollapseHeight || '';
      delete panel.dataset.preCollapseHeight;
    }
    document.getElementById('dpCollapseBtn').textContent = panel.classList.contains('dp-collapsed') ? '+' : '–';
  });
  window.addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'd' || e.key === 'D') document.getElementById('devPanel').classList.toggle('hidden');
    else if (e.key === 'r' || e.key === 'R') resetSettings();
  });
}

// window.innerWidth/innerHeight can genuinely read 0 for a brief moment
// on some mobile browsers, right at the point this script's own top-level
// boot code runs (before the viewport has settled/laid out) -- confirmed
// directly via a temporary boot-time console.log, not assumed: a real
// page load showed window.innerHeight === 0 at the exact line
// resetMainRope() is first called. That 0 silently propagated into
// vh()-derived NaN math (targetSeg became 0, so totalLen/targetSeg was
// 0/0 = NaN), which Math.max(2, NaN) does NOT clamp back to 2 (Math.max
// with a NaN operand returns NaN, not the other operand) -- so
// mainRope.points ended up permanently empty from frame one, and every
// subsequent update() threw trying to read points[0] for the anchor's
// boundaryConstraint. Reported directly as "the start button [the
// circle] appears then disappears after a second" on a real mobile
// Vercel visit -- exactly what a graphic drawn successfully ONCE (before
// the very first update() throws and every later frame silently no-ops)
// would look like. Falls back to `document.documentElement.clientHeight`/
// `clientWidth` (usually already valid even when window.innerHeight
// isn't yet) and finally a hardcoded sane default, so vh()/vw()/vmin()
// can never silently multiply by zero again, however early they're
// called from. Declared here, ABOVE Canvas setup below, since
// resizeCanvas() (called immediately, synchronously, at boot) needs
// these too -- a 0x0 canvas wouldn't throw, but would mean nothing
// paints at all until a later real resize event corrects it.
const viewportW = () => window.innerWidth || document.documentElement.clientWidth || 400;
const viewportH = () => window.innerHeight || document.documentElement.clientHeight || 800;
const vw = pct => viewportW() * pct / 100;
const vh = pct => viewportH() * pct / 100;
const vmin = pct => Math.min(viewportW(), viewportH()) * pct / 100;

/* ---------------------------------------------------------------------
   FLICK animation -- a small looping frame-sequence graphic, independent
   of the rope's own physics. Ping-pongs across 17 PNG frames (1->17->1,
   a boomerang, not a cut-back-to-1 loop) at a speed set by the dev panel.
--------------------------------------------------------------------- */
const FLICK_FRAME_COUNT = 17;
const FLICK_BASE_FPS = 12; // playback rate at Flick Anim Speed = 1x
const flickFrames = [];
for (let i = 1; i <= FLICK_FRAME_COUNT; i++){
  const img = new Image();
  img.src = `data/FLICK/ANI/FRAMES-${String(i).padStart(2, '0')}.webp`;
  flickFrames.push(img);
}
let flickAnimTime = 0;
// Rests on frame 1 until clicked, same click-to-trigger convention as
// animation 2 (see flick2Playing below) -- per explicit request ("apply
// the clicking function to animation 1 as well"). Previously always
// auto-played continuously; update() now only advances flickAnimTime while
// this is true, and stops it (one full ping-pong period, not a partial
// one) once the sequence completes -- see update()'s own completion check.
let flickPlaying = false;

// Triangle wave over a continuously-advancing time accumulator -- e.g.
// frame position 0, 1, 2 ... 16, 15, 14 ... 0, 1 ... -- rather than
// resetting to 0 every cycle, which would show 1->17 then SNAP back to 1
// instead of animating back down through 17->1.
function flickFrameIndex(){
  if (!flickPlaying) return 0;
  const cyclePos = flickAnimTime * FLICK_BASE_FPS * cfg.flickAnimSpeed;
  const period = (FLICK_FRAME_COUNT - 1) * 2;
  const t = ((cyclePos % period) + period) % period;
  return Math.round(t <= (FLICK_FRAME_COUNT - 1) ? t : period - t);
}

// The rect drawn in render(), kept in sync there each frame -- same
// pattern as flick2Rect/isPointInFlick2 below.
const flickRect = { x: 0, y: 0, w: 0, h: 0 };
function isPointInFlick(x, y){
  return x >= flickRect.x && x <= flickRect.x + flickRect.w &&
         y >= flickRect.y && y <= flickRect.y + flickRect.h;
}

// FLICK animation 2 -- a second, independent graphic, placed above the
// first by default. Its frames are loaded DIRECTLY from
// `data/FLICK/ANI/1` (in sequence) followed by `data/FLICK/ANI/2` (in
// REVERSE sequence) -- per explicit correction ("all animation frames
// should be from ANI not ANi2... none should be from Ani2"). An earlier
// version pre-copied/re-encoded both folders' frames into a 3rd,
// separate top-level `data/FLICK/ANI2/` folder purely so the loading
// code here could stay a simple sequential range (matching animation
// 1's own `for i=1..N` shape) -- but that meant every edit to ANI/1 or
// ANI/2 also needed a separate, easy-to-forget rebuild-into-ANI2 step,
// which is exactly what caused ANI2 to repeatedly drift out of sync
// with the 2 real source folders across several rounds. Loading from
// ANI/1 and ANI/2 directly removes that whole intermediate copy step --
// there is nothing left to keep in sync.
//
// Neither folder's own file numbers form a clean 1..N range (ANI/1 and
// ANI/2 each skip around, e.g. ANI/1 has no 05/06/08/09/14 -- whatever
// frames the user has actually put there), so the loading code can't
// stay a bare `for i=1..N` loop the way it could when both source
// folders got pre-flattened into one sequential ANI2. These 2 arrays
// list exactly which frame numbers exist in each folder, in the order
// they're used (ANI1_FRAMES forward, ANI2_FRAMES reversed at the point
// of use below) -- re-verify (`ls data/FLICK/ANI/1`, `ls
// data/FLICK/ANI/2`) and update these 2 arrays any time either folder's
// own contents change; nothing here derives them automatically (this is
// a static single-file app with no server-side directory listing).
const ANI1_FRAMES = [1, 2, 3, 4, 7, 10, 11, 12, 13, 15, 16];
const ANI2_FRAMES = [1, 2, 3, 5, 6, 11, 13, 15, 16];
// Rests on frame 1 (not auto-playing) until clicked, per explicit
// request -- flick2Playing gates whether flick2AnimTime advances at all
// (see update() and the pointerdown hit-test below); once started it
