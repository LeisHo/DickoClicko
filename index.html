      // jittery fashion" report, this time reproduced specifically while
      // mid-swing, independent of the earlier pileRepulsion/floor fix).
      // Leaving tip.x/y untouched avoids the jump entirely; the finalized
      // segment's actual length may fall very slightly short of targetSeg
      // as a result, which the distance constraint gently absorbs over
      // the next few frames instead of reacting to an instant full-length
      // snap.
    } else {
      // A rare multi-commit-in-one-frame burst (a very high growth rate,
      // or an unusually large dt spike) -- this tip was only just created
      // a few lines below, THIS same frame, so it has no meaningfully
      // smoothed history to preserve; give it its full-length position
      // the same way every commit used to, computed fresh from the
      // now-finalized prev.
      const dir = tipGrowDirection(pts);
      tip.x = prev.x + dir.x * targetSeg;
      tip.y = prev.y + dir.y * targetSeg;
    }
    tip.oldx = tip.x - vx; tip.oldy = tip.y - vy;
    pts.push({ x: tip.x, y: tip.y, oldx: tip.x - vx, oldy: tip.y - vy });
    // the new tip starts exactly coincident with its own anchor (the point
    // just pushed from) -- zero offset -- so positionGrowingTip()'s offset
    // smoothing (see its own comment) starts from the correct zero point
    // instead of inheriting whatever offset was accumulating for the
    // segment that just finished.
    mainRope.tipOffset = { x: 0, y: 0 };
    mainRope.tipGrowLen -= targetSeg;
    firstCommitThisFrame = false;
  }
  setCfg('ropeLength', mainRope.totalLength / window.innerHeight * 100);
}

function applyPunch(points, hit, clickX, clickY, intensity, pinnedIndex){
  const dirX = hit.x - clickX, dirY = hit.y - clickY;
  const len = Math.hypot(dirX, dirY) || 1;
  const nx = dirX / len, ny = dirY / len;
  const power = vh(1.0) * intensity;
  for (let i = 0; i < points.length; i++){
    if (i === pinnedIndex) continue;
    const falloff = Math.exp(-Math.pow((i - hit.index) / 3, 2));
    points[i].x += nx * power * falloff;
    points[i].y += ny * power * falloff;
  }
}

const CUT_SWEEP_BASE_SEC = 0.35;

// a perfectly vertical piece has no asymmetry to topple over on -- give it a
// small random initial tilt (around its own top point) so gravity and the
// floor collision naturally fold it into a heap instead of it standing
// there as a rigid straight column. Shared by both cutRopeAt (the piece
// falling off the main rope) and cutPieceAt (a fallen piece split in two).
function topplePiece(points){
  const angle = (Math.random() - 0.5) * 0.6;
  const pivot = points[0];
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  for (let i = 1; i < points.length; i++){
    const p = points[i];
    // rotate both the current AND old position by the same angle around the
    // same pivot, so the rotation only adds a topple bias — it does NOT
    // zero out whatever velocity the point already had from an in-progress
    // swing (rotating position but resetting oldx/oldy to match would kill
    // that momentum, which is exactly the "shouldn't freeze mid-swing" bug).
    const dx = p.x - pivot.x, dy = p.y - pivot.y;
    const odx = p.oldx - pivot.x, ody = p.oldy - pivot.y;
    p.x = pivot.x + dx * cosA - dy * sinA;
    p.y = pivot.y + dx * sinA + dy * cosA;
    p.oldx = pivot.x + odx * cosA - ody * sinA;
    p.oldy = pivot.y + odx * sinA + ody * cosA;
  }
}

function cutRopeAt(hit, clickX, clickY){
  // a cut is already pending (Fall Delay > 0, counting down) -- the rope
  // hasn't actually separated yet, so there's nothing new to cut.
  if (mainRope.pendingCut) return;
  const idx = Math.max(1, Math.min(hit.index, mainRope.points.length - 2));
  // refuse a cut whose TARGET point falls within Circle Cut Distance of the
  // anchor -- a double-click landing just outside isOnCircle's own (smaller,
  // hold-eligibility) margin can still target a rope point very close to the
  // anchor, which reads as "double-clicking near the circle cuts the rope
  // short" even though the press itself was technically off the circle.
  // A dedicated, independently-tunable distance (not reused from
  // isOnCircle) per explicit request, since the implicit reuse wasn't
  // generous enough for real reported clicks.
  const anchorForCut = circleAnchor();
  if (Math.hypot(hit.x - anchorForCut.x, hit.y - anchorForCut.y) < vmin(cfg.circleCutDistance)) return;
  // refuse the cut entirely if it would leave the remaining (anchor-side)
  // rope shorter than the configured minimum — the rope stays whole rather
  // than being clamped to some other length the user didn't ask for.
  const remainingLen = idx * mainRope.segLen;
  if (remainingLen < vh(cfg.minRopeLength)) return;
  const a = mainRope.points[idx - 1], b = mainRope.points[idx];
  let tx = b.x - a.x, ty = b.y - a.y;
  const tlen = Math.hypot(tx, ty) || 1;
  tx /= tlen; ty /= tlen;
  // perpendicular to the rope's local tangent, oriented so (1,0) is screen-right
  // when the rope hangs straight down (tangent (0,1)) — used to tell which side
  // of the rope the click landed on, so the cut sweep runs the direction the
  // user actually clicked from, not just a fixed screen-left/right assumption.
  const nx = ty, ny = -tx;
  const side = (clickX - hit.x) * nx + (clickY - hit.y) * ny;

  // the cut sweep-mark belongs to the REMAINING rope (still hanging from the
  // circle), not the eventual falling piece -- anchorIndex pins it to idx,
  // which stays the correct edge whether the split happens immediately
  // (Fall Delay 0) or later (see pendingCut below); renderCutSweep tracks
  // it live either way. A later cut overwrites this outright.
  const half = vmin(cfg.ropeThickness) / 2;
  mainRope.cutSweep = {
    progress: 0,
    anchorIndex: idx,
    startOffset: side > 0 ? half : -half,
    endOffset: side > 0 ? -half : half,
  };
  if (cfg.fallDelay > 0){
    // Defer the actual separation until the delay elapses -- the rope
    // stays ONE physics chain (still fully solved by integrateChain, still
    // pinned to the circle) instead of being split immediately into two
    // independently-integrated chains that then have to be kept in sync
    // by rigidly translating the piece to follow the parent's tip. That
    // translate-to-follow approach was the previous implementation and it
    // produced visible collision/seam artifacts when cut mid-swing --
    // translating by the shortened parent's tip delta doesn't reproduce
    // what the same point would have done had it stayed part of the
    // original, undivided chain, since a shorter chain swings differently.
    // Keeping it undivided sidesteps the mismatch entirely: nothing to
    // desync because there are no two separate chains yet. idx stays a
    // valid split point even if the rope keeps growing past it while the
    // cut is pending.
    mainRope.pendingCut = { idx, delay: cfg.fallDelay };
    return;
  }
  performMainRopeSplit(idx);
}

// Actually separates mainRope at idx into the remaining (anchor-side) rope
// and a new fallen piece -- called immediately from cutRopeAt() when Fall
// Delay is 0, or from update() once a pendingCut's delay has elapsed.
function performMainRopeSplit(idx){
  const lowerPoints = mainRope.points.slice(idx).map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
  mainRope.points = mainRope.points.slice(0, idx + 1);
  // keep the persisted real total (and its dev-panel display) in sync with
  // the now-shorter remainder — otherwise the next growRope() call would
  // resume accumulating from the stale PRE-cut total, and separately, the
  // Rope Length slider would still show the old length, so nudging it would
  // jump the rope back out near its pre-cut length instead of adjusting the
  // actual current (cut) one.
  mainRope.totalLength = mainRope.segLen * idx;
  // the remaining tip after a cut is always a full, already-committed
  // segment -- no growth in progress.
  mainRope.tipGrowLen = mainRope.segLen;
  // a cut changes the chain's own local geometry right at the new tip --
  // any smoothed growth direction carried over from BEFORE the cut
  // (tipGrowDirection()) belongs to a now-discarded portion of the rope,
  // so the next hold-to-grow should measure fresh rather than starting
  // biased toward wherever the rope was pointing pre-cut.
  mainRope.growDir = null;
  mainRope.tipOffset = null;
  setCfg('ropeLength', mainRope.totalLength / window.innerHeight * 100);
  if (lowerPoints.length >= 2){
    // Toppling (the initial random tilt) happens exactly at the moment of
    // real separation -- with a Fall Delay this is now the same instant
    // the piece starts actually falling, which is also the only instant
    // toppling makes physical sense (a still-attached piece has no reason
    // to tumble).
    topplePiece(lowerPoints);
    fallenPieces.push({ points: lowerPoints, segLen: mainRope.segLen });
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
}

// Splits an already-fallen piece into two independent pieces at the click
// point — same geometry/toppling as cutRopeAt's own piece split, but with
// no anchor/growth bookkeeping (a fallen piece has neither). The "upper"
// half (index 0..idx) keeps the piece's own identity and cutSweep mark,
// same convention as cutRopeAt's remaining rope keeping mainRope's; the
// "lower" half becomes a brand-new fallen piece with no mark of its own.
function cutPieceAt(pieceIndex, hit, clickX, clickY){
  const piece = fallenPieces[pieceIndex];
  if (!piece || piece.pendingCut) return;
  const idx = Math.max(1, Math.min(hit.index, piece.points.length - 2));
  const upperLen = idx * piece.segLen;
  const lowerLen = (piece.points.length - 1 - idx) * piece.segLen;
  if (upperLen < vh(cfg.minRopeLength) || lowerLen < vh(cfg.minRopeLength)) return;

  const a = piece.points[idx - 1], b = piece.points[idx];
  let tx = b.x - a.x, ty = b.y - a.y;
  const tlen = Math.hypot(tx, ty) || 1;
  tx /= tlen; ty /= tlen;
  const nx = ty, ny = -tx;
  const side = (clickX - hit.x) * nx + (clickY - hit.y) * ny;

  const half = vmin(cfg.ropeThickness) / 2;
  piece.cutSweep = {
    progress: 0,
    anchorIndex: idx,
    startOffset: side > 0 ? half : -half,
    endOffset: side > 0 ? -half : half,
  };
  if (cfg.fallDelay > 0){
    // See cutRopeAt()'s identical pendingCut comment -- same deferred-split
    // reasoning, just against this piece's own points instead of mainRope's.
    piece.pendingCut = { idx, delay: cfg.fallDelay };
    return;
  }
  performPieceSplit(piece, idx);
}

// Actually separates `piece` at idx -- see performMainRopeSplit()'s
// identical role for mainRope.
function performPieceSplit(piece, idx){
  const lowerPoints = piece.points.slice(idx).map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
  piece.points = piece.points.slice(0, idx + 1);
  if (lowerPoints.length >= 2){
    topplePiece(lowerPoints);
    fallenPieces.push({ points: lowerPoints, segLen: piece.segLen });
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
}

/* ---------------------------------------------------------------------
   Input: click(punch) / hold(grow or charge) / double-click(cut).
   Which hold behavior applies depends on WHERE the hold starts:
   - hold starting on the circle -> grows the rope (existing behavior).
   - hold starting on the rope -> charges punch intensity, fired on release
     (Click Hold Max Duration / Intensity Ceiling); a quick tap on the rope
     still goes through the normal punch/double-click-to-cut path below.
   Double-click is hand-rolled (not the native dblclick event) because a
   native click would otherwise fire before a dblclick is recognized —
   the spec requires a double click to never trigger a single click.
--------------------------------------------------------------------- */
let downInfo = null;   // {mode:'circle'} or {mode:'rope', x,y,hit,startTime,charging}
let holdTimer = null;
let pendingClick = null; // {hit,timer}

// Click diagnostics -- DEV_MODE only. One entry per input-state transition
// (down, hold-eligible, growing, charging, release action), both to the
// console AND to a visible, scrollable log inside the dev panel itself
// (#dpClickLog) -- the console alone isn't visible to a non-technical
// user testing the app, so the panel display is the primary surface this
// was actually requested for.
const CLICK_LOG_MAX_ENTRIES = 200;
function logClick(event, data){
  if (!DEV_MODE) return;
  console.log('[click]', event, data);
  const el = document.getElementById('dpClickLog');
  if (!el) return;
  const empty = el.querySelector('.dp-click-log-empty');
  if (empty) empty.remove();
  const line = document.createElement('div');
  const dataStr = Object.entries(data || {}).map(([k, v]) => k + ':' + (typeof v === 'number' ? round(v, 2) : v)).join(' ');
  line.textContent = event + '  ' + dataStr;
  el.appendChild(line);
  while (el.children.length > CLICK_LOG_MAX_ENTRIES) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function isOnCircle(x, y){
  const anchor = circleAnchor();
  // a generous margin beyond the circle's own visual radius — a small
  // circleSize is an easy miss otherwise, and the rope renders on top of
  // (visually through) the circle right where it emerges, so a press that's
  // "clearly meant for the circle" needs real forgiveness, not pixel-exact
  // targeting. Gates both hold-to-grow eligibility and the rope's own
  // exclusion zone (below), so the two stay consistent with each other.
  const circleR = vmin(cfg.circleSize) / 2 + vmin(4);
  return Math.hypot(x - anchor.x, y - anchor.y) <= circleR;
}

function hitTestRope(x, y){
  if (isOnCircle(x, y)) return null; // clicking the circle itself never counts as a rope hit
  const hit = nearestPointOnRope(x, y, mainRope.points);
  return hit.dist <= vmin(cfg.clickDistance) ? hit : null;
}

// Nearest fallen piece within Click Distance, if any -- same proximity gate
// as hitTestRope, checked against every piece independently since they're
// unrelated point chains scattered across the floor.
function hitTestPieces(x, y){
  let best = null;
  for (let i = 0; i < fallenPieces.length; i++){
    const hit = nearestPointOnRope(x, y, fallenPieces[i].points);
    if (hit.dist <= vmin(cfg.clickDistance) && (!best || hit.dist < best.dist)) best = { ...hit, pieceIndex: i };
  }
  return best;
}

// Whichever of the main rope or a fallen piece is closest to (x,y), tagged
// with which one it is -- used only for double-click-to-cut, which the
// user can aim at either. Punching/hold-charging stay rope-only (unchanged
// scope) and keep using hitTestRope/nearestPointOnRope directly.
function hitTestAny(x, y){
  const ropeHit = hitTestRope(x, y);
  const pieceHit = hitTestPieces(x, y);
  if (ropeHit && (!pieceHit || ropeHit.dist <= pieceHit.dist)) return { ...ropeHit, target: 'rope' };
  if (pieceHit) return { ...pieceHit, target: 'piece' };
  return null;
}

function onPointerDown(e){
  const x = e.clientX, y = e.clientY;
  // defensive: a pointerdown that never reaches onPointerUp/pointercancel
  // (dropped event, capture stolen by another element, etc.) would otherwise
  // leave its holdTimer's reference overwritten but the timer itself still
  // pending — it would later fire against a LATER click's downInfo and mark
  // that later click as a false hold, silently swallowing it. Clearing here
  // guarantees at most one holdTimer is ever live at a time.
  clearTimeout(holdTimer);

  if (isOnCircle(x, y)){
    downInfo = { mode: 'circle' };
    logClick('down:circle', { x, y });
    holdTimer = setTimeout(() => {
      if (!downInfo || downInfo.mode !== 'circle') return;
      growing = true;
      logClick('hold:grow-start', { x, y });
    }, HOLD_THRESHOLD_MS);
    return;
  }

  // hold-to-charge isn't limited by Click Distance — you can press down
  // anywhere and the hold still charges, aimed at whatever the nearest rope
  // point turns out to be. Only a QUICK tap (below) still needs real
  // proximity, since that's what targets a specific punch/cut point.
  const hit = nearestPointOnRope(x, y, mainRope.points);
  downInfo = { mode: 'rope', x, y, hit, startTime: performance.now(), charging: false };
  logClick('down:rope', { x, y, hitDist: hit.dist, hitIndex: hit.index });
  // Charging only becomes eligible after a FULL doubleClickThreshold of
  // holding, not the short HOLD_THRESHOLD_MS — this is what keeps it from
  // ever hijacking a real double-click. Provably safe, not just empirically:
  // if this release's own press duration already exceeds doubleClickThreshold,
  // the gap from the FIRST click's release (which is earlier still) must
  // exceed doubleClickThreshold too, so it could never have passed the
  // double-click gap check below anyway.
  holdTimer = setTimeout(() => {
    if (!downInfo || downInfo.mode !== 'rope') return;
    downInfo.charging = true;
    logClick('hold:charging-start', { x, y });
  }, cfg.doubleClickThreshold);
}

function onPointerUp(e){
  if (!downInfo) return;
  clearTimeout(holdTimer);
  const info = downInfo;
  downInfo = null;

  if (info.mode === 'circle'){
    logClick('up:circle', { wasGrowing: growing });
    growing = false;
    return;
  }

  const now = performance.now();

  if (pendingClick && (now - pendingClick.time) <= cfg.doubleClickThreshold){
    clearTimeout(pendingClick.timer);
    pendingClick = null;
    // re-resolve against CURRENT positions at release time -- the rope and
    // any fallen piece may both have moved since the press, and a double
    // click can be aimed at either (cuts the rope, or splits a piece).
    const target = hitTestAny(e.clientX, e.clientY);
    logClick('up:double-click', { x: e.clientX, y: e.clientY, willCut: !!target, target: target && target.target });
    if (target){
      if (target.target === 'rope') cutRopeAt(target, e.clientX, e.clientY);
      else cutPieceAt(target.pieceIndex, target, e.clientX, e.clientY);
    }
    return;
  }

  if (info.charging){
    // a genuine hold — not limited by Click Distance (press down anywhere);
    // gated instead by its own, more generous Click And Hold Distance,
    // checked against WHERE THE HOLD ENDS, not where it started — the user
    // can press anywhere and move the pointer toward the rope before
    // releasing, so the release position (not the stale press-time info.hit)
    // is what determines whether/where it fires. An earlier version reused
    // info.hit, which is frozen at pointerdown time, so moving the pointer
    // during the hold had no effect at all — a hold that started too far
    // from the rope stayed stuck failing even after being dragged right
    // over it, matching the reported "click and hold doesn't work."
    const releaseHit = nearestPointOnRope(e.clientX, e.clientY, mainRope.points);
    const heldMs = now - info.startTime;
    if (releaseHit.dist > vmin(cfg.holdDistance)){
      logClick('up:hold-release-too-far', { x: e.clientX, y: e.clientY, releaseDist: releaseHit.dist, heldMs });
      return;
    }
    const t = Math.min(1, heldMs / cfg.clickHoldMaxDuration);
    const intensity = cfg.clickIntensity + t * cfg.intensityCeiling;
    logClick('up:hold-release-punch', { x: e.clientX, y: e.clientY, releaseDist: releaseHit.dist, heldMs, t, intensity });
    // Intensity Ceiling stacks ON TOP of Click Intensity, not in place of it
    // -- a hold starts at the same intensity a quick tap would produce and
    // rises from there, reaching Click Intensity + Intensity Ceiling exactly
    // at Click Hold Max Duration.
    applyPunch(mainRope.points, releaseHit, e.clientX, e.clientY, intensity, 0);
    return;
  }

  // quick tap — arms pendingClick if the press landed near the rope OR a
  // fallen piece, so a double-click aimed at either (or a mix of the two)
  // still registers; only a ROPE tap fires the single-tap punch on its own
  // timeout — punching stays rope-only (unchanged scope), still keyed off
  // the original press-time rope hit (info.hit), same as before pieces
  // became double-click-cuttable.
  const nearAny = hitTestAny(info.x, info.y);
  if (!nearAny){
    logClick('up:tap-too-far', { x: info.x, y: info.y, hitDist: info.hit.dist });
    return;
  }
  if (pendingClick) clearTimeout(pendingClick.timer);
  logClick('up:tap-pending', { x: info.x, y: info.y, target: nearAny.target });
  pendingClick = {
    time: now,
    timer: setTimeout(() => {
      if (info.hit.dist <= vmin(cfg.clickDistance)){
        logClick('up:tap-punch', { x: info.x, y: info.y, hitDist: info.hit.dist, intensity: cfg.clickIntensity });
        applyPunch(mainRope.points, info.hit, info.x, info.y, cfg.clickIntensity, 0);
      }
      pendingClick = null;
    }, cfg.doubleClickThreshold),
  };
}

canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', () => { logClick('cancel', { wasGrowing: growing }); downInfo = null; growing = false; clearTimeout(holdTimer); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------------------------------------------------------------
   Update / render loop
--------------------------------------------------------------------- */
function floorY(){ return window.innerHeight - vh(cfg.floorHeight); }

function update(rawDt){
  const dt = rawDt * cfg.ropeAnimSpeed;
  const gravityAccel = vh(90) * cfg.gravityStrength * cfg.ropeWeight;

  mainRope.points[0].x = circleAnchor().x;
  mainRope.points[0].y = circleAnchor().y;
  if (growing) growRope(rawDt);
  const hasPartialTip = mainRope.tipGrowLen < mainRope.segLen;
  integrateChain(mainRope.points, mainRope.segLen, dt, gravityAccel, 0, hasPartialTip);
  if (hasPartialTip) positionGrowingTip();

  // A Fall Delay > 0 cut hasn't actually split mainRope yet (see
  // cutRopeAt's pendingCut) -- it just integrated as one whole chain above,
  // identically to an uncut rope. Once the countdown elapses, perform the
  // real split now, using this frame's already-updated positions.
  if (mainRope.pendingCut){
    mainRope.pendingCut.delay -= dt;
    if (mainRope.pendingCut.delay <= 0){
      const idx = mainRope.pendingCut.idx;
      mainRope.pendingCut = null;
      performMainRopeSplit(idx);
    }
  }

  // cutSweep.progress only drives the cosmetic sweep-mark overlay now
  // (render()) — it never gates anything's own physics, so a piece cut
  // mid-swing keeps swinging/falling continuously from the very next frame.
  // mainRope and any piece can each carry their own independent cutSweep
  // (a rope cut, and any number of subsequent piece-splits, all animate
  // on their own timeline).
  if (mainRope.cutSweep && mainRope.cutSweep.progress < 1){
    mainRope.cutSweep.progress = Math.min(1, mainRope.cutSweep.progress + rawDt * cfg.cutSpeed / CUT_SWEEP_BASE_SEC);
  }
  fallenPieces.forEach(piece => {
    if (piece.cutSweep && piece.cutSweep.progress < 1){
      piece.cutSweep.progress = Math.min(1, piece.cutSweep.progress + rawDt * cfg.cutSpeed / CUT_SWEEP_BASE_SEC);
    }
  });

  const fallGravity = vh(90) * cfg.gravityStrength * cfg.ropeWeight * cfg.ropeFallSpeed;
  fallenPieces.forEach(piece => {
    integrateChain(piece.points, piece.segLen, dt, fallGravity, -1);
    // A piece-on-piece cut (cutPieceAt) with Fall Delay > 0 hasn't actually
    // split `piece` yet -- same pendingCut deferral as mainRope's, checked
    // after this piece's own integration above so the split happens
    // against this frame's already-updated positions, identically to how
    // mainRope's pendingCut is resolved after ITS integration. A newly
    // split-off lower piece pushed here starts getting its own
    // integrateChain() from next frame's pass over fallenPieces.
    if (piece.pendingCut){
      piece.pendingCut.delay -= dt;
      if (piece.pendingCut.delay <= 0){
        const idx = piece.pendingCut.idx;
        piece.pendingCut = null;
        performPieceSplit(piece, idx);
      }
    }
  });

  if (cfg.floorEnabled){
    // the main rope (still attached to the circle) collides with the floor
    // too, not just cut-off pieces — otherwise growing it long enough to
    // reach the floor just clips straight through with no reaction at all.
    const fY = floorY();
    const allPoints = mainRope.points.slice();
    fallenPieces.forEach(piece => allPoints.push(...piece.points));
    allPoints.forEach(p => {
      if (p.y > fY){
        p.y = fY;
        p.oldx = p.x - (p.x - p.oldx) * 0.3;
        p.oldy = p.y;
      }
    });
    // pileRepulsion is deliberately NOT called here anymore. It has no
    // concept of chain adjacency -- it repels ANY two points closer than
    // minSep, including two points from far apart in the SAME chain that
    // simply ended up geometrically close after piling against the floor.
    // That fights integrateChain()'s distance constraint (which only ever
    // acts between true chain neighbors) for the ENTIRE rope, not just the
    // piled portion, and with only a handful of constraintIterations (a
    // dev-tunable, currently defaulted low) the solver can't recover from
    // that conflict within a frame -- confirmed as the dominant driver of
    // a real, reproduced bug: sustained hold-to-grow, once the tip reached
    // the floor, built into a severe, non-recovering tangle (worst-case
    // segment-length ratio >6x, dozens of points folded out of chain
    // order), reproducing the user's own screen-recorded "cut, then
    // extend again" report. Multiple other fixes attempted first (see
    // integrateChain()'s bendEnd comment and tipGrowDirection()'s
    // smoothing comment -- both real, independent bugs, both fixed, but
    // NEITHER was the actual cause here, confirmed by reproducing this
    // exact tangle with bendStiffness forced to 0). Isolated via direct
    // A/B: the same repro run with pileRepulsion call removed entirely
    // stayed stable (ratio ~0.7-1.3x) over a 20+ simulated-second hold,
    // well past the user's own ~24s recording; softening the floor
    // clamp's snap strength and re-solving constraints a second time on
    // floor-contact frames were also tried and did NOT help (the latter
    // made it measurably worse -- re-running integrateChain() re-triggers
    // its own velocity integration step, amplifying the correction rather
    // than just resolving it). The tradeoff: a rope piled deep at the
    // floor may render with less visual separation between overlapping
    // coils than pileRepulsion was meant to provide -- flagged as a
    // follow-up if that becomes its own complaint, since a real fix would
    // need pileRepulsion to be chain-adjacency-aware, not just removed.
  } else {
    fallenPieces = fallenPieces.filter(piece => piece.points.some(p => p.y < window.innerHeight * 1.5));
  }
}

function strokeRopeCurve(points, thicknessPx, color, endArcMult){
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = thicknessPx; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  const n = points.length;
  if (n === 2){
    // nothing to curve through -- a single segment is just a straight line.
    ctx.lineTo(points[1].x, points[1].y);
  } else {
    // Every interior point curves through itself toward the MIDPOINT of
    // itself and its neighbor (the standard smooth-curve-through-a-
    // polyline technique) -- EXCEPT the last one, which curves all the
    // way to the actual tip coordinate instead of a midpoint, since
    // there's no point past the tip to average with. An earlier version
    // used `ctx.lineTo(tip)` for that final leg instead, which always drew
    // a dead-straight line for roughly the last half-to-full segment
    // length regardless of the rope's actual physics state -- reported as
    // "the last ~20px end seems to be a stiff piece" (an almost exact
    // match for one segLen, ~24.9px at default settings). Confirmed as a
    // pure rendering artifact, not real stiffness: nothing in the physics
    // (constraints, bendStiffness, growth) singles out the tip's own
    // segment for extra rigidity outside of active growth (see
    // integrateChain()'s bendEnd, which only excludes the tip while a
    // partial segment is still growing). Curving through the actual tip
    // coordinate instead removes the straight leg entirely.
    for (let i = 1; i < n - 1; i++){
      const isLast = i === n - 2;
      const ex = isLast ? points[i+1].x : (points[i].x + points[i+1].x) / 2;
      const ey = isLast ? points[i+1].y : (points[i].y + points[i+1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, ex, ey);
    }
  }
  ctx.stroke();

  const tip = points[n - 1];
  if (endArcMult > 0){
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, (thicknessPx / 2) * endArcMult, 0, Math.PI * 2);
    ctx.fill();
  }
}

// direction of the LAST segment (second-to-last point -> tip), normalized;
// falls back to straight down for a degenerate (<2 point) chain.
function tipDirection(points){
  if (points.length < 2) return { x: 0, y: 1 };
  const a = points[points.length - 2], b = points[points.length - 1];
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: dx / len, y: dy / len };
}

function drawEndcap(points, thicknessPx, designKey, color, heightMult){
  const design = ENDCAP_DESIGNS[designKey];
  if (!design) return;
  const dir = tipDirection(points);
  const tip = points[points.length - 1];
  // rotates local "down" (0,1) to (dir.x,dir.y); derived from the standard
  // rotation matrix (x cosθ - y sinθ, x sinθ + y cosθ) solved for
  // (-sinθ,cosθ) = (dir.x,dir.y).
  const angle = Math.atan2(-dir.x, dir.y);
  const scale = thicknessPx / ENDCAP_ALIGNMENT.width;
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(angle);
  // heightMult stretches ONLY the local "down" axis (independent of X) --
  // applied here, before the anchor-shift below, so it scales the shape
  // around the path's own local origin. Since the anchor-shift translate is
  // the LAST transform call (so it acts FIRST on the path's raw coordinates,
  // canvas transforms compose in reverse call order), the anchor point
  // (topCenterX,topY) always lands at local (0,0) regardless of scale --
  // any scale factor leaves the origin fixed -- so the cap's top edge stays
  // exactly at the tip no matter how much vertical stretch is applied.
  ctx.scale(scale, scale * heightMult);
  ctx.translate(-ENDCAP_ALIGNMENT.topCenterX, -ENDCAP_ALIGNMENT.topY);
  ctx.fillStyle = color;
  ctx.fill(design.path);
  ctx.restore();
}

function renderCutSweep(entity){
  const sweep = entity.cutSweep;
  const t = sweep.progress;
  const off = sweep.startOffset + (sweep.endOffset - sweep.startOffset) * t;
  // anchored to entity.points[sweep.anchorIndex] -- the point the cut
  // actually landed on. With a Fall Delay (cfg.fallDelay) in effect, the
  // entity isn't split at cut time (see cutRopeAt/cutPieceAt's pendingCut
  // deferral) so anchorIndex generally is NOT pts.length-1 yet -- it only
  // becomes the entity's true last point once the deferred split actually
  // happens, at which point Math.min below just naturally resolves to it.
  // Still tracks live physics either way, same reasoning as before: the
  // entity keeps moving/rotating after the cut, so a snapshotted position
  // or direction would visibly stop tracking that motion.
  const pts = entity.points;
  const idx = Math.min(sweep.anchorIndex, pts.length - 1);
  const cutPoint = pts[idx];
  // tangent at the anchor point (idx-1 -> idx), recomputed fresh every
  // frame -- same "toward increasing index" convention cutRopeAt/
  // cutPieceAt derived nx/ny from, so the sweep runs from the same
  // physical edge it started at even while the entity keeps swinging.
  const a = pts[Math.max(0, idx - 1)], b = pts[idx];
  const tdx = b.x - a.x, tdy = b.y - a.y;
  const tlen = Math.hypot(tdx, tdy) || 1;
  const dir = { x: tdx / tlen, y: tdy / tlen };
  const nx = dir.y, ny = -dir.x;
  const x1 = cutPoint.x + nx * sweep.startOffset, y1 = cutPoint.y + ny * sweep.startOffset;
  const x2 = cutPoint.x + nx * off, y2 = cutPoint.y + ny * off;
  ctx.strokeStyle = cfg.cutSweepColor;
  ctx.lineWidth = Math.max(2, vmin(cfg.cutSweepThickness));
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function render(){
  ctx.fillStyle = cfg.backgroundColor;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  if (cfg.floorEnabled){
    const fY = floorY();
    ctx.fillStyle = cfg.floorColor;
    ctx.fillRect(0, fY, window.innerWidth, vh(cfg.floorThickness));
  }

  const anchor = circleAnchor();
  ctx.beginPath();
  ctx.arc(anchor.x, anchor.y, vmin(cfg.circleSize) / 2, 0, Math.PI * 2);
  ctx.fillStyle = cfg.circleColor;
  ctx.fill();

  const thickness = vmin(cfg.ropeThickness);
  // an SVG endcap replaces the plain round cap entirely (drawn separately,
  // below) rather than stacking both at the tip.
  const roundCapMult = cfg.endcapDesign === 'none' ? cfg.ropeEndCurveArc : 0;
  fallenPieces.forEach(piece => strokeRopeCurve(piece.points, thickness, cfg.ropeColor, roundCapMult));
  strokeRopeCurve(mainRope.points, thickness, cfg.ropeColor, roundCapMult);
  if (cfg.endcapDesign !== 'none'){
    fallenPieces.forEach(piece => drawEndcap(piece.points, thickness, cfg.endcapDesign, cfg.ropeColor, cfg.endcapHeight));
    drawEndcap(mainRope.points, thickness, cfg.endcapDesign, cfg.ropeColor, cfg.endcapHeight);
    // piece.points[0] is the cut edge (where it severed from the rest of the
    // rope, per renderCutSweep's own convention) -- reversing the piece's
    // points array before reusing drawEndcap() puts that cut point at
    // points[length-1] (the position drawEndcap always caps) and its
    // neighbor at points[length-2] (drawEndcap's own orientation reference),
    // so the cap is correctly positioned AND oriented at the severed end
    // with no separate code path needed.
    if (cfg.endcapAtCutEnd){
      // No separate "has it started falling yet" gate needed here anymore:
      // with Fall Delay > 0, a piece doesn't exist in fallenPieces at all
      // until the deferred split actually happens (cutRopeAt/cutPieceAt's
      // pendingCut, resolved in update()) -- so by the time a piece is here
      // to iterate over, it has, by construction, already started falling.
      fallenPieces.forEach(piece => {
        drawEndcap([...piece.points].reverse(), thickness, cfg.endcapDesign, cfg.ropeColor, cfg.endcapHeight);
      });
    }
  }
  if (mainRope.cutSweep && mainRope.cutSweep.progress < 1) renderCutSweep(mainRope);
  fallenPieces.forEach(piece => { if (piece.cutSweep && piece.cutSweep.progress < 1) renderCutSweep(piece); });
}

// Fixed-timestep physics: update() always advances by exactly this much,
// however many times are needed to catch up to real elapsed time (a plain
// requestAnimationFrame dt is fed straight from the browser's own frame
// timing, which jitters — every subsequent frame's motion, growth rate, and
// cut-sweep speed jittered along with it, which read as "jumpy").
// render() still runs once per real animation frame.
const FIXED_DT = 1 / 60;
const MAX_FRAME_DT = 0.25; // cap the catch-up burst after e.g. a backgrounded tab
let lastTime = performance.now();
let accumulator = 0;
let fpsAccum = 0, fpsFrames = 0, fpsLast = performance.now();
function loop(now){
  const frameDt = Math.min((now - lastTime) / 1000, MAX_FRAME_DT);
  lastTime = now;
  accumulator += frameDt;
  while (accumulator >= FIXED_DT){
    update(FIXED_DT);
    accumulator -= FIXED_DT;
  }
  render();
  if (DEV_MODE){
    fpsFrames++; fpsAccum += frameDt;
    if (now - fpsLast > 500){
      document.getElementById('dpFps').textContent = Math.round(fpsFrames / fpsAccum) + 'fps';
      fpsFrames = 0; fpsAccum = 0; fpsLast = now;
    }
  }
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
resetMainRope();
if (DEV_MODE){
  document.getElementById('devPanel').classList.remove('hidden');
  buildDevPanel();
  buildPanelStyleGroup();
  applyPanelStyle();
  initPanelDrag();
  initResizeHandles();
  initDevPanelChrome();
  initDeviceTabs();
  resetSettings(); // load last-saved values/order/geometry, if any (falls back to defaults if nothing saved)
}
requestAnimationFrame(loop);

})();
</script>
