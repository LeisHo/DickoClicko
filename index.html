// loops forward (1->N->1, a hard cut back to frame 1, not a ping-pong --
// no "loop back" behavior was requested for this one) for as long as it
// keeps being clicked to restart, same as animation 1's own always-on
// loop otherwise.
const FLICK2_FRAME_COUNT = ANI1_FRAMES.length + ANI2_FRAMES.length;
const flickFrames2 = ([]).concat(
  ANI1_FRAMES.map(n => 'data/FLICK/ANI/1/FRAMES-' + String(n).padStart(2, '0') + '.webp'),
  [...ANI2_FRAMES].reverse().map(n => 'data/FLICK/ANI/2/FRAMES-' + String(n).padStart(2, '0') + '.webp'),
).map(src => {
  const img = new Image();
  img.src = src;
  return img;
});
let flick2AnimTime = 0;
let flick2Playing = false;

// Hold-to-preview: press-and-hold on EITHER animation's own graphic cycles
// through these 4 frames for as long as it's held, and only starts that
// animation's real click-triggered sequence on release -- per explicit
// request ("when i click and hold on the animations, the animation only
// starts at release. but while its holding, cycle throug the frames").
// holdingFlick is 1, 2, or null -- which animation (if any) is currently
// being held; shared by both since only one graphic can be held at a time.
const FLICK_HOLD_FRAME_COUNT = 3;
const flickHoldFrames = [];
for (let i = 1; i <= FLICK_HOLD_FRAME_COUNT; i++){
  const img = new Image();
  img.src = `data/FLICK/ANI/3/FRAMES-${String(i).padStart(2, '0')}.webp`;
  flickHoldFrames.push(img);
}
let holdingFlick = null;
let flickHoldTime = 0;
// The hold-cycle speeds up the longer the hold lasts -- per explicit
// request ("the longer I hold, the faster the frames alternate... that
// maximum speed will be hit at the maximum hold duration"). flickHoldTime
// alone (elapsed real hold duration) still drives the ramp's own
// progress, but the actual frame-cycle POSITION now needs its own
// separate accumulator (flickHoldCyclePos) advanced each frame at
// whatever the CURRENT ramped rate is (see update()'s own tick) --
// unlike the constant-rate case, cyclePos is no longer a pure function of
// flickHoldTime alone (it's the accumulated integral of a rate that
// itself changes over time), so it can't be recomputed fresh here the
// way flickFrameIndex()/flick2FrameIndex() do.
let flickHoldCyclePos = 0;
function flickHoldFrameIndex(){
  return Math.floor(((flickHoldCyclePos % FLICK_HOLD_FRAME_COUNT) + FLICK_HOLD_FRAME_COUNT) % FLICK_HOLD_FRAME_COUNT);
}

function flick2FrameIndex(){
  if (!flick2Playing) return 0;
  const cyclePos = flick2AnimTime * FLICK_BASE_FPS * cfg.flick2AnimSpeed;
  return Math.floor(((cyclePos % FLICK2_FRAME_COUNT) + FLICK2_FRAME_COUNT) % FLICK2_FRAME_COUNT);
}

// The rect drawn in render() below, kept in sync there each frame so this
// hit-test always matches what's actually on screen regardless of the
// live Flick2 X/Y/Scale slider values.
const flick2Rect = { x: 0, y: 0, w: 0, h: 0 };
function isPointInFlick2(x, y){
  return x >= flick2Rect.x && x <= flick2Rect.x + flick2Rect.w &&
         y >= flick2Rect.y && y <= flick2Rect.y + flick2Rect.h;
}

/* ---------------------------------------------------------------------
   Canvas setup
--------------------------------------------------------------------- */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  // viewportW()/viewportH() (declared above, before this whole section --
  // see their own comment) rather than raw window.innerWidth/innerHeight
  // directly -- this runs immediately/synchronously at boot, just as
  // exposed to the same momentary 0-viewport read on mobile as
  // resetMainRope() was.
  canvas.width = viewportW() * dpr;
  canvas.height = viewportH() * dpr;
  canvas.style.width = viewportW() + 'px';
  canvas.style.height = viewportH() + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* ---------------------------------------------------------------------
   Rope physics — verlet point chain.
   Main rope: point 0 pinned to the circle center, grown/cut at runtime.
   Fallen pieces: unpinned independent chains, inherit velocity at cut time.
--------------------------------------------------------------------- */
const POINT_COUNT = 14;
const HOLD_THRESHOLD_MS = 180;
const MAX_FALLEN_PIECES = 60;
// target segment length (as %vh, matching the default rope's own density) —
// growth/manual-length-change ADD points to hold roughly this density rather
// than stretching a fixed point count further apart. A fixed point count
// over a growing length gets sparser and sparser, which both looks and
// behaves like a stiff stick instead of a rope (too few joints to bend at),
// and — since hit-testing walks the same straight-line segments — makes the
// visually-curved (smoothed) rope increasingly miss its own hit-test
// geometry the longer/sparser it gets, which is why an extended piece
// stopped being cuttable.
const TARGET_SEG_LEN_VH = 45 / (POINT_COUNT - 1);

function makeChain(n, x, y, segLen){
  const pts = [];
  // Every point used to share the EXACT same x (oldx===x too, zero
  // implied velocity) -- a perfectly vertically symmetric chain from
  // frame one. Harmless for a piece that just falls, but a genuine bug
  // for mainRope specifically: with gravity pulling straight down and
  // integrateChain()'s own boundaryConstraint clamping straight back up
  // along that SAME line every frame, nothing ever introduces a net
  // lateral force to break the symmetry -- confirmed via live tracing
  // (window.__debug): mainRope's anchor sat frozen at EXACTLY its
  // boundary radius, x identical to circleAnchor().x and to every other
  // point's own x, for 10+ real seconds with zero net motion. Reported
  // as "on startup... it stays this way for 5-10 seconds then it settles
  // to the position i expect" -- on a real device, ordinary floating-
  // point/timing noise eventually perturbs it enough to fall off-axis
  // (explaining the reported delay, which varies run to run since it
  // depends on incidental noise), but nothing GUARANTEED that happened
  // promptly, or at all (this sandbox's own more deterministic timing
  // never once escaped it across 10+ seconds of direct measurement). A
  // per-point random lean gives every chain a real, deterministic reason
  // to settle off-axis from frame one, with the model's full
  // wait/rise/pause duration to do so naturally before mainRope is ever
  // shown. Magnitude tuned by direct live measurement, not guessed: an
  // initial attempt at 3% of segLen was too small -- confirmed via
  // window.__debug tracing that it decayed back toward the exact
  // symmetric point within only a few physics ticks (a handful of ms),
  // producing no meaningfully visible settle motion at all before it was
  // ever shown -- basically indistinguishable from the original bug. 40%
  // is a real, visible perturbation (still small relative to the rope's
  // own total length) that produces genuine multi-tick swinging motion
  // as it settles, matching the "will then naturally fall... like a real
  // drop" behavior this code has always intended, rather than an
  // instantly-reabsorbed micro-nudge.
  const leanRange = segLen * 0.4;
  for (let i = 0; i < n; i++){
    const lean = (Math.random() - 0.5) * leanRange;
    pts.push({ x: x + lean, y: y + i * segLen, oldx: x + lean, oldy: y + i * segLen });
  }
  return pts;
}

let mainRope = null;
let fallenPieces = [];
let bgRope = null;

// Background "peeking" rope: a second, permanently non-interactive chain
// -- never cut, never grown, never clicked -- that exists purely to be
// drawn clipped to the circle's own shape (see render()). Built once at
// Boot at a fixed length (cfg.ropeDefaultLength at that moment -- bgRope
// represents the rope's own default/pristine silhouette, never the live
// mainRope's current cut/grown length, so it reads the same Default Rope
// Length spawn-time-only value mainRope itself spawns from) using the SAME
// targetSeg density every other rope in this file uses. "It cant get
// extended", per explicit request, means no USER-driven growth (no
// hold-to-grow, no manual resize) -- maintainBgRopeEnd() below still
// silently adjusts its point count internally so its own tip is never
// actually visible, an implementation detail invisible to the viewer,
// not a user-facing extension mechanic like setMainRopeTotalLength().
// startX/startY (optional) build the chain hanging from that point instead
// of circleAnchor() -- used by updateIntro()'s 'rising'-phase transition to
// rebuild bgRope hanging from its far-below climb-start position, so every
// point starts already consistent with gravity's own direction (see that
// call site's own comment for the inversion bug this fixes).
function resetBgRope(startX, startY){
  const anchor = circleAnchor();
  const sx = startX !== undefined ? startX : anchor.x;
  const sy = startY !== undefined ? startY : anchor.y;
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const pointCount = Math.max(2, Math.round(vh(cfg.ropeDefaultLength) / targetSeg) + 1);
  bgRope = { points: makeChain(pointCount, sx, sy, targetSeg), segLen: targetSeg };
}

const BG_ROPE_MIN_POINTS = 3;
const BG_ROPE_MAX_POINTS = 400; // hard safety cap against runaway extension

// "We should never see the rope end of background rope. just continue
// extending the end when its appropriate and remove the ends when
// theyre done being seen." -- bgRope's tip must always stay comfortably
// outside the circle's own clip region; this checks that distance every
// frame and extends (pushes a new point continuing the tip's current
// direction) or trims (pops the tip point) by at most one segment per
// frame. The two thresholds (1.5x vs 4x the safe radius) are deliberately
// far apart -- pure hysteresis, so a tip sitting near one single boundary
// doesn't add/remove a point every other frame.
function maintainBgRopeEnd(){
  const anchor = circleAnchor();
  const safeR = vmin(cfg.circleSize) / 2 + vmin(cfg.ropeThickness) * 2;
  const pts = bgRope.points;
  const tip = pts[pts.length - 1];
  const tipDist = Math.hypot(tip.x - anchor.x, tip.y - anchor.y);
  if (tipDist < safeR * 1.5 && pts.length < BG_ROPE_MAX_POINTS){
    const prev = pts[pts.length - 2] || pts[0];
    let dx = tip.x - prev.x, dy = tip.y - prev.y;
    const dlen = Math.hypot(dx, dy) || 1;
    dx /= dlen; dy /= dlen;
    const nx = tip.x + dx * bgRope.segLen, ny = tip.y + dy * bgRope.segLen;
    pts.push({ x: nx, y: ny, oldx: nx, oldy: ny });
  } else if (tipDist > safeR * 4 && pts.length > BG_ROPE_MIN_POINTS){
    pts.pop();
  }
}

// startingLengthPx: optional override for the built rope's initial total
// length -- used by the startup animation to build a minimal (single-
// segment) rope instead of the full configured length, so there's
// something for the intro's own growth phase to visibly extend from
// scratch. Defaults to the normal full cfg.ropeDefaultLength when
// omitted, same as every pre-intro caller of this function already
// expects -- this is a SPAWN, so it reads the Default, never whatever
// length a prior rope happened to be left at (see Default Rope Length's
// own comment).
function resetMainRope(startingLengthPx){
  const anchor = circleAnchor();
  const totalLen = startingLengthPx !== undefined ? startingLengthPx : vh(cfg.ropeDefaultLength);
  // Must build with the SAME segLen (targetSeg) that setMainRopeTotalLength()
  // pins everything to, not a POINT_COUNT-derived one -- those two used to
  // disagree whenever cfg.ropeDefaultLength's default no longer matched the
  // fixed 45%vh TARGET_SEG_LEN_VH was originally computed from (it was, until
  // a later "set defaults" round changed Rope Length's default without also
  // updating this constant). The mismatch left the rope built at one segLen
  // and then, the moment anything called setMainRopeTotalLength() (e.g. a
  // saved settings reload firing ropeLength's onChange), silently
  // overwritten to targetSeg for every point at once -- a whole-chain
  // rest-length jump the constraint solver had to violently correct,
  // reading as a bounce/glitch on load or on the slider's first touch.
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const pointCount = Math.max(2, Math.round(totalLen / targetSeg) + 1);
  mainRope = {
    points: makeChain(pointCount, anchor.x, anchor.y, targetSeg),
    segLen: targetSeg,
    totalLength: totalLen, // the real, continuously-accumulating length — see growRope()
    // how far the LAST segment currently reaches toward a full targetSeg --
    // always targetSeg (fully committed) except mid-growth, when it rises
    // from 0 back up to targetSeg each time growRope() adds a new tip point.
    // See integrateChain()'s tipSegLen param and growRope() for how this
    // drives smooth, continuous-looking extension instead of whole-segment
    // jumps.
    tipGrowLen: targetSeg,
    // smoothed growth-direction state (tipGrowDirection()) -- null starts
    // it fresh from the first real measurement rather than carrying over
    // whatever direction the PREVIOUS mainRope object happened to end on.
    growDir: null,
    // smoothed tip-offset-from-anchor state (positionGrowingTip()) -- same
    // fresh-start reasoning as growDir.
    tipOffset: null,
    // End Emerge state for this rope's own tip -- null means "fully
    // emerged" (nothing's ever been cut off it yet, or it's a fresh
    // rope), same convention as growDir/tipOffset.
    tipEmerge: null,
    // Boot-only endcap grow-in (see the 'pausing'->'growing' spawn code's
    // own comment) -- null means "not growing in" (either not yet armed,
    // or already finished). Deliberately NOT armed here at construction
    // time; set explicitly at the actual spawn moment instead, since
    // resetMainRope() itself runs well before that (this rope's chain
    // doesn't become visible until 'growing' starts).
    bootEndcapScale: null,
  };
}

function setMainRopeTotalLength(newTotalPx){
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const desiredCount = Math.max(2, Math.round(newTotalPx / targetSeg) + 1);
  const pts = mainRope.points;
  if (desiredCount > pts.length){
    const prev = pts[pts.length - 2] || pts[0];
    const tip = pts[pts.length - 1];
    let dx = tip.x - prev.x, dy = tip.y - prev.y;
    const dlen = Math.hypot(dx, dy) || 1;
    dx /= dlen; dy /= dlen;
    while (pts.length < desiredCount){
      const last = pts[pts.length - 1];
      const nx = last.x + dx * targetSeg, ny = last.y + dy * targetSeg;
      pts.push({ x: nx, y: ny, oldx: nx, oldy: ny });
    }
  } else if (desiredCount < pts.length){
    pts.length = Math.max(2, desiredCount);
  }
  // segLen is ALWAYS exactly targetSeg, never derived from newTotalPx/count.
  // Deriving it from the point count used to mean every single new point
  // added during growth also silently changed the rest-length target for
  // EVERY existing segment in the same instant (a rounding-driven step, not
  // matching the continuously-growing newTotalPx) -- the constraint solver
  // then had to correct that whole-chain mismatch on the very next frame,
  // which read as a small jitter/bounce each time growth crossed into a new
  // point, even on an otherwise-still rope. Since new points are already
  // inserted exactly targetSeg from their neighbor above, keeping segLen
  // pinned to targetSeg means insertion never violates the constraint it's
  // about to be solved against, so there's nothing left to correct.
  mainRope.segLen = targetSeg;
  // persist the REAL requested total separately from what the (quantized,
  // whole-point-count) segLen*pointCount implies -- growRope() below reads
  // this back as its baseline every frame. Without a persisted value here,
  // sustained growth would silently stall between point-insertion thresholds:
  // segLen*(pointCount-1) doesn't change at all until the NEXT point gets
  // added, so re-deriving "current total" from it every frame would discard
  // however much sub-threshold growth had already accumulated.
  mainRope.totalLength = newTotalPx;
  // a direct set (slider drag, saved-settings reload) always produces
  // uniform, fully-committed segments -- no growth-in-progress tip.
  mainRope.tipGrowLen = targetSeg;
}

function circleAnchor(){
  return { x: vw(cfg.circleX), y: vh(cfg.circleY) };
}

function closestPointOnSegment(px, py, a, b){
  const abx = b.x - a.x, aby = b.y - a.y;
  const abLenSq = abx * abx + aby * aby || 0.0001;
  let t = ((px - a.x) * abx + (py - a.y) * aby) / abLenSq;
  t = Math.max(0, Math.min(1, t));
  return { x: a.x + abx * t, y: a.y + aby * t, t };
}

function nearestPointOnRope(px, py, points){
  let best = { dist: Infinity, index: 0, x: points[0].x, y: points[0].y };
  for (let i = 0; i < points.length - 1; i++){
    const a = points[i], b = points[i + 1];
    const cp = closestPointOnSegment(px, py, a, b);
    const d = Math.hypot(px - cp.x, py - cp.y);
    if (d < best.dist) best = { dist: d, index: cp.t < 0.5 ? i : i + 1, x: cp.x, y: cp.y };
  }
  return best;
}

function integrateChain(points, segLen, dt, gravityAccel, pinnedIndex, skipLastSegment, boundaryConstraint){
  // skipLastSegment also excludes the growing-tip POINT itself (not just its
  // segment's distance/bend constraints, handled further below) from this
  // basic Verlet step -- positionGrowingTip() places it directly every
  // frame and owns its oldx/oldy entirely, so it's meant to never enter the
  // solver at all (see that function's own comment). This loop was the one
  // place that claim didn't hold: it only ever excluded pinnedIndex, so the
  // fresh, near-zero-length tip pushed by growRope() still got a real
  // gravity+velocity kick here on its very first frame (inheriting prev's
  // velocity, per growRope()'s own "start it moving, not at rest" fix) --
  // positionGrowingTip() then only partially (its own 0.25-1.0 smoothing
  // ramp) pulled it back toward the intended kinematic position, leaving a
  // real residual displacement that's tiny in absolute px but huge relative
  // to that segment's own near-zero length, i.e. a large swing in its local
  // direction. Confirmed via direct frame-by-frame tracing during a
  // swinging+growing simulation: the angle between the newly-committed
  // segment and the brand-new growing one flipped by up to ~180 degrees
  // right at commit, decaying back over the next several frames as the
  // segment grew long enough to dilute the residual -- reproducing the
  // user's "still extends in a jittery fashion" report even after the
  // separate tip-position-smoothing fix above. Excluding the tip here
  // entirely removes the kick at its source.
  const tipIndex = skipLastSegment ? points.length - 1 : -1;
  // boundaryConstraint.weightMult (Anchor Weight) lets that one point feel
  // MORE or LESS gravity than the rest of the chain -- e.g. mainRope's own
  // anchor, so it can look/feel heavier
  // ("like an anchor") even though it's no longer rigidly fixed. Defaults to
  // 1 (identical to every other point) whenever boundaryConstraint is absent
  // or doesn't specify one, so nothing changes for fallenPieces or for a
  // mainRope with Anchor Weight left at its own default.
  for (let i = 0; i < points.length; i++){
    if (i === pinnedIndex || i === tipIndex) continue;
    const p = points[i];
    const weightMult = (boundaryConstraint && i === boundaryConstraint.index && boundaryConstraint.weightMult !== undefined)
      ? boundaryConstraint.weightMult : 1;
    const vx = (p.x - p.oldx) * cfg.damping;
    const vy = (p.y - p.oldy) * cfg.damping;
    p.oldx = p.x; p.oldy = p.y;
    p.x += vx;
    p.y += vy + gravityAccel * weightMult * dt * dt;
  }
  // skipLastSegment excludes the LAST segment from distance-constraint
  // solving entirely -- used while that segment is a growing tip (see
  // positionGrowingTip()) so the solver never tries to enforce a stale full
  // segLen against it. An earlier version instead gave the solver a rising
  // "tipSegLen" target for that one segment every frame; that continuously
  // moving target acted as a sustained forcing function on the solver, and
  // with only 6 constraint-solve sweeps and 0.99 damping (the original
  // hardcoded values -- both are now cfg.constraintIterations/cfg.damping
  // dev sliders) barely dissipating anything, residual correction error
  // compounded over many
  // seconds of holding into a real, reproduced bug: after ~4-15s of
  // continuous growth the tip (and nearby segments) built up a large,
  // visibly wild swing -- confirmed by a direct simulation showing segment
  // lengths reaching 2.9x their rest length and points folding back on
  // themselves, not just normal swinging. Now the growing tip is placed
  // directly (see positionGrowingTip()), never entering the iterative
  // solver at all, so it can't inject anything into it.
  const segCount = points.length - 1 - (skipLastSegment ? 1 : 0);
  for (let iter = 0; iter < cfg.constraintIterations; iter++){
    for (let i = 0; i < segCount; i++){
      const a = points[i], b = points[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const diff = (dist - segLen) / dist;
      const aFixed = i === pinnedIndex, bFixed = (i + 1) === pinnedIndex;
      const offX = dx * diff * 0.5, offY = dy * diff * 0.5;
      if (!aFixed){ a.x += offX; a.y += offY; }
      if (!bFixed){ b.x -= offX; b.y -= offY; }
    }
    // Bending constraint: gently pulls each interior point toward the
    // midpoint of its two neighbors, i.e. toward local straightness. Pure
    // distance constraints (above) have ZERO resistance to bending -- any
    // angle between two segments, including a full fold-back, satisfies
    // them equally well. A strong-enough punch (applyPunch()'s falloff
    // pushes a wide neighborhood of points sideways by DIFFERENT amounts)
    // can fold the chain onto itself, and the distance solver alone then
    // has no reason to ever undo that fold -- it's just as "valid" as
    // straight. Confirmed by direct reproduction: a single punch left the
    // chain permanently kinked (2-point-span distance stuck at ~23px vs an
    // expected ~55px for a straight chain, unrecovered after 3 full
    // simulated seconds) -- reproducing the real, user-recorded "crazy
    // movement"/knot bug. `cfg.bendStiffness` (default 0.15, tuned low so
    // ordinary swinging still looks floppy/rope-like, not stick-rigid) is
    // applied once per constraint iteration, same cadence as the distance
    // constraints, so both converge together.
    //
    // bendEnd mirrors segCount's own skipLastSegment handling above -- NOT
    // just "loop bound is points.length-1, one short of the tip", which
    // only keeps the tip from being MOVED by this constraint but still lets
    // it be READ as neighbor `c` on the loop's last iteration (i =
    // points.length-2, c = points[points.length-1] = the tip). While a
    // partial tip is active, that tip is kinematically repositioned every
    // frame by positionGrowingTip() FROM this same point's own position
    // (points.length-2, i.e. dir.prev) -- so bending this point toward a
    // midpoint that includes the tip closes a feedback loop between the
    // two: bend pulls prev toward the tip's last-frame position, then
    // positionGrowingTip() re-extends the tip from prev's new (bent)
    // position and direction, repeating every frame. Confirmed via a
    // user-supplied screen recording as the real cause of a severe,
    // reproduced tangle (the rope curling into a tight, chaotic knot within
    // ~1s of holding to grow after a cut) -- not present before
    // bendStiffness was added, and specific to active growth, matching
    // exactly what the recording showed. Excluding dir.prev from the
    // bending constraint entirely while a partial tip exists (same
    // skipLastSegment signal the distance constraint already uses to leave
    // that whole segment alone) breaks the loop.
    if (cfg.bendStiffness > 0){
      const bendEnd = points.length - 1 - (skipLastSegment ? 1 : 0);
      for (let i = 1; i < bendEnd; i++){
        if (i === pinnedIndex) continue;
        const a = points[i - 1], b = points[i], c = points[i + 1];
        const midX = (a.x + c.x) / 2, midY = (a.y + c.y) / 2;
        b.x += (midX - b.x) * cfg.bendStiffness;
        b.y += (midY - b.y) * cfg.bendStiffness;
      }
    }
    // boundaryConstraint ({index, center, radius}): keeps points[index]
    // inside a circular boundary, e.g. mainRope.points[0] inside the
    // circle graphic. Applied EVERY iteration, alongside distance/bend
    // above, rather than once as a post-pass after the whole solve
    // finishes -- a post-pass version was tried first and produced a real,
    // measured, persistent instability: clamping the point to an EXACT
    // boundary position unilaterally overrides whatever the distance
    // constraint (segment 0-1) had just computed for it, discarding that
    // correction every single frame the point rests against the boundary
    // (confirmed via direct simulation: segment(0,1)'s own length ratio
    // sat around 1.4-1.7x and never recovered even after 2s of otherwise
    // undisturbed settling, while every other segment stayed near a
    // healthy ~1.0-1.1x -- clearly localized to the one segment fighting
    // this constraint, not a general chain-wide problem). A flat boundary
    // (the floor) doesn't have this problem because clamping only ONE
    // axis (y) still leaves x fully free for the distance constraint to
    // satisfy segLen through; a circular boundary has no such spare axis
    // -- clamping position at all necessarily fixes BOTH x and y. Solved
    // the same way the bend-vs-distance interaction two constraints ago
    // already solves it: let both constraints iterate together
    // `constraintIterations` times so they can negotiate a position that
    // reasonably satisfies both, instead of one unconditionally
    // overriding the other's result.
    if (boundaryConstraint){
      const bp = points[boundaryConstraint.index];
      const bdx = bp.x - boundaryConstraint.center.x, bdy = bp.y - boundaryConstraint.center.y;
      const bdist = Math.hypot(bdx, bdy) || 1e-6;
      if (bdist > boundaryConstraint.radius){
        // Position-only clamp, same as every other constraint in this loop
        // (distance/bend never touch oldx/oldy either) -- deliberately NOT
        // shifting oldx/oldy here. oldx/oldy is already fixed for the
        // WHOLE frame (set once, at the very top of this function, to last
        // frame's final position); leaving it alone means next frame's
        // implied velocity is naturally (this frame's final clamped
        // position - last frame's position), which already correctly
        // preserves tangential motion (rolling along the boundary) while
        // killing radial motion (no bounce), with zero extra bookkeeping.
        // An earlier version of this fix DID shift oldx/oldy here, on the
        // theory that it would preserve velocity across the clamp -- that
        // was wrong and double-counted: this block can fire on more than
        // one of the constraintIterations rounds per frame (the distance
        // constraint pulling point 0 back out between rounds), and shifting
        // oldx/oldy on EVERY firing compounds each round's correction on
        // top of the last, producing an implied velocity many times too
        // large (confirmed via direct simulation: a 15px/frame outward
        // velocity came out as 323px/frame after just one update() call).
        // The real cause of the "zooms back to its default spot" complaint
        // was constrainAnchorToCircle()'s separate, explicit bounce
        // formula -- removed entirely below -- not this position clamp,
        // which was already correct as originally written.
        bp.x = boundaryConstraint.center.x + (bdx / bdist) * boundaryConstraint.radius;
        bp.y = boundaryConstraint.center.y + (bdy / bdist) * boundaryConstraint.radius;
      }
    }
  }
}

// mainRope.points[0] is no longer rigidly pinned to circleAnchor() -- per
// explicit request, it's a free physics point kept inside the circle
// entirely by integrateChain()'s own boundaryConstraint param (see that
// function's comment). There used to be a separate bounce step here
// (constrainAnchorToCircle(), velocity-reflection off the boundary normal)
// -- removed per explicit follow-up feedback: it read as the anchor
// "suddenly zooming back to its default spot" rather than a natural
// weighted body falling or rolling down the side of the circle. The
// position-clamp above (a plain position-only clamp, like every other
// constraint in that loop -- see its own comment for why touching
// oldx/oldy there was tried and was actually wrong) already produces
// exactly that natural roll/settle behavior on its own, with no separate
// reflection formula needed.
// Circle Offset (cfg.circleBoundaryOffset) lets the anchor's own confinement
// radius differ from the circle GRAPHIC's own radius (vmin(circleSize)/2) --
// positive shrinks the playable interior. Negative USED to let the anchor
// bulge past the drawn circle's own edge (see the removed comment this
// replaced, kept in CODE_SUMMARY's gotchas for the full history); per
// explicit correction ("the main circle is the master boundary. everything
// else within that never breaks that rule") the circle itself is now a hard
// ceiling -- Circle Offset can only shrink the confinement radius INTERIOR
// to the circle, never push it past the circle's own edge, regardless of
// sign.
function anchorBoundaryRadius(){
  const circleRadius = vmin(cfg.circleSize) / 2;
  // Floored at a small positive minimum, not 0 -- a large enough POSITIVE
  // Circle Offset relative to a small Circle Size would otherwise go
  // negative, which is meaningless for a circle's own radius and broke the
  // boundary math (confirmed directly: an offset large enough to exceed
  // circleSize/2 drove the radius negative, at which point `dist > R` is
  // always true regardless of the anchor's real position, and
  // `center + normal*R` with a negative R places the clamp point on the
  // OPPOSITE side of the circle from whichever direction the anchor was
  // actually heading). Ceiled at circleRadius -- the circle is the master
  // boundary; a negative offset (or offset 0) now lands exactly ON the
  // circle's own edge instead of bulging past it.
  return Math.max(2, Math.min(circleRadius, circleRadius - vmin(cfg.circleBoundaryOffset)));
}

// A fallen piece's own rendered thickness at its CURRENT age -- holds at
// its baseThickness (captured when it was created) until Piece Decay
// Delay elapses, then decreases at Piece Decay Speed (%vmin/s) down to a
// floor of Piece Minimum Thickness. Per explicit request: "the speed at
// which cut off rope segments 'decay'... decrease in rope thickness
// until they hit the minimum thickness" plus a separate delay before
// decay starts. Falls back to a piece's own baseThickness unconditionally
// (no decay math at all) if either field is missing -- defensive only,
// every real piece-creation site sets both.
function pieceThickness(piece){
  if (piece.baseThickness === undefined || piece.age === undefined) return vmin(cfg.ropeThickness);
  const decaying = Math.max(0, piece.age - cfg.pieceDecayDelay);
  return Math.max(vmin(cfg.pieceMinThickness), piece.baseThickness - vmin(cfg.pieceDecaySpeed) * decaying);
}

// How far a piece's own endcap graphic actually extends PAST the
// physics point it's anchored to, in world px, once fully emerged --
// mirrors drawEndcap()'s own geometry exactly (ENDCAP_ALIGNMENT.topY ->
// designBottomY, scaled by heightThicknessPx/ENDCAP_ALIGNMENT.width,
// then by heightMult) without actually drawing anything. Used by
// pieceCollision() below to inflate that point's own collision radius,
// per explicit request ("the rope endcap should also be affected by
// collision detection... the rope start and end endcaps should not be
// allowed to overlap other ropes, or other endcaps") -- previously
// collision only ever considered the underlying chain's own points,
// completely ignoring the endcap's own rendered shape sticking out past
// them, so 2 pieces' points could sit a valid minSep apart while their
// actual endcap graphics still visibly overlapped. designKey 'none'
// (no endcap selected at all) returns 0, same as drawEndcap() itself
// being a no-op in that case.
function endcapExtensionPx(designKey, heightThicknessPx, heightMult){
  if (designKey === 'none') return 0;
  const designBottomY = ENDCAP_BOTTOM_Y[designKey] !== undefined ? ENDCAP_BOTTOM_Y[designKey] : ENDCAP_ALIGNMENT.topY;
  const heightNormalScale = heightThicknessPx / ENDCAP_ALIGNMENT.width;
  return (designBottomY - ENDCAP_ALIGNMENT.topY) * heightNormalScale * heightMult;
}

// Cross-PIECE collision only -- two different fallen pieces push each
// other apart (so cut-off segments stack or shove each other around
// instead of freely overlapping, per explicit request), but a piece
// never repels its own points against each other. This is deliberately
// NOT the old pileRepulsion() (removed below): that function took one
// flat array with no concept of which piece a point came from, so it
// repelled ANY two points closer than minSep including two points far
// apart in the SAME chain -- fighting that chain's own distance/bend
// constraints and causing the severe tangle documented at this
// function's own call site. Iterating piece-PAIRS (never a piece against
// itself) sidesteps that class of bug entirely, by construction. A cheap
// per-piece bounding-box pre-check (computed once per piece per frame,
// not per pair) skips the expensive point-by-point double loop for any
// pair that clearly can't be touching yet.
// The original 1.15 margin (and the `Math.max(2, ...)` floor) is gone:
// reported directly -- "when one is laying on top of the other. I still
// see a couple pixels of space between the 2 when one is laying on top
// of the other. there should be none." At default thickness (~6px),
// 1.15x was adding ~0.9px of REAL separation beyond actual contact --
// not an anti-aliasing illusion, an intentional gap the old margin was
// built to create. Per the same reasoning as the endcap/rope seam fix
// (2 independently-rasterized shapes that only ever exactly touch can
// still show an anti-aliasing hairline), separation now UNDERSHOOTS
// contact by a small margin instead so touching chains render with a
// hair of real overlap rather than a hair of real gap.
//
// PROPORTIONAL, not a fixed pixel amount -- an earlier version
// subtracted a fixed 0.75px, which could EXCEED the entire
// thickness-based separation once both sides decayed down near Piece
// Minimum Thickness, and `Math.max(0, ...)` clamped the result to
// EXACTLY 0 -- no enforced separation left between decayed pieces' own
// centerlines. Reported directly: "as they shrink down in thcikness to
// minimum thickness, instead of piling ontop of each other, they end up
// overlapping each other on the ground such that it looks like only a
// single layer." A fixed FRACTION of the pair's own combined radius can
// never fully cancel it out regardless of how thin either side has
// decayed -- 15% is the same kind of judgment call the fixed-pixel
// version was, just expressed proportionally instead of absolutely.
const PIECE_SEAM_OVERLAP_FRAC = 0.15;

// See pieceCollision()'s own mainRope-vs-piece call site for the full
// story -- a freshly-cut piece starts exactly coincident with mainRope's
// own tip, so mainRope collision must stay off it for a brief window or
// the near-zero-distance/large-minSep pair produces a violent one-frame
// separation ("jolt"). 0.3s judgment call, not a measured value.
const MAIN_COLLISION_GRACE_AGE = 0.3;

// Reported directly after the grace period above shipped: "the rope
// cutting jumping bug is sitll occuring" plus "the cut segments of rope
// on the floor are now sliding around slowly." The grace period only
// DELAYED the violent correction, it never actually bounded its size --
// the instant a piece's age crosses MAIN_COLLISION_GRACE_AGE, if it's
// still meaningfully overlapping mainRope's own (endcap-inflated) tip,
// resolveChainCollision still threw the ENTIRE correction in one frame,
// same as before. And separately, mainRope-vs-piece ran unconditionally
// whenever any fallen piece existed at all, even while mainRope was just
// ordinarily hanging/swinging (low damping, cfg.damping=0.986, by design
// long-lasting) nowhere near a real floor pile -- so a piece resting
// anywhere near mainRope's own ambient sway kept getting nudged by it
// every single frame, reading as a slow, continuous, unwanted drift.
// COLLISION_MAX_PUSH_PER_S bounds resolveChainCollision()'s own
// per-frame correction to a fixed px/s rate (scaled by dt so it isn't
// frame-rate dependent) regardless of how large the underlying overlap
// is -- a big coincident-point overlap now resolves smoothly over
// several frames instead of snapping instantly, whether that overlap
// came from a fresh cut, a residual overlap right as the grace period
// ends, or genuine contact once mainRope really does reach a floor
// pile. 400 %vmin/s is a judgment call (fast enough that a real,
// intentional pile-up still looks responsive within a few frames, not
// sluggish), not a measured value.
const COLLISION_MAX_PUSH_PER_S = 400;

// Per-chain, per-POINT collision radius -- ordinary rope points use half
// the chain's own live thickness; the 2 ends (points[0], the cut edge
// for a piece / the never-capped anchor for mainRope, and points[last],
// the free tip) get an ADDITIONAL radius on top of that when an endcap
// actually lives there, approximating the endcap's own elongated shape
// as a bigger circle centered on that same physics point -- not a
// precise polygon collision against the endcap's real outline, which
// would need a much more involved shape-collision system for a
// decorative feature that's never the rope's own primary silhouette;
// this is a deliberate, documented simplification that still satisfies
// the actual request (no visible overlap) in the common case. Per
// explicit request: "the rope endcap should also be affected by
// collision detection... the rope start and end endcaps should not be
// allowed to overlap other ropes, or other endcaps."
function pieceCollisionRadii(points, thick, tipExtension, cutExtension){
  const baseRadius = thick / 2;
  const n = points.length;
  const radii = new Array(n).fill(baseRadius);
  radii[n - 1] = baseRadius + tipExtension;
  radii[0] = baseRadius + cutExtension;
  let maxRadius = baseRadius;
  for (const r of radii) if (r > maxRadius) maxRadius = r;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of points){
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  return { points, radii, maxRadius, box: { minX, maxX, minY, maxY } };
}

// Pushes 2 chains' own points apart wherever a pair sits closer than
// their combined (radius-inflated, seam-undershot) separation -- shared
// by both mainRope-vs-piece and piece-vs-piece below so the 2
// relationships behave identically rather than via 2 near-duplicate
// loops. A cheap bounding-box pre-check (padded by each chain's own
// largest per-point radius, so an inflated endcap end is never
// under-counted) skips the expensive point-by-point double loop for any
// pair that clearly can't be touching yet.
function resolveChainCollision(dataA, dataB, maxPush){
  const pad = dataA.maxRadius + dataB.maxRadius;
  const ba = dataA.box, bb = dataB.box;
  if (ba.maxX + pad < bb.minX || bb.maxX + pad < ba.minX ||
      ba.maxY + pad < bb.minY || bb.maxY + pad < ba.minY) return;
  const ptsA = dataA.points, ptsB = dataB.points;
  for (let i = 0; i < ptsA.length; i++){
    const p = ptsA[i];
    const ri = dataA.radii[i];
    for (let j = 0; j < ptsB.length; j++){
      const q = ptsB[j];
      const minSep = Math.max(0, (ri + dataB.radii[j]) * (1 - PIECE_SEAM_OVERLAP_FRAC));
      const dx = q.x - p.x, dy = q.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0.0001 && dist < minSep){
        // Capped at maxPush (see COLLISION_MAX_PUSH_PER_S's own comment)
        // so a large overlap -- coincident fresh-cut points, or anything
        // else -- resolves gradually over several frames instead of
        // snapping to full separation in one.
        const push = Math.min((minSep - dist) / 2, maxPush);
        const nx = dx / dist, ny = dy / dist;
        p.x -= nx * push; p.y -= ny * push;
        q.x += nx * push; q.y += ny * push;
      }
    }
  }
}

// endcapExt: given a chain's own live thickness and whichever
// heightThicknessPx drawEndcap() would actually use for that specific
// end, returns how far that end's endcap extends past its own point (0
// when no endcap is selected at all, or when that particular end never
// gets one).
function pieceCollision(dt){
  const hasEndcapForCollision = cfg.endcapDesign !== 'none';
  const endcapExt = heightThicknessPx => hasEndcapForCollision ? endcapExtensionPx(cfg.endcapDesign, heightThicknessPx, cfg.endcapHeight) : 0;
  // See COLLISION_MAX_PUSH_PER_S's own comment -- caps every correction
  // below to a fixed px/s rate (scaled by dt so it's frame-rate
  // independent) so nothing ever resolves in one violent snap.
  const maxPush = vmin(COLLISION_MAX_PUSH_PER_S) * dt;

  // mainRope-vs-piece: per explicit request ("when i extend the main
  // rope very very long, such that it reaches the floor and beyond, the
  // extended long rope should also pile up on top of any rope segments
  // that are on the floor as opposed to going right through them") --
  // previously this function only ever repelled 2 DIFFERENT fallen
  // pieces against each other; mainRope itself was completely excluded
  // (it already collides with the FLOOR separately, in update()'s own
  // floor-clamp block, but never with a PILE resting on that floor).
  // mainRope's own live thickness uses the SAME formula render() computes
  // (vmin(cfg.ropeThickness) * ropeThicknessMultiplier) -- recomputed
  // here since that's a render()-local const, not something update()'s
  // own physics pass already has. mainRope's anchor (points[0]) never
  // has an endcap (see render()'s own comment on that), so its cut-end
  // extension is always 0 -- only the tip (points[last]) can have one.
  //
  // Gated on the tip actually being close to the CURRENT pile's own
  // topmost point, not "any fallen piece exists anywhere" -- reported
  // directly after the age-grace fix below shipped: "the cut segments of
  // rope on the floor are now sliding around slowly." Without this,
  // mainRope-vs-piece ran every frame regardless of where mainRope
  // actually was, so its own ordinary post-cut hang/swing (low damping,
  // cfg.damping=0.986, deliberately long-lasting) kept nudging any piece
  // whose bounding box happened to overlap it, read as a slow, unwanted,
  // continuous drift. The original request was specifically about a
  // DELIBERATELY extended-long rope reaching down to a floor pile, not
  // ordinary hanging -- this margin (10%vh, a judgment call) lets the
  // pass engage a little before actual contact (so the endcap's own
  // inflated radius has room to make contact naturally) without ever
  // firing while mainRope is nowhere near the pile at all.
  if (fallenPieces.length > 0){
    let pileTopY = Infinity;
    fallenPieces.forEach(piece => piece.points.forEach(p => { if (p.y < pileTopY) pileTopY = p.y; }));
    const tipY = mainRope.points[mainRope.points.length - 1].y;
    if (tipY >= pileTopY - vh(10)){
      const mainThick = vmin(cfg.ropeThickness) * ropeThicknessMultiplier;
      const mainData = pieceCollisionRadii(mainRope.points, mainThick, endcapExt(mainThick), 0);
      fallenPieces.forEach(piece => {
        // MAIN_COLLISION_GRACE_AGE: a piece freshly split off mainRope
        // starts with its own points at the EXACT same position as
        // mainRope's own (now-shortened) tip -- performMainRopeSplit()
        // copies them directly. The very next frame or two,
        // topplePiece()'s tilt/velocity nudges the piece a tiny amount
        // away, but that's still far closer than this pair's combined
        // (thickness+endcap-inflated) minSep -- this age gate skips
        // mainRope collision entirely for a piece still in its initial
        // fall, so it settles via gravity/floor/piece-vs-piece collision
        // alone during that window; maxPush above (not this gate alone)
        // is what actually prevents a violent snap once collision does
        // engage, including right as this gate opens.
        if (piece.age < MAIN_COLLISION_GRACE_AGE) return;
        const thick = pieceThickness(piece);
        // Tip always uses this piece's own ORIGINAL baseThickness
        // (matching drawEndcap()'s own heightThicknessPx param there --
        // the tip endcap's LENGTH is deliberately decoupled from live
        // decay, see pieceThickness()'s own call site in render()); the
        // cut edge (only present at all when Endcap At Cut End is on)
        // uses the piece's current live thickness instead, matching
        // drawEndcap() not being passed a heightThicknessPx override
        // there.
        const tipExt = endcapExt(piece.baseThickness);
        const cutExt = cfg.endcapAtCutEnd ? endcapExt(thick) : 0;
        resolveChainCollision(mainData, pieceCollisionRadii(piece.points, thick, tipExt, cutExt), maxPush);
      });
    }
  }

  if (fallenPieces.length < 2) return;
  // Per-PAIR separation, from each piece's own CURRENT (possibly
  // decayed) thickness via pieceThickness() -- not a single global
  // value pinned to cfg.ropeThickness (the un-decayed default) computed
  // once for every pair regardless of either piece's real live
  // thickness. That fixed value never shrank as a piece's own thickness
  // decayed toward Piece Minimum Thickness, so anything resting on top
  // of a decaying piece stayed held up at the ORIGINAL, un-decayed
  // separation forever -- reported directly: "when the bottom piece
  // starts shrinking in thickness, the top piece doesnt fall down with
  // it... the top piece stays suspended in the air."
  const pieceData = fallenPieces.map(piece => {
    const thick = pieceThickness(piece);
    const tipExt = endcapExt(piece.baseThickness);
    const cutExt = cfg.endcapAtCutEnd ? endcapExt(thick) : 0;
    return pieceCollisionRadii(piece.points, thick, tipExt, cutExt);
  });
  for (let a = 0; a < fallenPieces.length; a++){
    for (let b = a + 1; b < fallenPieces.length; b++){
      resolveChainCollision(pieceData[a], pieceData[b], maxPush);
    }
  }
}

/* ---------------------------------------------------------------------
   Startup animation -- 'waiting' (nothing but the circle) -> 'rising'
   (bgRope's OWN rope-start climbs from the circle's bottom edge, driven
   directly rather than following mainRope -- bgRope itself, clipped to
   the circle, IS the climbing visual now, not a separate dot) -> once
   bgRope's rope-start clears the circle's bottom-edge boundary (per
   Startup Rise Clear Offset), 'pausing' (brief hold, bgRope resumes
   following mainRope's own anchor as usual) -> 'growing' (the rope
   extends downward from there, reusing the SAME `growing`-flag mechanic
   hold-to-grow already drives -- no separate growth code) -> 'done'
   (normal operation). mainRope is built as a minimal single-segment rope
   at boot when this is active (see the Boot section), so it's always
   structurally valid (physics can integrate it every frame, letting the
   anchor settle naturally during 'waiting'/'rising' the same way it
   would during ordinary play) -- render() is what actually hides it,
   per phase.
--------------------------------------------------------------------- */
let introPhase = 'done'; // set to 'waiting' at boot when cfg.introEnabled
let introTimer = 0;
let introTargetLengthPx = 0;
// mainRope.totalLength at the exact instant 'growing' starts -- the tween's
// own 0% point, so progress is measured against how far THIS extension has
// actually come, not an assumed-fixed starting length.
let introGrowStartLengthPx = 0;
// false for the boot-time (page-load) run of this state machine, true for
// every run triggered by detachEntireRopeAndRestartIntro() -- lets
// 'pausing' pick Detach Pause Duration instead of Startup Pause Duration.
// Never reset back to false: once the first detach happens, every LATER
// 'waiting' in this same page session is also detach-triggered by
// definition (the only way to re-enter 'waiting' after boot is another
// detach), so staying true is correct, not stale.
let introTriggeredByDetach = false;
// Tracks the PREVIOUS frame's unsettled state (see update()'s own
// introUnsettled computation) so the exact frame it flips from true to
// false can be detected and have its own implied-velocity zeroed out --
// see that transition's own comment near the integrateChain() call for
// why. Starts true (matching introUnsettled's own default reasoning).
let anchorWasUnsettled = true;
// Gates Startup Rise Gravity vs. Gravity Strength -- see
// introUnsettled()'s own comment (defined near update()) for the full,
// twice-corrected mechanism.
// Compounds by cfg.detachThicknessMultiplier on every full-rope detach --
// "every subsequent time the rope is fully cut, it increases in
// thickness by [the multiplier]", per explicit request. Applied only to
// mainRope's and bgRope's own live rendering (see render()'s
// liveThickness), never to already-fallen pieces, which keep whatever
// thickness they had at the moment they existed.
let ropeThicknessMultiplier = 1;

// The rate growRope() extends at during the startup animation's own
// 'growing' phase -- either a flat Startup Extension Speed, or (when
// Startup Extension Speed Tween Enabled) linearly tweened from Startup
// Extension Starting Speed up to that same default as the extension
// progresses from 0% to 100% of its own span, per explicit request ("set
// a starting speed, and that speed tweens into the default extension
// speed as the rope extends").
function currentIntroExtendRate(){
  if (!cfg.introExtendSpeedTweenEnabled) return cfg.introExtendSpeed;
  const span = introTargetLengthPx - introGrowStartLengthPx;
  const progress = span > 0 ? Math.min(1, Math.max(0, (mainRope.totalLength - introGrowStartLengthPx) / span)) : 1;
  return cfg.introExtendStartSpeed + (cfg.introExtendSpeed - cfg.introExtendStartSpeed) * progress;
}

function updateIntro(rawDt){
  if (introPhase === 'waiting'){
    // Re-checked every frame (not just once at boot) rather than decided
    // once at boot time -- resetSettings() loads saved config
    // asynchronously, so cfg.introEnabled may not reflect a saved
    // override yet on the very first frames. If it turns out to be off
    // (now, or once the async load catches up), skip straight to a full-
    // length rope instead of running the animation.
    if (!cfg.introEnabled){
      setMainRopeTotalLength(vh(cfg.ropeDefaultLength));
      introPhase = 'done';
      return;
    }
    introTimer += rawDt;
    // Detach-triggered restarts get their own Detach Wait Duration instead
    // of reusing Startup Wait Duration -- same split as Detach Pause
    // Duration below, so tuning boot's own wait doesn't also change how
    // long a detach-and-regrow cycle pauses before its climb starts.
    // Reported as "the main rope doesnt spawn UNTIl the wait time is
    // over": before this, a detach had no independent control over this
    // delay at all.
    const waitDuration = introTriggeredByDetach ? cfg.detachWaitDuration : cfg.introWaitDuration;
    if (introTimer >= waitDuration){
      introPhase = 'rising';
      // bgRope's own rope-start begins its climb one full circle-diameter
      // BELOW the circle's bottom edge -- "as if the circle was a hole in
      // a wall and this rope is climbing through it coming from the
      // bottom". Deliberately NOT starting exactly at the bottom edge
      // itself (which the old dot used to do): with Startup Rise Clear
      // Offset at its own default of 0, the "clear the bottom edge"
      // threshold (below) sits exactly AT the bottom edge too, so a
      // start position already there would satisfy it instantly, making
      // the whole climb imperceptible by default -- contradicting a
      // slow Startup Rise Speed default existing at all. Starting a full
      // diameter below guarantees a real, visible climb regardless of
      // the offset's own value.
      //
      // The WHOLE chain is rebuilt here (not just point 0 repositioned) --
      // reported as "the background rope suddenly goes really high
      // straight up" right as this phase begins. Root cause, confirmed via
      // direct frame-by-frame tracing: only point 0 used to jump to this
      // far-below position while points 1+ stayed wherever they'd settled
      // during 'waiting' (hanging normally downward from the OLD point 0,
      // which sat at circleAnchor()) -- leaving the rest of the chain
      // ABOVE the newly-teleported point 0, an inverted configuration
      // gravity never produces naturally. The constraint solver's
      // correction for that inversion is what flung the tail upward: 5
      // consecutive frames after the teleport measured the tip moving
      // 199->165->147->127->106->84 (y decreasing = climbing), racing
      // upward well past the circle before eventually settling. Rebuilding
      // the whole chain to hang FURTHER below this same start point (via
      // resetBgRope's own makeChain() logic, now parameterized) means
      // every point is already consistent with gravity's own direction
      // from frame one -- nothing to invert, nothing to violently correct.
      //
      // Start position: just barely below the circle's own edge -- Rope
      // Thickness + 1 (%vmin) -- not a full diameter below. Per explicit
      // correction ("the background rope should spawn just out of sight
      // of the circle... spawning very far down [was wrong]. It sould be
      // spawning the rope thickness+1 under the circle"). This makes the
      // visible climb correspondingly short when Startup Rise Clear
      // Offset is at/near its own default (0, disabled) -- an explicit,
      // deliberate tradeoff against this same function's PRIOR reasoning
      // (a far-below start was originally chosen specifically to
      // guarantee a real, visible climb regardless of Offset) -- that
      // reasoning no longer applies now that the spawn point itself is
      // meant to already sit just out of sight.
      resetBgRope(circleAnchor().x, circleAnchor().y + vmin(cfg.circleSize) / 2 + vmin(cfg.ropeThickness + 1));
    }
  } else if (introPhase === 'rising'){
    // bgRope's own rope-start climbs at Startup Rise Speed until it
    // clears a tunable boundary -- Startup Rise Clear Offset -- measured
    // from the circle's own bottom edge, per explicit request ("when the
    // rope start of background rope clears the bottom edge of the
    // circle, then the main rope appears and begins the extension").
    // This replaces the old "climb until reaching mainRope's own settled
    // anchor position" target: a purely geometric trigger, independent
    // of wherever Anchor Physics happens to settle mainRope's anchor.
    //
    // Clamped to mainRope's own anchor boundary (anchorBoundaryRadius()
    // around circleAnchor()) -- NOT the raw offset math alone. Reported as
    // "sometimes i see the background rope jump up past the top edge of
    // the circle, then come back down" / "the rope comes from above":
    // mainRope's anchor is a physics point that can NEVER actually rest
    // outside that radius (integrateChain()'s own boundaryConstraint
    // clamps it back every single frame), so an Offset large enough to
    // put the RAW target beyond it was never actually achievable by the
    // handoff below -- bgRope climbed there anyway (fully unconstrained
    // during 'rising'), then mainRope's spawn got hard-snapped back
    // inside the boundary on the very next physics tick while its
    // oldx/oldy still held the far-outside spawn position (set equal to
    // it the same frame, on the -- as it turns out, false -- assumption
    // that meant zero implied velocity). The FOLLOWING frame's verlet
    // step then computed a real implied velocity from that mismatch
    // (clamped position minus the still-far-outside old position),
    // flinging the anchor hard in the correction's own direction --
    // confirmed via direct trace at the current default Startup Rise
    // Clear Offset (-18.5): the raw target sits ~29%vmin from center vs.
    // an ~8.75%vmin boundary radius at default Circle Size/Circle
    // Boundary Offset, a large enough gap to overshoot past the
    // boundary's opposite side before damping settled it back --
    // reproducing exactly the reported jump-then-return. Clamping the
    // climb's own TARGET here means bgRope's visible climb now stops
    // exactly where mainRope's anchor can actually rest, so the handoff
    // below is a genuine zero-discontinuity continuation, matching what
    // this code always intended ("There will not be a sudden jump") --
    // rather than relying on a same-frame zero-velocity assignment that
    // the very next frame's boundary clamp was silently invalidating.
    // A large negative Offset's own configured "climb from far below"
    // distance is now bounded by the anchor's real physics reach --
    // increase Circle Boundary Offset (or Circle Size) to let the anchor
    // itself range further from center if a longer visible climb is
    // wanted; Offset beyond that boundary was never physically
    // achievable without reproducing this exact bug.
    //
    // clearY is a straight horizontal line again -- per explicit
    // correction, back from the circle this was briefly changed to
    // ("Make it a horizontal line again. But make it an offset from the
    // bottom point of the Anhor Point - Circle Offset"). Measured from
    // anchorBoundaryRadius()'s own BOTTOM point (circleAnchor().y +
    // boundaryR, the Circle-Offset-adjusted confinement boundary's lowest
    // point, not the raw drawn circle's circleSize/2 or circleAnchor().y
    // itself) minus the offset -- positive Offset moves the line UP
    // (toward center, shrinking how far the climb has to travel to
    // "clear"), same sign convention Circle Offset itself already uses.
    // Clamped so an extreme Offset can't push the line above the
    // boundary's own top point -- a straight y-bound now, not a circle
    // clamp, though the underlying math is unchanged from before this
    // revert (this path was always purely vertical -- bgRope's climb only
    // ever moves along the anchor's own x -- so "circle" vs. "line"
    // framing produced identical numbers here regardless; this revert is
    // about restoring the conceptual framing and the debug visualization,
    // see debugShowRiseClearOffset below).
    //
    // Startup Rise Clear Offset Enabled (def false, per explicit
    // request) gates whether the slider's own value is actually applied
    // -- when off, the line collapses to exactly the boundary's own
    // bottom point (offset 0), so the climb simply clears at the anchor's
    // own real physics boundary with no extra offset.
    const boundaryR = anchorBoundaryRadius();
    const bottomY = circleAnchor().y + boundaryR;
    const appliedOffset = cfg.introRiseClearOffsetEnabled ? vmin(cfg.introRiseClearOffset) : 0;
    const rawClearY = bottomY - appliedOffset;
    // Clamped to the circle's own drawn radius, NOT anchorBoundaryRadius() --
    // that used to cap Startup Rise Clear Offset at the tiny anchor
    // boundary itself, so raising the slider past it did nothing ("the main
    // rope is still spawning at its own offset boundary instead of
    // spawning at the startup clear offset"). anchorBoundaryRadius() used
    // to be the right bound here because mainRope's spawn point, placed
    // beyond it, would get hard-snapped straight back by
    // integrateChain()'s own boundaryConstraint on the very next physics
    // tick (see that fix's own comment above) -- that snap is what's
    // actually fixed now, at its source, by relaxing the boundaryConstraint
    // itself while introUnsettled() is true (see update()'s own call
    // below), so this clamp no longer needs to protect against it. Still
    // clamped to SOMETHING (the circle's own edge) so an extreme Offset
    // can't send the clear line -- and therefore mainRope's spawn point --
    // outside the circle graphic entirely.
    const circleR = vmin(cfg.circleSize) / 2;
    const clearY = Math.min(circleAnchor().y + circleR, Math.max(circleAnchor().y - circleR, rawClearY));
    const step = vh(cfg.introRiseSpeed) * rawDt;
    if (bgRope.points[0].y - clearY <= step){
      bgRope.points[0].y = clearY;
      introPhase = 'pausing';
      introTimer = 0;
      // mainRope does NOT spawn here anymore -- per explicit correction
      // ("after the background rope has risen to clear the startup rise
      // offset, it stays there for the pause duration, then after that
      // duration does the main rope spawn and the whole unit begins to
      // fall"). bgRope simply holds at clearY (nothing here moves it)
      // for the whole 'pausing' duration; the actual spawn moved to the
      // 'pausing'->'growing' transition below.
    } else {
      bgRope.points[0].y -= step;
    }
  } else if (introPhase === 'pausing'){
    introTimer += rawDt;
    // Boot's own (first-ever) startup animation uses Startup Pause
    // Duration; a double-click-triggered full detach (see
    // detachEntireRopeAndRestartIntro()) reuses this ENTIRE state
    // machine but pauses for its own, separately-tunable Detach Pause
    // Duration instead -- per explicit request ("give me a duplicate,
    // but this is the pause for when the rope is fully cut").
    const pauseDuration = introTriggeredByDetach ? cfg.detachPauseDuration : cfg.introPauseDuration;
    if (introTimer >= pauseDuration){
      // mainRope "spawns" exactly where bgRope has been holding -- no
      // jump -- then, from this frame on, mainRope's own already-running
      // physics (the same boundaryConstraint every other frame already
      // uses) naturally settles it toward wherever it actually wants to
      // rest, exactly like a real drop rather than a teleport. Per
      // explicit request: "the main rope [will] start with the rope
      // start at background rope's rope start... will then naturally
      // fall back to its default position. There will not be a sudden
      // jump."
      //
      // The WHOLE chain is rebuilt here (not just point 0) -- same fix
      // shape as 'waiting'->'rising' and bgRope's own handoff rebuild
      // just below, and for the exact same reason. Only patching point 0
      // (as this used to do) left points 1+ wherever they'd hung from
      // mainRope's OLD anchor position for the entire waiting+rising+
      // pausing duration -- normally close enough to the new spawn point
      // to go unnoticed, but with a real Startup Rise Clear Offset now
      // actually reaching far from that old position, the gap between
      // old point 1 and new point 0 became large enough for the distance
      // constraint to violently whip the chain back toward the old
      // position the instant this handoff ran -- reported directly, with
      // a screen recording, as "you can also see that the background
      // rope jumps down to the circle offset" (bgRope visibly moves too
      // because it re-syncs to mainRope's own anchor every frame from
      // here on -- see its own comment below). Rebuilding hanging from
      // the new spawn point means every point is already consistent with
      // both gravity's direction AND the actual segment length from
      // frame one, nothing left to violently correct.
      mainRope.points = makeChain(mainRope.points.length, bgRope.points[0].x, bgRope.points[0].y, mainRope.segLen);
      // Point 0 explicitly pinned to the exact spawn coordinate (not left
      // to makeChain()'s own small random per-point x lean, which is only
      // meant to break points 1+'s symmetry -- see makeChain()'s own
      // comment) -- oldx/oldy set equal to x/y (zero implied velocity) so
      // the following frame's integration doesn't compute a spurious
      // "teleport" velocity from wherever mainRope's own anchor had
      // independently drifted to while hidden during waiting/rising.
      mainRope.points[0].x = bgRope.points[0].x;
      mainRope.points[0].y = bgRope.points[0].y;
      mainRope.points[0].oldx = mainRope.points[0].x;
      mainRope.points[0].oldy = mainRope.points[0].y;
      // See makeChain()'s own comment for the real fix to "it stays this
      // way for 5-10 seconds then it settles to the position i expect" --
      // a nudge attempted HERE, at the handoff, was tried first and
      // measured to fail: by this point mainRope has already been
      // integrating (hidden) for the ENTIRE waiting+rising+pausing
      // duration, long enough to have already settled deep into
      // makeChain()'s own perfectly-symmetric trap -- a one-frame nudge
      // this late is fighting settled inertia across the whole chain,
      // not preventing it, and live tracing confirmed even an
      // 8%-of-boundary-radius kick here decayed back to the exact same
      // symmetric x within ~1-2s (i.e. it just relocated the freeze, it
      // didn't fix it). Fixing the chain's own construction instead means
      // the whole hidden wait+rise+pause duration is naturally available
      // to settle into a real off-axis resting pose BEFORE this handoff
      // ever runs, so there's nothing left to fight here.
      // bgRope resumes following mainRope's own anchor from here on (see
      // update()'s own bgRope sync) -- rebuild it HERE, at the moment of
      // that handoff, both for the usual race-avoidance reason (locks its
      // fixed length in against the real settings-loaded Rope Length, not
      // a possible pre-load default. Built hanging from mainRope's NEW
      // spawn position directly (not circleAnchor()) -- previously this
      // called resetBgRope() with no args, which hangs the WHOLE chain
      // from circleAnchor() and only patched point 0 afterward (the 2
      // lines below), leaving points 1+ built relative to circleAnchor()
      // while point 0 sat wherever the climb actually ended (the anchor
      // BOUNDARY, not circleAnchor() itself -- these differ by
      // anchorBoundaryRadius(), a real gap whenever Circle Offset moves
      // the boundary off dead-center). That's the exact same inversion
      // bug class already fixed for the 'waiting'->'rising' transition
      // above, just recurring here at the handoff instead -- reported as
      // "when the main rope spawns, it seems to physically affect the
      // background rope. it shouldnt." Passing the real spawn coordinates
      // directly means every point starts consistent with gravity's
      // direction from frame one, same fix shape as above.
      resetBgRope(mainRope.points[0].x, mainRope.points[0].y);
      // Still set explicitly (not left to makeChain()'s own small random
      // per-point x lean) so point 0 matches mainRope's spawn x exactly,
      // not off by that lean.
      bgRope.points[0].x = mainRope.points[0].x;
      bgRope.points[0].y = mainRope.points[0].y;
      // detachTipScaleProgress is armed HERE (the actual spawn moment),
      // not back at the initial detach trigger -- arming it there meant
      // it had already been ticking for the ENTIRE hidden waiting+rising+
      // pausing duration by the time mainRope was ever shown, often
      // exceeding Detach Endcap Grow Duration before the endcap was ever
      // visible at all. Reported directly: "when i cut the rope entirely,
      // the new main rope has a full height endcap regardless of those
      // sliders." undefined (-> full size) for boot, which never sets
      // this, same as before.
      if (introTriggeredByDetach) mainRope.detachTipScaleProgress = 0;
      // Boot-only endcap grow-in (per explicit request, and per explicit
      // follow-up clarifying detach keeps its OWN existing mechanism
      // above unchanged rather than sharing this one): starts at
      // Background Rope Endcap Pause Height -- the same height bgRope's
      // own endcap was shrinking FROM during 'pausing' (see render()'s
      // own bgRope-endcap comment) -- and grows to mainRope's normal
      // Endcap Height at Main Rope Endcap Growth Speed (see update()'s
      // own per-frame increment). Left null (skipped) on a detach spawn.
      if (!introTriggeredByDetach) mainRope.bootEndcapScale = cfg.bgRopeEndcapPauseHeight;
      // Captured HERE, not at boot -- by this point (wait + rise + pause,
      // several seconds in) any async settings load has long since
      // resolved, so this is guaranteed to be the real configured target,
      // never a stale pre-load default. Reads Default Rope Length, not
      // Rope Length -- this is a fresh spawn's own target (boot, or a
      // full detach/respawn), which must always be the real configured
      // default regardless of whatever length a prior rope was grown to
      // or cut down to (see Default Rope Length's own comment).
      introTargetLengthPx = vh(cfg.ropeDefaultLength);
      introGrowStartLengthPx = mainRope.totalLength;
      introPhase = 'growing';
      growing = true; // reuses growRope()/positionGrowingTip() unchanged
    }
  } else if (introPhase === 'growing'){
    if (mainRope.totalLength >= introTargetLengthPx){
      growing = false;
      introPhase = 'done';
    }
  }
}

// Double-clicking in the circle: the whole rope lets go and falls as one
// piece (rather than a minimum-length partial cut), then the startup
// animation replays to grow a fresh one in -- per explicit request. Reuses
// the exact same fresh-rope/toppling/emerge-state machinery Boot and a
// normal cut already use, just applied to the ENTIRE points array instead
// of a slice of it, and re-enters 'waiting' instead of leaving introPhase
// alone.
function detachEntireRopeAndRestartIntro(){
  if (mainRope.points.length >= 2){
    const fallingPoints = mainRope.points.map(p => ({ x:p.x, y:p.y, oldx:p.oldx, oldy:p.oldy }));
    topplePiece(fallingPoints);
    // Captured BEFORE ropeThicknessMultiplier compounds further below --
    // this piece is the OLD rope, falling at whatever thickness it
    // actually had, not the NEW (about to be thicker) one the fresh
    // regrowth will use.
    const piece = { points: fallingPoints, segLen: mainRope.segLen, tipEmerge: mainRope.tipEmerge, age: 0, baseThickness: vmin(cfg.ropeThickness) * ropeThicknessMultiplier };
    // Falls immediately, same as any other cut -- an earlier version of
    // this held the piece frozen (no gravity) until the fresh main rope
    // spawned, based on a misreading of "the ropes shouldnt fall until
    // the Main rope has been spawned." Corrected per explicit follow-up:
    // "the wait is only for the endcap. the cut segment should fall
    // immediatly as it used to" -- the wait belongs to the NEW rope's own
    // endcap grow-in (Detach Endcap Start Scale/Grow Duration, driven by
    // mainRope.detachTipScaleProgress below), not to this falling piece's
    // physics at all.
    // the piece's own free/tip end keeps whatever End Emerge state the
    // rope's tip already had; its NEW cut edge (former anchor, now
    // points[0]) starts its own fresh emerge, same convention
    // performMainRopeSplit() already uses for an ordinary cut.
    piece.cutEdgeEmerge = cfg.endEmergeEnabled ? newEmergeState() : null;
    fallenPieces.push(piece);
    if (fallenPieces.length > MAX_FALLEN_PIECES) fallenPieces.shift();
  }
  resetMainRope(vh(TARGET_SEG_LEN_VH));
  // Boot's own version of this restart also rebuilds bgRope from scratch
  // (see resetBgRope() at Boot) -- this path used to skip that entirely,
  // leaving bgRope's OWN chain (points[1] onward; point 0 alone gets
  // explicitly repositioned when 'rising' begins, a few lines below in
  // updateIntro()) at whatever stale positions it last held from normal
  // 'done'-phase operation, swinging wherever mainRope's old anchor had
  // last taken it. The instant 'rising' snapped point 0 to the fresh
  // "below the circle" start while the REST of the chain stayed stale
  // and far away, the distance/bend constraints spent several real
  // seconds violently whipping those stale points back into a normal
  // chain shape relative to the new point 0 -- reported as "the
  // background rope act[s] weird" for "5-8 seconds", "coming from the
  // top or something" (wherever the old rope happened to be swinging,
  // often above the circle), reproduced by repeatedly double-clicking to
  // trigger this exact path ("I cut it 3 times"). Rebuilding bgRope HERE
  // means every point starts fresh and consistent on every detach-
  // triggered restart, not just the very first boot.
  resetBgRope();
  // detachTipScaleProgress is armed at the actual SPAWN moment instead
  // (the 'pausing'->'growing' transition in updateIntro()), not here --
  // see that site's own comment for why arming it this early was a real
  // bug ("the new main rope has a full height endcap regardless of
  // those sliders").
  introTriggeredByDetach = true;
  ropeThicknessMultiplier *= cfg.detachThicknessMultiplier;
  introPhase = 'waiting';
  introTimer = 0;
}

/* ---------------------------------------------------------------------
   Growth / cut / punch actions
--------------------------------------------------------------------- */
let growing = false;

// direction to extend the tip in: the settled rope's own local tangent
// (from the point BEFORE prev, to prev) -- deliberately not derived from the
// tip's own current position, which is what's being placed and would make
// the direction circular/dependent on wherever the tip last happened to be.
//
// The RAW per-frame tangent is exponentially smoothed into mainRope.growDir
// before being returned, rather than handed back unsmoothed. prev/beforePrev
// are real, solver-participating points, so their measured tangent carries
// the solver's own ordinary per-frame "breathing" noise (worse with fewer
// constraintIterations / higher damping, i.e. less energy removed per
// frame) -- positionGrowingTip() already smooths its OWN rendered position
// toward the target, but growRope()'s commit previously placed each newly-
// finalized segment using a freshly-recomputed RAW direction with no
// smoothing at all, so a single noisy frame at the exact instant a segment
// committed could bake a locally-wrong angle in as a PERMANENT kink.
// Confirmed via reproduction: a synthetic straight-down growth test (zero
// punches/perturbation, so every committed point's Y should stay strictly
// increasing) showed points going non-monotonic starting a few commits in --
// e.g. point Y-sequence ...441.4, 455.4, 511.8, 462.4, 520.2, 471.8... --
// a real fold-back baked in at specific commits, reproducing the user's
// reported chaotic knotting during sustained hold-to-grow after a cut. This
// happened independent of cfg.bendStiffness (reproduced identically with it
// forced to 0), so it predates and is unrelated to that constraint -- fixing
// bendStiffness's own separate tip-feedback issue (see integrateChain()'s
// bendEnd) was necessary but not sufficient on its own.
function tipGrowDirection(pts){
  const n = pts.length;
  const prev = pts[n - 2] || pts[0];
  const beforePrev = pts[n - 3] || pts[0];
  const dx = prev.x - beforePrev.x, dy = prev.y - beforePrev.y;
  const dlen = Math.hypot(dx, dy);
  // A chain this short (n<=2, e.g. right after a cut leaves just the anchor
  // + 1 point) has no real local tangent yet -- prev and beforePrev both
  // resolve to the SAME point (pts[n-3] underflows to undefined, falling
  // back to pts[0]), making dx/dy exactly 0. The old `|| 1` fallback only
  // guarded the DIVISOR, not this case, so it silently returned direction
  // (0,0) -- positionGrowingTip() and growRope()'s commit both then placed
  // the new point at EXACTLY prev's position (anchor.x + 0*len = anchor.x),
  // collapsing multiple points onto the same coordinate. integrateChain()'s
  // distance constraint, solving a real segLen against a measured distance
  // of ~0, then produced a correction with an effectively arbitrary
  // direction (0/0.0001-scale noise) -- confirmed via reproduction as the
  // tight knot/tangle right at the anchor reported after cutting the rope
  // very short and then repeatedly growing it. Falls back to straight down
  // (the rope's own authored default direction) whenever there's no real
  // direction to measure yet.
  const raw = dlen < 1e-6 ? { x: 0, y: 1 } : { x: dx / dlen, y: dy / dlen };
  if (!mainRope.growDir){
    mainRope.growDir = { x: raw.x, y: raw.y };
  } else {
    const s = 0.15; // low-pass factor -- low enough to filter single-frame solver noise, high enough to still track real swinging within a few frames
    mainRope.growDir.x += (raw.x - mainRope.growDir.x) * s;
    mainRope.growDir.y += (raw.y - mainRope.growDir.y) * s;
    const glen = Math.hypot(mainRope.growDir.x, mainRope.growDir.y) || 1;
    mainRope.growDir.x /= glen; mainRope.growDir.y /= glen; // re-normalize -- blending two unit vectors doesn't stay unit length
  }
  return { x: mainRope.growDir.x, y: mainRope.growDir.y, prev };
}

// Places the currently-growing tip segment directly, every frame, instead of
// letting it participate in the iterative constraint solve (see
// integrateChain()'s skipLastSegment for why). oldx/oldy are set to match,
// so the tip carries zero implied velocity — it can never accumulate
// momentum of its own, only ever reflecting mainRope.tipGrowLen and the
// settled chain's current direction. A no-op once tipGrowLen has reached a
// full segLen (fully committed, ordinary physics point from here on).
function positionGrowingTip(){
  if (mainRope.tipGrowLen >= mainRope.segLen) return;
  const pts = mainRope.points;
  const dir = tipGrowDirection(pts);
  const tip = pts[pts.length - 1];
  // The tip's position is anchor (dir.prev, a real physics point) PLUS a
  // smoothed OFFSET -- not a smoothed absolute position. mainRope.tipOffset
  // (reset to {0,0} by growRope() every time a new tip is pushed) is what
  // gets smoothed toward the raw target offset below; dir.prev's own
  // CURRENT position is always applied in full, every frame, with no lag.
  // An earlier version smoothed the absolute (dir.prev + offset) position
  // directly, which meant the tip only partially followed dir.prev when
  // dir.prev itself moved -- and dir.prev moves for real reasons every
  // commit frame (it inherits the outgoing segment's velocity, per
  // growRope()'s own comment, then gets constraint-solved against ITS OWN
  // neighbor for the first time as an ordinary point). Confirmed via direct
  // frame-by-frame tracing: at a commit frame with real swing velocity
  // present, dir.prev moved several px while the tip -- still smoothing
