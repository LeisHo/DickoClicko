--------------------------------------------------------------------- */
const numEls = {};
// Shared across every color picker in the panel -- per explicit request
// ("provide a copy and paste buttons so i can copy colors from one to
// another"). A single in-memory value, not the OS clipboard: no
// permission prompt, no async, works identically for every color
// control regardless of which one copied it.
let copiedColorValue = null;
// Shared group-DOM builder -- used both for a real DEV_GROUPS entry
// (buildDevPanel below) and for a user-created custom group (addDevGroup,
// and applyOrder()'s own "recreate a group that only exists in saved
// order" fallback). Built via DOM methods rather than an innerHTML
// string concat (unlike this function's pre-refactor form) since `name`
// can now come from user input (see addDevGroup) instead of only a
// hardcoded DEV_GROUPS title.
/* ---------------------------------------------------------------------
   Text Edit Mode (§12-adjacent, ported from TEMPLATE_DEV_PANEL.html's
   own checkboxDevTextEditMode/openDevTextEditFor, per explicit request)
   -- right-click-free inline rename of any group title or setting
   label. `devTextOverrides` is keyed by a stable id ('group:'+data-key
   or 'row:'+data-key -- both already unique across the whole panel,
   the same identity getPanelOrder()/applyOrder() rely on) rather than
   DOM position, so a rename survives drag-reordering. `devTextOriginals`
   remembers each element's REAL text the first time it's ever seen,
   so an override can always be reverted to the true original (typing
   the original text back, or clearing the field, clears the override
   rather than storing a redundant copy).
--------------------------------------------------------------------- */
let devTextOverrides = {};
const devTextOriginals = {};
function devTextOriginalFor(key, currentText){
  if (!(key in devTextOriginals)) devTextOriginals[key] = currentText;
  return devTextOriginals[key];
}
// Re-applies every stored override (or, where none exists, each
// element's own remembered original) across every group title and
// setting label currently in the panel -- called once after the panel
// is first built, and again whenever devTextOverrides is replaced
// wholesale (Reset). Skips an element mid-edit (its own open textarea)
// so a live rename-in-progress is never clobbered by this sweep.
function applyDevTextOverrides(){
  document.querySelectorAll('#dpGroups .dp-group').forEach(g => {
    const titleSpan = g.querySelector(':scope > .dp-group-header > span:last-child');
    if (!titleSpan || titleSpan.querySelector('textarea')) return;
    const key = 'group:' + g.dataset.key;
    const original = devTextOriginalFor(key, titleSpan.textContent);
    titleSpan.textContent = devTextOverrides[key] != null ? devTextOverrides[key] : original;
  });
  // '#dpBody' (not '#dpGroups') -- reaches #dpUngrouped's own rows too
  // (e.g. Text Edit Mode's own row, which now lives there by default).
  document.querySelectorAll('#dpBody .dp-row label').forEach(label => {
    if (label.querySelector('textarea')) return;
    const row = label.closest('.dp-row');
    if (!row) return;
    const key = 'row:' + row.dataset.key;
    const original = devTextOriginalFor(key, label.textContent);
    label.textContent = devTextOverrides[key] != null ? devTextOverrides[key] : original;
  });
}
// Opens an inline <textarea> over `el` (a group title span or a row
// label) to type a replacement. Commits on blur/Enter (empty or
// unchanged-from-original clears the override rather than storing a
// no-op copy), reverts on Escape.
function openDevTextEditFor(el, key){
  if (!key || el.querySelector('textarea')) return;
  const original = devTextOriginalFor(key, el.textContent);
  const currentValue = devTextOverrides[key] != null ? devTextOverrides[key] : original;
  const originalHTML = el.innerHTML;
  const input = document.createElement('textarea');
  input.rows = 1;
  input.value = currentValue;
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
  // Stop this element's own drag-reorder/collapse-toggle listeners from
  // seeing events that originate inside the textarea.
  input.addEventListener('pointerdown', ev => ev.stopPropagation());
  input.addEventListener('click', ev => ev.stopPropagation());
  let settled = false;
  function commit(){
    if (settled) return;
    settled = true;
    const typed = input.value;
    devTextOverrides[key] = (typed === '' || typed === original) ? null : typed;
    el.textContent = devTextOverrides[key] != null ? devTextOverrides[key] : original;
  }
  function cancel(){
    if (settled) return;
    settled = true;
    el.innerHTML = originalHTML;
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); input.blur(); }
    else if (ev.key === 'Escape') cancel();
  });
}
// Delegated single listener (not one per label) -- capture phase +
// preventDefault so clicking a checkbox row's label text doesn't also
// toggle the checkbox (native <label> click-through behavior).
function setupDevTextEditMode(){
  const groupsEl = document.getElementById('dpGroups');
  groupsEl.addEventListener('click', e => {
    if (!panelStyle.textEditMode) return;
    const label = e.target.closest('.dp-row label');
    if (!label || label.querySelector('textarea')) return;
    const row = label.closest('.dp-row');
    if (!row) return;
    e.preventDefault();
    e.stopPropagation();
    openDevTextEditFor(label, 'row:' + row.dataset.key);
  }, true);
}

function createGroupElement(name){
  const g = document.createElement('div');
  g.className = 'dp-group';
  g.dataset.key = name;
  const h = document.createElement('div');
  h.className = 'dp-group-header';
  // 'dp-group-handle' (in addition to the shared 'dp-drag-handle' CSS
  // styling class) is what makeReorderable()'s GROUP registration
  // actually matches on -- see that function's own comment for why a
  // ROW handle (which also carries 'dp-drag-handle', for the same
  // shared cursor/color/touch-action styling) must NOT match here too.
  const handle = document.createElement('span'); handle.className = 'dp-group-handle dp-drag-handle'; handle.textContent = '⠿';
  const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '▼';
  const title = document.createElement('span'); title.textContent = name;
  h.appendChild(handle); h.appendChild(arrow); h.appendChild(title);
  const gb = document.createElement('div');
  gb.className = 'dp-group-body';
  h.addEventListener('click', e => {
    if (e.target.closest('.dp-drag-handle')) return;
    // Text Edit Mode takes over the WHOLE header click (not just the
    // title text) while it's on -- matches the template's own
    // toggleSection() behavior -- so collapse/expand is unreachable
    // via a plain click until the mode is switched off again.
    if (panelStyle.textEditMode){
      openDevTextEditFor(title, 'group:' + g.dataset.key);
      return;
    }
    g.classList.toggle('collapsed');
  });
  g.appendChild(h); g.appendChild(gb);
  return g;
}
function buildDevPanel(){
  const body = document.getElementById('dpGroups');
  DEV_GROUPS.forEach(group => {
    const g = createGroupElement(group.title);
    const gb = g.querySelector('.dp-group-body');
    group.controls.forEach(ctrl => gb.appendChild(buildRow(ctrl)));
    body.appendChild(g);
  });
  makeReorderable(body, 'dp-group', 'dp-group-handle', groupDragTargets);
  // Row (setting) dragging is registered ONCE, on the whole panel body
  // (see the single call site near this file's init sequence, after
  // buildPanelStyleGroup()/the ungrouped area both exist) -- not here,
  // per group -- so it isn't repeated here.
}

// "+ Add Group" (§12e/template parity, per explicit request: "I also
// wanted the function to add groups and place groups within groups").
// A group created this way exists ONLY in the DOM + whatever gets
// captured into saved order -- it has no DEV_GROUPS entry, so it
// survives Reset/reload purely via applyOrder()'s own "recreate a
// group that only exists in saved order" fallback (see that function's
// comment). Considers every group already on the panel, top-level AND
// nested (querySelectorAll('.dp-group') reaches both), so a new name
// can't collide with a nested group's name either.
function addDevGroup(){
  const container = document.getElementById('dpGroups');
  const existingNames = new Set(Array.from(container.querySelectorAll('.dp-group')).map(g => g.dataset.key));
  let name = 'New Group';
  let n = 2;
  while (existingNames.has(name)){ name = 'New Group (' + n + ')'; n++; }
  const g = createGroupElement(name);
  container.appendChild(g);
  // No per-group row registration needed -- the single delegated row
  // listener (see makeReorderable()'s own comment) already reaches
  // this new group's body via event delegation.
  g.scrollIntoView({ behavior:'smooth', block:'center' });
}

// Any .dp-group-body ANYWHERE in the tree is a valid nest target, at
// UNLIMITED depth -- per TEMPLATE_DEV_PANEL.html's own follow-up fix
// (folded back in here per its own MAINTENANCE note), replacing the
// earlier "top-level bodies only, one level of nesting" design.
//
// That earlier design had a real, undetected bug, not just a
// deliberate cap: #dpGroups was listed FIRST in the returned candidate
// list, and since its own bounding rect always geometrically CONTAINS
// every group body's rect (it's the scrollable container housing them
// all), makeReorderable()'s own `candidates.find(c => pointerY within
// c's own rect)` hit-test would match #dpGroups FIRST for ANY pointer
// position anywhere in the panel -- meaning a drop could never
// actually register as "into THIS specific group," 100% of the time,
// regardless of pointer precision. The one-level nesting this project
// shipped was therefore never actually reachable via drag (only via
// applyOrder()'s own JSON-restore path) -- missed because the earlier
// verification checked groupDragTargets()'s own returned candidate
// LIST for correct membership/exclusions, but never simulated the
// actual find()-based hit-test order against that list, which is
// exactly where the bug lived. Caught this round by cross-referencing
// the template's own explicit fix description, then confirmed via a
// jsdom test that simulates the real find() hit-test (not just list
// membership) against a 3-level-deep nested scenario.
//
// groupNestingDepth() sorts candidates DEEPEST-first (with #dpGroups
// itself always LAST, as the top-level fallback) so find() always
// prefers the most specific match, falling through to a shallower one
// only when the pointer is genuinely outside every deeper candidate --
// this ordering is not optional, it's what makes hit-testing into a
// nested group possible at all. Excludes the dragged group's own body
// AND every one of its descendants' bodies (draggedGroup.contains(gb))
// -- can't nest a group inside itself or inside its own child.
function groupNestingDepth(body, dpGroupsEl){
  let depth = 0, cur = body.parentElement;
  while (cur && cur !== dpGroupsEl){
    if (cur.classList.contains('dp-group')) depth++;
    cur = cur.parentElement;
  }
  return depth;
}
// Excludes any body that isn't actually VISIBLE right now (collapsed,
// or nested inside a collapsed ancestor) -- fixes a real, reproduced
// data-integrity bug: `getBoundingClientRect()` on a `display:none`
// element (a collapsed group's own `.dp-group-body`, per this file's
// own `.collapsed .dp-group-body{display:none}` CSS) returns an
// all-zero rect at (0,0). makeReorderable()'s own "nearest candidate"
// fallback (used whenever the pointer isn't within ANY candidate's own
// vertical bounds -- exactly what happens when dragging a group UP AND
// OUT of the panel's visible area) then treats that phantom (0,0) rect
// as genuinely "close" to any drag ending near the top of the screen,
// silently nesting the dragged group inside the COLLAPSED, invisible
// parent instead of leaving it at top-level. Reported directly ("when
// i drag a group out of the panel. It dissappears. I dont want that.
// I dont want to accidentally delete anything") and reproduced exactly:
// collapsing one group, then dragging an unrelated group toward the
// top of the screen, silently relocated it inside the collapsed one --
// no data was ever actually lost, but it vanished from the visible
// top-level list until that specific collapsed parent was re-expanded,
// which reads as deletion to a user with no reason to suspect it.
// `offsetParent !== null` is the standard "is this actually rendered"
// check -- true regardless of whether the body itself or any ancestor
// is what's collapsed, unlike checking `.collapsed` one level at a
// time. rowDragTargets() (below) applies the same fix for the same
// reason.
function groupDragTargets(draggedGroup){
  const dpGroupsEl = document.getElementById('dpGroups');
  const allBodies = Array.from(dpGroupsEl.querySelectorAll('.dp-group-body'))
    .filter(gb => !draggedGroup.contains(gb) && gb.offsetParent !== null);
  allBodies.sort((a, b) => groupNestingDepth(b, dpGroupsEl) - groupNestingDepth(a, dpGroupsEl));
  return [...allBodies, dpGroupsEl];
}
// Valid drop targets for a dragged ROW (setting): every currently-
// visible group body (same collapsed/hidden exclusion as
// groupDragTargets() above, and for the same reason -- a row dragged
// toward a collapsed group must not silently vanish into it either)
// plus the ungrouped area (#dpUngrouped) itself, so a setting can
// always be dragged OUT of every group entirely. Unlike
// groupDragTargets(), a row never CONTAINS a `.dp-group-body` itself
// (rows are leaf UI, not containers), so there's no "exclude my own
// descendants" filtering needed here.
function rowDragTargets(){
  const dpGroupsEl = document.getElementById('dpGroups');
  const ungroupedEl = document.getElementById('dpUngrouped');
  const allBodies = Array.from(dpGroupsEl.querySelectorAll('.dp-group-body'))
    .filter(gb => gb.offsetParent !== null);
  // Same DEEPEST-first sort as groupDragTargets(), and for the exact
  // same reason (see that function's own comment for the full account):
  // querySelectorAll returns bodies in DOM/document order, which puts
  // an OUTER group's body before any nested subgroup's body living
  // inside it -- and since a parent body's own bounding rect always
  // geometrically CONTAINS its nested child's rect, makeReorderable()'s
  // `candidates.find(c => pointerY within c's rect)` would match the
  // OUTER body first for ANY drop position inside the nested one too,
  // making it impossible to ever drag a row INTO a 2nd-level-or-deeper
  // subgroup specifically -- reported directly ("I can drag it between
  // top level groups, but not second level") and reproduced exactly
  // this way. groupDragTargets() already had this exact sort; it was
  // simply never carried over here when row-dragging was generalized
  // to cross-group targets. rowDragTargets() has no equivalent of
  // groupDragTargets()'s own trailing `dpGroupsEl` top-level fallback
  // to also reorder in the sort -- ungroupedEl plays that same
  // always-last role, appended after sorting rather than sorted with
  // the rest, since it's never nested inside a group body.
  allBodies.sort((a, b) => groupNestingDepth(b, dpGroupsEl) - groupNestingDepth(a, dpGroupsEl));
  return [...allBodies, ungroupedEl];
}

/* ---------------------------------------------------------------------
   Drag-to-reorder (groups, and settings within/across groups) —
   pointer-based so it works the same on touch and mouse.
   `crossContainerFn(dragEl)` (optional) lets an item cross into a
   DIFFERENT sibling container instead of only reordering within the
   one it started in -- used for GROUP dragging (groupDragTargets(),
   above) so a group can be dropped either back at top-level or nested
   into another group's own body, and for ROW dragging (rowDragTargets(),
   below) so a setting can be dragged into ANY group or into the
   ungrouped area (#dpUngrouped) -- per explicit request ("allow me to
   drag any setting outside of any group"). ROW dragging used to be
   registered once PER GROUP BODY, confined to that one body; now
   registered ONCE on the whole #dpBody (see the single call site near
   this file's init sequence) with rowDragTargets as crossContainerFn,
   the same one-listener-with-delegation pattern GROUP dragging already
   used -- this also means a newly created/restored group never needs
   its OWN row-listener registered, the single delegated listener
   already reaches it.
--------------------------------------------------------------------- */
function makeReorderable(container, itemClass, handleClass, crossContainerFn){
  let dragEl = null;
  container.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.' + handleClass);
    if (!handle || !container.contains(handle)) return;
    const item = handle.closest('.' + itemClass);
    // Without crossContainerFn, an item must already be a direct child of
    // the container this listener was registered on (original behavior,
    // unchanged). WITH crossContainerFn, an item's current parent can
    // legitimately vary over time (e.g. a group that was nested last
    // drag, now living inside a different group's body) -- container.
    // contains(handle) above (event delegation reaches the whole
    // subtree) is enough to confirm this pointerdown is genuinely ours.
    if (!item || (!crossContainerFn && item.parentElement !== container)) return;
    e.preventDefault();
    // A ROW's own handle carries BOTH 'dp-row-handle' AND the shared
    // 'dp-drag-handle' class (buildRow()'s own handle.className), so
    // without this, a row-handle pointerdown -- after being claimed
    // here -- kept bubbling up past its own group body all the way to
    // #dpGroups, where the GROUP-level listener (matching the shared
    // '.dp-drag-handle' class) ALSO fired, resolving `item` to the
    // row's own CONTAINING group and starting a SECOND, simultaneous
    // drag of that entire group. Real, reproduced bug -- confirmed via
    // direct report ("when I try [to drag a single setting between
    // groups], it drags the whole group") and independently via a live
    // test (dragging one row a small amount visibly reordered its own
    // parent group in the top-level list). stopPropagation() here
    // claims the event fully once a valid drag starts, so only the
    // INNERMOST matching listener (whichever one's container is the
    // nearest ancestor) ever begins a drag for a given pointerdown.
    e.stopPropagation();
    dragEl = item;
    dragEl.classList.add('dp-dragging');
    tryCapture(handle, e.pointerId);

    function move(ev){
      if (!dragEl) return;
      let targetContainer = container;
      if (crossContainerFn){
        const candidates = crossContainerFn(dragEl);
        let found = candidates.find(c => {
          const r = c.getBoundingClientRect();
          return ev.clientY >= r.top && ev.clientY <= r.bottom;
        });
        if (!found){
          let minDist = Infinity;
          candidates.forEach(c => {
            const r = c.getBoundingClientRect();
            const dist = Math.abs(ev.clientY - (r.top + r.height / 2));
            if (dist < minDist){ minDist = dist; found = c; }
          });
        }
        if (found) targetContainer = found;
      }
      const siblings = Array.from(targetContainer.children).filter(c => c.classList.contains(itemClass) && c !== dragEl);
      if (siblings.length === 0){ targetContainer.appendChild(dragEl); return; }
      for (const sib of siblings){
        const r = sib.getBoundingClientRect();
        const mid = r.top + r.height / 2;
        if (ev.clientY < mid){
          targetContainer.insertBefore(dragEl, sib);
          return;
        } else if (sib === siblings[siblings.length - 1]){
          targetContainer.appendChild(dragEl);
        }
      }
    }
    function up(){
      if (dragEl) dragEl.classList.remove('dp-dragging');
      dragEl = null;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
}

function setCfg(key, value){
  cfg[key] = value;
  const num = numEls[key];
  if (num && num.type !== 'checkbox' && document.activeElement !== num.numInput) {
    if (num.slider) num.slider.value = Math.max(parseFloat(num.slider.min), Math.min(parseFloat(num.slider.max), value));
    if (num.numInput) num.numInput.value = round(value, 3);
  }
}

// Same as setCfg()'s own slider/numInput sync, but deliberately does NOT
// touch cfg[key] itself -- used where a control's on-screen number should
// reflect the rope's current live state without redefining what that
// control's own value actually MEANS going forward. See
// performMainRopeSplit()'s own use of this for why: a cut used to call
// setCfg('ropeLength', ...) directly, which kept the slider's display
// honest but ALSO silently overwrote the persisted default itself --
// meaning a later FULL detach (which regrows to vh(cfg.ropeLength) as
// "the default length") regrew to whatever a PRIOR cut had shrunk it to,
// not the rope's real original configured length. Reported directly:
// "when I cut the rope in full, the length it extends back to after
// should be the default length. not the length the cut rope was."
//
// This kept cfg.ropeLength itself honest against a CUT, but a later
// direct report ("Default rope length and 'current' rope length needs
// to be 2 different figures") showed the same leak still existed
// through hold-to-grow (growRope() -> setCfg('ropeLength', ...), a
// genuine live-length update, not a bug) -- growing the rope longer,
// THEN fully detaching, regrew to the grown length, not the true
// original default, since cfg.ropeLength was still the only place any
// "default" lived. Fully resolved by adding a real, separate
// cfg.ropeDefaultLength (see its own dev-panel comment) that nothing
// ever overwrites automatically -- this function's own cut-display use
// below still stands on its own merits (Rope Length's slider SHOULD
// keep reflecting live current length either way).
function syncControlDisplay(key, value){
  const num = numEls[key];
  if (num && num.type !== 'checkbox' && document.activeElement !== num.numInput) {
    if (num.slider) num.slider.value = Math.max(parseFloat(num.slider.min), Math.min(parseFloat(num.slider.max), value));
    if (num.numInput) num.numInput.value = round(value, 3);
  }
}

function round(v, d){ const m = Math.pow(10,d); return Math.round(v*m)/m; }

function buildRow(ctrl){
  const row = document.createElement('div');
  row.className = 'dp-row';
  row.dataset.key = ctrl.key;
  const handle = document.createElement('span');
  handle.className = 'dp-row-handle dp-drag-handle';
  handle.textContent = '⠿';
  row.appendChild(handle);
  const label = document.createElement('label');
  label.textContent = ctrl.label;
  row.appendChild(label);

  if (ctrl.type === 'slider') {
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = ctrl.min; slider.max = ctrl.max; slider.step = ctrl.step;
    slider.value = ctrl.def;
    const numInput = document.createElement('input');
    numInput.type = 'text'; numInput.className = 'dp-num';
    numInput.value = ctrl.def;

    function apply(v){
      v = parseFloat(v);
      if (isNaN(v)) return;
      cfg[ctrl.key] = v;
      // §12h: typing beyond the current bound actually expands that bound
      // (typed value ± 20%), not just a visual clamp of the slider handle.
      let mn = parseFloat(slider.min), mx = parseFloat(slider.max);
      if (v > mx) { slider.max = v + Math.max(Math.abs(v), Math.abs(mx - mn), 1) * 0.2; }
      if (v < mn) { slider.min = v - Math.max(Math.abs(v), Math.abs(mx - mn), 1) * 0.2; }
      slider.value = v;
      numInput.value = round(v, 3);
      if (ctrl.onChange) ctrl.onChange(v);
    }
    slider.addEventListener('input', () => apply(slider.value));
    numInput.addEventListener('change', () => apply(numInput.value));
    numInput.addEventListener('keydown', e => { if (e.key === 'Enter') numInput.blur(); });

    row.appendChild(slider); row.appendChild(numInput);
    numEls[ctrl.key] = { slider, numInput };
  } else if (ctrl.type === 'color') {
    const color = document.createElement('input');
    color.type = 'color'; color.value = ctrl.def;
    color.addEventListener('input', () => { cfg[ctrl.key] = color.value; });
    row.appendChild(color);
    // Copy/Paste: copies this picker's current color into the shared
    // value, or overwrites this picker from whatever was last copied
    // (from ANY color picker in the panel, including this one) -- see
    // copiedColorValue's own comment.
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button'; copyBtn.className = 'dp-color-copy'; copyBtn.textContent = 'C';
    copyBtn.title = 'Copy this color';
    copyBtn.addEventListener('click', () => { copiedColorValue = color.value; });
    const pasteBtn = document.createElement('button');
    pasteBtn.type = 'button'; pasteBtn.className = 'dp-color-paste'; pasteBtn.textContent = 'P';
    pasteBtn.title = 'Paste copied color';
    pasteBtn.addEventListener('click', () => {
      if (copiedColorValue === null) return;
      color.value = copiedColorValue;
      cfg[ctrl.key] = copiedColorValue;
    });
    row.appendChild(copyBtn);
    row.appendChild(pasteBtn);
    numEls[ctrl.key] = { type:'color' };
  } else if (ctrl.type === 'checkbox') {
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !!ctrl.def;
    cb.addEventListener('change', () => { cfg[ctrl.key] = cb.checked; });
    row.appendChild(cb);
    numEls[ctrl.key] = { type:'checkbox' };
  } else if (ctrl.type === 'dropdown') {
    const select = document.createElement('select');
    select.className = 'dp-dropdown';
    ctrl.options.forEach(opt => {
      const optionEl = document.createElement('option');
      optionEl.value = opt.value; optionEl.textContent = opt.label;
      select.appendChild(optionEl);
    });
    select.value = ctrl.def;
    select.addEventListener('change', () => {
      cfg[ctrl.key] = select.value;
      if (ctrl.onChange) ctrl.onChange(select.value);
    });
    row.appendChild(select);
    numEls[ctrl.key] = { type:'dropdown' };
  } else if (ctrl.type === 'gradient') {
    // A Photoshop-style gradient bar: each stop is a draggable marker
    // along the bottom edge (position, NOT evenly spaced -- "I want to
    // be able to slide the sliders to determine where a gradient color
    // kicks in"), and clicking a marker (a real click/tap, not a drag)
    // opens a native color picker for that stop -- per explicit request
    // and reference image. cfg[key] holds an array of {pos: 0-1, color}
    // objects, order-independent (always re-sorted before building the
    // actual canvas gradient -- see ropeStrokeColor()).
    const wrap = document.createElement('div');
    wrap.className = 'dp-gradient';
    const bar = document.createElement('div');
    bar.className = 'dp-gradient-bar';
    wrap.appendChild(bar);

    // One hidden native color input, repositioned and reused for
    // whichever stop is currently being edited -- simpler and lighter
    // than a separate <input type=color> per stop.
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.className = 'dp-gradient-color-input';
    wrap.appendChild(colorInput);
    let editingStop = null;

    function sortedStops(){ return [...cfg[ctrl.key]].sort((a, b) => a.pos - b.pos); }

    function renderStops(){
      const sorted = sortedStops();
      bar.style.background = sorted.length >= 2
        ? `linear-gradient(to right, ${sorted.map(s => `${s.color} ${Math.round(Math.max(0, Math.min(1, s.pos)) * 100)}%`).join(', ')})`
        : (sorted[0] ? sorted[0].color : '#888888');
      bar.querySelectorAll('.dp-gradient-marker').forEach(m => m.remove());
      cfg[ctrl.key].forEach(stop => {
        const marker = document.createElement('div');
        marker.className = 'dp-gradient-marker';
        marker.style.left = (Math.max(0, Math.min(1, stop.pos)) * 100) + '%';
        marker.style.setProperty('--marker-color', stop.color);
        bar.appendChild(marker);
        marker.addEventListener('pointerdown', e => {
          e.stopPropagation();
          tryCapture(marker, e.pointerId);
          const barRect = bar.getBoundingClientRect();
          let dragged = false;
          function move(ev){
            dragged = true;
            stop.pos = Math.max(0, Math.min(1, (ev.clientX - barRect.left) / barRect.width));
            renderStops();
          }
          function up(ev){
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            if (!dragged){
              // A real click, not a drag -- open the color picker for
              // this stop rather than treat it as a (no-op) position edit.
              editingStop = stop;
              colorInput.value = stop.color;
              colorInput.style.left = (Math.max(0, Math.min(1, stop.pos)) * 100) + '%';
              colorInput.click();
            }
          }
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up);
        });
        // Deleting a stop: both double-click AND right-click do it (per
        // explicit request -- right-click was added alongside the
        // original double-click, not in place of it). Never below 2
        // stops -- a gradient needs at least a start and end.
        function deleteStop(e){
          e.stopPropagation();
          e.preventDefault();
          if (cfg[ctrl.key].length > 2){
            cfg[ctrl.key] = cfg[ctrl.key].filter(s => s !== stop);
            renderStops();
          }
        }
        marker.addEventListener('dblclick', deleteStop);
        marker.addEventListener('contextmenu', deleteStop);
      });
    }

    // Clicking empty bar space (not a marker -- those stop propagation
    // above) adds a new stop there, seeded with whatever color the
    // gradient already shows at that position so it doesn't visibly
    // jump.
    bar.addEventListener('pointerdown', e => {
      if (e.target !== bar) return;
      const barRect = bar.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - barRect.left) / barRect.width));
      const sorted = sortedStops();
      let color = sorted.length ? sorted[0].color : '#ffffff';
      for (let k = 0; k < sorted.length - 1; k++){
        if (frac >= sorted[k].pos && frac <= sorted[k + 1].pos){ color = sorted[k].color; break; }
        if (frac >= sorted[k].pos) color = sorted[k].color;
      }
      cfg[ctrl.key] = [...cfg[ctrl.key], { pos: frac, color }];
      renderStops();
    });

    colorInput.addEventListener('input', () => {
      if (editingStop){ editingStop.color = colorInput.value; renderStops(); }
    });

    row.appendChild(wrap);
    numEls[ctrl.key] = { type:'gradient', renderStops, setStops: newStops => { cfg[ctrl.key] = newStops.map(s => ({ ...s })); renderStops(); } };
    renderStops();
  }
  return row;
}

/* ---------------------------------------------------------------------
   Dev panel drag + resize (chrome only — not subject to the %-unit rule,
   which applies to the animation's own position/size controls)
--------------------------------------------------------------------- */
function tryCapture(el, pointerId){
  try { el.setPointerCapture(pointerId); } catch (err) { /* no active pointer to capture — window-level listeners below still work */ }
}

// Shared with applyPanelGeometry() below -- a saved position/size can come
// from a WIDER viewport than the one it's being loaded into (a different
// device, or the same device with the browser window since resized), and
// resetSettings()'s own async settings fetch applies that saved geometry
// several seconds AFTER boot, well after initPanelDrag()'s own one-time
// startup clamp already ran (harmlessly, against the panel's still-default
// position) -- with no 'resize' event to trigger a re-clamp afterward for a
// user who never actually resizes their window. Reported directly: "Dev
// panel dissappears in the first seconds of startup in dev mode" -- the
// panel was rendering fine at its default position, then silently jumping
// off-screen the moment the real saved geometry (e.g. left:1552 on a
// narrower-than-that viewport) landed unclamped. See CLAUDE.md gotchas.
function clampPanelToViewport(){
  const panel = document.getElementById('devPanel');
  if (panel.classList.contains('hidden')) return;
  const r = panel.getBoundingClientRect();
  const maxLeft = Math.max(0, viewportW() - r.width);
  const maxTop = Math.max(0, viewportH() - r.height);
  const left = Math.max(0, Math.min(maxLeft, r.left));
  const top = Math.max(0, Math.min(maxTop, r.top));
  if (left !== r.left || top !== r.top){
    panel.style.right = 'auto';
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  }
}
function initPanelDrag(){
  const panel = document.getElementById('devPanel');
  const header = document.getElementById('dpHeader');
  header.addEventListener('pointerdown', e => {
    if (e.target.closest('.dp-icon-btn')) return;
    tryCapture(header, e.pointerId);
    const r = panel.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY, startLeft = r.left, startTop = r.top;
    panel.style.right = 'auto';

    function move(ev){
      // clamp against the panel's OWN actual width/height, not a fixed
      // stub margin — otherwise most of the panel (including the resize
      // corners, which sit right at its edges) can be dragged off-screen
      // well before the drag "stops".
      const maxLeft = Math.max(0, viewportW() - r.width);
      const maxTop = Math.max(0, viewportH() - r.height);
      panel.style.left = Math.max(0, Math.min(maxLeft, startLeft + (ev.clientX - startX))) + 'px';
      panel.style.top = Math.max(0, Math.min(maxTop, startTop + (ev.clientY - startY))) + 'px';
    }
    function up(){ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
  // §12c clamping only ever fired during an active drag -- resizing the
  // BROWSER WINDOW itself (e.g. dragging it down to phone width, or a
  // real device rotation) never triggered a drag, so a panel positioned
  // fine at a wide viewport could end up with its saved `left`/`top`
  // now past the new, narrower window's own edge, with nothing to pull
  // it back -- reported directly ("when i resize my browser to phone
  // size, the panel will end up out of frame"). Reuses the shared
  // clampPanelToViewport() (see its own comment above) -- also called
  // from applyPanelGeometry() itself now, since that's what actually
  // applies a freshly-loaded saved position/size.
  window.addEventListener('resize', clampPanelToViewport);
  clampPanelToViewport();
}

// §12c: "minimum size is whatever is functionally necessary" -- derived
// live from the header's own rendered content (title text width, collapse
// button width, padding, gaps), not a hardcoded guess. Computed fresh on
// every resize-drag start rather than cached once, since the title's
// rendered width depends on the Dev Panel Title Font Size slider (part of
// the panel's own live-adjustable appearance), so a cached value could go
// stale the moment that slider moves. #dpFps (flex:1 1 auto) is
// deliberately excluded from the floor -- it's the header's designated
// shrink-first element, not a click target, so it's fine for it to have
// zero space rather than dictating the panel's minimum width. The floor
// only needs to keep the title and the (clickable) collapse button
// visible and non-overlapping -- everything below the header scrolls
// (`.dp-body{overflow-y:auto}`), so it can shrink to 0 without breaking
// anything.
function computeMinPanelSize(){
  const header = document.getElementById('dpHeader');
  const title = header.querySelector('.dp-title');
  const collapseBtn = document.getElementById('dpCollapseBtn');
  const style = getComputedStyle(header);
  const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const gap = parseFloat(style.gap) || 0;
  return {
    width: Math.ceil(title.scrollWidth + collapseBtn.offsetWidth + paddingX + gap * 2),
    height: Math.ceil(header.offsetHeight),
  };
}

/* All 4 edges + all 4 corners resizable, per §12c. */
function initResizeHandles(){
  const panel = document.getElementById('devPanel');
  document.querySelectorAll('.dp-resize').forEach(handle => {
    const dir = handle.dataset.dir;
    handle.addEventListener('pointerdown', e => {
      tryCapture(handle, e.pointerId);
      const sx = e.clientX, sy = e.clientY;
      const startRect = panel.getBoundingClientRect();
      panel.style.right = 'auto';
      const { width: minW, height: minH } = computeMinPanelSize();
      panel.style.minWidth = minW + 'px';
      panel.style.minHeight = minH + 'px';

      function move(ev){
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        let { left, top, width, height } = startRect;
        // matches the CSS max-height:88vh on #devPanel exactly — without this,
        // a requested height beyond it gets silently clamped by CSS while this
        // math still thinks the full request took effect, so 's' would go
        // visually unresponsive past the cap and 'n' would push the panel's
        // top off-screen while its (uncompensated) height stayed clamped,
        // shrinking the panel from the bottom instead of growing it.
        const maxH = viewportH() * 0.88;
        if (dir.includes('e')) width = Math.max(minW, Math.min(viewportW() - left, startRect.width + dx));
        if (dir.includes('s')) height = Math.max(minH, Math.min(maxH, viewportH() - top, startRect.height + dy));
        if (dir.includes('w')) { width = Math.max(minW, startRect.width - dx); left = startRect.left + (startRect.width - width); }
        if (dir.includes('n')) {
          // the bottom edge is the fixed point for a pure top-edge resize —
          // compute height from the (clamped) top, not the other way around,
          // so the two never disagree about where the bottom edge actually is.
          const bottomEdge = startRect.top + startRect.height;
          let newTop = startRect.top + dy;
          newTop = Math.max(0, bottomEdge - maxH, Math.min(newTop, bottomEdge - minH));
          top = newTop;
          height = bottomEdge - newTop;
        }
        panel.style.width = width + 'px';
        panel.style.height = height + 'px';
        panel.style.left = left + 'px';
        panel.style.top = top + 'px';
      }
      function up(){ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  });
}

/* ---------------------------------------------------------------------
   Copy / Save / Reset settings (§12d), reorderable-group/setting order
   captured alongside values (§12e), panel size/position saved separately
   per device class (§12f).
--------------------------------------------------------------------- */
const isMobileClass = () => window.matchMedia('(max-width: 767px)').matches;
// which tab (Desktop/Mobile, §12f) is active — the panel's own geometry keys off
// this explicit selection, not the live viewport, so it can be previewed/tuned
// without actually resizing the browser. Every functional setting in this
// project is already %/vmin-based (§12a), so none of them need to be
// device-split — only the panel's own chrome (§12c) does, per §12f's own text.
let activeDeviceTab = isMobileClass() ? 'mobile' : 'desktop';

// Captures one group's own direct row keys, plus any subgroups it
// directly contains -- genuinely recursive, UNLIMITED depth (matching
// groupDragTargets()'s own unlimited-depth nesting). `:scope`-scoped
// throughout so a query only ever reaches DIRECT children at each
// level; the recursion itself (subgroups.map(sub => captureGroup(sub)))
// is what reaches deeper levels, one call per level, not a wider query.
// `subgroups` is a new-ish field (old saved data simply won't have it
// -- applyOrder()'s own `(saved.subgroups || [])` handles that as "no
// subgroups", not an error).
function captureGroup(g){
  const body = g.querySelector(':scope > .dp-group-body');
  return {
    key: g.dataset.key,
    collapsed: g.classList.contains('collapsed'),
    settings: Array.from(body.querySelectorAll(':scope > .dp-row')).map(r => r.dataset.key),
    subgroups: Array.from(body.querySelectorAll(':scope > .dp-group')).map(sub => captureGroup(sub)),
  };
}
// A row can now live in #dpGroups' subtree (inside some group) OR in
// #dpUngrouped (outside every group) -- searches the WHOLE panel, not
// just one or the other, since a row's current location can genuinely
// be either depending on what's been dragged where.
function findRowByKey(key){
  return document.getElementById('devPanel').querySelector('.dp-row[data-key="' + CSS.escape(key) + '"]');
}
// order.ungrouped: the row keys currently sitting directly in
// #dpUngrouped, in order -- new field, alongside the pre-existing
// order.groups (was the WHOLE return value before ungrouped settings
// existed; applyOrder() below still accepts that old bare-array shape
// for backward compat with a save from before this feature).
function getPanelOrder(){
  return {
    ungrouped: Array.from(document.getElementById('dpUngrouped').querySelectorAll(':scope > .dp-row')).map(r => r.dataset.key),
    groups: Array.from(document.querySelectorAll('#dpGroups > .dp-group')).map(g => captureGroup(g)),
  };
}

// Places one saved group (and, recursively, its own saved subgroups at
// ANY depth) into parentContainer -- either #dpGroups itself (top-level)
// or another group's own .dp-group-body (nested), matching
// captureGroup()'s own unlimited-depth recursion. Searches the WHOLE
// panel for an existing group/row by key -- not just within
// parentContainer -- since a row or group may currently sit somewhere
// else in the tree (e.g. nested last save, top-level again this time,
// or now, ungrouped last save but saved back into a group this time).
function placeGroup(saved, parentContainer){
  const dpGroupsEl = document.getElementById('dpGroups');
  let groupEl = dpGroupsEl.querySelector('.dp-group[data-key="' + CSS.escape(saved.key) + '"]');
  if (!groupEl){
    // Not a mistake -- this is how a CUSTOM group (see addDevGroup())
    // survives a reload: it doesn't exist in DEV_GROUPS/the static build
    // at all, only in saved order.
    groupEl = createGroupElement(saved.key);
    // No per-group row registration needed -- the single delegated row
    // listener (see makeReorderable()'s own comment) already reaches
    // this new group's body via event delegation.
  }
  parentContainer.appendChild(groupEl);
  groupEl.classList.toggle('collapsed', !!saved.collapsed);
  const body = groupEl.querySelector(':scope > .dp-group-body');
  (saved.settings || []).forEach(k => {
    const rowEl = findRowByKey(k);
    if (rowEl) body.appendChild(rowEl);
  });
  (saved.subgroups || []).forEach(sub => placeGroup(sub, body));
}
function applyOrder(order){
  if (!order) return;
  const groupsContainer = document.getElementById('dpGroups');
  const ungroupedEl = document.getElementById('dpUngrouped');
  // Backward compat: a save from before ungrouped settings existed has
  // `order` as a bare array (what getPanelOrder() used to return
  // wholesale) -- treat that as "no ungrouped rows recorded" rather
  // than an error, same convention as captureGroup()'s own
  // `(saved.subgroups || [])` for an older field that didn't exist yet.
  const groups = Array.isArray(order) ? order : (order.groups || []);
  const ungrouped = Array.isArray(order) ? [] : (order.ungrouped || []);
  groups.forEach(g => placeGroup(g, groupsContainer));
  ungrouped.forEach(k => {
    const rowEl = findRowByKey(k);
    if (rowEl) ungroupedEl.appendChild(rowEl);
  });
}

function applyValues(values){
  DEV_GROUPS.forEach(group => group.controls.forEach(ctrl => {
    if (!(ctrl.key in (values || {}))) return;
    const v = values[ctrl.key];
    const el = numEls[ctrl.key];
    if (ctrl.type === 'slider'){
      // cfg write and onChange happen regardless of whether el exists --
      // a real visitor (no dev panel built, el always undefined here)
      // still needs the actual functional value/side-effect to apply;
      // only the slider/numInput DOM sync is dev-panel-only, per the
      // same convention 'color'/'checkbox'/'dropdown' below already use.
      cfg[ctrl.key] = v;
      if (el){
        if (v > parseFloat(el.slider.max)) el.slider.max = v;
        if (v < parseFloat(el.slider.min)) el.slider.min = v;
        el.slider.value = v; el.numInput.value = round(v, 3);
      }
      if (ctrl.onChange) ctrl.onChange(v);
    } else if (ctrl.type === 'color'){
      cfg[ctrl.key] = v;
      const input = document.querySelector('.dp-row[data-key="' + CSS.escape(ctrl.key) + '"] input[type=color]');
      if (input) input.value = v;
    } else if (ctrl.type === 'checkbox'){
      cfg[ctrl.key] = v;
      const input = document.querySelector('.dp-row[data-key="' + CSS.escape(ctrl.key) + '"] input[type=checkbox]');
      if (input) input.checked = v;
    } else if (ctrl.type === 'dropdown'){
      cfg[ctrl.key] = v;
      const select = document.querySelector('.dp-row[data-key="' + CSS.escape(ctrl.key) + '"] select');
      if (select) select.value = v;
      if (ctrl.onChange) ctrl.onChange(v);
    } else if (ctrl.type === 'gradient'){
      if (Array.isArray(v) && v.length){
        // Auto-converts a pre-existing save from the OLD gradient format
        // (a plain array of hex strings, evenly spaced) to the current
        // {pos, color} shape, rather than silently doing nothing with it
        // -- a save from before this round's editor rebuild should still
        // load correctly, not just get dropped.
        const stops = typeof v[0] === 'object' ? v : v.map((c, i) => ({ pos: v.length > 1 ? i / (v.length - 1) : 0, color: c }));
        // el.setStops() writes cfg[ctrl.key] itself (see its own
        // definition) AND re-renders the gradient bar UI -- but el is
        // always undefined for a real visitor with no dev panel built,
        // so cfg has to be set directly here too, same reasoning as the
        // 'slider' branch above.
        if (el && el.setStops) el.setStops(stops);
        else cfg[ctrl.key] = stops.map(s => ({ ...s }));
      }
    }
  }));
}

function getPanelGeometry(){
  const r = document.getElementById('devPanel').getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height, style: { ...panelStyle } };
}

function applyPanelGeometry(geom){
  // geom === null means "nothing saved for this tab" — reset to the CSS
  // default rather than silently leaving whatever the other tab had applied.
  const panel = document.getElementById('devPanel');
  if (geom){
    panel.style.right = 'auto';
    panel.style.left = geom.left + 'px';
    panel.style.top = geom.top + 'px';
    panel.style.width = geom.width + 'px';
    panel.style.height = geom.height + 'px';
  } else {
    panel.style.left = ''; panel.style.top = ''; panel.style.right = '';
    panel.style.width = ''; panel.style.height = '';
  }
  applyPanelStyleValues(geom && geom.style);
  // A geom loaded from a wider viewport (a different device, or this same
  // one since resized) needs the same re-clamp initPanelDrag()'s own
  // resize listener already does -- this is the call site that was
  // actually missing one (see clampPanelToViewport()'s own comment for
  // the full story: this fn runs asynchronously, seconds after boot,
  // well after initPanelDrag()'s one-time startup clamp already ran
  // against the panel's still-default position).
  clampPanelToViewport();
}

/* ---------------------------------------------------------------------
   §12l/§12d: Save Settings writes ONLY to a git-tracked settings log
   (data/processed/dev-panel-settings.json) — there is deliberately no
   persistent browser-local default alongside it. Reset restores from that
   same file, not from any local default. Three tiers, tried in order,
   each covering what the one before it can't:

   1. Vercel/GitHub API (writeSettingsViaApi()/readSettingsViaApi() above)
      — a serverless function (api/save-settings.js) commits straight to
      the repo via GitHub's Contents API. The ONLY tier that works from a
      device with no filesystem access of its own (e.g. a phone visiting
      the deployed site with ?dev=1). Tried whenever a real server is
      behind the page at all (not file://) — reads always try this first
      (a plain fetch of the already-committed static file, so it works
      from any server including a local one), writes fall through to
      Tier 2 if this fails (not deployed as Vercel, network error, or the
      function's env vars genuinely aren't configured yet).
   2. File System Access API (GIT_LOG_WRITABLE, getGitSettingsFileHandle()
      below) — direct local disk write via a native picker. The FIRST
      Save on a given browser prompts that dialog (navigate to
      data/processed/, use the suggested filename); the resulting handle
      is persisted in IndexedDB so every later Save/Reset reuses it with
      no dialog. Reading at boot never prompts (no user gesture exists
      yet) — it only succeeds if this browser already silently holds read
      permission on a previously-picked handle (queryPermission, which
      never shows UI). Chromium-only (Firefox/Safari lack the API) and
      feature-detected throughout.
   3. Local save prompt + sessionStorage (downloadSettingsAsFile() above,
      SESSION_FALLBACK_KEY below) — last resort when neither of the above
      reached the git-tracked log at all (§12l's "no server, opened
      directly as a local file" exception, or a browser lacking both
      capabilities). Never a persistent local default — sessionStorage is
      gone the moment the tab closes, so it exists only so a Save made in
      this mode has anything for that same tab's own Reset to read back.
--------------------------------------------------------------------- */
const GIT_SETTINGS_FILENAME = 'dev-panel-settings.json';
const IDB_NAME = 'dickoClicko';
const IDB_STORE = 'handles';
const IDB_HANDLE_KEY = 'gitSettingsFileHandle';
// the last snapshot read from (or written to) the git settings log, kept
// in memory so tab-switching/copySettings can find the OTHER device's
// panel geometry without re-reading the file — there is no localStorage
// fallback for any of this anymore.
let lastLoadedSnapshot = null;

// Shared anti-abuse token for /api/save-settings -- NOT a real secret (it
// ships in this public page's source, same as every other client-side
// value here); it exists only to keep a random visitor from spamming
// commits to the repo. Must match the DEV_PANEL_SAVE_SECRET env var set on
// the Vercel project -- see README.md for setup. Reuses the exact same
// value CLICKO already uses, since this is one workspace-wide shared
// secret (CLAUDE.md §12l), not a per-project one.
const DEV_PANEL_SAVE_SECRET = 'PkrbMti03M6xm3FEThYXa8gGW_08BOGj';

// Tier 1 of Save/Reset (see saveSettings()/resetSettings() below): a
// Vercel serverless function (api/save-settings.js) that commits straight
// to data/processed/dev-panel-settings.json via GitHub's Contents API.
// This is the ONLY tier that works from a device with no local filesystem
// access of its own (a phone visiting the deployed site with ?dev=1
// appended) -- Tier 2's File System Access picker would just save to some
// location on THAT visitor's own disk, unrelated to this repo. Reading is
// simpler than writing: once committed, the settings file is just an
// ordinary static asset, so Reset fetches it directly rather than needing
// its own API route.
// Returns {ok, error} rather than a bare boolean -- api/save-settings.js's
// own error responses (missing env vars, secret mismatch, GitHub API
// failure) are worth surfacing directly rather than collapsing every
// failure mode into a single generic "didn't work", both for real users
// and for diagnosing a live deployment's actual problem from the outside.
async function writeSettingsViaApi(data){
  try {
    const resp = await fetch('/api/save-settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Dev-Panel-Secret': DEV_PANEL_SAVE_SECRET },
      body: JSON.stringify(data),
    });
    const body = await resp.json().catch(() => ({}));
    if (resp.ok && body.ok === true) return { ok: true };
    return { ok: false, error: body.error || `HTTP ${resp.status}` };
  } catch (err) {
    return { ok: false, error: 'offline or unreachable: ' + String((err && err.message) || err) };
  }
}
async function readSettingsViaApi(){
  try {
    const resp = await fetch('/data/processed/dev-panel-settings.json', { cache: 'no-store' });
    if (!resp.ok) return null; // e.g. 404 before the file exists yet, or not served at all
    return await resp.json();
  } catch (err) {
    return null;
  }
}

// Tier 3 last resort (see saveSettings() below): when nothing above
// reached the git-tracked log at all, hand the user a real file they can
// save themselves, via the browser's ordinary download mechanism -- works
// everywhere a normal file:// page runs, unlike the File System Access
// API's native picker.
function downloadSettingsAsFile(data){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = GIT_SETTINGS_FILENAME;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// True only for a genuine local-development context (a bare local file, or
// a local dev server) -- false for a real deployed/hosted origin (a Vercel
// preview or production URL, or any other real domain), even though that
// origin's own protocol is a normal https:// that would otherwise pass a
// bare "not file:" check. This is the actual "is there a local checkout
// behind this page at all" signal that both the fallback tiers below and
// saveSettings() itself (see its own comment) key off of -- a deployed
// page must never fall through to a local-save mechanism, per §12l/§12d's
// explicit rule, regardless of whether Tier 1 (the Vercel/GitHub API)
// succeeds or fails.
const IS_LOCAL_CONTEXT = location.protocol === 'file:' ||
  location.hostname === 'localhost' || location.hostname === '127.0.0.1';

// §12l's scope for Tier 2 specifically (the File System Access picker):
// gated on DEV_MODE, not just protocol/API capability -- the native
// save-file picker/disk write only makes sense against a real local
// checkout (localhost/127.0.0.1, never file: -- see below), never against
// a deployed/hosted origin, which has no locally-tracked repo file for
// that write to be meaningfully "tracked" through. Corrected same day as
// this comment's own original wording: the code previously only checked
// `location.protocol !== 'file:'`, which stayed TRUE for any real deployed
// domain too (a normal https:// origin passes that check just as easily
// as localhost does) -- confirmed via direct user report: hitting Save on
// a real, correctly-configured Vercel deployment still triggered the
// native picker dialog, exactly the "local save prompt on a served
// deployment" behavior §12d/§12l calls out as a bug. Now requires
// IS_LOCAL_CONTEXT's own hostname check, which a deployed origin can never
// satisfy. `location.protocol !== 'file:'` is layered on TOP of
// IS_LOCAL_CONTEXT (not redundant with it) because IS_LOCAL_CONTEXT itself
// still counts file: as local (that's what makes the dev panel visible
// when opened as a bare local file, per DEV_MODE) -- this is the one case
// where git-write must stay off despite being "local", per §12l's own "no
// server behind it at all" exception. Also false in the ordinary case of a
// browser lacking the API entirely (Firefox/Safari). Checked once, not
// per-call, since these are environmental facts that don't change
// mid-session. When false, Save/Reset use SESSION_FALLBACK_KEY instead
// (sessionStorage, not localStorage -- it's gone the moment the tab
// closes, so it can never become the persistent "separate browser-local
// default" §12d/§12l otherwise bans; it exists only so a Save made in this
// mode has anything for that same tab's own Reset to read back).
const GIT_LOG_WRITABLE = DEV_MODE && IS_LOCAL_CONTEXT && location.protocol !== 'file:' && 'showSaveFilePicker' in window;
const SESSION_FALLBACK_KEY = 'dickoClicko.sessionSettings';

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// mode: 'read' (boot/Reset — never prompts) or 'readwrite' (Save — may
// prompt, since it always runs from a real click/keydown user gesture).
async function getGitSettingsFileHandle(mode, promptIfMissing){
  if (!('showSaveFilePicker' in window)) return null;
  let handle = null;
  try { handle = await idbGet(IDB_HANDLE_KEY); } catch (err) { handle = null; }
  if (handle){
    try {
      let perm = await handle.queryPermission({ mode }); // never shows UI
      if (perm !== 'granted' && promptIfMissing){
        perm = await handle.requestPermission({ mode }); // needs a user gesture to actually prompt
      }
      if (perm === 'granted') return handle;
    } catch (err) { /* handle stale/revoked — fall through to re-prompt below */ }
  }
  if (!promptIfMissing) return null; // boot-time/Reset read: never force a picker with no gesture behind it
  try {
    handle = await window.showSaveFilePicker({
      suggestedName: GIT_SETTINGS_FILENAME,
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
    });
    await idbSet(IDB_HANDLE_KEY, handle);
    return handle;
  } catch (err) {
    return null; // user cancelled the picker, or the API is blocked
  }
}

async function writeGitSettingsLog(data){
  const handle = await getGitSettingsFileHandle('readwrite', true);
  if (!handle) return false;
  try {
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    return true;
  } catch (err) {
    return false;
  }
}

async function readGitSettingsLog(){
  const handle = await getGitSettingsFileHandle('read', false);
  if (!handle) return null;
  try {
    const file = await handle.getFile();
    return JSON.parse(await file.text());
  } catch (err) {
    return null; // missing/empty/corrupt file, or permission not actually granted
  }
}

async function saveSettings(){
  const current = activeDeviceTab;
  const other = activeDeviceTab === 'mobile' ? 'desktop' : 'mobile';
  const otherGeom = lastLoadedSnapshot && lastLoadedSnapshot.panelGeometry ? lastLoadedSnapshot.panelGeometry[other] : null;
  const snapshot = {
    values: { ...cfg },
    order: getPanelOrder(),
    panelGeometry: { [current]: getPanelGeometry(), [other]: otherGeom },
    // Not device-split (unlike panelGeometry/panelStyle) -- a renamed
    // label should read the same regardless of which tab is active,
    // same rationale as cfg's own settings values.
    textOverrides: { ...devTextOverrides },
  };
  const btn = document.getElementById('dpSaveBtn');
  const flash = (text, holdMs) => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = text;
    setTimeout(() => btn.textContent = orig, holdMs || 900);
  };

  // Tier 1: Vercel/GitHub API -- works from any device (see the big comment
  // above), so try it whenever a real server is behind the page at all.
  if (location.protocol !== 'file:'){
    const result = await writeSettingsViaApi(snapshot);
    if (result.ok){
      lastLoadedSnapshot = snapshot;
      flash('Saved to repo!');
      return;
    }
    // §12d/§12l: a genuinely deployed page must NEVER fall through to a
    // local-save mechanism (Tier 2's native picker, or Tier 3's download
    // dialog) -- confirmed via direct user report that this was actually
    // happening (Save on a real, configured Vercel deployment still
    // triggered the native picker, since the OLD IS_LOCAL_CONTEXT-less
    // check let it fall through here). Report the real failure and stop;
    // console.error too, since the on-screen flash is brief and the error
    // text (e.g. "Server not configured - missing: ...", a GitHub API
    // failure detail) is exactly what's needed to diagnose a live
    // deployment from the outside.
    if (!IS_LOCAL_CONTEXT){
      console.error('[saveSettings] Vercel/GitHub API write failed:', result.error);
      flash('Save failed: ' + result.error, 4000);
      return;
    }
  }

  // Tier 2: direct local disk write via the File System Access API. Local
  // dev only (IS_LOCAL_CONTEXT, folded into GIT_LOG_WRITABLE itself) --
  // never reached on a real deployment, per the guard above.
  if (GIT_LOG_WRITABLE){
    const ok = await writeGitSettingsLog(snapshot);
    if (ok){
      lastLoadedSnapshot = snapshot;
      flash('Saved!');
      return;
    }
    // fall through to Tier 3 rather than reporting outright failure -- the
    // picker may have just been cancelled, and the user still gets SOME
    // way to preserve this Save.
  }

  // Tier 3: nothing above reached the git-tracked log at all -- §12l's "no
  // server, opened directly as a local file" exception. Hand the user a
  // real downloadable file AND stash it in this tab's own sessionStorage
  // (never a persistent local default), rather than failing outright, and
  // say so honestly rather than claiming a real git-log save.
  try {
    downloadSettingsAsFile(snapshot);
    sessionStorage.setItem(SESSION_FALLBACK_KEY, JSON.stringify(snapshot));
    lastLoadedSnapshot = snapshot;
    flash('Saved (session only)');
  } catch (err) {
    flash('Save failed');
  }
}

async function resetSettings(){
  let snap = null;

  // Tier 1: the git-tracked settings log is just a static asset once
  // committed, so a plain fetch works on ANY server (local dev server or a
  // real Vercel deployment) -- no picker/permission dance needed for reads.
  if (location.protocol !== 'file:'){
    snap = await readSettingsViaApi();
  }
  // Tier 2: this browser's own previously-granted File System Access handle.
  if (!snap && GIT_LOG_WRITABLE){
    snap = await readGitSettingsLog();
  }
  // Tier 3: this tab's own sessionStorage fallback.
  if (!snap){
    try { snap = JSON.parse(sessionStorage.getItem(SESSION_FALLBACK_KEY)); } catch (err) { snap = null; }
  }

  lastLoadedSnapshot = snap;
  if (snap){
    applyOrder(snap.order);
    applyValues(snap.values);
  }
  applyPanelGeometry(snap && snap.panelGeometry ? snap.panelGeometry[activeDeviceTab] : null);
  // Always resolve (falling back to {}), same "don't silently keep
  // whatever was already showing" convention as applyPanelStyleValues().
  devTextOverrides = (snap && snap.textOverrides) ? { ...snap.textOverrides } : {};
  applyDevTextOverrides();
}

function copySettings(){
  const current = activeDeviceTab;
  const other = activeDeviceTab === 'mobile' ? 'desktop' : 'mobile';
  const otherGeom = lastLoadedSnapshot && lastLoadedSnapshot.panelGeometry ? lastLoadedSnapshot.panelGeometry[other] : null;
  const snapshot = {
    values: { ...cfg },
    order: getPanelOrder(),
    panelGeometry: { [current]: getPanelGeometry(), [other]: otherGeom },
    textOverrides: { ...devTextOverrides },
  };
  const text = JSON.stringify(snapshot, null, 2);
  const btn = document.getElementById('dpCopyBtn');
  const flash = msg => { const orig = btn.textContent; btn.textContent = msg; setTimeout(() => btn.textContent = orig, 900); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flash('Copied!')).catch(() => flash('Copy failed'));
  } else {
    flash('Copy failed');
  }
}

function initDeviceTabs(){

function initDevPanelChrome(){
  document.getElementById('dpCopyBtn').addEventListener('click', copySettings);
  document.getElementById('dpSaveBtn').addEventListener('click', saveSettings);
  document.getElementById('dpResetBtn').addEventListener('click', resetSettings);
  document.getElementById('dpClickLogClear').addEventListener('click', () => {
    const el = document.getElementById('dpClickLog');
    el.innerHTML = '<span class="dp-click-log-empty">(no clicks yet)</span>';
  });
  document.getElementById('dpCollapseBtn').addEventListener('click', () => {
    const panel = document.getElementById('devPanel');
    const collapsing = !panel.classList.contains('dp-collapsed');
    panel.classList.toggle('dp-collapsed');
    // The CSS rule (#devPanel.dp-collapsed .dp-body/.dp-resize) only
    // hides the BODY and resize handles -- it never touched the panel's
    // own explicit inline height (set by dragging a resize handle, or by
    // a saved-settings reload via applyPanelGeometry()). Left alone, that
    // explicit height persisted across collapse, leaving the panel's own
    // outer box at its full pre-collapse size with a big empty gap below
    // the title bar -- reported as "collapse button simply collapses the
    // setting options but not the panel". Saving/clearing/restoring the
    // explicit height here (not touching width, which should stay as-is)
    // is what actually shrinks the panel itself down to just its title
    // bar while collapsed, and restores the user's own resized height
    // when expanded again.
    if (collapsing){
      panel.dataset.preCollapseHeight = panel.style.height;
      panel.style.height = '';
    } else {
      panel.style.height = panel.dataset.preCollapseHeight || '';
      delete panel.dataset.preCollapseHeight;
    }
    document.getElementById('dpCollapseBtn').textContent = panel.classList.contains('dp-collapsed') ? '+' : '–';
  });
  window.addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'd' || e.key === 'D') document.getElementById('devPanel').classList.toggle('hidden');
    else if (e.key === 'r' || e.key === 'R') resetSettings();
  });
}

// window.innerWidth/innerHeight can genuinely read 0 for a brief moment
// on some mobile browsers, right at the point this script's own top-level
// boot code runs (before the viewport has settled/laid out) -- confirmed
// directly via a temporary boot-time console.log, not assumed: a real
// page load showed window.innerHeight === 0 at the exact line
// resetMainRope() is first called. That 0 silently propagated into
// vh()-derived NaN math (targetSeg became 0, so totalLen/targetSeg was
// 0/0 = NaN), which Math.max(2, NaN) does NOT clamp back to 2 (Math.max
// with a NaN operand returns NaN, not the other operand) -- so
// mainRope.points ended up permanently empty from frame one, and every
// subsequent update() threw trying to read points[0] for the anchor's
// boundaryConstraint. Reported directly as "the start button [the
// circle] appears then disappears after a second" on a real mobile
// Vercel visit -- exactly what a graphic drawn successfully ONCE (before
// the very first update() throws and every later frame silently no-ops)
// would look like. Falls back to `document.documentElement.clientHeight`/
// `clientWidth` (usually already valid even when window.innerHeight
// isn't yet) and finally a hardcoded sane default, so vh()/vw()/vmin()
// can never silently multiply by zero again, however early they're
// called from. Declared here, ABOVE Canvas setup below, since
// resizeCanvas() (called immediately, synchronously, at boot) needs
// these too -- a 0x0 canvas wouldn't throw, but would mean nothing
// paints at all until a later real resize event corrects it.
const viewportW = () => window.innerWidth || document.documentElement.clientWidth || 400;
const viewportH = () => window.innerHeight || document.documentElement.clientHeight || 800;
const vw = pct => viewportW() * pct / 100;
const vh = pct => viewportH() * pct / 100;
const vmin = pct => Math.min(viewportW(), viewportH()) * pct / 100;

// Per-pixel alpha hit-test, shared by all 3 FLICK animations' own
// isPointInFlick*() below -- reported directly: "make sure it only
// triggers when i click within the visible parts of the pngs... right
// now it is triggered when i click very far from it." Every prior
// isPointInFlick*() only ever checked the bounding RECT (matching the
// image's own drawn width/height), never whether the clicked pixel was
// actually opaque -- a source PNG with real transparent margin around
// its visible content (common for these hand-pose frames, none of which
// were cropped tight) let a click anywhere in that invisible margin
// still register as a hit. Draws just the 1 relevant source pixel into a
// shared 1x1 offscreen canvas and reads its alpha back rather than
// precomputing/caching a full per-image alpha map -- cheap enough to run
// on every pointerdown (a rare, human-paced event, not a per-frame cost).
const hitTestCanvas = document.createElement('canvas');
hitTestCanvas.width = 1; hitTestCanvas.height = 1;
const hitTestCtx = hitTestCanvas.getContext('2d', { willReadFrequently: true });
const ALPHA_HIT_THRESHOLD = 10; // out of 255 -- lets a barely-visible anti-aliased edge pixel still count as a real hit, not just fully-opaque
function isPixelVisible(img, rectX, rectY, rectW, rectH, x, y){
  if (!img || !img.complete || img.naturalWidth === 0 || rectW <= 0 || rectH <= 0) return false;
  if (x < rectX || x > rectX + rectW || y < rectY || y > rectY + rectH) return false;
  const nx = Math.min(img.naturalWidth - 1, Math.max(0, Math.floor((x - rectX) / rectW * img.naturalWidth)));
  const ny = Math.min(img.naturalHeight - 1, Math.max(0, Math.floor((y - rectY) / rectH * img.naturalHeight)));
  hitTestCtx.clearRect(0, 0, 1, 1);
  hitTestCtx.drawImage(img, nx, ny, 1, 1, 0, 0, 1, 1);
  return hitTestCtx.getImageData(0, 0, 1, 1).data[3] > ALPHA_HIT_THRESHOLD;
}

// The rect drawn in render(), kept in sync there each frame -- same
// pattern as flick2Rect/isPointInFlick2 below. Still the first, cheap
// reject isPixelVisible() itself also checks -- the rect and the pixel
// check are complementary, not redundant: the rect alone (old behavior)
// was too PERMISSIVE (any point inside the box, including transparent
// margin, counted); pixel-alpha alone with no rect pre-check would still
// work correctly but the rect keeps the common case (a click nowhere
// near the graphic at all) a simple bounds compare instead of always
// touching the canvas.
const flickRect = { x: 0, y: 0, w: 0, h: 0 };
function isPointInFlick(x, y){

// there is nothing left to keep in sync.

    const t = cfg.mouseFlickTargetMode === 'random' ? mfRandomTargetPoint : cfg.mouseFlickTargetPoint;
    return mouseFlickPointOnRope(t);
  }
  if (mode === 'rope') return nearestPointOnRope(mfEntityX, mfEntityY, mainRope.points);
  return null;
}
// The real frame-NUMBER array a variant's forward-ordered frames
// correspond to (not array index) -- variant.nums when present
// (non-contiguous sets, e.g. base's own trimmed sets), else the
// implied contiguous 1..count range. Used by mouseFlickRemapSequence()
// below to preserve "same frame number, nearest if missing" across a
// mid-sequence direction switch (explicit spec, point 3).
function mouseFlickVariantNumbers(variant){
  return variant.nums || Array.from({ length: variant.count }, (_, i) => i + 1);
}
function mouseFlickNearestIndex(numbers, target){
  let bestIdx = 0, bestDiff = Infinity;
  numbers.forEach((n, i) => {
    const diff = Math.abs(n - target);
    if (diff < bestDiff){ bestDiff = diff; bestIdx = i; }
  });
  return bestIdx;
}
// SNAP's freeze-at-42 mechanic (see the mfSnapFrozen call site) targets
// this INDEX, not a hardcoded number -- computed via the same nearest-
// number lookup used for mid-sequence switching, so a future SNAP frame
// trim that removes 41 itself still resolves to the closest surviving
// number rather than going silently stale the way the old hardcoded
// `41` did when SNAP went from 45 contiguous frames to 38 non-
// contiguous ones (2026-09-10 regression -- see CLAUDE.md gotchas).
// Assumes SNAP_A_FRAME_NUMBERS is shared across all 8 directions, true
// as of this writing (re-verify if SNAP ever goes per-direction like
// base/click already has).
const SNAP_FREEZE_INDEX = mouseFlickNearestIndex(SNAP_A_FRAME_NUMBERS, 41);

// Per-direction, per-VARIANT visible-content anchor point -- ported
// directly from DotFlicko's own VISIBLE_BOUNDS_BY_DIRECTION (per
// explicit request: "we have in that project placed a specific end
// point for each animation type... good enough"). The cursor should
// sit at the base of the WRIST, i.e. the bottom-center of each frame's
// own actual non-transparent content, not the raw PNG's geometric
// bottom-center (the source art has real transparent padding around
// the visible hand -- same class of padding DotFlicko had to account
// for, confirmed here too: this table's own 'behind'/base entry
// (0.5265/0.8916) matches DotFlicko's 'behind' entry EXACTLY, since
// the base frame art is shared between the 2 sibling projects).
//
// Extended beyond DotFlicko's own single-set-per-direction shape:
// DotFlicko has no SCISS/SNAP/CHARGE, only one pose set per direction,
// so one vb per direction was enough there. Here each of the 4
// variants (base/sciss/snap/charge) is its own distinct pose with its
// own wrist placement within the frame -- confirmed real, not
// negligible (e.g. front-pinky: base bottomY 0.9221 vs charge 0.9228;
// front-thumb: base centerX 0.4738 vs sciss 0.4706) -- so bounds are
// computed per (direction, variant) pair, 32 entries total, each from
// that variant's own frame 1 (always present in every variant/
// direction as of this writing, unlike some later frame numbers that
// have been trimmed).
//
// PRECOMPUTED OFFLINE via Node + sharp against frame 1 of each real
// variant/direction on disk, same ALPHA_HIT_THRESHOLD=10 convention
// already used elsewhere in this file (hitTest/isOpaqueAtLocalPoint).
// TO REGENERATE (e.g. after replacing a direction/variant's frame 1
// art): re-run the computation against
// `data/FLICK/2TONED/<FOLDER>/A/<prefix>_001.png` for each entry,
// using DotFlicko's own documented one-liner as the template (see that
// project's VISIBLE_BOUNDS_BY_DIRECTION comment) -- same alpha
// threshold, same centerX/bottomY formula.
const MOUSE_FLICK_VISIBLE_BOUNDS = {
  'behind':       { base:{centerX:0.5265,bottomY:0.8916}, charge:{centerX:0.5266,bottomY:0.891},  sciss:{centerX:0.5299,bottomY:0.891},  snap:{centerX:0.5299,bottomY:0.891} },
  'behind-thumb': { base:{centerX:0.5029,bottomY:0.9009}, charge:{centerX:0.4987,bottomY:0.8931}, sciss:{centerX:0.4992,bottomY:0.8931}, snap:{centerX:0.4992,bottomY:0.8931} },
  'side-thumb':   { base:{centerX:0.4788,bottomY:0.8815}, charge:{centerX:0.4786,bottomY:0.8815}, sciss:{centerX:0.4786,bottomY:0.8815}, snap:{centerX:0.4786,bottomY:0.8815} },
  'front-thumb':  { base:{centerX:0.4738,bottomY:0.9009}, charge:{centerX:0.4737,bottomY:0.9005}, sciss:{centerX:0.4706,bottomY:0.9005}, snap:{centerX:0.4706,bottomY:0.9005} },
  'front':        { base:{centerX:0.4763,bottomY:0.9145}, charge:{centerX:0.4763,bottomY:0.9143}, sciss:{centerX:0.4719,bottomY:0.9143}, snap:{centerX:0.4719,bottomY:0.9143} },
  'front-pinky':  { base:{centerX:0.4942,bottomY:0.9221}, charge:{centerX:0.4943,bottomY:0.9228}, sciss:{centerX:0.4922,bottomY:0.9228}, snap:{centerX:0.4922,bottomY:0.9228} },
  'side-pinky':   { base:{centerX:0.5194,bottomY:0.9272}, charge:{centerX:0.5195,bottomY:0.927},  sciss:{centerX:0.5195,bottomY:0.927},  snap:{centerX:0.5195,bottomY:0.927} },
  'behind-pinky': { base:{centerX:0.521, bottomY:0.917},  charge:{centerX:0.5208,bottomY:0.9175}, sciss:{centerX:0.5208,bottomY:0.9175}, snap:{centerX:0.5208,bottomY:0.9175} },
};
// The 0.5/1 fallback (old center-anchor behavior) only matters for a
// direction/variant combo missing from the table above (e.g. a newly
// added direction whose bounds haven't been regenerated yet).
function mouseFlickVisibleBounds(directionKey, variantKey){
  const dir = MOUSE_FLICK_VISIBLE_BOUNDS[directionKey];
  return (dir && dir[variantKey]) || { centerX: 0.5, bottomY: 1 };
}
// Maps the live mfMode to the visible-bounds table's variant keys --
// 'click' and 'idle' both draw from the base/click frame set, so both
// resolve to 'base'; 'sciss'/'snap'/'charge' map directly to themselves.
function mouseFlickVariantKeyForMode(mode){
  if (mode === 'sciss' || mode === 'snap' || mode === 'charge') return mode;
  return 'base';
}
// Mid-sequence direction switch for click/sciss/snap (charge needs no
// equivalent -- see its own comment at the mfMode==='charge' direction-
// switch call site for why). Per explicit spec: continue the sequence
// in the new direction "from the same frame number; if that exact
// frame number does not exist...use the next closest frame number,"
// and this applies even mid-sequence, not just while idle.
//
// click's own forward-then-mirrored-reverse shape needs to know which
// half of the sequence the current position falls in (so the NEW
// position mirrors correctly too); sciss/snap are plain forward-only,
// no mirroring. Preserves the sub-frame fractional part of
// mfFrameAccum so playback speed doesn't visibly stutter at the switch
// instant.
function mouseFlickRemapSequence(newKey){
  const oldDir = mouseFlickDirection();
  const newDir = MOUSE_FLICK_DIRECTIONS.find(d => d.key === newKey);
  if (!newDir) return;
  const variantKey = mfMode === 'click' ? 'base' : mfMode;
  const oldNumbers = mouseFlickVariantNumbers(oldDir[variantKey]);
  const newNumbers = mouseFlickVariantNumbers(newDir[variantKey]);
  const newFrames = mouseFlickFramesByDirection[newKey] && mouseFlickFramesByDirection[newKey][mfMode];
  if (!newFrames || !newFrames.length || !oldNumbers.length || !newNumbers.length) return;
  const p = Math.floor(mfFrameAccum);
  const frac = mfFrameAccum - p;
  let currentNumber, forwardHalf = true;
  if (mfMode === 'click'){
    const n = oldNumbers.length;
