    if (p < n){ currentNumber = oldNumbers[p]; forwardHalf = true; }
    else { currentNumber = oldNumbers[Math.max(0, Math.min(n - 1, 2 * n - 2 - p))]; forwardHalf = false; }
  } else {
    currentNumber = oldNumbers[Math.max(0, Math.min(oldNumbers.length - 1, p))];
  }
  const newIdx = mouseFlickNearestIndex(newNumbers, currentNumber);
  let newPos;
  if (mfMode === 'click' && !forwardHalf){
    const n2 = newNumbers.length;
    newPos = Math.max(0, 2 * n2 - 2 - newIdx);
  } else {
    newPos = newIdx;
  }
  mfFrameAccum = newPos + frac;
  mfFrozenFrames = newFrames;
}
// Starts a fresh click/sciss/snap play (forward, or forward+reverse for
// click) -- ignored if a mode is already active, same "in-progress
// sequence can't be interrupted" rule the other 3 FLICK animations use.
function mouseFlickStartPlay(mode){
  if (mfMode !== 'idle') return;
  const frames = mouseFlickFramesByDirection[mfDirectionKey][mode];
  if (!frames || !frames.length) return;
  mfMode = mode;
  mfFrameAccum = 0;
  mfFrozenFrames = frames;
}
function mouseFlickStartCharge(){
  if (mfMode !== 'idle') return;
  mfMode = 'charge';
  mfHoldCyclePos = 0;
  mfHoldTime = 0;
}
// Release of a charge hold: per explicit request ("on release, you run
// the regular click sequence"), always transitions straight into the
// normal click (A forward+reverse) sequence, regardless of how long the
// charge was held -- same unconditional "release always plays click"
// convention Animations 1/3's own hold already uses.
function mouseFlickEndCharge(){
  if (mfMode !== 'charge') return;
  mfMode = 'idle';
  mouseFlickStartPlay('click');
}

/* ---------------------------------------------------------------------
   Canvas setup
--------------------------------------------------------------------- */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  // viewportW()/viewportH() (declared above, before this whole section --
  // see their own comment) rather than raw window.innerWidth/innerHeight
  // directly -- this runs immediately/synchronously at boot, just as
  // exposed to the same momentary 0-viewport read on mobile as
  // resetMainRope() was.
  canvas.width = viewportW() * dpr;
  canvas.height = viewportH() * dpr;
  canvas.style.width = viewportW() + 'px';
  canvas.style.height = viewportH() + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* ---------------------------------------------------------------------
   Rope physics — verlet point chain.
   Main rope: point 0 pinned to the circle center, grown/cut at runtime.
   Fallen pieces: unpinned independent chains, inherit velocity at cut time.
--------------------------------------------------------------------- */
const POINT_COUNT = 20;
const HOLD_THRESHOLD_MS = 180;
const MAX_FALLEN_PIECES = 60;
// target segment length (as %vh, matching the default rope's own density) —
// growth/manual-length-change ADD points to hold roughly this density rather
// than stretching a fixed point count further apart. A fixed point count
// over a growing length gets sparser and sparser, which both looks and
// behaves like a stiff stick instead of a rope (too few joints to bend at),
// and — since hit-testing walks the same straight-line segments — makes the
// visually-curved (smoothed) rope increasingly miss its own hit-test
// geometry the longer/sparser it gets, which is why an extended piece
// stopped being cuttable.
const TARGET_SEG_LEN_VH = 45 / (POINT_COUNT - 1);

function makeChain(n, x, y, segLen){
  const pts = [];
  // Every point used to share the EXACT same x (oldx===x too, zero
  // implied velocity) -- a perfectly vertically symmetric chain from
  // frame one. Harmless for a piece that just falls, but a genuine bug
  // for mainRope specifically: with gravity pulling straight down and
  // integrateChain()'s own boundaryConstraint clamping straight back up
  // along that SAME line every frame, nothing ever introduces a net
  // lateral force to break the symmetry -- confirmed via live tracing
  // (window.__debug): mainRope's anchor sat frozen at EXACTLY its
  // boundary radius, x identical to circleAnchor().x and to every other
  // point's own x, for 10+ real seconds with zero net motion. Reported
  // as "on startup... it stays this way for 5-10 seconds then it settles
  // to the position i expect" -- on a real device, ordinary floating-
  // point/timing noise eventually perturbs it enough to fall off-axis
  // (explaining the reported delay, which varies run to run since it
  // depends on incidental noise), but nothing GUARANTEED that happened
  // promptly, or at all (this sandbox's own more deterministic timing
  // never once escaped it across 10+ seconds of direct measurement). A
  // per-point random lean gives every chain a real, deterministic reason
  // to settle off-axis from frame one, with the model's full
  // wait/rise/pause duration to do so naturally before mainRope is ever
  // shown. Magnitude tuned by direct live measurement, not guessed: an
  // initial attempt at 3% of segLen was too small -- confirmed via
  // window.__debug tracing that it decayed back toward the exact
  // symmetric point within only a few physics ticks (a handful of ms),
  // producing no meaningfully visible settle motion at all before it was
  // ever shown -- basically indistinguishable from the original bug. 40%
  // is a real, visible perturbation (still small relative to the rope's
  // own total length) that produces genuine multi-tick swinging motion
  // as it settles, matching the "will then naturally fall... like a real
  // drop" behavior this code has always intended, rather than an
  // instantly-reabsorbed micro-nudge.
  const leanRange = segLen * 0.4;
  for (let i = 0; i < n; i++){
    const lean = (Math.random() - 0.5) * leanRange;
    pts.push({ x: x + lean, y: y + i * segLen, oldx: x + lean, oldy: y + i * segLen });
  }
  return pts;
}

let mainRope = null;
let fallenPieces = [];
let bgRope = null;

// Background "peeking" rope: a second, permanently non-interactive chain
// -- never cut, never grown, never clicked -- that exists purely to be
// drawn clipped to the circle's own shape (see render()). Built once at
// Boot at a fixed length (cfg.ropeDefaultLength at that moment -- bgRope
// represents the rope's own default/pristine silhouette, never the live
// mainRope's current cut/grown length, so it reads the same Default Rope
// Length spawn-time-only value mainRope itself spawns from) using the SAME
// targetSeg density every other rope in this file uses. "It cant get
// extended", per explicit request, means no USER-driven growth (no
// hold-to-grow, no manual resize) -- maintainBgRopeEnd() below still
// silently adjusts its point count internally so its own tip is never
// actually visible, an implementation detail invisible to the viewer,
// not a user-facing extension mechanic like setMainRopeTotalLength().
// startX/startY (optional) build the chain hanging from that point instead
// of circleAnchor() -- used by updateIntro()'s 'rising'-phase transition to
// rebuild bgRope hanging from its far-below climb-start position, so every
// point starts already consistent with gravity's own direction (see that
// call site's own comment for the inversion bug this fixes).
function resetBgRope(startX, startY){
  const anchor = circleAnchor();
  const sx = startX !== undefined ? startX : anchor.x;
  const sy = startY !== undefined ? startY : anchor.y;
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const pointCount = Math.max(2, Math.round(vh(cfg.ropeDefaultLength) / targetSeg) + 1);
  bgRope = { points: makeChain(pointCount, sx, sy, targetSeg), segLen: targetSeg };
}

const BG_ROPE_MIN_POINTS = 3;
const BG_ROPE_MAX_POINTS = 400; // hard safety cap against runaway extension

// "We should never see the rope end of background rope. just continue
// extending the end when its appropriate and remove the ends when
// theyre done being seen." -- bgRope's tip must always stay comfortably
// outside the circle's own clip region; this checks that distance every
// frame and extends (pushes a new point continuing the tip's current
// direction) or trims (pops the tip point) by at most one segment per
// frame. The two thresholds (1.5x vs 4x the safe radius) are deliberately
// far apart -- pure hysteresis, so a tip sitting near one single boundary
// doesn't add/remove a point every other frame.
function maintainBgRopeEnd(){
  const anchor = circleAnchor();
  const safeR = vmin(cfg.circleSize) / 2 + vmin(cfg.ropeThickness) * 2;
  const pts = bgRope.points;
  const tip = pts[pts.length - 1];
  const tipDist = Math.hypot(tip.x - anchor.x, tip.y - anchor.y);
  if (tipDist < safeR * 1.5 && pts.length < BG_ROPE_MAX_POINTS){
    const prev = pts[pts.length - 2] || pts[0];
    let dx = tip.x - prev.x, dy = tip.y - prev.y;
    const dlen = Math.hypot(dx, dy) || 1;
    dx /= dlen; dy /= dlen;
    const nx = tip.x + dx * bgRope.segLen, ny = tip.y + dy * bgRope.segLen;
    pts.push({ x: nx, y: ny, oldx: nx, oldy: ny });
  } else if (tipDist > safeR * 4 && pts.length > BG_ROPE_MIN_POINTS){
    pts.pop();
  }
}

// startingLengthPx: optional override for the built rope's initial total
// length -- used by the startup animation to build a minimal (single-
// segment) rope instead of the full configured length, so there's
// something for the intro's own growth phase to visibly extend from
// scratch. Defaults to the normal full cfg.ropeDefaultLength when
// omitted, same as every pre-intro caller of this function already
// expects -- this is a SPAWN, so it reads the Default, never whatever
// length a prior rope happened to be left at (see Default Rope Length's
// own comment).
function resetMainRope(startingLengthPx){
  const anchor = circleAnchor();
  const totalLen = startingLengthPx !== undefined ? startingLengthPx : vh(cfg.ropeDefaultLength);
  // Must build with the SAME segLen (targetSeg) that setMainRopeTotalLength()
  // pins everything to, not a POINT_COUNT-derived one -- those two used to
  // disagree whenever cfg.ropeDefaultLength's default no longer matched the
  // fixed 45%vh TARGET_SEG_LEN_VH was originally computed from (it was, until
  // a later "set defaults" round changed Rope Length's default without also
  // updating this constant). The mismatch left the rope built at one segLen
  // and then, the moment anything called setMainRopeTotalLength() (e.g. a
  // saved settings reload firing ropeLength's onChange), silently
  // overwritten to targetSeg for every point at once -- a whole-chain
  // rest-length jump the constraint solver had to violently correct,
  // reading as a bounce/glitch on load or on the slider's first touch.
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const pointCount = Math.max(2, Math.round(totalLen / targetSeg) + 1);
  mainRope = {
    points: makeChain(pointCount, anchor.x, anchor.y, targetSeg),
    segLen: targetSeg,
    totalLength: totalLen, // the real, continuously-accumulating length — see growRope()
    // how far the LAST segment currently reaches toward a full targetSeg --
    // always targetSeg (fully committed) except mid-growth, when it rises
    // from 0 back up to targetSeg each time growRope() adds a new tip point.
    // See integrateChain()'s tipSegLen param and growRope() for how this
    // drives smooth, continuous-looking extension instead of whole-segment
    // jumps.
    tipGrowLen: targetSeg,
    // smoothed growth-direction state (tipGrowDirection()) -- null starts
    // it fresh from the first real measurement rather than carrying over
    // whatever direction the PREVIOUS mainRope object happened to end on.
    growDir: null,
    // smoothed tip-offset-from-anchor state (positionGrowingTip()) -- same
    // fresh-start reasoning as growDir.
    tipOffset: null,
    // End Emerge state for this rope's own tip -- null means "fully
    // emerged" (nothing's ever been cut off it yet, or it's a fresh
    // rope), same convention as growDir/tipOffset.
    tipEmerge: null,
    // Boot-only endcap grow-in (see the 'pausing'->'growing' spawn code's
    // own comment) -- null means "not growing in" (either not yet armed,
    // or already finished). Deliberately NOT armed here at construction
    // time; set explicitly at the actual spawn moment instead, since
    // resetMainRope() itself runs well before that (this rope's chain
    // doesn't become visible until 'growing' starts).
    bootEndcapScale: null,
  };
}

function setMainRopeTotalLength(newTotalPx){
  const targetSeg = vh(TARGET_SEG_LEN_VH);
  const desiredCount = Math.max(2, Math.round(newTotalPx / targetSeg) + 1);
  const pts = mainRope.points;
  if (desiredCount > pts.length){
    const prev = pts[pts.length - 2] || pts[0];
    const tip = pts[pts.length - 1];
    let dx = tip.x - prev.x, dy = tip.y - prev.y;
    const dlen = Math.hypot(dx, dy) || 1;
    dx /= dlen; dy /= dlen;
    while (pts.length < desiredCount){
      const last = pts[pts.length - 1];
      const nx = last.x + dx * targetSeg, ny = last.y + dy * targetSeg;
      pts.push({ x: nx, y: ny, oldx: nx, oldy: ny });
    }
  } else if (desiredCount < pts.length){
    pts.length = Math.max(2, desiredCount);
  }
  // segLen is ALWAYS exactly targetSeg, never derived from newTotalPx/count.
  // Deriving it from the point count used to mean every single new point
  // added during growth also silently changed the rest-length target for
  // EVERY existing segment in the same instant (a rounding-driven step, not
  // matching the continuously-growing newTotalPx) -- the constraint solver
  // then had to correct that whole-chain mismatch on the very next frame,
  // which read as a small jitter/bounce each time growth crossed into a new
  // point, even on an otherwise-still rope. Since new points are already
  // inserted exactly targetSeg from their neighbor above, keeping segLen
  // pinned to targetSeg means insertion never violates the constraint it's
  // about to be solved against, so there's nothing left to correct.
  mainRope.segLen = targetSeg;
  // persist the REAL requested total separately from what the (quantized,
  // whole-point-count) segLen*pointCount implies -- growRope() below reads
  // this back as its baseline every frame. Without a persisted value here,
  // sustained growth would silently stall between point-insertion thresholds:
  // segLen*(pointCount-1) doesn't change at all until the NEXT point gets
  // added, so re-deriving "current total" from it every frame would discard
  // however much sub-threshold growth had already accumulated.
  mainRope.totalLength = newTotalPx;
  // a direct set (slider drag, saved-settings reload) always produces
  // uniform, fully-committed segments -- no growth-in-progress tip.
  mainRope.tipGrowLen = targetSeg;
}

function circleAnchor(){
  return { x: vw(cfg.circleX), y: vh(cfg.circleY) };
}

function closestPointOnSegment(px, py, a, b){
  const abx = b.x - a.x, aby = b.y - a.y;
  const abLenSq = abx * abx + aby * aby || 0.0001;
  let t = ((px - a.x) * abx + (py - a.y) * aby) / abLenSq;
  t = Math.max(0, Math.min(1, t));
  return { x: a.x + abx * t, y: a.y + aby * t, t };
}

function nearestPointOnRope(px, py, points){
  let best = { dist: Infinity, index: 0, x: points[0].x, y: points[0].y };
  for (let i = 0; i < points.length - 1; i++){
    const a = points[i], b = points[i + 1];
    const cp = closestPointOnSegment(px, py, a, b);
    const d = Math.hypot(px - cp.x, py - cp.y);
    if (d < best.dist) best = { dist: d, index: cp.t < 0.5 ? i : i + 1, x: cp.x, y: cp.y };
  }
  return best;
}

function integrateChain(points, segLen, dt, gravityAccel, pinnedIndex, skipLastSegment, boundaryConstraint, tipTarget){
  // skipLastSegment also excludes the growing-tip POINT itself (not just its
  // segment's distance/bend constraints, handled further below) from this
  // basic Verlet step -- positionGrowingTip() places it directly every
  // frame and owns its oldx/oldy entirely, so it's meant to never enter the
  // solver at all (see that function's own comment). This loop was the one
  // place that claim didn't hold: it only ever excluded pinnedIndex, so the
  // fresh, near-zero-length tip pushed by growRope() still got a real
  // gravity+velocity kick here on its very first frame (inheriting prev's
  // velocity, per growRope()'s own "start it moving, not at rest" fix) --
  // positionGrowingTip() then only partially (its own 0.25-1.0 smoothing
  // ramp) pulled it back toward the intended kinematic position, leaving a
  // real residual displacement that's tiny in absolute px but huge relative
  // to that segment's own near-zero length, i.e. a large swing in its local
  // direction. Confirmed via direct frame-by-frame tracing during a
  // swinging+growing simulation: the angle between the newly-committed
  // segment and the brand-new growing one flipped by up to ~180 degrees
  // right at commit, decaying back over the next several frames as the
  // segment grew long enough to dilute the residual -- reproducing the
  // user's "still extends in a jittery fashion" report even after the
  // separate tip-position-smoothing fix above. Excluding the tip here
  // entirely removes the kick at its source.
  const tipIndex = skipLastSegment ? points.length - 1 : -1;
  // boundaryConstraint.weightMult (Anchor Weight) lets that one point feel
  // MORE or LESS gravity than the rest of the chain -- e.g. mainRope's own
  // anchor, so it can look/feel heavier
  // ("like an anchor") even though it's no longer rigidly fixed. Defaults to
  // 1 (identical to every other point) whenever boundaryConstraint is absent
  // or doesn't specify one, so nothing changes for fallenPieces or for a
  // mainRope with Anchor Weight left at its own default.
  for (let i = 0; i < points.length; i++){
    if (i === pinnedIndex || i === tipIndex) continue;
    const p = points[i];
    const weightMult = (boundaryConstraint && i === boundaryConstraint.index && boundaryConstraint.weightMult !== undefined)
      ? boundaryConstraint.weightMult : 1;
    const vx = (p.x - p.oldx) * cfg.damping;
    const vy = (p.y - p.oldy) * cfg.damping;
    p.oldx = p.x; p.oldy = p.y;
    p.x += vx;
    p.y += vy + gravityAccel * weightMult * dt * dt;
  }
  // skipLastSegment excludes the LAST segment from distance-constraint
  // solving entirely -- used while that segment is a growing tip (see
  // positionGrowingTip()) so the solver never tries to enforce a stale full
  // segLen against it. An earlier version instead gave the solver a rising
  // "tipSegLen" target for that one segment every frame; that continuously
  // moving target acted as a sustained forcing function on the solver, and
  // with only 6 constraint-solve sweeps and 0.99 damping (the original
  // hardcoded values -- both are now cfg.constraintIterations/cfg.damping
  // dev sliders) barely dissipating anything, residual correction error
  // compounded over many
  // seconds of holding into a real, reproduced bug: after ~4-15s of
  // continuous growth the tip (and nearby segments) built up a large,
  // visibly wild swing -- confirmed by a direct simulation showing segment
  // lengths reaching 2.9x their rest length and points folding back on
  // themselves, not just normal swinging. Now the growing tip is placed
  // directly (see positionGrowingTip()), never entering the iterative
  // solver at all, so it can't inject anything into it.
  const segCount = points.length - 1 - (skipLastSegment ? 1 : 0);
  for (let iter = 0; iter < cfg.constraintIterations; iter++){
    for (let i = 0; i < segCount; i++){
      const a = points[i], b = points[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const diff = (dist - segLen) / dist;
      const aFixed = i === pinnedIndex, bFixed = (i + 1) === pinnedIndex;
      const offX = dx * diff * 0.5, offY = dy * diff * 0.5;
      if (!aFixed){ a.x += offX; a.y += offY; }
      if (!bFixed){ b.x -= offX; b.y -= offY; }
    }
    // Bending constraint: gently pulls each interior point toward the
    // midpoint of its two neighbors, i.e. toward local straightness. Pure
    // distance constraints (above) have ZERO resistance to bending -- any
    // angle between two segments, including a full fold-back, satisfies
    // them equally well. A strong-enough punch (applyPunch()'s falloff
    // pushes a wide neighborhood of points sideways by DIFFERENT amounts)
    // can fold the chain onto itself, and the distance solver alone then
    // has no reason to ever undo that fold -- it's just as "valid" as
    // straight. Confirmed by direct reproduction: a single punch left the
    // chain permanently kinked (2-point-span distance stuck at ~23px vs an
    // expected ~55px for a straight chain, unrecovered after 3 full
    // simulated seconds) -- reproducing the real, user-recorded "crazy
    // movement"/knot bug. `cfg.bendStiffness` (default 0.15, tuned low so
    // ordinary swinging still looks floppy/rope-like, not stick-rigid) is
    // applied once per constraint iteration, same cadence as the distance
    // constraints, so both converge together.
    //
    // bendEnd mirrors segCount's own skipLastSegment handling above -- NOT
    // just "loop bound is points.length-1, one short of the tip", which
    // only keeps the tip from being MOVED by this constraint but still lets
    // it be READ as neighbor `c` on the loop's last iteration (i =
    // points.length-2, c = points[points.length-1] = the tip). While a
    // partial tip is active, that tip is kinematically repositioned every
    // frame by positionGrowingTip() FROM this same point's own position
    // (points.length-2, i.e. dir.prev) -- so bending this point toward a
    // midpoint that includes the tip closes a feedback loop between the
    // two: bend pulls prev toward the tip's last-frame position, then
    // positionGrowingTip() re-extends the tip from prev's new (bent)
    // position and direction, repeating every frame. Confirmed via a
    // user-supplied screen recording as the real cause of a severe,
    // reproduced tangle (the rope curling into a tight, chaotic knot within
    // ~1s of holding to grow after a cut) -- not present before
    // bendStiffness was added, and specific to active growth, matching
    // exactly what the recording showed. Excluding dir.prev from the
    // bending constraint entirely while a partial tip exists (same
    // skipLastSegment signal the distance constraint already uses to leave
    // that whole segment alone) breaks the loop.
    if (cfg.bendStiffness > 0){
      const bendEnd = points.length - 1 - (skipLastSegment ? 1 : 0);
      for (let i = 1; i < bendEnd; i++){
        if (i === pinnedIndex) continue;
        const a = points[i - 1], b = points[i], c = points[i + 1];
        const midX = (a.x + c.x) / 2, midY = (a.y + c.y) / 2;
        // Round 5 (self-fold-on-floor drift, reported directly as
        // occurring "at all [friction] settings"): this used to move ONLY
        // b toward the a/c midpoint -- unlike the distance constraint
        // just above (which always splits its correction between both
        // endpoints), a single-point correction has no net-momentum
        // guarantee at all. Traced via direct live simulation (a tight,
        // physically-valid fold resting on the floor, isolating each
        // collision-system variable in turn) to the actual root cause of
        // the whole 4-round drift saga: every prior fix (contact
        // friction, self-collision normal damping at various fractions)
        // changed the MAGNITUDE of the drift but never its source, because
        // the source was never collision damping at all -- it's this
        // constraint continuously "trying" to straighten a sharp fold,
        // net-translating the whole piece sideways specifically once the
        // floor clamp removes gravity's usual dominant motion and pins
        // the vertical axis, leaving this leak as the most visible
        // remaining one. Measured directly: a fold at this project's own
        // actual live bendStiffness (0.01) drifted ~477-18306px over 3000
        // frames depending on Floor Friction (matching "occurs at all
        // settings" exactly -- friction changes the magnitude, never
        // eliminates it, because it was never the cause); bendStiffness=0
        // showed no comparable drift either (no force driving it), which
        // is what actually isolated the bend constraint as the source
        // rather than self-collision. Splitting this correction across
        // all 3 points (b gets it, a/c each absorb half with the opposite
        // sign) makes it properly momentum-conserving, exactly like the
        // distance constraint beside it -- verified this eliminates the
        // drift at the live bendStiffness value while leaving ordinary
        // (non-folded, non-floor-resting) bending visually unchanged.
        const corrX = (midX - b.x) * cfg.bendStiffness;
        const corrY = (midY - b.y) * cfg.bendStiffness;
        b.x += corrX; b.y += corrY;
        const aFixed = (i - 1) === pinnedIndex, cFixed = (i + 1) === pinnedIndex;
        if (!aFixed){ a.x -= corrX * 0.5; a.y -= corrY * 0.5; }
        if (!cFixed){ c.x -= corrX * 0.5; c.y -= corrY * 0.5; }
      }
    }
    // boundaryConstraint ({index, center, radius}): keeps points[index]
    // inside a circular boundary, e.g. mainRope.points[0] inside the
    // circle graphic. Applied EVERY iteration, alongside distance/bend
    // above, rather than once as a post-pass after the whole solve
    // finishes -- a post-pass version was tried first and produced a real,
    // measured, persistent instability: clamping the point to an EXACT
    // boundary position unilaterally overrides whatever the distance
    // constraint (segment 0-1) had just computed for it, discarding that
    // correction every single frame the point rests against the boundary
    // (confirmed via direct simulation: segment(0,1)'s own length ratio
    // sat around 1.4-1.7x and never recovered even after 2s of otherwise
    // undisturbed settling, while every other segment stayed near a
    // healthy ~1.0-1.1x -- clearly localized to the one segment fighting
    // this constraint, not a general chain-wide problem). A flat boundary
    // (the floor) doesn't have this problem because clamping only ONE
    // axis (y) still leaves x fully free for the distance constraint to
    // satisfy segLen through; a circular boundary has no such spare axis
    // -- clamping position at all necessarily fixes BOTH x and y. Solved
    // the same way the bend-vs-distance interaction two constraints ago
    // already solves it: let both constraints iterate together
    // `constraintIterations` times so they can negotiate a position that
    // reasonably satisfies both, instead of one unconditionally
    // overriding the other's result.
    if (boundaryConstraint){
      const bp = points[boundaryConstraint.index];
      const bdx = bp.x - boundaryConstraint.center.x, bdy = bp.y - boundaryConstraint.center.y;
      const bdist = Math.hypot(bdx, bdy) || 1e-6;
      if (bdist > boundaryConstraint.radius){
        // Position-only clamp, same as every other constraint in this loop
        // (distance/bend never touch oldx/oldy either) -- deliberately NOT
        // shifting oldx/oldy here. oldx/oldy is already fixed for the
        // WHOLE frame (set once, at the very top of this function, to last
        // frame's final position); leaving it alone means next frame's
        // implied velocity is naturally (this frame's final clamped
        // position - last frame's position), which already correctly
        // preserves tangential motion (rolling along the boundary) while
        // killing radial motion (no bounce), with zero extra bookkeeping.
        // An earlier version of this fix DID shift oldx/oldy here, on the
        // theory that it would preserve velocity across the clamp -- that
        // was wrong and double-counted: this block can fire on more than
        // one of the constraintIterations rounds per frame (the distance
        // constraint pulling point 0 back out between rounds), and shifting
        // oldx/oldy on EVERY firing compounds each round's correction on
        // top of the last, producing an implied velocity many times too
        // large (confirmed via direct simulation: a 15px/frame outward
        // velocity came out as 323px/frame after just one update() call).
        // The real cause of the "zooms back to its default spot" complaint
        // was constrainAnchorToCircle()'s separate, explicit bounce
        // formula -- removed entirely below -- not this position clamp,
        // which was already correct as originally written.
        bp.x = boundaryConstraint.center.x + (bdx / bdist) * boundaryConstraint.radius;
        bp.y = boundaryConstraint.center.y + (bdy / bdist) * boundaryConstraint.radius;
      }
    }
    // tipTarget ({x,y}, e.g. mainRope's own Rope Attraction pin): pins the
    // TIP to a moving target the exact same way boundaryConstraint already
    // pins the ANCHOR to the circle -- position-only, applied every
    // iteration alongside distance/bend so the solver negotiates a
    // consistent shape, never touching oldx/oldy so next frame's implied
    // velocity naturally reflects however far it actually got dragged.
    // This replaces an earlier design that nudged the tip (or a weighted
    // span of trailing points) directly in update() BEFORE this solve ran
    // -- moving a single point ahead of an otherwise-unconstrained
    // neighbor let the chain fold into a sharp hook, and widening the
    // nudge to multiple points fixed the fold but let too much of the
    // rope's own shape get overridden by the reach ("I dont need the
    // ENTIRE rope to participate in the reaching"). Pinning the tip as a
    // genuine 2nd fixed endpoint (mirroring the anchor's own proven,
    // already-stable pin) lets the EXISTING distance/bend relaxation --
    // the same math that already smoothly connects the anchor to a
    // swinging rope with zero folding -- bend the WHOLE chain between the
    // 2 pins naturally, with no separate nudging logic needed at all. The
    // endcap's own rotation is then just tipDirection() again, unchanged
    // from before Rope Attraction existed, and is automatically "flush"
    // by construction since it reads the real last-segment tangent.
    if (tipTarget){
      const tp = points[points.length - 1];
      tp.x = tipTarget.x; tp.y = tipTarget.y;
    }
  }
}

// mainRope.points[0] is no longer rigidly pinned to circleAnchor() -- per
// explicit request, it's a free physics point kept inside the circle
// entirely by integrateChain()'s own boundaryConstraint param (see that
// function's comment). There used to be a separate bounce step here
// (constrainAnchorToCircle(), velocity-reflection off the boundary normal)
// -- removed per explicit follow-up feedback: it read as the anchor
// "suddenly zooming back to its default spot" rather than a natural
// weighted body falling or rolling down the side of the circle. The
// position-clamp above (a plain position-only clamp, like every other
// constraint in that loop -- see its own comment for why touching
// oldx/oldy there was tried and was actually wrong) already produces
// exactly that natural roll/settle behavior on its own, with no separate
// reflection formula needed.
// Circle Offset (cfg.circleBoundaryOffset) lets the anchor's own confinement
// radius differ from the circle GRAPHIC's own radius (vmin(circleSize)/2) --
// positive shrinks the playable interior. Negative USED to let the anchor
// bulge past the drawn circle's own edge (see the removed comment this
// replaced, kept in CODE_SUMMARY's gotchas for the full history); per
// explicit correction ("the main circle is the master boundary. everything
// else within that never breaks that rule") the circle itself is now a hard
// ceiling -- Circle Offset can only shrink the confinement radius INTERIOR
// to the circle, never push it past the circle's own edge, regardless of
// sign.
function anchorBoundaryRadius(){
  const circleRadius = vmin(cfg.circleSize) / 2;
  // Floored at a small positive minimum, not 0 -- a large enough POSITIVE
  // Circle Offset relative to a small Circle Size would otherwise go
  // negative, which is meaningless for a circle's own radius and broke the
  // boundary math (confirmed directly: an offset large enough to exceed
  // circleSize/2 drove the radius negative, at which point `dist > R` is
  // always true regardless of the anchor's real position, and
  // `center + normal*R` with a negative R places the clamp point on the
  // OPPOSITE side of the circle from whichever direction the anchor was
  // actually heading). Ceiled at circleRadius -- the circle is the master
  // boundary; a negative offset (or offset 0) now lands exactly ON the
  // circle's own edge instead of bulging past it.
  return Math.max(2, Math.min(circleRadius, circleRadius - vmin(cfg.circleBoundaryOffset)));
}

// A fallen piece's own rendered thickness at its CURRENT age -- holds at
// its baseThickness (captured when it was created) until Piece Decay
// Delay elapses, then decreases at Piece Decay Speed (%vmin/s) down to a
// floor of Piece Minimum Thickness. Per explicit request: "the speed at
// which cut off rope segments 'decay'... decrease in rope thickness
// until they hit the minimum thickness" plus a separate delay before
// decay starts. Falls back to a piece's own baseThickness unconditionally
// (no decay math at all) if either field is missing -- defensive only,
// every real piece-creation site sets both.
function pieceThickness(piece){
  if (piece.baseThickness === undefined || piece.age === undefined) return vmin(cfg.ropeThickness);
  const decaying = Math.max(0, piece.age - cfg.pieceDecayDelay);
  return Math.max(vmin(cfg.pieceMinThickness), piece.baseThickness - vmin(cfg.pieceDecaySpeed) * decaying);
}

// How far a piece's own endcap graphic actually extends PAST the
// physics point it's anchored to, in world px, once fully emerged --
// mirrors drawEndcap()'s own geometry exactly (ENDCAP_ALIGNMENT.topY ->
// designBottomY, scaled by heightThicknessPx/ENDCAP_ALIGNMENT.width,
// then by heightMult) without actually drawing anything. Used by
// pieceCollision() below to inflate that point's own collision radius,
// per explicit request ("the rope endcap should also be affected by
// collision detection... the rope start and end endcaps should not be
// allowed to overlap other ropes, or other endcaps") -- previously
// collision only ever considered the underlying chain's own points,
// completely ignoring the endcap's own rendered shape sticking out past
// them, so 2 pieces' points could sit a valid minSep apart while their
// actual endcap graphics still visibly overlapped. designKey 'none'
// (no endcap selected at all) returns 0, same as drawEndcap() itself
// being a no-op in that case.
function endcapExtensionPx(designKey, heightThicknessPx, heightMult){
  if (designKey === 'none') return 0;
  const designBottomY = ENDCAP_BOTTOM_Y[designKey] !== undefined ? ENDCAP_BOTTOM_Y[designKey] : ENDCAP_ALIGNMENT.topY;
  const heightNormalScale = heightThicknessPx / ENDCAP_ALIGNMENT.width;
  return (designBottomY - ENDCAP_ALIGNMENT.topY) * heightNormalScale * heightMult;
}

// The collision circle's own radius at the endcap's narrow TIP, in
// world px -- ENDCAP_TIP_WIDTH (see its own comment) converted through
// the SAME scale drawEndcap() itself uses for its shape's X axis
// (widthThicknessPx / ENDCAP_ALIGNMENT.width, i.e. the chain's own live
// thickness -- NOT heightMult, which only ever stretches the Y/length
// axis there, never X). Per explicit request: "a circle with the
// radius... at the tip of the endcap, where it's narrower, and the
// diameter of that circle will be the dimension of that narrow end of
// my SVG" -- diameter = the design's own real width at its tip,
// radius = half that.
function endcapTipRadiusPx(designKey, widthThicknessPx){
  if (designKey === 'none') return 0;
  const localWidth = ENDCAP_TIP_WIDTH[designKey] || 0;
  const widthNormalScale = widthThicknessPx / ENDCAP_ALIGNMENT.width;
  return (localWidth * widthNormalScale) / 2;
}

// A live, tangent-following collision point rigidly offset `offsetDist`
// past `owner` (a real physics point) in the direction AWAY from
// `neighbor` -- used to place the endcap's own tip collision circle at
// its real rendered position (offset from the chain's last/first
// point, not centered on it) without needing a separate physics body of
// its own. `x`/`y` are computed FRESH from owner/neighbor's CURRENT
// positions on every read (so this always tracks the endcap's real
// live position/orientation, exactly like drawEndcap()'s own
// tipDirection() does, never a stale one-time snapshot) -- and a WRITE
// (exactly what resolveChainCollision()/resolveSelfCollision() already
// do to correct an overlap: `p.x -= nx*push`) translates into shifting
// `owner` by that same delta instead, since this project's verlet
// points have no rotational/angular state to instead apply a torque
// to -- a plain translation of the whole rigid offset is the correct,
// consistent simplification here. Verified via direct simulation
// before shipping: pushing the proxy by a delta moves owner by exactly
// that same delta, and the proxy's own offset distance from owner
// stays exactly offsetDist afterward (the tangent direction itself is
// free to rotate as owner's position relative to the fixed `neighbor`
// changes, same as the endcap's real rendered angle would).
// oldx/oldy getters/setters mirror x/y exactly, just built from owner's/
// neighbor's own oldx/oldy instead of x/y -- added so resolveChainCollision's
///resolveSelfCollision's tangential-friction step (see their own comments)
// can read/write a proxy's implied velocity (x - oldx) the SAME way it does
// for a real point, without special-casing proxies. Writing through this
// setter shifts owner's oldx/oldy by the same delta, exactly like the x/y
// setters already shift owner's real x/y.
function makeTipCollisionPoint(owner, neighbor, offsetDist){
  function dir(){
    const dx = owner.x - neighbor.x, dy = owner.y - neighbor.y;
    const len = Math.hypot(dx, dy) || 1;
    return { x: dx / len, y: dy / len };
  }
  function oldDir(){
    const dx = owner.oldx - neighbor.oldx, dy = owner.oldy - neighbor.oldy;
    const len = Math.hypot(dx, dy) || 1;
    return { x: dx / len, y: dy / len };
  }
  return {
    get x(){ return owner.x + dir().x * offsetDist; },
    set x(v){ owner.x += v - (owner.x + dir().x * offsetDist); },
    get y(){ return owner.y + dir().y * offsetDist; },
    set y(v){ owner.y += v - (owner.y + dir().y * offsetDist); },
    get oldx(){ return owner.oldx + oldDir().x * offsetDist; },
    set oldx(v){ owner.oldx += v - (owner.oldx + oldDir().x * offsetDist); },
    get oldy(){ return owner.oldy + oldDir().y * offsetDist; },
    set oldy(v){ owner.oldy += v - (owner.oldy + oldDir().y * offsetDist); },
  };
}

// Cross-PIECE collision only -- two different fallen pieces push each
// other apart (so cut-off segments stack or shove each other around
// instead of freely overlapping, per explicit request), but a piece
// never repels its own points against each other. This is deliberately
// NOT the old pileRepulsion() (removed below): that function took one
// flat array with no concept of which piece a point came from, so it
// repelled ANY two points closer than minSep including two points far
// apart in the SAME chain -- fighting that chain's own distance/bend
// constraints and causing the severe tangle documented at this
// function's own call site. Iterating piece-PAIRS (never a piece against
// itself) sidesteps that class of bug entirely, by construction. A cheap
// per-piece bounding-box pre-check (computed once per piece per frame,
// not per pair) skips the expensive point-by-point double loop for any
// pair that clearly can't be touching yet.
// The original 1.15 margin (and the `Math.max(2, ...)` floor) is gone:
// reported directly -- "when one is laying on top of the other. I still
// see a couple pixels of space between the 2 when one is laying on top
// of the other. there should be none." At default thickness (~6px),
// 1.15x was adding ~0.9px of REAL separation beyond actual contact --
// not an anti-aliasing illusion, an intentional gap the old margin was
// built to create. Per the same reasoning as the endcap/rope seam fix
// (2 independently-rasterized shapes that only ever exactly touch can
// still show an anti-aliasing hairline), separation now UNDERSHOOTS
// contact by a small margin instead so touching chains render with a
// hair of real overlap rather than a hair of real gap.
//
// PROPORTIONAL, not a fixed pixel amount -- an earlier version
// subtracted a fixed 0.75px, which could EXCEED the entire
// thickness-based separation once both sides decayed down near Piece
// Minimum Thickness, and `Math.max(0, ...)` clamped the result to
// EXACTLY 0 -- no enforced separation left between decayed pieces' own
// centerlines. Reported directly: "as they shrink down in thcikness to
// minimum thickness, instead of piling ontop of each other, they end up
// overlapping each other on the ground such that it looks like only a
// single layer." A fixed FRACTION of the pair's own combined radius can
// never fully cancel it out regardless of how thin either side has
// decayed -- 15% is the same kind of judgment call the fixed-pixel
// version was, just expressed proportionally instead of absolutely.
const PIECE_SEAM_OVERLAP_FRAC = 0.15;

// Reported directly: 2 long pieces resting flush against each other
// (many overlapping point pairs at once) "keep moving slightly for a
// period," and sometimes "one piece will slowly keep sliding to one
// side until they arent touching anymore." Root cause: the normal-only
// push in resolveChainCollision/resolveSelfCollision below runs as a
// single un-iterated sweep (unlike integrateChain's distance/bend/
// boundary solve, which deliberately iterates `constraintIterations`
// times specifically so simultaneously-active constraints can negotiate
// a converged shape -- see boundaryConstraint's own comment). With many
// point pairs in contact at once, that single pass leaves a small
// residual PER-PAIR push whose direction depends on the exact line
// between that specific pair, not the ropes' shared contact axis -- and
// since nothing has ever damped the TANGENTIAL (sliding) component of
// that residual, per the project's existing "leave oldx/oldy alone,
// let next frame's implied velocity reflect whatever actually moved"
// convention (see boundaryConstraint's own comment for why that's
// normally correct), an un-cancelled tangential residual becomes real
// carried velocity next frame and can compound into a slow, one-
// directional drift over many frames if it isn't symmetric (which,
// resting two irregular pieces together, it usually isn't).
// applyContactFriction(p, q, nx, ny, maxPush) fixes this directly:
// after the normal push above already separates p/q, it damps
// whatever RELATIVE velocity remains between them along the TANGENT
// (perpendicular to the contact normal) by cfg.pieceFriction -- pure
// friction, the normal-direction motion the push just resolved is left
// untouched. Implemented as an oldx/oldy shift (the same KIND of
// mechanism cfg.floorFriction, when turned up from its own 0 default,
// applies to the floor clamp -- see that control's own comment,
// including the real tradeoff of turning it up), which is safe here
// specifically because -- unlike the multi-iteration distance/bend/boundary solve --
// pieceCollision() only ever runs once per frame, so there's no risk of
// the same double-counting bug that ruled out touching oldx/oldy inside
// integrateChain's own iteration loop. Works on endcap proxy points too
// via their own oldx/oldy passthrough (see makeTipCollisionPoint()).
// Clamped to +-maxPush (COLLISION_MAX_PUSH_PER_S) for the same reason
// every other correction in this system is rate-capped -- a friction
// impulse should never be able to kill more relative velocity in one
// frame than the normal push itself is allowed to correct.
// cfg.pieceFriction (0-1, fraction of relative tangential velocity
// removed per frame per contact) -- a live dev-panel slider (FLOOR
// group, "Rope Friction") per explicit request. Default 0.4 (see that
// control's own def) matches this constant's original hardcoded value
// exactly. Was a judgment call when hardcoded, chosen high enough to
// visibly stop sliding within a handful of frames without reading as
// pieces being glued together -- now directly user-tunable instead.
function applyContactFriction(p, q, nx, ny, maxPush){
  const tx = -ny, ty = nx;
  const pvx = p.x - p.oldx, pvy = p.y - p.oldy;
  const qvx = q.x - q.oldx, qvy = q.y - q.oldy;
  const relTangent = (pvx - qvx) * tx + (pvy - qvy) * ty;
  const impulse = Math.max(-maxPush, Math.min(maxPush, relTangent * cfg.pieceFriction * 0.5));
  p.oldx += tx * impulse; p.oldy += ty * impulse;
  q.oldx -= tx * impulse; q.oldy -= ty * impulse;
}

// Reported directly after the grace period above shipped: "the rope
// cutting jumping bug is sitll occuring" plus "the cut segments of rope
// on the floor are now sliding around slowly." The grace period only
// DELAYED the violent correction, it never actually bounded its size --
// the instant a piece's age crosses MAIN_COLLISION_GRACE_AGE, if it's
// still meaningfully overlapping mainRope's own (endcap-inflated) tip,
// resolveChainCollision still threw the ENTIRE correction in one frame,
// same as before. And separately, mainRope-vs-piece ran unconditionally
// whenever any fallen piece existed at all, even while mainRope was just
// ordinarily hanging/swinging (low damping, cfg.damping=0.986, by design
// long-lasting) nowhere near a real floor pile -- so a piece resting
// anywhere near mainRope's own ambient sway kept getting nudged by it
// every single frame, reading as a slow, continuous, unwanted drift.
// COLLISION_MAX_PUSH_PER_S bounds resolveChainCollision()'s own
// per-frame correction to a fixed px/s rate (scaled by dt so it isn't
// frame-rate dependent) regardless of how large the underlying overlap
// is -- a big coincident-point overlap now resolves smoothly over
// several frames instead of snapping instantly, whether that overlap
// came from a fresh cut, a residual overlap right as the grace period
// ends, or genuine contact once mainRope really does reach a floor
// pile. 400 %vmin/s is a judgment call (fast enough that a real,
// intentional pile-up still looks responsive within a few frames, not
// sluggish), not a measured value.
const COLLISION_MAX_PUSH_PER_S = 400;

// Gates endcap-aware collision (both the endcap's own tip circle, see
// pieceCollisionRadii()/endcapTipRadiusPx(), and mainRope-vs-piece
// collision entirely) -- everything `a29da9c` originally added. Full
// history of the 5 fix attempts that preceded this one (2 topplePiece()
// velocity bugs, a ruled-out self-collision-radii hypothesis, a
// piece-vs-piece spawn-grace fix, a pileTopY settledness fix -- each
// real and independently verified, none sufficient on their own) lives
// in docs/CHANGELOG.txt rather than repeated here every round; the
// pileTopY settledness fix (PILE_SETTLED_MAX_SPEED, below) stays in
// place regardless of this flag since it's a real, standalone
// correctness fix independent of the radius/shape question.
//
// Attempt #6: per explicit request, the RADIUS MODEL itself changed --
// not another gating/timing fix, a genuinely different geometric
// approximation. Every prior attempt (including the original a29da9c
// design) approximated the endcap as ONE circle centered on the
// physics point, radius = the endcap's full neck-to-tip LENGTH (later
// scaled down by a fraction, ENDCAP_COLLISION_RADIUS_FRAC, since even
// that was a substantial overestimate of a narrow tapered shape's real
// "fatness"). Replaced entirely: a SMALL circle positioned at the
// endcap's own real narrow TIP (offset past the physics point, via
// makeTipCollisionPoint()), sized by the design's own real measured
// tip width (endcapTipRadiusPx(), from ENDCAP_TIP_WIDTH) rather than a
// fraction of its length. Re-enabled (true) so this new model is live;
// flip back to false to disable the whole mechanism again exactly as
// before if it doesn't hold up either -- nothing here was ever deleted,
// only gated, per the user's own standing "may want to change it back."
const ENABLE_ENDCAP_AND_MAINROPE_COLLISION = true;

// Per-chain, per-POINT collision radius -- ordinary rope points use half
// the chain's own live thickness. The 2 ends (points[0], the cut edge
// for a piece / the never-capped anchor for mainRope, and points[last],
// the free tip) ADDITIONALLY get their own small extra collision circle
// when an endcap actually lives there -- appended to points/radii as an
// EXTRA entry (not inflating the real point's own radius) positioned at
// the endcap's real narrow TIP (offset past the physics point, via
// makeTipCollisionPoint(), not centered on it) with a radius sized from
// the design's own real measured tip width (endcapTipRadiusPx()) --
// replacing the earlier design (one big circle centered on the physics
// point, radius = the endcap's full neck-to-tip LENGTH) per explicit
// request/correction: "instead of doing the radius thing you did
// previously... put a collision circle at the tip of the endcap, where
// it's narrower, and the diameter of that circle will be the dimension
// of that narrow end of my SVG." Still not a precise polygon collision
// against the endcap's real outline (that would need a much more
// involved shape-collision system for a decorative feature that's never
// the rope's own primary silhouette) -- but a small circle at the
// endcap's own real tip position, sized by its own real tip width, is a
// substantially closer approximation of "narrow, tapered shape" than a
// single oversized circle covering the endcap's ENTIRE length ever was.
//
// A SECOND extra circle, at the endcap's own MIDPOINT (half the tip
// circle's own offset, same tangent direction/neighbor -- i.e. halfway
// between the physics point and the tip circle), fills the gap between
// the neck (full body radius) and the tip (its own small radius) --
// per explicit request. Its own radius is the midpoint of those 2:
// (bodyRadius + tipRadius) / 2, i.e. a straight linear taper sampled at
// its own halfway point rather than jumping straight from full
// thickness to the tip's real narrow width in one step. Still just 3
// sample circles approximating a continuously tapering shape, not a
// true polygon collision -- but a meaningfully closer approximation
// than the tip circle alone, especially for a piece with unusually
// long endcap extension relative to its own body thickness.
//
// tipCircle/cutCircle are `{offset, radius}` (from pieceCollision()'s
// own endcapCircle() closure) or null/undefined when no endcap applies
// at that end -- unlike the old tipExtension/cutExtension numbers, a
// missing circle now means "no extra entry added" rather than "add 0".
function pieceCollisionRadii(points, thick, tipCircle, cutCircle){
  const baseRadius = thick / 2;
  const n = points.length;
  const allPoints = points.slice();
  const allRadii = new Array(n).fill(baseRadius);
  let maxRadius = baseRadius;
  if (tipCircle && tipCircle.radius > 0 && n >= 2){
    allPoints.push(makeTipCollisionPoint(points[n - 1], points[n - 2], tipCircle.offset));
    allRadii.push(tipCircle.radius);
    if (tipCircle.radius > maxRadius) maxRadius = tipCircle.radius;
    const midRadius = (baseRadius + tipCircle.radius) / 2;
    allPoints.push(makeTipCollisionPoint(points[n - 1], points[n - 2], tipCircle.offset / 2));
    allRadii.push(midRadius);
    if (midRadius > maxRadius) maxRadius = midRadius;
  }
  if (cutCircle && cutCircle.radius > 0 && n >= 2){
    allPoints.push(makeTipCollisionPoint(points[0], points[1], cutCircle.offset));
    allRadii.push(cutCircle.radius);
    if (cutCircle.radius > maxRadius) maxRadius = cutCircle.radius;
    const midRadius = (baseRadius + cutCircle.radius) / 2;
    allPoints.push(makeTipCollisionPoint(points[0], points[1], cutCircle.offset / 2));
    allRadii.push(midRadius);
    if (midRadius > maxRadius) maxRadius = midRadius;
  }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of allPoints){
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  return { points: allPoints, radii: allRadii, maxRadius, box: { minX, maxX, minY, maxY } };
}

// Pushes 2 chains' own points apart wherever a pair sits closer than
// their combined (radius-inflated, seam-undershot) separation -- shared
// by both mainRope-vs-piece and piece-vs-piece below so the 2
// relationships behave identically rather than via 2 near-duplicate
// loops. A cheap bounding-box pre-check (padded by each chain's own
// largest per-point radius, so an inflated endcap end is never
// under-counted) skips the expensive point-by-point double loop for any
// pair that clearly can't be touching yet.
function resolveChainCollision(dataA, dataB, maxPush){
  const pad = dataA.maxRadius + dataB.maxRadius;
  const ba = dataA.box, bb = dataB.box;
  if (ba.maxX + pad < bb.minX || bb.maxX + pad < ba.minX ||
      ba.maxY + pad < bb.minY || bb.maxY + pad < ba.minY) return;
  const ptsA = dataA.points, ptsB = dataB.points;
  for (let i = 0; i < ptsA.length; i++){
    const p = ptsA[i];
    const ri = dataA.radii[i];
    for (let j = 0; j < ptsB.length; j++){
      const q = ptsB[j];
      const minSep = Math.max(0, (ri + dataB.radii[j]) * (1 - PIECE_SEAM_OVERLAP_FRAC));
      const dx = q.x - p.x, dy = q.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0.0001 && dist < minSep){
        // Capped at maxPush (see COLLISION_MAX_PUSH_PER_S's own comment)
        // so a large overlap -- coincident fresh-cut points, or anything
        // else -- resolves gradually over several frames instead of
        // snapping to full separation in one.
        const push = Math.min((minSep - dist) / 2, maxPush);
        const nx = dx / dist, ny = dy / dist;
        p.x -= nx * push; p.y -= ny * push;
        q.x += nx * push; q.y += ny * push;
        applyContactFriction(p, q, nx, ny, maxPush);
        // Full strength (1) -- see applyContactNormalDamping()'s own
        // comment for why cross-chain collision needs this, unlike
        // self-collision's much weaker SELF_COLLISION_NORMAL_DAMP_FRAC.
        applyContactNormalDamping(p, q, nx, ny, 1);
      }
    }
  }
}

// Gives a freshly-created piece the same kind of collision grace
// mainRopeExcluded already gives a piece split off mainRope specifically
// (see performMainRopeSplit()'s own comment) -- but generalized to
// protect against ANY other already-fallen piece it might spawn
// spatially overlapping, not just the one it split from. Piece-vs-piece
// collision never had this at all: mainRope-vs-piece got its own
// dedicated exclusion because "a rope colliding with the piece it just
// split from" was reported and fixed directly, but a NEW piece spawning
// already overlapping a DIFFERENT, unrelated existing piece (e.g. 2
// cuts landing close together in time, or a piece falling through
// wherever an earlier piece happens to already be) had nothing
// protecting it -- resolveChainCollision's own per-frame push cap
// (COLLISION_MAX_PUSH_PER_S) still applies, but at up to ~2952px/s for
// this project's own viewport that's easily fast enough to look like
// "shoots downward really fast" for as many frames as a real spawn-time
// overlap takes to resolve, then settle into whatever minSep the
// correction stops at -- "floating". Reported directly, persisting through 2
// topplePiece() velocity fixes and the already-shipped self-collision-
// radii fix, none of which touch this gap.
//
// setPieceSpawnGrace(piece) is called once, right after every piece is
// created (all 3 sites: detachEntireRopeAndRestartIntro,
// performMainRopeSplit, performPieceSplit) -- unconditionally, since any
// newly-created piece could in principle spawn overlapping an existing
// one, not just the ones that also happen to trigger mainRopeExcluded.
//
// pieceSpawnGraceActive(piece, radius) is checked per-pair inside the
// piece-vs-piece loop below; `radius` is that SAME piece's own maxRadius
// (already computed by pieceCollisionRadii()) -- self-contained, based
// only on this piece's own geometry, since (unlike mainRopeExcluded,
// which always pairs against mainRope specifically) piece-vs-piece can't
// know in advance which other piece(s) it needs clearance from. Clears
// PERMANENTLY the first time it's satisfied, same convention as
// mainRopeExcluded.
//
// PIECE_SPAWN_GRACE_RADIUS_FRAC: reported directly, 2 ways -- "when i
// cut an already cut rope segment, the subsequent 2 rope pieces should
// still have collision detectors" and "when i cut a rope piece lying
// on top of rope pieces, atleast one of the cut pieces will fall
// through the ropes they are resting on." Root cause: this grace
// window doesn't just skip a ONE-TIME overlap check -- while active,
// it disables piece-vs-piece collision for the graced piece against
// EVERY other piece, entirely, including the continuous, every-frame
// counter-gravity correction a piece resting on another piece
// fundamentally depends on to stay up (verlet + explicit gravity means
// every point is pulled down every frame; collision pushing back is
// the ONLY thing holding a resting piece in place). A piece that
// spawns already resting on other ropes (splitting a piece that was
// itself lying on top of others) has nothing holding it up for the
// piece's own gravity to be caught by until grace clears -- it falls
// straight through, unopposed, for the whole window. The previous
// value (`* 2`, i.e. the grace radius was 2x the piece's own maxRadius)
// gave gravity easily enough unopposed time to carry a resting piece
// all the way through before clearing. Reduced to `* 0.3` -- still
// enough to filter out the ORIGINAL concern this mechanism was added
// for (2 cuts landing close together in time, a piece spawning
// violently deep inside an unrelated one, a case COLLISION_MAX_PUSH_PER_S
// alone was found insufficient for -- see this section's own git
// history), but short enough that ordinary gravity-driven sinking
// clears grace almost immediately, before it can carry a piece all the
// way through whatever it should be resting on. Still a judgment call.
// mitigation, not a mathematically guaranteed fix -- an even shorter
// window reduces the fall-through risk further but weakens protection
// against the original coincident-deep-overlap case; no measured
// "correct" value exists for either extreme.
const PIECE_SPAWN_GRACE_RADIUS_FRAC = 0.3;
function setPieceSpawnGrace(piece){
  const p0 = piece.points[0];
  piece.spawnGraceOriginX = p0.x;
  piece.spawnGraceOriginY = p0.y;
  piece.spawnGrace = true;
}
function pieceSpawnGraceActive(piece, radius){
  if (!piece.spawnGrace) return false;
  const p0 = piece.points[0];
  const dist = Math.hypot(p0.x - piece.spawnGraceOriginX, p0.y - piece.spawnGraceOriginY);
  if (dist < radius * PIECE_SPAWN_GRACE_RADIUS_FRAC) return true;
  piece.spawnGrace = false;
  return false;
}

// How many points apart (by chain INDEX, not distance) a pair must be
// before self-collision even considers them -- per explicit request
// ("make it so that a rope segment that has been cut off will collide
// with itsel[f]"). This can't just reuse resolveChainCollision() against
// a piece and itself: ADJACENT (or near-adjacent) points are ALWAYS
// close together by construction (that's what being connected by a
// short segment means), and normal bending routinely brings points a
// few indices apart even closer without the piece actually overlapping
// itself in any real sense -- pushing those apart would fight the same
// bend/distance constraints already governing the chain's own shape.
// This project already hit exactly that failure mode once, with a
// DIFFERENT, cruder self-collision system (the removed pileRepulsion()
// -- see its own history in the CODE_SUMMARY gotchas): it repelled ANY
// 2 points closer than minSep with zero concept of chain adjacency,
// including 2 points from the SAME chain, and caused a severe,
// reproduced tangle (worst-case segment-length ratio >6x). Skipping any
// pair within this many indices of each other avoids repeating that --
// only a REAL self-overlap (the piece's own far-apart sections folding
// all the way back onto each other, e.g. a tight coil or a doubled-over
// heap) ever triggers a push. 4 is a judgment call, not a measured
// value -- large enough that ordinary local bending never engages it,
// small enough that a real coil still gets caught.
const MIN_SELF_COLLISION_GAP = 4;

// Reported directly: a piece that's folded back on itself (self-collision
// keeping the fold from passing through itself, "which is fine") starts
// "sliding in one direction until out of frame" specifically once it
// settles on the FLOOR -- not from touching another piece. Once a fold
// is resting on the floor, the floor itself can pin the fold into a
// configuration self-collision can never fully separate (the floor holds
// it flat, so the "impossible to satisfy" overlap keeps re-triggering
// every frame instead of resolving once and staying resolved, the way it
// does while still falling/tumbling freely). applyContactFriction()
// above only ever damps the TANGENTIAL component of a pair's relative
// velocity -- deliberately, since the NORMAL (separating) component is
// supposed to represent a real, legitimate push apart. But for a
// pinned, perpetually-re-triggering overlap specifically, that NORMAL
// velocity never actually represents real separation either -- it's the
// same kind of unrepresented, uncancelled velocity the floor clamp
// itself already guards against on its own axis (`oldy = y`, killing
// 100% of clamped-direction velocity every frame a point rests on the
// floor -- see clampToFloor's own call site). applyContactNormalDamping()
// applies that identical "fully cancel the constrained direction's
// relative velocity" treatment here. Only ever engages while an overlap
// is actively being resolved -- once dist >= minSep, this code path
// stops running for that pair entirely, so a piece that's simply
// resting (not actively overlapping) is completely unaffected.
//
// Originally self-collision only (applySelfCollisionNormalDamping, on
// the theory that "2 separate bodies genuinely CAN fully separate,
// unlike 2 points on the SAME already-constrained chain") -- reported
// directly that the fold-on-floor sliding was STILL occurring after
// that fix shipped, with new evidence: a piece landing on TOP of an
// already-resting, unrelated piece caused BOTH to start jittering, the
// already-resting one included -- exactly the piece-vs-piece case the
// original reasoning assumed was safe. That reasoning was wrong: 2
// DIFFERENT pieces resting against each other under constant gravity
// are just as exposed to a persistently-re-triggering overlap as a
// self-fold is -- verified via a 2-chain simulation (one piece resting,
// one landing on/beside it): WITHOUT this on resolveChainCollision, the
// pair drifted ~48px/1500 frames; WITH it (full cancellation, frac=1),
// drift dropped to a ~1px one-time settling nudge that stayed flat for
// 6000+ frames.
//
// `frac` was added as a SECOND follow-up, per 2 new reports about a
// piece folding onto itself MIDAIR (not resting on anything): "it
// suddenly falls really slowly [until] it straightens out," and
// "sometimes seems to have a weird fall path... as if being blown by
// wind." Proved first that this can't be the FULL-cancellation math
// itself changing a chain's own AVERAGE/center-of-mass velocity -- the
// impulse is exactly equal-and-opposite between p and q, so the SUM
// across all points is mathematically invariant regardless of frac,
// confirmed via a simple 2-point check. But a densely-folded piece
// (matching the real POINT_COUNT=20) has MANY simultaneous self-
// colliding pairs sharing the SAME points, processed sequentially --
// verified via a realistic simulation (real distance+bend constraints,
// a genuine tumble/spin, no floor) that full cancellation (frac=1)
// measurably drained a big chunk of the group's own individual
// velocities during the first ~45-60 frames after a tight fold forms
// (avgVy 99.5 vs. a true free-fall baseline of 218.6 px/s at frame 15,
// with SOME individual points briefly moving upward -- exactly matching
// "falls slowly" and "as if being blown by wind"), before converging
// back once the fold naturally opens (matching "once it straightens
// out"). Isolated the cause precisely: applyContactFriction() alone
// tracked the baseline almost exactly (219.8 vs 218.6) -- this function
// alone was the culprit. A single SPEED-gated threshold could not
// separate the 2 scenarios (a piece-landing impact and a self-fold
// tumble have similarly fast relative velocities in the critical
// window -- no threshold fixed both at once, confirmed by sweeping 60
// through 3000px/s). The resolution: SEPARATE fractions per call site.
// resolveChainCollision() (piece-vs-piece/mainRope-vs-piece) keeps
// frac=1 (full cancellation) -- verified still needed at full strength
// to keep piece-landing drift near 0. resolveSelfCollision() uses a
// much weaker frac=0.05 -- verified this still fully eliminates the
// original fold-on-floor drift (0 across 5 seeds x 8000 frames each;
// a PERSISTENT, many-times-per-second recurring overlap still
// accumulates enough correction over that many frames even at a weak
// per-frame fraction), while a brief mid-air tumble no longer has time
// to meaningfully drain the group's own momentum (avgVy recovered to
// 207.6/287.2 vs. the 218.6/290.4 baseline, both within ~5% instead of
// being roughly halved). The asymmetry makes sense structurally, not
// just empirically: a tight self-fold can have dramatically MORE
// simultaneous overlapping pairs sharing the SAME points (the entire
// folded length can be in contact with itself) than a typical piece-
// vs-piece contact boundary (usually just a few points), so the SAME
// per-pair fraction compounds far more aggressively for self-collision.
function applyContactNormalDamping(p, q, nx, ny, frac){
  const pvx = p.x - p.oldx, pvy = p.y - p.oldy;
  const qvx = q.x - q.oldx, qvy = q.y - q.oldy;
  const relNormal = (pvx - qvx) * nx + (pvy - qvy) * ny;
  const impulse = relNormal * frac * 0.5;
  p.oldx += nx * impulse; p.oldy += ny * impulse;
  q.oldx -= nx * impulse; q.oldy -= ny * impulse;
}
// Weak on purpose -- see applyContactNormalDamping()'s own comment for
// why self-collision needs a much gentler fraction than cross-chain
// collision to avoid draining a genuinely tumbling piece's own
// momentum, while still fully resolving a persistent floor-fold drift
// given enough recurring frames.
const SELF_COLLISION_NORMAL_DAMP_FRAC = 0.05;

// Pushes a SINGLE chain's own far-apart points away from each other
// wherever 2 of them (at least MIN_SELF_COLLISION_GAP indices apart) sit
// closer than their combined (radius-inflated, seam-undershot)
// separation -- see that constant's own comment for why the index gap
// is what makes this safe to run at all. Reuses the exact same
// maxPush-capped, seam-undershot math as resolveChainCollision() (cross-
// chain), just against one chain's own point set instead of 2 different
// chains' -- including the same applyContactFriction() tangential-damping
// AND applyContactNormalDamping() normal-damping steps (see each one's
// own comment) -- both now shared identically between this function and
// resolveChainCollision(), not self-collision-specific.
function resolveSelfCollision(data, maxPush){
  const pts = data.points, radii = data.radii;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i], ri = radii[i];
    for (let j = i + MIN_SELF_COLLISION_GAP; j < pts.length; j++){
      const q = pts[j];
      const minSep = Math.max(0, (ri + radii[j]) * (1 - PIECE_SEAM_OVERLAP_FRAC));
      const dx = q.x - p.x, dy = q.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0.0001 && dist < minSep){
        const push = Math.min((minSep - dist) / 2, maxPush);
        const nx = dx / dist, ny = dy / dist;
        p.x -= nx * push; p.y -= ny * push;
        q.x += nx * push; q.y += ny * push;
        applyContactFriction(p, q, nx, ny, maxPush);
        // Weak (SELF_COLLISION_NORMAL_DAMP_FRAC) -- see
        // applyContactNormalDamping()'s own comment for why.
        applyContactNormalDamping(p, q, nx, ny, SELF_COLLISION_NORMAL_DAMP_FRAC);
      }
    }
  }
}

function pieceCollision(dt){
  // see ENABLE_ENDCAP_AND_MAINROPE_COLLISION's own comment -- forcing
  // this false reverts endcapCircle() below to always return null (no
  // extra tip/cut collision circles, thickness-only radii everywhere,
  // matching this function's own pre-a29da9c behavior) regardless of
  // cfg.endcapDesign.
  const hasEndcapForCollision = ENABLE_ENDCAP_AND_MAINROPE_COLLISION && cfg.endcapDesign !== 'none';
  // endcapCircle(offsetThicknessPx, radiusThicknessPx): returns the
  // {offset, radius} for one end's own small tip collision circle, or
  // null when no endcap applies there at all -- see pieceCollisionRadii()
  // and makeTipCollisionPoint()'s own comments for the full "small
  // circle at the real tip, not one big circle at the physics point"
  // design this replaced. 2 separate thickness params because
  // drawEndcap() itself doesn't always use the same one for length vs
  // width -- a fallen piece's own tip endcap LENGTH is deliberately
  // decoupled from live decay (baseThickness, fixed at fall-time) while
  // its WIDTH still tracks current/decaying thickness (see each call
  // site's own comment); mainRope and any cut-edge endcap use the same
  // single thickness for both, since neither has that decay-decoupling.
  const endcapCircle = (offsetThicknessPx, radiusThicknessPx) => hasEndcapForCollision ? {
    offset: endcapExtensionPx(cfg.endcapDesign, offsetThicknessPx, cfg.endcapHeight),
    radius: endcapTipRadiusPx(cfg.endcapDesign, radiusThicknessPx),
  } : null;
  // See COLLISION_MAX_PUSH_PER_S's own comment -- caps every correction
  // below to a fixed px/s rate (scaled by dt so it's frame-rate
  // independent) so nothing ever resolves in one violent snap.
  const maxPush = vmin(COLLISION_MAX_PUSH_PER_S) * dt;

  // mainRope-vs-piece: per explicit request ("when i extend the main
  // rope very very long, such that it reaches the floor and beyond, the
  // extended long rope should also pile up on top of any rope segments
  // that are on the floor as opposed to going right through them") --
  // previously this function only ever repelled 2 DIFFERENT fallen
  // pieces against each other; mainRope itself was completely excluded
  // (it already collides with the FLOOR separately, in update()'s own
  // floor-clamp block, but never with a PILE resting on that floor).
  // mainRope's own live thickness uses the SAME formula render() computes
  // (vmin(cfg.ropeThickness) * ropeThicknessMultiplier) -- recomputed
  // here since that's a render()-local const, not something update()'s
  // own physics pass already has. mainRope's anchor (points[0]) never
  // has an endcap (see render()'s own comment on that), so its cut-end
  // extension is always 0 -- only the tip (points[last]) can have one.
  //
  // Gated on the tip actually being close to the CURRENT pile's own
  // topmost point, not "any fallen piece exists anywhere" -- reported
  // directly after the age-grace fix below shipped: "the cut segments of
  // rope on the floor are now sliding around slowly." Without this,
  // mainRope-vs-piece ran every frame regardless of where mainRope
  // actually was, so its own ordinary post-cut hang/swing (low damping,
  // cfg.damping=0.986, deliberately long-lasting) kept nudging any piece
  // whose bounding box happened to overlap it, read as a slow, unwanted,
  // continuous drift. The original request was specifically about a
  // DELIBERATELY extended-long rope reaching down to a floor pile, not
  // ordinary hanging -- this margin (10%vh, a judgment call) lets the
  // pass engage a little before actual contact (so the endcap's own
  // inflated radius has room to make contact naturally) without ever
  // firing while mainRope is nowhere near the pile at all.
  // see ENABLE_ENDCAP_AND_MAINROPE_COLLISION's own comment -- this whole
  // block is what a29da9c added; forcing the flag false skips it
  // entirely, reverting mainRope to colliding with the floor only (via
  // update()'s own separate floor-clamp block), never a piece pile.
  if (ENABLE_ENDCAP_AND_MAINROPE_COLLISION && fallenPieces.length > 0){
    // pileTopY only ever looks at pieces NOT currently mainRopeExcluded
    // (see that flag's own comment in performMainRopeSplit()) -- a piece
    // freshly split off mainRope starts essentially COINCIDENT with
    // mainRope's own tip, so it would otherwise always dominate this
    // min() the instant it's created, making the proximity gate below
    // (tipY >= pileTopY - 10%vh) ALWAYS true for a moment right after
    // every single cut regardless of whether any genuine floor pile was
    // anywhere nearby -- opening the whole mainRope-vs-piece pass against
    // every OTHER piece too. Excluding a still-excluded piece from this
    // gate's own pileTopY computation closes that loophole -- the gate
    // can now only ever open because of a piece actually eligible to be
    // collided with in the first place.
    // PILE_SETTLED_MAX_SPEED: the actual root cause found once
    // ENABLE_ENDCAP_AND_MAINROPE_COLLISION's own history was traced --
    // mainRopeExcluded clears the instant a piece has moved a small,
    // thickness-scaled distance (radius x1.5) from where it was cut,
    // completely independent of whether that piece has actually LANDED.
    // Cut twice in quick succession and the FIRST piece clears its own
    // exclusion within a few frames -- still high up, barely fallen --
    // and immediately starts counting toward pileTopY below as if it
    // were resting pile, even though it's still mid-fall. The freshly
    // reset mainRope, spawning right at the circle, is very often
    // already within the vh(10) proximity margin of that still-airborne
    // piece's CURRENT position -- so the gate opens against it, with
    // full endcap-inflated radii and no protection at all for this
    // specific pairing (mainRopeExcluded only ever protected a piece
    // from the ONE mainRope instance it just split from, never from an
    // older, unrelated piece it happens to be spatially near) -- a
    // large, sudden correction at up to COLLISION_MAX_PUSH_PER_S. This
    // is what "shoots downward really fast" and the subsequent
    // endcap-inflated-minSep "floating" actually were: not a mistuned
    // radius, but this gate opening against a piece that was never
    // really part of any pile yet. A piece only genuinely belongs to
    // "the pile" once it's actually SETTLED -- at rest, not still
    // accelerating under gravity -- which distance-since-creation alone
    // can never guarantee (a piece cut right next to the floor clears
    // mainRopeExcluded almost immediately despite genuinely resting;
    // one cut high up stays legitimately airborne far longer). Checking
    // real per-point speed instead is the direct, principled fix: a
    // still-falling piece has picked up real velocity by the time it's
    // moved radius x1.5 (that distance takes several frames of
    // acceleration to cover), while a piece that's actually landed sits
    // essentially still frame to frame. vmin(5)/s is a judgment call --
    // no measured "correct" settled threshold exists, same as every
    // other tuning constant in this collision system -- chosen well
    // below the speed gravity would produce within a fraction of a
    // second of real falling.
    const PILE_SETTLED_MAX_SPEED = vmin(5);
    let pileTopY = Infinity;
    fallenPieces.forEach(piece => {
      if (piece.mainRopeExcluded) return;
      let maxSpeed = 0;
      piece.points.forEach(p => {
        const speed = Math.hypot(p.x - p.oldx, p.y - p.oldy) / dt;
        if (speed > maxSpeed) maxSpeed = speed;
      });
      if (maxSpeed > PILE_SETTLED_MAX_SPEED) return;
      piece.points.forEach(p => { if (p.y < pileTopY) pileTopY = p.y; });
    });
    const tipY = mainRope.points[mainRope.points.length - 1].y;
    if (tipY >= pileTopY - vh(10)){
      const mainThick = vmin(cfg.ropeThickness) * ropeThicknessMultiplier;
      const mainTipCircle = endcapCircle(mainThick, mainThick);
      const mainData = pieceCollisionRadii(mainRope.points, mainThick, mainTipCircle, null);
      // How far mainRope's own tip-end collision presence reaches from
      // its physics point -- either the plain body radius, or (when a
      // tip circle exists) that circle's own farthest point (offset +
      // its own radius), whichever is larger. Used by safeDist below;
      // "reach" replaces the old design's single inflated radius now
      // that the endcap contributes an OFFSET small circle instead of
      // enlarging the body radius directly.
      const mainReach = Math.max(mainThick / 2, mainTipCircle ? mainTipCircle.offset + mainTipCircle.radius : 0);
      fallenPieces.forEach(piece => {
        const thick = pieceThickness(piece);
        // Tip always uses this piece's own ORIGINAL baseThickness for
        // the OFFSET (matching drawEndcap()'s own heightThicknessPx
        // param there -- the tip endcap's LENGTH is deliberately
        // decoupled from live decay, see pieceThickness()'s own call
        // site in render()) but current/live thickness for the RADIUS
        // (matching drawEndcap()'s own thicknessPx param, which DOES
        // track live decay) -- see endcapCircle()'s own comment. The
        // cut edge (only present at all when Endcap At Cut End is on)
        // uses the piece's current live thickness for both, matching
        // drawEndcap() not being passed a heightThicknessPx override
        // there.
        const tipCircle = endcapCircle(piece.baseThickness, thick);
        const cutCircle = cfg.endcapAtCutEnd ? endcapCircle(thick, thick) : null;
        // mainRopeExcluded: an ABSOLUTE, distance-based guarantee this
        // piece never collides with mainRope until it has genuinely
        // moved away from wherever it was split off -- see that flag's
        // own comment in performMainRopeSplit() for the full story on
        // why a fixed TIME window (this function's earlier
        // MAIN_COLLISION_GRACE_AGE) couldn't guarantee real separation
        // on its own. safeDist is the combined REACH (see mainReach's
        // own comment) of mainRope's own tip and this piece's own cut
        // edge, times 1.5 -- a real, comfortable clearance rather than
        // "just barely not overlapping" -- computed fresh each check
